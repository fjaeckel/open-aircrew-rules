name: Add a credential
description: A licence, rating, privilege, certificate or medical the catalogue does not cover yet.
labels: [new-credential]
body:
  - type: input
    id: credential
    attributes:
      label: Credential
      description: e.g. EASA mountain rating, FAA seaplane class rating, UK CAA IMC rating
    validations:
      required: true
  - type: input
    id: articles
    attributes:
      label: Articles that govern it
      description: Validity, revalidation, recency and passenger rules, with paragraph references.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Who holds it, what records a logbook usually has for it, known ambiguities.
