# Every message, requirement-name, remedy and rule-description key an evaluation can report.
# Keys are stable, language-neutral ids; applications translate them. Fields:
#   kind       message | requirement_name | requirement_message | remedy | rule_description |
#              training_title | training_item | training_message
#   params     messageParams / remedyParams names; a trailing ? marks an optional param
#   notes      what the key means, in one line
# A new key is added here, in the section of its family, before a credential uses it.
