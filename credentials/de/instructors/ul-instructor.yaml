credential: Ultralight instructor rating (Lehrberechtigung nach § 95a)
id: de.instructor.ul-instructor
kind: instructor_certificate
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  privilege: { kinds: [UL_INSTRUCTOR], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }
validity: { period_months: 36, ref: "de:LuftPersV.96(1)" }

evaluations:
  - id: extension
    asks: Is the instructor rating valid, and has the holder met two of the three extension items (instruction given, a refresher course, a proficiency check)?
    source: de:LuftPersV.96(4)
    also_cites: [de:LuftPersV.96(1)]
    valid_for:
      counted_from: valid_from
      ref: de:LuftPersV.96(1)
      periods:
        - { months: 36, ref: de:LuftPersV.96(1) }
    passes_if:
      id: extension
      ref: de:LuftPersV.96(4)
      n_of:
        n: 2
        of:
          - id: instruction
            ref: de:LuftPersV.96(4)
            within_months_before_expiry: 36
            classes: [ULTRALIGHT]
            in_ul_kind: true
            any_of:
              - id: instruction_circuits
                ref: de:LuftPersV.96(4)
                as: [instructor, examiner]
                all_of:
                  - takeoffs: { id: instruction_takeoffs, min: 60, ref: de:LuftPersV.96(4) }
                  - landings: { id: instruction_landings, min: 60, ref: de:LuftPersV.96(4) }
              - instruction_or_examining_time: { id: instruction_time, min_hours: 10, ref: de:LuftPersV.96(4) }
          - instructor_refresher: { id: refresher_course, within_validity_period: true, with: competent_body, ref: de:LuftPersV.96(4) }
          - assessment_of_competence: { within_months_before_expiry: 12, with: examiner, ref: de:LuftPersV.96(4) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: privilege.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: de:LuftPersV.96(1) }
      - { id: kind_unknown, when: undetermined, status: unknown, message: privilege.ul_instructor_kind_unknown, params: { date: expiry_date }, ref: policy:unknown-input }
      - { id: met, when: all_met, status: current, message: privilege.revalidation_current, params: { date: expiry_date }, ref: de:LuftPersV.96(4) }
      - { id: not_met, when: always, status: expiring, message: privilege.revalidation_not_met, params: { date: expiry_date }, ref: policy:revalidation-not-met-expiring }
    on_fail: { what: renewal of the rating, ref: de:LuftPersV.96(4) }

  - id: licence
    asks: Is the instructor rating entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: three-years-from-valid-from
    reading: 'The rating is valid for three years from its valid-from date (else its issue date); an earlier recorded expiry date wins. The three years are a period set by an ordinance, so §§ 187 to 193 BGB apply (§ 186 BGB): the first day counts (§ 187(2)) and the period ends with the day before the anniversary (§ 188(2)), so a rating valid from 10 January 2024 is valid through 9 January 2027. Without any of these dates the three years cannot be placed and the result is unknown.'
    ref: [de:LuftPersV.96(1), de:BGB.186, de:BGB.187(2), de:BGB.188(2)]
    affects: [extension]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: last-three-years-before-expiry
    reading: '"Innerhalb der letzten drei Jahre" has no anchor in the text; it is read as the 36 months before the expiry date, which with a three-year validity is the validity period being extended.'
    ref: de:LuftPersV.96(4)
    affects: [extension]
    principle: P3
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: instruction-as-instructor-or-examiner
    reading: 'In item 1, "als Lehrer oder Prüfer" qualifies both alternatives: 60 take-offs and 60 landings on ultralight flights with instruction given or examiner time, or 10 hours of instruction given plus examiner time on ultralights. The rating is granted per kind (§ 95a(1)) and limited to the ultralights the holder may fly (§ 96(2)), so only instruction in the kinds the rating covers counts: the kinds its detail names (for example "THREE_AXIS WEIGHT_SHIFT"). A rating recorded without a kind, or an instruction flight without one, gives unknown and asks for it.'
    ref: [de:LuftPersV.96(4), de:LuftPersV.96(2), de:LuftPersV.95a(1)]
    affects: [extension]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: refresher-course-event
    reading: 'Item 2 is an instructor refresher course (event instructor_refresher) within the rating''s validity period; that the course was run or recognised by the competent body is not recorded and is taken as met. The alternative "within the 12 months before renewal" applies to the renewal of an expired rating, which is not evaluated.'
    ref: de:LuftPersV.96(4)
    affects: [extension]
    approved_by: null
    approved_on: null
  - id: befaehigungspruefung-event
    reading: 'Item 3, the "Befähigungsprüfung", is an instructor assessment of competence: the ordinance calls the pilot''s check "Befähigungsüberprüfung" (§ 45(3)) and uses "Befähigungsprüfung" only here. It counts when recorded as an assessment_of_competence event within the 12 months before the expiry date; a proficiency check taken for a pilot rating does not count. Who conducted it is not checked, and that it was passed is taken from its being recorded.'
    ref: [de:LuftPersV.96(4), de:LuftPersV.95a(3), de:LuftPersV.45(3)]
    affects: [extension]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: renewal-not-evaluated
    reading: The renewal of an expired rating is not evaluated; after the expiry date the rating is reported expired. The flight-engineer instructor rating of § 88 is out of scope.
    ref: [de:LuftPersV.96(4), de:LuftPersV.96(1)]
    affects: [extension]
    approved_by: null
    approved_on: null
  - id: towing-instruction-not-evaluated
    reading: The privilege to instruct in towing (§ 96(3)) depends on the holder's own towing rating and "sufficient practical experience", which the text does not quantify; it is not evaluated.
    ref: de:LuftPersV.96(3)
    affects: [extension]
    approved_by: null
    approved_on: null
