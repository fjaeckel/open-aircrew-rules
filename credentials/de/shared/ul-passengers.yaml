shared: Carrying passengers in an ultralight (LuftPersV § 45a, § 84a)
id: de.shared.ul-passengers
authority: DE
params:
  kinds: The ultralight kinds whose take-offs and landings count ("ein Luftsportgerät derselben Art").
  authorised: The condition under which the holder holds the passenger authorisation of § 84a for the kind flown (a valid UL_PASSENGER_AUTH on the same licence whose detail names the kind).
evaluation:
  about: passengers
  asks: Has the holder made 3 take-offs and 3 landings in an ultralight of the same kind in the last 90 days, and does the holder hold the passenger authorisation?
  source: de:LuftPersV.45a
  also_cites: [de:LuftPersV.84a(1), de:LuftPersV.84a(2), de:LuftPersV.44(2)]
  counting: { within_days: 90, classes: [ULTRALIGHT], ul_kinds: $kinds }
  passes_if:
    ref: de:LuftPersV.45a
    all_of:
      - takeoffs_and_landings: { id: day, min: 3, ref: de:LuftPersV.45a }
      - id: authorisation_progress
        ref: de:LuftPersV.84a(2)
        informational: true
        only_if: { not: $authorised, ref: de:LuftPersV.84a(2) }
        since_licence_issue: true
        with_time: [dual, crossCountry]
        all_of:
          - flights: { id: ul_xc_flights, name: requirement.ul_xc_flights, min: 5, ref: de:LuftPersV.84a(2) }
          - flights: { id: ul_xc_landing_flights, name: requirement.ul_xc_landing_flights, min: 2, min_landings: 2, min_distance_km: 200, ref: de:LuftPersV.84a(2) }
  outcomes:
    - { id: current, when: { all: [all_met, $authorised] }, status: current, message: pax.current_day_no_night_privilege, ref: [de:LuftPersV.45a, de:LuftPersV.44(2)] }
    - { id: authorisation_kind_missing, when: { all: [all_met, { holds: { privileges: [UL_PASSENGER_AUTH], details: [none], sameLicence: true, valid: true } }] }, status: unknown, message: pax.ul_authorisation_kind_missing, ref: policy:unknown-input }
    - { id: authorisation_missing, when: all_met, status: unknown, message: pax.ul_authorisation_missing, ref: policy:unknown-input }
    - { id: not_current, when: always, status: expired, message: pax.not_current, params: { needed: { needed: day } }, ref: policy:passengers-expired }
  description_key: ul_pax

interpretations:
  - id: same-kind-any-role
    reading: 'Take-offs and landings "mit einem Luftsportgerät derselben Art" count in any role (the text does not require PIC time) and however the ultralight was launched; only the take-offs and landings logged count, and the smaller of the two decides. A flight with no ultralight kind recorded cannot be shown to be of the same kind: it is unknown input and never counted.'
    ref: de:LuftPersV.45a
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: authorisation-recorded
    reading: 'The passenger authorisation of § 84a(1) is entered for the kind of ultralight the pilot trained on (§ 84a(5) first sentence), so it counts only for that kind: a UL_PASSENGER_AUTH privilege on the same licence, not expired on the date evaluated (its validity follows the licence unless limited, § 84a(5)), whose detail names the kind flown (three-axis and UL motorglider being one kind). An authorisation recorded without a kind gives unknown and asks for the kind. With the recency met but no authorisation for the kind recorded, the result is unknown and asks for it, because the record may simply not hold it.'
    ref: [de:LuftPersV.84a(1), de:LuftPersV.84a(5)]
    affects: [evaluation]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: authorisation-progress-informational
    reading: 'Without an authorisation the progress toward § 84a(2) is shown for information only and never changes the result: five cross-country flights with dual time since the ultralight licence was issued (unknown when the issue date is not recorded), two of them with at least two landings (the intermediate landing) and a recorded distance of at least 200 km, counted on ultralights of the same kind. § 84a(2) sets these for two-seat ultralight aeroplanes. § 84a(3) covers two-seat hang gliders, paragliders and comparable Luftsportgeräte and tandem parachutes, not ultralight helicopters or gyroplanes; for the kinds § 84a(2) does not clearly cover, the same rows are shown as a guide.'
    ref: [de:LuftPersV.84a(2), de:LuftPersV.84a(3)]
    affects: [evaluation]
    principle: P5
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: xc-200-km-per-flight
    reading: '"Mindestens zwei Überlandflüge mit Zwischenlandung über eine Gesamtstrecke von mindestens 200 Kilometer" can mean 200 km for each of the two flights or 200 km for both together. The wording favours both together (no "jeweils", unlike § 42(4) no. 2); each flight is shown against 200 km, the stricter of the two readings, because the row is informational only. A flight with no recorded distance is unknown input.'
    ref: [de:LuftPersV.84a(2), de:LuftPersV.42(4)]
    affects: [evaluation]
    principle: P5
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: day-only
    reading: The ultralight licence is valid by day only (§ 44(2)), so no night passenger recency is evaluated and the current message says so. Tandem parachuting (10 jumps) is out of scope.
    ref: [de:LuftPersV.44(2), de:LuftPersV.45a]
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: practical-test-not-checked
    reading: The practical test of § 84a(4) is taken as passed when the authorisation is recorded.
    ref: de:LuftPersV.84a(4)
    affects: [evaluation]
    approved_by: null
    approved_on: null
