credential: Ultralight helicopter (Ultraleichthubschrauber)
id: de.rating.ul-helicopter
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [HELICOPTER], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly ultralight helicopters? 6 hours on ultralight helicopters in the last 12 months, with 6 take-offs, 6 landings and a 1-hour training flight with an instructor; or a proficiency check on an ultralight helicopter.
    source: de:LuftPersV.45(2a)
    also_cites: [de:LuftPersV.45(3), de:LuftPersV.45(1), de:LuftPersV.45b]
    counting: { within_months: 12, classes: [ULTRALIGHT], ul_kinds: [HELICOPTER] }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(2a), de:LuftPersV.45(3)]
      any_of:
        - id: experience
          ref: de:LuftPersV.45(2a)
          all_of:
            - flight_time: { min_hours: 6, ref: de:LuftPersV.45(2a) }
            - takeoffs: { min: 6, ref: de:LuftPersV.45(2a) }
            - landings: { min: 6, ref: de:LuftPersV.45(2a) }
            - longest_flight: { min_hours: 1, any_flight_of: [{ with_time: [dual] }, { flagged: { instructorOnBoard: true } }], with: FI, ref: [de:LuftPersV.45(2a), de:LuftPersV.45b] }
        - proficiency_check: { with: examiner, ref: de:LuftPersV.45(3) }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_luftpersv_helicopter

  - id: passengers
    asks: May the holder carry passengers in an ultralight helicopter?
    uses: de.shared.ul-passengers
    with:
      kinds: [HELICOPTER]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], details: [HELICOPTER], sameLicence: true, valid: true } }

  - id: medical
    asks: Is a valid class 2 or LAPL medical certificate held (§ 45(1) second sentence, ultralights above 120 kg empty mass)?
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1@lapl]

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: only-ultralight-helicopters
    reading: Only flights and checks on ultralight helicopters count; no Part-FCL helicopter time or check is credited, and no PIC time is required.
    ref: [de:LuftPersV.45(2a), de:LuftPersV.45(3)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: takeoffs-and-landings
    reading: The 6 hours must include 6 take-offs and 6 landings; both are counted as logged.
    ref: de:LuftPersV.45(2a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: training-flight-as-dual
    reading: 'As for three-axis ultralights (§ 45(2a) repeats "in Begleitung eines Fluglehrers"): the training flight is one flight of at least 60 minutes on an ultralight helicopter, either logged with dual time or logged as pilot time and flagged as flown with an instructor aboard (instructorOnBoard, § 45b no. 3). A flight logged as PIC without the flag does not count. That the instructor is a Fluglehrer is not checked.'
    ref: [de:LuftPersV.45(2a), de:LuftPersV.45b]
    affects: [recency]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: proficiency-check-period
    reading: 'The proficiency check of § 45(3) second sentence replaces the requirements of § 45(2a), which run over 12 months, so a check counts for 12 months. Only a check on an ultralight helicopter counts. That the examiner is recognised, and the logbook signature, are not checked.'
    ref: de:LuftPersV.45(3)
    affects: [recency]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: An ultralight flight with no ultralight kind recorded cannot be shown to be a helicopter flight; it is unknown input and never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.45(2a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: medical-above-120-kg
    reading: 'Above 120 kg empty mass the licence is valid only with a valid medical certificate (§ 45(1) second sentence, MED.A.030(b)). Ultralight helicopters are practically always heavier, so the rating requires a valid LAPL or class 2 medical certificate, or a class 1 certificate within its LAPL validity (AMC1 MED.A.030): with none recorded the result is unknown and asks for one; with only an expired one it is expired.'
    ref: de:LuftPersV.45(1)
    affects: [medical]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
