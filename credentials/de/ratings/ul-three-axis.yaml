credential: Three-axis ultralight (aerodynamisch gesteuerte Ultraleichtflugzeuge)
id: de.rating.ul-three-axis
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly three-axis ultralights? 12 hours in the last 24 months on three-axis ultralights, TMGs or single-engine piston land aeroplanes, with 6 hours as PIC, 12 take-offs, 12 landings and a 1-hour training flight with an instructor on a three-axis ultralight; or a proficiency check.
    source: de:LuftPersV.45(2)
    also_cites: [de:LuftPersV.45(3), de:LuftPersV.45(1), de:LuftPersV.45b]
    counting: { within_months: 24 }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(2), de:LuftPersV.45(3)]
      any_of:
        - id: experience
          ref: de:LuftPersV.45(2)
          any_flight_of: &counted
            - { classes: [ULTRALIGHT], ul_kinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER] }
            - { classes: [SEP_LAND, TMG] }
          all_of:
            - flight_time: { min_hours: 12, ref: de:LuftPersV.45(2) }
            - pic_time: { min_hours: 6, ref: de:LuftPersV.45(2) }
            - takeoffs: { min: 12, ref: de:LuftPersV.45(2) }
            - landings: { min: 12, ref: de:LuftPersV.45(2) }
            - longest_training_flight: { min_hours: 1, classes: [ULTRALIGHT], ul_kinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER], with: FI, ref: de:LuftPersV.45(2) }
        - proficiency_check: { any_flight_of: *counted, with: examiner, ref: de:LuftPersV.45(3) }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_luftpersv

  - id: passengers
    asks: May the holder carry passengers in a three-axis ultralight?
    uses: de.shared.ul-passengers
    with:
      kinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], sameLicence: true, valid: true } }

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: three-axis-includes-motorgliders
    reading: Three-axis ultralights and ultralight motorgliders are one Luftsportgeräteart (aerodynamisch gesteuerte Ultraleichtflugzeuge); ratings recorded with either kind are this credential, and flights of either kind count as three-axis flights.
    ref: [de:LuftPersV.45(2), de:LuftPersV.44(2)]
    affects: [recency, passengers]
    approved_by: null
    approved_on: null
  - id: scope-of-closing-words
    reading: 'Ambiguity, § 45(2) second sentence: the closing words "auf aerodynamisch gesteuerten Ultraleichtflugzeugen" are read as qualifying only the training flight. The 6 hours as PIC and the 12 take-offs and 12 landings are part of "den 12 Stunden", which already include TMG and single-engine piston land aeroplane time. Read the other way (all of them on three-axis ultralights only), TMG and SEP time would not count toward the PIC hours, take-offs and landings.'
    ref: de:LuftPersV.45(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: counted-aircraft
    reading: '"Reisemotorsegler" is the TMG class and "einmotorige Landflugzeuge mit Kolbentriebwerk" the SEP(land) class; single-engine turbine aeroplanes (SET) are a class of their own and do not count, nor do other ultralight kinds or sea planes. Every flight counts, whatever the launch method.'
    ref: de:LuftPersV.45(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: takeoffs-and-landings
    reading: The 12 hours must include 12 take-offs and 12 landings; both are counted as logged, so a landing logged without a take-off does not make up a missing take-off.
    ref: de:LuftPersV.45(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: training-flight-as-dual
    reading: The training flight of at least one hour "in Begleitung eines Fluglehrers" is one flight with dual time and a total time of at least 60 minutes on a three-axis ultralight; that the instructor is a Fluglehrer is not checked.
    ref: de:LuftPersV.45(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: proficiency-check-period
    reading: § 45(3) names no period for the proficiency check that replaces the requirements; a check within the same 24 months counts, recorded as a check event or check flight on a three-axis ultralight, a TMG or an SEP(land) aeroplane. That the examiner is recognised, and the logbook signature of § 45(3) third sentence, are not checked.
    ref: de:LuftPersV.45(3)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: flight-time-credit
    reading: 'Every logged flight time on the counted aircraft is flight time (§ 45b: instructor, dual, training-flight, examiner and applicant time), and PIC time as logged; time as instructor or examiner counts when it is logged as flight time.'
    ref: de:LuftPersV.45b
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: An ultralight flight with no ultralight kind recorded cannot be shown to be a three-axis flight; it is unknown input and never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.45(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: deemed-authorisation
    reading: 'The passenger authorisation is deemed granted (§ 84a(2) second sentence) "mit der Erteilung" of the ultralight licence to a three-axis pilot who then holds a valid "Lizenz für Privatflugzeugführer oder Segelflugzeugführer" (read literally as a PPL(A) or SPL, not a CPL, ATPL or LAPL); once granted, its validity follows the ultralight licence (§ 84a(5)), not the PPL or SPL. The record cannot show whether a PPL(A) or SPL was valid on the day the ultralight licence was issued, so a PPL(A) or SPL is not taken as the authorisation: a deemed authorisation counts when it is recorded as a UL_PASSENGER_AUTH privilege on the ultralight licence (where § 84a(5) first sentence enters it), and otherwise the result is unknown and asks for it. The third sentence ("§ 122 Abs. 1 bleibt unberührt") refers to a repealed paragraph and has no effect.'
    ref: [de:LuftPersV.84a(2), de:LuftPersV.84a(5), de:LuftPersV.122]
    affects: [passengers]
    approved_by: null
    approved_on: null
  - id: medical-above-120-kg-not-evaluated
    reading: Above 120 kg empty mass the licence is valid only with a valid medical certificate (§ 45(1) second sentence); the record has no empty mass per ultralight, so this is not evaluated here.
    ref: de:LuftPersV.45(1)
    affects: [recency]
    approved_by: null
    approved_on: null
