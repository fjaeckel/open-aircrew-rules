credential: Ultralight gyroplane (Tragschrauber)
id: de.rating.ul-gyroplane
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [GYROPLANE], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly ultralight gyroplanes? Sufficient practice as the Beauftragte set it (association rule, not in the statute; numbers unverified) - 12 hours on gyroplanes in the last 24 months with 6 hours as PIC, 12 landings and a 1-hour training flight with an instructor, or a proficiency check.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    counting: { within_months: 24 }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane]
      any_of:
        - id: experience
          ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane]
          any_flight_of: &counted
            - { classes: [ULTRALIGHT], ul_kinds: [GYROPLANE] }
            - { classes: [GYROPLANE] }
          all_of:
            - flight_time: { min_hours: 12, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
            - pic_time: { min_hours: 6, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
            - landings: { min: 12, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
            - longest_training_flight: { min_hours: 1, classes: [ULTRALIGHT], ul_kinds: [GYROPLANE], with: FI, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
        - proficiency_check: { any_flight_of: *counted, with: examiner, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_gyroplane

  - id: passengers
    asks: May the holder carry passengers in an ultralight gyroplane?
    uses: de.shared.ul-passengers
    with:
      kinds: [GYROPLANE]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], sameLicence: true, valid: true } }

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: association-rule-unverified
    reading: '§ 45(4) requires "ausreichende fliegerische Übung" and leaves the details to the Beauftragte under § 31c LuftVG. The numbers here (12 hours in 24 months on gyroplanes, 6 hours as PIC, 12 landings, a training flight of at least 1 hour with an instructor, or a proficiency check) are those of the DULV recency rule for ultralight gyroplanes, cited by name only (document title and text not verified); they are not in the statute. The rule is applied to every German ultralight licence, whether issued by the LBA, the DULV or the DAeC; whether DAeC-issued licences follow the same numbers is not verified.'
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: gyroplane-class-credited
    reading: Part-FCL gyroplane (GYROPLANE class) flights count toward the hours, the PIC time and the landings, and a proficiency check in either counts; the training flight is one flight with dual time of at least 60 minutes on an ultralight gyroplane, and that the instructor and examiner are qualified is not checked. Take-offs are not counted.
    ref: de:LuftPersV.45(4)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: luftvzo-numbering
    reading: 'Ambiguity, § 45(4): it refers to "§ 1 Absatz 4 Satz 1 Nummer 1" LuftVZO, but LuftVZO § 1(4) first sentence has no numbered items. Read literally it covers the one- and two-seat sport aircraft of at most 120 kg empty mass that § 1(4) exempts from type certification, and this kind is evaluated under § 45(4).'
    ref: [de:LuftPersV.45(4), de:LuftVZO.1(4)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: above-120-kg-not-named
    reading: 'Ultralights of this kind above 120 kg empty mass are named neither in § 45(2), (2a) nor in § 45(4) read literally. The record has no empty mass per ultralight, so the association rule is applied regardless of mass.'
    ref: [de:LuftPersV.45(4), de:LuftPersV.45(1)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: The licence covers the kind entered in it (§ 44(2)); an ultralight flight with no ultralight kind recorded cannot be attributed to this kind, is unknown input and is never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.44(2)
    affects: [recency]
    approved_by: null
    approved_on: null
