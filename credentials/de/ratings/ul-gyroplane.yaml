credential: Ultralight gyroplane (Tragschrauber)
id: de.rating.ul-gyroplane
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [GYROPLANE], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: For a licence issued by the LBA or the DULV, may the holder fly ultralight gyroplanes? Sufficient practice as the DULV sets it (association rule, not in the statute) - 12 hours on ultralight gyroplanes in the last 24 months with 6 hours as PIC, 12 take-offs, 12 landings and a 1-hour training flight with an instructor, or a proficiency check on an ultralight gyroplane.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    only_for: { authorities: [LBA, DULV], ref: de:LuftPersV.45(4) }
    counting: { within_months: 24, classes: [ULTRALIGHT], ul_kinds: [GYROPLANE] }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane, assoc:dulv:ausbildungshandbuch-1-40]
      any_of:
        - id: experience
          ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane]
          all_of:
            - flight_time: { min_hours: 12, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
            - pic_time: { min_hours: 6, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
            - takeoffs: { min: 12, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
            - landings: { min: 12, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
            - longest_training_flight: { min_hours: 1, with: FI, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
        - proficiency_check: { with: examiner, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_gyroplane

  - id: recency_daec
    asks: For a licence issued by the DAeC, may the holder fly ultralight gyroplanes? Sufficient practice as the DAeC sets it (association rule, not in the statute) - 12 hours on ultralight gyroplanes in the last 24 months with 12 take-offs, 12 landings and a 1-hour training flight with an instructor, or a proficiency check on an ultralight gyroplane.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    only_for: { authorities: [DAEC], ref: de:LuftPersV.45(4) }
    counting: { within_months: 24, classes: [ULTRALIGHT], ul_kinds: [GYROPLANE] }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-gyroplane]
      any_of:
        - id: experience
          ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-gyroplane]
          all_of:
            - flight_time: { min_hours: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-gyroplane] }
            - takeoffs: { min: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-gyroplane] }
            - landings: { min: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-gyroplane] }
            - longest_training_flight: { min_hours: 1, with: FI, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-gyroplane] }
        - proficiency_check: { with: examiner, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-gyroplane] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_gyroplane_daec

  - id: passengers
    asks: May the holder carry passengers in an ultralight gyroplane?
    uses: de.shared.ul-passengers
    with:
      kinds: [GYROPLANE]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], details: [GYROPLANE], sameLicence: true, valid: true } }

  - id: medical
    asks: Is a valid class 2 or LAPL medical certificate held (§ 45(1) second sentence, ultralights above 120 kg empty mass)?
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1@lapl]

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: association-rule-unverified
    reading: '§ 45(4) requires "ausreichende fliegerische Übung" and leaves the details to the Beauftragte under § 31c LuftVG. The DULV and the DAeC rules for ultralight gyroplanes (checked against their published pages on 2026-09-28) differ, so the rule follows the body that issued the licence, as for weight-shift ultralights. DULV (and LBA) licences: 12 hours in 24 months with 6 hours as PIC, 12 take-offs, 12 landings and a training flight of at least 1 hour with an instructor, or a proficiency check. DAeC licences: the same without the 6 hours as PIC. That an LBA licence follows the DULV rule is an unverified assumption. The numbers are not in the statute.'
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane, assoc:daec:ul-recency-gyroplane]
    affects: [recency, recency_daec]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: gyroplane-class-credited
    reading: 'Only ultralight gyroplanes count: both association rules name gyroplane time on ultralight gyroplanes only, so Part-FCL gyroplane (GYROPLANE class) flights and checks are not credited. Take-offs and landings are both counted. Only a proficiency check on an ultralight gyroplane counts. The training flight is one flight with dual time of at least 60 minutes on an ultralight gyroplane; that the instructor and examiner are qualified is not checked.'
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-gyroplane, assoc:daec:ul-recency-gyroplane]
    affects: [recency, recency_daec]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: luftvzo-numbering
    reading: 'Ambiguity, § 45(4): it refers to "§ 1 Absatz 4 Satz 1 Nummer 1" LuftVZO, but LuftVZO § 1(4) first sentence has no numbered items. Read literally it covers the one- and two-seat sport aircraft of at most 120 kg empty mass that § 1(4) exempts from type certification, and this kind is evaluated under § 45(4).'
    ref: [de:LuftPersV.45(4), de:LuftVZO.1(4)]
    affects: [recency, recency_daec]
    approved_by: null
    approved_on: null
  - id: above-120-kg-not-named
    reading: 'As for weight-shift ultralights: no paragraph names ultralight gyroplanes above 120 kg empty mass (practically all of them), so the statutory basis of their recency rule is unclear. Both Beauftragte treat the gyroplane as a special aerodynamically controlled ultralight and publish a rule for it, so the association rule is applied regardless of mass.'
    ref: [de:LuftPersV.45(4), de:LuftPersV.45(1)]
    affects: [recency, recency_daec]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency, recency_daec]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: The licence covers the kind entered in it (§ 44(2)); an ultralight flight with no ultralight kind recorded cannot be attributed to this kind, is unknown input and is never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.44(2)
    affects: [recency, recency_daec]
    approved_by: null
    approved_on: null
  - id: medical-above-120-kg
    reading: 'Above 120 kg empty mass the licence is valid only with a valid medical certificate (§ 45(1) second sentence, MED.A.030(b)). Ultralight gyroplanes are practically always heavier, so the rating requires a valid LAPL or class 2 medical certificate, or a class 1 certificate within its LAPL validity (AMC1 MED.A.030): with none recorded the result is unknown and asks for one; with only an expired one it is expired.'
    ref: de:LuftPersV.45(1)
    affects: [medical]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
