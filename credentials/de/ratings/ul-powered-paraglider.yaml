credential: Powered paraglider (Motorschirm)
id: de.rating.ul-powered-paraglider
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [POWERED_PARAGLIDER], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly powered paragliders? Sufficient practice as the Beauftragte set it (association rule, not in the statute) - 30 take-offs and 30 landings with powered paragliders in the last 24 months, or a proficiency check on a powered paraglider.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    counting: { within_months: 24, classes: [ULTRALIGHT], ul_kinds: [POWERED_PARAGLIDER] }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-powered-paraglider, assoc:daec:ul-recency-powered-paraglider]
      any_of:
        - id: experience
          ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-powered-paraglider, assoc:daec:ul-recency-powered-paraglider, assoc:dulv:ausbildungshandbuch-1-40]
          all_of:
            - takeoffs: { min: 30, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-powered-paraglider, assoc:daec:ul-recency-powered-paraglider] }
            - landings: { min: 30, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-powered-paraglider, assoc:daec:ul-recency-powered-paraglider] }
        - proficiency_check: { with: examiner, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-powered-paraglider, assoc:daec:ul-recency-powered-paraglider] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_powered_paraglider

  - id: passengers
    asks: May the holder carry passengers in a powered paraglider?
    uses: de.shared.ul-passengers
    with:
      kinds: [POWERED_PARAGLIDER]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], details: [POWERED_PARAGLIDER], sameLicence: true, valid: true } }

  - id: medical_above_120_kg
    asks: 'For a powered paraglider (a trike) above 120 kg empty mass, is a valid LAPL, class 2 or class 1 medical certificate held (§ 45(1) second sentence)? The record holds no empty mass, so this is reported as a limitation and never decides.'
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1@lapl]
    limits: above_120_kg

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: association-rule-unverified
    reading: '§ 45(4) requires "ausreichende fliegerische Übung" and leaves the details to the Beauftragte under § 31c LuftVG. The DULV and the DAeC rules for powered paragliders (checked against their published pages on 2026-09-28) agree: 30 take-offs and 30 landings with a powered paraglider or powered paraglider trike in 24 months, or a proficiency check with a recognised examiner. The rule is applied to every German ultralight licence. Only a check recorded on a powered paraglider counts, for the same 24 months; that the examiner is recognised is not checked. The numbers are not in the statute.'
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-powered-paraglider, assoc:daec:ul-recency-powered-paraglider]
    affects: [recency]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: luftvzo-numbering
    reading: 'Ambiguity, § 45(4): it refers to "§ 1 Absatz 4 Satz 1 Nummer 1" LuftVZO, but LuftVZO § 1(4) first sentence has no numbered items. Read literally it covers the one- and two-seat sport aircraft of at most 120 kg empty mass that § 1(4) exempts from type certification, and this kind is evaluated under § 45(4).'
    ref: [de:LuftPersV.45(4), de:LuftVZO.1(4)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: above-120-kg-not-named
    reading: 'As for weight-shift ultralights: no paragraph names powered paragliders above 120 kg empty mass (powered paraglider trikes), so the statutory basis of their recency rule is unclear; the associations apply the same numbers to them, so the rule is applied regardless of mass. Most powered paragliders are in the 120 kg class and need no medical, so no medical is required for the rating; a powered paraglider trike above 120 kg needs one (§ 45(1) second sentence). The record cannot show the mass, so the medical is reported as a limitation of the privileges above 120 kg (scope above_120_kg) and never decides.'
    ref: [de:LuftPersV.45(4), de:LuftPersV.45(1)]
    affects: [recency, medical_above_120_kg]
    approved_by: null
    approved_on: null
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: The licence covers the kind entered in it (§ 44(2)); an ultralight flight with no ultralight kind recorded cannot be attributed to this kind, is unknown input and is never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.44(2)
    affects: [recency]
    approved_by: null
    approved_on: null
