credential: Ultralight sailplane (Luftsportgerät-Segelflugzeug)
id: de.rating.ul-sailplane
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [SAILPLANE], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly ultralight sailplanes? Sufficient practice as the DAeC sets it (association rule, not in the statute) - 5 take-offs and 5 landings with ultralight sailplanes in the last 12 months, any launch method.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    counting: { within_months: 12, classes: [ULTRALIGHT], ul_kinds: [SAILPLANE] }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-sailplane]
      all_of:
        - takeoffs: { min: 5, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-sailplane] }
        - landings: { min: 5, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-sailplane] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_sailplane

  - id: passengers
    asks: May the holder carry passengers in an ultralight sailplane?
    uses: de.shared.ul-passengers
    with:
      kinds: [SAILPLANE]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], details: [SAILPLANE], sameLicence: true, valid: true } }

  - id: medical_above_120_kg
    asks: 'For an ultralight sailplane above 120 kg empty mass, is a valid LAPL, class 2 or class 1 medical certificate held (§ 45(1) second sentence)? The record holds no empty mass, so this is reported as a limitation and never decides.'
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1@lapl]
    limits: above_120_kg

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: association-rule-unverified
    reading: '§ 45(4) requires "ausreichende fliegerische Übung" and leaves the details to the Beauftragte under § 31c LuftVG. The DAeC rule for ultralight sailplanes (checked against its published page on 2026-09-28) is 5 take-offs and 5 landings in 12 months, whatever the launch method; missing ones are flown with or under an instructor, and there is no proficiency-check alternative. No DULV rule for this kind was found, so the DAeC rule is applied to every German ultralight licence. The numbers are not in the statute.'
    ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-sailplane]
    affects: [recency]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: luftvzo-numbering
    reading: 'Ambiguity, § 45(4): it refers to "§ 1 Absatz 4 Satz 1 Nummer 1" LuftVZO, but LuftVZO § 1(4) first sentence has no numbered items. Read literally it covers the one- and two-seat sport aircraft of at most 120 kg empty mass that § 1(4) exempts from type certification, and this kind is evaluated under § 45(4).'
    ref: [de:LuftPersV.45(4), de:LuftVZO.1(4)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: above-120-kg-not-named
    reading: 'As for weight-shift ultralights: no paragraph names ultralight sailplanes above 120 kg empty mass, so the statutory basis of a recency rule for them is unclear; the DAeC rule is applied regardless of mass. No medical is required for the rating, because the record cannot show whether the sailplane is above 120 kg; one above 120 kg needs a medical (§ 45(1) second sentence), which is reported as a limitation of the privileges above 120 kg (scope above_120_kg) and never decides.'
    ref: [de:LuftPersV.45(4), de:LuftPersV.45(1)]
    affects: [recency, medical_above_120_kg]
    approved_by: null
    approved_on: null
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: The licence covers the kind entered in it (§ 44(2)); an ultralight flight with no ultralight kind recorded cannot be attributed to this kind, is unknown input and is never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.44(2)
    affects: [recency]
    approved_by: null
    approved_on: null
