credential: Weight-shift ultralight (schwerkraftgesteuerte Ultraleichtflugzeuge, trike)
id: de.rating.ul-weight-shift
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [WEIGHT_SHIFT], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency_dulv
    asks: For a licence issued by the LBA or the DULV, may the holder fly weight-shift ultralights? Sufficient practice as the Beauftragte set it (association rule, not in the statute; number unverified) - 12 hours as PIC on weight-shift ultralights in the last 24 months.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    only_for: { authorities: [LBA, DULV], ref: de:LuftPersV.45(4) }
    counting: { within_months: 24, classes: [ULTRALIGHT], ul_kinds: [WEIGHT_SHIFT] }
    passes_if:
      pic_time: { min_hours: 12, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_trike_dulv

  - id: recency_daec
    asks: For a licence issued by the DAeC, may the holder fly weight-shift ultralights? Sufficient practice as the Beauftragte set it (association rule, not in the statute; numbers unverified) - 12 hours and 12 landings on weight-shift ultralights in the last 24 months.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    only_for: { authorities: [DAEC], ref: de:LuftPersV.45(4) }
    counting: { within_months: 24, classes: [ULTRALIGHT], ul_kinds: [WEIGHT_SHIFT] }
    passes_if:
      ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift]
      all_of:
        - flight_time: { min_hours: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
        - landings: { min: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
        - not_recorded: { id: safety_training, name: requirement.safety_training, unit: training, informational: true, messages: { untracked: requirement.untracked }, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_trike_daec

  - id: passengers
    asks: May the holder carry passengers in a weight-shift ultralight?
    uses: de.shared.ul-passengers
    with:
      kinds: [WEIGHT_SHIFT]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], sameLicence: true, valid: true } }

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: association-rules-by-authority
    reading: '§ 45(4) requires "ausreichende fliegerische Übung" and leaves the details to the Beauftragte under § 31c LuftVG, and the DULV and the DAeC set different numbers for weight-shift ultralights. The rule follows the body that issued the licence: a DAeC licence uses the DAeC recency rule for weight-shift ultralights, every other German ultralight licence (DULV, LBA) the DULV one. Both are cited by name only (document titles and text not verified); their numbers are not in the statute.'
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift, assoc:daec:ul-recency-weight-shift]
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
  - id: dulv-pic-only
    reading: The DULV rule is read as 12 hours as PIC on weight-shift ultralights in 24 months, with no proficiency-check alternative; dual time is not PIC time.
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift]
    affects: [recency_dulv]
    approved_by: null
    approved_on: null
  - id: daec-safety-training-not-recorded
    reading: The DAeC rule is read as 12 hours (any role) and 12 landings on weight-shift ultralights in 24 months. It also names a safety or performance training whose period is not known and which the record cannot show; it is an informational, untracked row that never changes the result. Landings are counted, although the rule may name take-offs and landings.
    ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift]
    affects: [recency_daec]
    approved_by: null
    approved_on: null
  - id: luftvzo-numbering
    reading: 'Ambiguity, § 45(4): it refers to "§ 1 Absatz 4 Satz 1 Nummer 1" LuftVZO, but LuftVZO § 1(4) first sentence has no numbered items. Read literally it covers the one- and two-seat sport aircraft of at most 120 kg empty mass that § 1(4) exempts from type certification, and this kind is evaluated under § 45(4).'
    ref: [de:LuftPersV.45(4), de:LuftVZO.1(4)]
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
  - id: above-120-kg-not-named
    reading: 'Ultralights of this kind above 120 kg empty mass are named neither in § 45(2), (2a) nor in § 45(4) read literally. The record has no empty mass per ultralight, so the association rule is applied regardless of mass.'
    ref: [de:LuftPersV.45(4), de:LuftPersV.45(1)]
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: The licence covers the kind entered in it (§ 44(2)); an ultralight flight with no ultralight kind recorded cannot be attributed to this kind, is unknown input and is never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.44(2)
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
