credential: Weight-shift ultralight (schwerkraftgesteuerte Ultraleichtflugzeuge, trike)
id: de.rating.ul-weight-shift
kind: rating
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  ratings: { classes: [ULTRALIGHT], ul_kinds: [WEIGHT_SHIFT], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: recency_dulv
    asks: For a licence issued by the LBA or the DULV, may the holder fly weight-shift ultralights? Sufficient practice as the DULV sets it (association rule, not in the statute) - 12 hours as PIC on weight-shift ultralights in the last 24 months, or a proficiency check on a weight-shift ultralight.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    only_for: { authorities: [LBA, DULV], ref: de:LuftPersV.45(4) }
    counting: { within_months: 24, classes: [ULTRALIGHT], ul_kinds: [WEIGHT_SHIFT] }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift, assoc:dulv:ausbildungshandbuch-1-40]
      any_of:
        - pic_time: { min_hours: 12, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift] }
        - proficiency_check: { ul_kinds: [WEIGHT_SHIFT], with: examiner, ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift] }
    outcomes:
      preset: recency
      special:
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_trike_dulv

  - id: recency_daec
    asks: For a licence issued by the DAeC, may the holder fly weight-shift ultralights? Sufficient practice as the DAeC sets it (association rule, not in the statute) - 12 hours, 12 take-offs and 12 landings on weight-shift ultralights in the last 24 months and a safety or performance training, or a proficiency check on a weight-shift ultralight.
    source: de:LuftPersV.45(4)
    also_cites: [de:LuftPersV.45(1), de:LuftVZO.1(4)]
    only_for: { authorities: [DAEC], ref: de:LuftPersV.45(4) }
    counting: { within_months: 24, classes: [ULTRALIGHT], ul_kinds: [WEIGHT_SHIFT] }
    passes_if:
      id: recency
      ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift]
      any_of:
        - id: experience
          ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift]
          all_of:
            - flight_time: { min_hours: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
            - takeoffs: { min: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
            - landings: { min: 12, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
            - safety_training: { unknown_if_none: true, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
        - proficiency_check: { ul_kinds: [WEIGHT_SHIFT], with: examiner, ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift] }
    outcomes:
      preset: recency
      special:
        - { id: safety_training_unknown, when: { all: [undetermined, { met: total_time }, { met: takeoffs }, { met: landings }] }, status: unknown, message: rating.ul_safety_training_not_recorded, ref: policy:unknown-input }
        - { id: kind_unknown, when: undetermined, status: unknown, message: rating.ul_flights_kind_unknown, ref: policy:unknown-input }
    description_key: ul_trike_daec

  - id: passengers
    asks: May the holder carry passengers in a weight-shift ultralight?
    uses: de.shared.ul-passengers
    with:
      kinds: [WEIGHT_SHIFT]
      authorised: { holds: { privileges: [UL_PASSENGER_AUTH], details: [WEIGHT_SHIFT], sameLicence: true, valid: true } }

  - id: medical
    asks: Is a valid class 2 or LAPL medical certificate held (§ 45(1) second sentence, ultralights above 120 kg empty mass)?
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1@lapl]

  - id: licence
    asks: Is the kind entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: association-rules-by-authority
    reading: '§ 45(4) requires "ausreichende fliegerische Übung" and leaves the details to the Beauftragte under § 31c LuftVG. The DULV and the DAeC set different rules for weight-shift ultralights (their published rules were checked on 2026-09-28), so the rule follows the body that issued the licence: a DAeC licence uses the DAeC rule, a DULV licence the DULV rule. A licence issued by the LBA also uses the DULV rule; no official source says which rule governs an LBA licence, so that mapping is an unverified assumption.'
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift, assoc:daec:ul-recency-weight-shift]
    affects: [recency_dulv, recency_daec]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: dulv-pic-only
    reading: 'The DULV rule is 12 hours as PIC on weight-shift ultralights in 24 months (dual time is not PIC time), or a proficiency check with a recognised examiner. Only a check recorded on a weight-shift ultralight counts, and it counts for the same 24 months. That the examiner is recognised is not checked.'
    ref: [de:LuftPersV.45(4), assoc:dulv:ul-recency-weight-shift, assoc:dulv:ausbildungshandbuch-1-40]
    affects: [recency_dulv]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: daec-safety-training-not-recorded
    reading: 'The DAeC rule is 12 hours (any role), 12 take-offs and 12 landings on weight-shift ultralights in 24 months and a safety or performance training for trikes, or a proficiency check on a weight-shift ultralight. The training decides whether the pilot may fly, so it is required: it counts when recorded as a safety_training event on a weight-shift ultralight within the same 24 months (the DAeC gives no period of its own), and while none is recorded the result is unknown and asks for it, not lapsed. Only a check recorded on a weight-shift ultralight counts; that the examiner is recognised is not checked.'
    ref: [de:LuftPersV.45(4), assoc:daec:ul-recency-weight-shift]
    affects: [recency_daec]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: luftvzo-numbering
    reading: 'Ambiguity, § 45(4): it refers to "§ 1 Absatz 4 Satz 1 Nummer 1" LuftVZO, but LuftVZO § 1(4) first sentence has no numbered items. Read literally it covers the one- and two-seat sport aircraft of at most 120 kg empty mass that § 1(4) exempts from type certification, and this kind is evaluated under § 45(4).'
    ref: [de:LuftPersV.45(4), de:LuftVZO.1(4)]
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
  - id: above-120-kg-not-named
    reading: 'No paragraph names weight-shift ultralights above 120 kg empty mass (most trikes): § 45(2) covers three-axis ultralights, (2a) helicopters, and § 45(4) the class up to 120 kg, so the statutory basis of a recency rule for heavier trikes is unclear. Both Beauftragte still publish and apply one, so the association rule is applied regardless of mass (the record has no empty mass either).'
    ref: [de:LuftPersV.45(4), de:LuftPersV.45(1)]
    affects: [recency_dulv, recency_daec]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: licence-without-expiry
    reading: The ultralight licence is issued without a time limit (§ 45(1)); a recorded rating expiry date is ignored, and only the recency decides.
    ref: de:LuftPersV.45(1)
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: The licence covers the kind entered in it (§ 44(2)); an ultralight flight with no ultralight kind recorded cannot be attributed to this kind, is unknown input and is never counted, and when nothing else decides the result is unknown and asks for the kind.
    ref: de:LuftPersV.44(2)
    affects: [recency_dulv, recency_daec]
    approved_by: null
    approved_on: null
  - id: medical-above-120-kg
    reading: 'Above 120 kg empty mass the licence is valid only with a valid medical certificate (§ 45(1) second sentence, MED.A.030(b)). Most weight-shift ultralights are heavier, so the rating requires a valid LAPL or class 2 medical certificate, or a class 1 certificate within its LAPL validity (AMC1 MED.A.030): with none recorded the result is unknown and asks for one; with only an expired one it is expired. A trike up to 120 kg needs none, which the record cannot show.'
    ref: de:LuftPersV.45(1)
    affects: [medical]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
