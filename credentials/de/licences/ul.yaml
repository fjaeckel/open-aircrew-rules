credential: Ultralight pilot licence (Luftfahrerschein für Luftsportgeräteführer)
id: de.licence.ul
kind: licence
authority: DE
held_on: []
selects:
  licence: { kinds: [UL], authorities: [LBA, DULV, DAEC] }
  ratings: { classes: [ULTRALIGHT], ul_kinds: [none], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }
validity: { ref: "de:LuftPersV.45(1)", note: Issued without a time limit. }

evaluations:
  - id: kind_required
    about: rating
    asks: Does every ultralight rating on the licence record the kind of ultralight entered in the licence?
    source: de:LuftPersV.44(2)
    also_cites: [de:LuftPersV.45(2), de:LuftPersV.45(4)]
    outcomes:
      - { id: kind_required, when: always, status: unknown, message: rating.ul_kind_required, ref: policy:unknown-input }

  - id: training_three_axis
    about: training
    asks: For a student, is the three-axis flight training complete (30 hours on three-axis ultralights, 5 of them solo)?
    source: de:LuftPersV.42(4)
    also_cites: [de:LuftPersV.45b]
    only_for: { programme: UL_THREE_AXIS }
    counting: { ever: true, ul_kinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER] }
    passes_if:
      ref: de:LuftPersV.42(4)
      all_of:
        - pic_dual_or_solo_time: { id: total_time, min_hours: 30, ref: de:LuftPersV.42(4) }
        - solo_time: { min_hours: 5, ref: de:LuftPersV.42(4) }
    outcomes: { preset: training, omit: [unknown] }

  - id: training_weight_shift
    about: training
    asks: For a student, is the weight-shift flight training complete (25 hours on weight-shift ultralights, 10 of them with an instructor and 5 solo)?
    source: de:LuftPersV.42(5)
    also_cites: [de:LuftPersV.45b]
    only_for: { programme: UL_WEIGHT_SHIFT }
    counting: { ever: true, ul_kinds: [WEIGHT_SHIFT] }
    passes_if:
      ref: de:LuftPersV.42(5)
      all_of:
        - pic_dual_or_solo_time: { id: total_time, min_hours: 25, ref: de:LuftPersV.42(5) }
        - dual_time: { min_hours: 10, ref: de:LuftPersV.42(5) }
        - solo_time: { min_hours: 5, ref: de:LuftPersV.42(5) }
    outcomes: { preset: training, omit: [unknown] }

interpretations:
  - id: kind-decides-the-rule
    reading: The licence covers the kind of ultralight entered in it (§ 44(2)), and the recency rule, its thresholds and the aircraft that count all depend on that kind (§ 45(2), (2a) and the association rules under § 45(4)). An ultralight rating recorded without a kind is therefore not evaluated for recency or passengers; it reports unknown and asks for the kind.
    ref: [de:LuftPersV.44(2), de:LuftPersV.45(4)]
    affects: [kind_required]
    approved_by: null
    approved_on: null
  - id: ultralight-licences
    reading: 'The ultralight licence is a licence of kind UL issued by the LBA or by a Beauftragter under § 31c LuftVG (DULV, DAeC). It is issued without a time limit, so no licence-level validity is evaluated; the privileges of each ultralight kind entered are evaluated on the ratings that record the kinds. Above 120 kg empty mass the licence is valid only with a valid medical certificate (§ 45(1) second sentence, MED.A.030(b)). The record has no empty mass, so the kind ratings that are practically always heavier (three-axis, helicopter, gyroplane, weight-shift) require a valid LAPL or class 2 medical, or a class 1 within its LAPL validity: with none recorded they are unknown, with only an expired one expired. Powered paraglider and ultralight sailplane ratings, mostly up to 120 kg, require none.'
    ref: [de:LuftPersV.45(1), de:LuftPersV.44(2)]
    affects: [training_three_axis, training_weight_shift]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: training-hours-partial
    reading: Only the hours of § 42(4) no. 1 and § 42(5) no. 1 are evaluated, counted on ultralights of the kind trained over the whole logbook (for three-axis, UL motorgliders included). Not evaluated - shown neither as met nor unmet - are the credit of time on other aircraft toward the total (up to 20 hours as PIC of sailplanes or helicopters, or 5 hours on weight-shift ultralights, for three-axis; up to 10 hours as PIC of other aircraft for weight-shift) and the exercises of no. 2 (take-offs and landings at different aerodromes, outlandings with an instructor, the cross-country flights, the briefings), which the record cannot show.
    ref: [de:LuftPersV.42(4), de:LuftPersV.42(5)]
    affects: [training_three_axis, training_weight_shift]
    approved_by: null
    approved_on: null
  - id: training-time-counted
    reading: 'The total is dual, supervised solo and PIC time (§ 45b: time as a student with an instructor and as pilot on prescribed training flights); "Alleinflug" is supervised solo or PIC time. PIC time flown after the licence was issued counts as well, because the record does not separate training from later flying.'
    ref: [de:LuftPersV.45b, de:LuftPersV.42(4)]
    affects: [training_three_axis, training_weight_shift]
    approved_by: null
    approved_on: null
  - id: training-for-ul-licence-records
    reading: The programmes are evaluated once for every ultralight licence recorded (which may be the licence in training); whether the holder is still a student is not decided here.
    ref: de:LuftPersV.42(1)
    affects: [training_three_axis, training_weight_shift]
    approved_by: null
    approved_on: null
  - id: kindless-flights-unknown
    reading: An ultralight flight with no ultralight kind recorded cannot be attributed to the kind trained; it is unknown input and never counted. A programme that is not complete is reported in progress even when such flights exist.
    ref: de:LuftPersV.44(2)
    affects: [training_three_axis, training_weight_shift]
    approved_by: null
    approved_on: null
