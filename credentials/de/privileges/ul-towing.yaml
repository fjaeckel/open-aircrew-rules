credential: Ultralight towing rating (Schleppberechtigung)
id: de.privilege.ul-towing
kind: privilege
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  privilege: { kinds: [UL_TOWING] }

evaluations:
  - id: recency
    asks: May the holder tow with a powered ultralight? 10 tow flights in an ultralight in the last 24 months, of the kind entered with the rating (what is towed and how it is taken up).
    source: de:LuftPersV.84(5)
    also_cites: [de:LuftPersV.84(1), de:LuftPersV.84(4)]
    counting: { within_months: 24 }
    passes_if:
      landings: { id: tows, name: requirement.tows, min: 10, classes: [ULTRALIGHT], flagged: { towFlight: true }, by_this_tow_kind: true, by_this_tow_take_up: true, ref: [de:LuftPersV.84(5), de:LuftPersV.84(4)] }
    outcomes:
      preset: privilege_recency
      special:
        - { id: tow_kind_unknown, when: undetermined, status: unknown, message: privilege.ul_tow_kind_unknown, ref: policy:unknown-input }
    on_fail: { what: fly the supervised tows of paragraph (2) no. 2 or paragraph (3) no. 2 again, ref: de:LuftPersV.84(5) }
    description_key: dulv_ul_towing

  - id: licence
    asks: Is the towing rating entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: tow-kind-not-recorded
    reading: '"In der jeweils eingetragen Art" ties the 10 tows to the kind entered with the rating (§ 84(4): what is towed and how it is taken up). The rating records the entered kind in its detail, a tow kind (glider, banner, ul_glider, hang_glider) and a take-up (ground, pick_up), for example "banner pick_up"; a tow flight counts only when its recorded tow kind and take-up match. A detail naming no tow kind or no take-up, or a tow flight without them, cannot be matched and gives unknown, even when every tow was of one kind (stricter than unknown only with tows of several kinds). Only tows flown in an ultralight count; whether tows in other aircraft count is left open by the text.'
    ref: [de:LuftPersV.84(5), de:LuftPersV.84(4)]
    affects: [recency]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: tows-counted
    reading: 'The text counts tow flights ("Schleppflüge"): each landing on a flight flagged as a tow flight is one tow flight, so a logbook line grouping several tow flights counts each, and a double tow (two objects on one flight) counts once. The recorded number of towed objects is not used.'
    ref: de:LuftPersV.84(5)
    affects: [recency]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: statutory-for-every-authority
    reading: The requirement is statutory and applies to an ultralight towing rating whichever body issued the licence; a recorded expiry date of the rating is honoured (valid through that date).
    ref: de:LuftPersV.84(5)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: supervised-tows-not-restoring
    reading: When the tows are missing, § 84(5) second sentence sends the holder back to the supervised tows of § 84(2) no. 2 or § 84(3) no. 2; these are not modelled as a restoring event, and the result names the missing tows.
    ref: de:LuftPersV.84(5)
    affects: [recency]
    approved_by: null
    approved_on: null
