credential: Ultralight towing rating (Schleppberechtigung)
id: de.privilege.ul-towing
kind: privilege
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  privilege: { kinds: [UL_TOWING] }

evaluations:
  - id: recency
    asks: May the holder tow with a powered ultralight? 10 tows of the entered kind in the last 24 months.
    source: de:LuftPersV.84(5)
    also_cites: [de:LuftPersV.84(1), de:LuftPersV.84(4)]
    counting: { within_months: 24 }
    passes_if:
      tows: { min: 10, classes: [ULTRALIGHT], ref: de:LuftPersV.84(5) }
    outcomes: privilege_recency
    on_fail: { what: fly the supervised tows of paragraph (2) no. 2 or paragraph (3) no. 2 again, ref: de:LuftPersV.84(5) }
    description_key: dulv_ul_towing

  - id: licence
    asks: Is the towing rating entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: tow-kind-not-recorded
    reading: '"In der jeweils eingetragen Art" is the kind of tow entered with the rating (§ 84(4): the take-up method and the object towed). The record does not state it for the rating or for every flight, so every tow flown in an ultralight counts, whatever was towed and whatever the ultralight kind; a tow in any other class does not.'
    ref: [de:LuftPersV.84(5), de:LuftPersV.84(4)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: tows-counted
    reading: A tow is one towed object on a flight flagged as a tow flight, counted by the recorded number of towed gliders and as one when no number is recorded; the text counts tow flights ("Schleppflüge"), and a flight recording several tows is read as several.
    ref: de:LuftPersV.84(5)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: statutory-for-every-authority
    reading: The requirement is statutory and applies to an ultralight towing rating whichever body issued the licence; a recorded expiry date of the rating is honoured (valid through that date).
    ref: de:LuftPersV.84(5)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: supervised-tows-not-restoring
    reading: When the tows are missing, § 84(5) second sentence sends the holder back to the supervised tows of § 84(2) no. 2 or § 84(3) no. 2; these are not modelled as a restoring event, and the result names the missing tows.
    ref: de:LuftPersV.84(5)
    affects: [recency]
    approved_by: null
    approved_on: null
