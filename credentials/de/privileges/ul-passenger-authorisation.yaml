credential: Ultralight passenger authorisation (Passagierberechtigung)
id: de.privilege.ul-passenger-authorisation
kind: privilege
authority: DE
held_on: [Luftfahrerschein für Luftsportgeräteführer]
selects:
  privilege: { kinds: [UL_PASSENGER_AUTH], licence_kinds: [UL], authorities: [LBA, DULV, DAEC] }

evaluations:
  - id: validity
    asks: Is the passenger authorisation still valid? It follows the licence, which has no time limit, unless an expiry date was entered.
    source: de:LuftPersV.84a(5)
    also_cites: [de:LuftPersV.84a(1), de:LuftPersV.45(1)]
    outcomes:
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: de:LuftPersV.84a(5) }
      - { id: valid, when: always, status: current, message: privilege.valid, params: { date: expiry_date }, ref: de:LuftPersV.84a(5) }

  - id: licence
    asks: Is the authorisation entered in an ultralight licence whose own requirements are met?
    requires_all: [de.licence.ul]

interpretations:
  - id: validity-follows-licence
    reading: The authorisation is valid as long as the ultralight licence, which is issued without a time limit (§ 45(1)); where the Beauftragte limited its validity, the limit is the expiry date recorded with the privilege, valid through that date. The conditions for extending a limited authorisation are set by the Beauftragte and are not evaluated.
    ref: [de:LuftPersV.84a(5), de:LuftPersV.45(1)]
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: acquisition-taken-as-met
    reading: A recorded UL_PASSENGER_AUTH privilege is taken as granted, so the cross-country flights of § 84a(2), the requirements of § 84a(3) and the practical test of § 84a(4) are not checked for it. The kind of ultralight the authorisation is entered for (§ 84a(5) first sentence), recorded in the privilege's detail, does not affect its validity; it is compared with the kind flown when passengers are carried (de.shared.ul-passengers).
    ref: [de:LuftPersV.84a(2), de:LuftPersV.84a(4), de:LuftPersV.84a(5)]
    affects: [validity]
    approved_by: null
    approved_on: null
