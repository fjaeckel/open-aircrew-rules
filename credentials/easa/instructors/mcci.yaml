credential: Multi-crew cooperation instructor certificate (MCCI)
id: easa.instructor.mcci
kind: instructor_certificate
authority: EASA
held_on: []
selects:
  privilege: { kinds: [MCCI], authorities: [EASA, LBA] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: validity
    asks: Is the MCCI certificate within its 3-year validity period?
    uses: easa.shared.instructor-certificate-validity

interpretations:
  - id: part-fcl-certificate
    reading: "An MCCI certificate is an MCCI privilege recorded on a licence of authority EASA or LBA."
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: revalidation-not-evaluated
    reading: "The revalidation is not evaluated: it refers to point FCL.930.MCCI(a)(3), which is not stored under sources/, and to instruction in an MCC course on a given FSTD type, which the record does not identify. Renewal ((b)) is not applied. Only the validity period is evaluated."
    ref: [easa:FCL.940.MCCI(a), easa:FCL.940.MCCI(b)]
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: no-licence-requirement
    reading: The certificate names no licence requirement. Its holder need only hold or have held a pilot licence and may instruct in an FSTD without exercising licence privileges, and the record cannot show a licence held in the past; requiring a current licence would report valid certificates unknown.
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
