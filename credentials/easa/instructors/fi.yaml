credential: Flight instructor certificate (FI), Part-FCL
id: easa.instructor.fi
kind: instructor_certificate
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL, PPL(H), CPL(H), ATPL(H), GPL]
selects:
  privilege: { kinds: [FI], authorities: [EASA, LBA], not_licence_kinds: [BPL, SPL, LAPL_S, UL] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: revalidation
    asks: Is the FI certificate within its 3 years, and has the holder met two of the three revalidation items (50 hours of instruction, instructor refresher training, an assessment of competence in the last 12 months)?
    source: easa:FCL.940.FI(a)(1)
    also_cites: [easa:FCL.940]
    valid_for:
      counted_from: valid_from
      periods:
        - { months: 36, ref: easa:FCL.940 }
    counting: { within_months_before_expiry: 36 }
    passes_if:
      id: revalidation
      ref: easa:FCL.940.FI(a)(1)
      n_of:
        n: 2
        of:
          - instruction_or_examining_time: { id: instruction, min_hours: 50, ref: easa:FCL.940.FI(a)(1)(i)(A) }
          - instructor_refresher: { for_rating: [FI, IRI], with: ATO, ref: easa:FCL.940.FI(a)(1)(ii) }
          - assessment_of_competence: { for_rating: [FI, IRI], within_months_before_expiry: 12, with: examiner, ref: easa:FCL.940.FI(a)(1)(iii) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: privilege.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: easa:FCL.940 }
      - { id: met, when: all_met, status: current, message: privilege.revalidation_current, params: { date: expiry_date }, ref: easa:FCL.940.FI(a)(1) }
      - { id: expiring, when: { expires_within: { days: 90 } }, status: expiring, message: privilege.expiring, params: { days: days_to_expiry, date: expiry_date }, ref: policy:expiring-notice }
      - { id: not_met, when: always, status: current, message: privilege.revalidation_not_met, params: { date: expiry_date }, ref: easa:FCL.940 }
    on_fail: { what: renewal (instructor refresher training and an assessment of competence in the 12 months before applying), ref: easa:FCL.940.FI(b) }
    description_key: privilege_expiry

  - id: licence
    asks: Is the FI certificate held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.lapl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl, easa.licence.ppl-h, easa.licence.lapl-h, easa.licence.cpl-h, easa.licence.atpl-h, easa.licence.ppl-as, easa.licence.cpl-as, easa.licence.gpl]

interpretations:
  - id: part-fcl-certificate
    reading: An FI certificate is an FI privilege recorded on a licence of authority EASA or LBA, not on a BPL, SPL, LAPL(S) or ultralight licence (an FI on a BPL is an FI(B) under Part-BFCL; the sailplane instructor is the FI_S privilege).
    ref: easa:FCL.940
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: three-years-from-valid-from
    reading: The 3 years run from the certificate's recorded validity start (validFrom), else its issue date; an earlier recorded expiry date wins, a later one is capped at 3 years. Without either date the result is unknown.
    ref: easa:FCL.940
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: valid-until-expiry
    reading: '"Before the expiry date" is the whole 3-year validity period. The certificate stays valid until its expiry date whether or not the revalidation items are met, so an unmet revalidation is reported current (expiring in the last 90 days) with a message saying it is not met; only the met stage says it is revalidated.'
    ref: [easa:FCL.940, easa:FCL.940.FI(a)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: instruction-any-category
    reading: The 50 hours are instruction given plus examiner time in any aircraft; the "appropriate aircraft category" is not checked, because the FI privilege record does not say whether it is an FI(A), FI(H), FI(As) or FI(G), nor in which capacity (FI, TRI, CRI, IRI, MI or examiner) the time was flown. The 20 hours of an FI(As), the gyroplane hours of an FI(G) and the 10 hours of BIR or IR instruction in the last 12 months are not applied.
    ref: [easa:FCL.940.FI(a)(1)(i)(A), easa:FCL.940.FI(a)(1)(i)(B), easa:FCL.940.FI(a)(1)(i)(C)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: refresher-and-assessment-events
    reading: The instructor refresher training is an instructor_refresher event and the assessment of competence an assessment_of_competence event, each recorded for the FI or the IRI certificate (the IRI is revalidated with this evaluation, so an event recorded for either counts for both); the refresher falls within the validity period and the assessment in the 12 months before expiry. An event recorded for another certificate (an FI(S), a CRI, an examiner certificate) or for none does not count. That the refresher was given at an ATO or the competent authority, and who conducted the assessment, cannot be shown by the record and are taken as met.
    ref: [easa:FCL.940.FI(a)(1)(ii), easa:FCL.940.FI(a)(1)(iii)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: alternate-assessment-not-tracked
    reading: The rule that at least every alternate revalidation includes an assessment of competence is not applied, because the record holds no history of earlier revalidations. Renewal after expiry is not evaluated.
    ref: [easa:FCL.940.FI(a)(2), easa:FCL.940.FI(b)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
