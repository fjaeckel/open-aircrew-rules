credential: Flight test instructor certificate (FTI)
id: easa.instructor.fti
kind: instructor_certificate
authority: EASA
held_on: []
selects:
  privilege: { kinds: [FTI], authorities: [EASA, LBA] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: validity
    asks: Is the FTI certificate within its 3-year validity period?
    uses: easa.shared.instructor-certificate-validity

  - id: licence
    asks: Is the FTI certificate held on an aeroplane or helicopter licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.lapl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl, easa.licence.ppl-h, easa.licence.lapl-h, easa.licence.cpl-h, easa.licence.atpl-h]

interpretations:
  - id: part-fcl-certificate
    reading: "An FTI certificate is an FTI privilege recorded on a licence of authority EASA or LBA."
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: revalidation-not-evaluated
    reading: "The revalidation is not evaluated: flight-test time and flight-test instruction are not recorded as such, and a recorded instructor refresher event does not say that it was FTI refresher training at an ATO with a supervised instruction flight. Renewal ((b)) is not applied. Only the validity period is evaluated."
    ref: [easa:FCL.940.FTI(a)(1)(i), easa:FCL.940.FTI(a)(1)(ii), easa:FCL.940.FTI(a)(2), easa:FCL.940.FTI(b)]
    affects: [validity]
    approved_by: null
    approved_on: null
