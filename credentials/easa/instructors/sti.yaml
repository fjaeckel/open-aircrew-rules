credential: Synthetic training instructor certificate (STI)
id: easa.instructor.sti
kind: instructor_certificate
authority: EASA
held_on: []
selects:
  privilege: { kinds: [STI], authorities: [EASA, LBA] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: validity
    asks: Is the STI certificate within its 3-year validity period?
    uses: easa.shared.instructor-certificate-validity

interpretations:
  - id: part-fcl-certificate
    reading: "An STI certificate is an STI privilege recorded on a licence of authority EASA or LBA."
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: revalidation-not-evaluated
    reading: "The revalidation is not evaluated: instruction given in an FSTD as part of a complete CPL, IR, PPL or class or type rating course, and a proficiency check passed on the same FSTD, are not identifiable in the record. Renewal ((b)) is not applied. Only the validity period is evaluated."
    ref: [easa:FCL.940.STI(a)(1), easa:FCL.940.STI(a)(2), easa:FCL.940.STI(b)]
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: no-licence-requirement
    reading: The certificate names no licence requirement. Its holder need only hold or have held a pilot licence and may instruct in an FSTD without exercising licence privileges, and the record cannot show a licence held in the past; requiring a current licence would report valid certificates unknown.
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
