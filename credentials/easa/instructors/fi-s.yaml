credential: Flight instructor certificate for sailplanes (FI(S))
id: easa.instructor.fi-s
kind: instructor_certificate
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  privilege: { kinds: [FI_S], not_authorities: [FAA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder exercise the FI(S) privileges? Instructor refresher training and 30 hours or 60 launches of instruction in the last 3 years, and a demonstration of instructional ability in the last 9 years.
    source: easa:SFCL.360(a)
    also_cites: [easa:SFCL.360(b), easa:SFCL.360(c), easa:SFCL.360(d)]
    counting: { within_months: 36 }
    passes_if:
      id: recency
      ref: easa:SFCL.360(a)
      all_of:
        - instructor_refresher: { name: requirement.fi_refresher, with: ATO, ref: easa:SFCL.360(a)(1)(i) }
        - id: instruction
          ref: easa:SFCL.360(a)(1)(ii)
          any_of:
            - instruction_or_examining_time: { id: instruction_time, name: requirement.instruction_time, min_hours: 30, classes: [GLIDER, TMG], ref: [easa:SFCL.360(a)(1)(ii)(A), easa:SFCL.360(b)] }
            - launches: { id: instruction_launches, name: requirement.instruction_launches, min: 60, classes: [GLIDER, TMG], with_time: [dualGiven], ref: easa:SFCL.360(a)(1)(ii)(B) }
            - assessment_of_competence: { id: resumption_assessment, with: examiner, ref: easa:SFCL.360(d) }
        - supervised_instruction: { id: demonstration, also: [assessment_of_competence], within_months: 108, with: examiner, ref: [easa:SFCL.360(a)(2), easa:SFCL.360(c)] }
    outcomes: privilege_recency
    on_fail: { what: instructor refresher training and an assessment of competence (SFCL.345) before resuming, ref: easa:SFCL.360(d) }
    description_key: sfcl_360_fi_s

  - id: licence
    asks: Is the FI(S) certificate held on a sailplane licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.spl]

interpretations:
  - id: sfcl-certificate
    reading: An FI(S) certificate is an FI_S privilege recorded on a licence of any authority except FAA and the ultralight associations (DULV, DAeC). Part-SFCL sets no validity period for it; a recorded expiry date is honoured (valid through that date).
    ref: easa:SFCL.360(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: instruction-on-sailplanes
    reading: Instruction is instruction given plus examiner time (the FE(S) hours of (b)) on GLIDER and TMG flights in the last 36 months; the launches are those of flights with instruction given (a TMG's launch count is its take-offs), and examiner time does not add launches.
    ref: [easa:SFCL.360(a)(1)(ii), easa:SFCL.360(b)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: refresher-event
    reading: The instructor refresher training is an instructor_refresher event in the last 36 months; where it was given and its theoretical content cannot be shown by the record and are taken as met.
    ref: easa:SFCL.360(a)(1)(i)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: demonstration-event
    reading: The demonstration of instructional ability is a supervised_instruction event in the last 108 months (9 years); an assessment of competence (SFCL.345) in that period satisfies it too, as it is what (c) requires after a failed demonstration. Who supervised it cannot be shown by the record.
    ref: [easa:SFCL.360(a)(2), easa:SFCL.360(c)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: resumption
    reading: A holder who does not comply resumes with refresher training and an assessment of competence (SFCL.345); an assessment_of_competence event in the last 36 months, with the refresher training, therefore stands in for the instruction hours or launches.
    ref: easa:SFCL.360(d)
    affects: [recency]
    approved_by: null
    approved_on: null
