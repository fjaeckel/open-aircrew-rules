credential: Mountain rating instructor certificate (MI)
id: easa.instructor.mi
kind: instructor_certificate
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  privilege: { kinds: [MI], authorities: [EASA, LBA] }

evaluations:
  - id: validity
    asks: Is an FI, TRI or CRI certificate valid on the same licence (the MI is valid as long as one is)?
    source: easa:FCL.940.MI
    outcomes:
      - { id: valid, when: { holds: { privileges: [FI, TRI, CRI], sameLicence: true, valid: true } }, status: current, message: privilege.valid, ref: easa:FCL.940.MI }
      - { id: invalid, when: always, status: expired, message: privilege.underlying_certificate_invalid, ref: easa:FCL.940.MI }
    description_key: privilege_expiry

  - id: underlying_certificate
    asks: Are the requirements of the FI, TRI or CRI certificate the MI rests on met?
    requires_any: [easa.instructor.fi, easa.instructor.tri, easa.instructor.cri]

interpretations:
  - id: same-licence-recorded-expiry
    reading: The MI is valid while an FI, TRI or CRI privilege recorded on the same licence is not expired by its recorded expiry date (one recorded without an expiry date counts as valid); a date recorded on the MI itself is not used. The derived 3-year validity of that certificate is evaluated by its own credential, which the underlying_certificate requirement brings into the composite.
    ref: easa:FCL.940.MI
    affects: [validity]
    approved_by: null
    approved_on: null
