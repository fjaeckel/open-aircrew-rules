credential: Synthetic flight instructor certificate (SFI)
id: easa.instructor.sfi
kind: instructor_certificate
authority: EASA
held_on: []
selects:
  privilege: { kinds: [SFI], authorities: [EASA, LBA] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: validity
    asks: Is the SFI certificate within its 3-year validity period?
    uses: easa.shared.instructor-certificate-validity

interpretations:
  - id: part-fcl-certificate
    reading: "An SFI certificate is an SFI privilege recorded on a licence of authority EASA or LBA."
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: revalidation-not-evaluated
    reading: "The revalidation is not evaluated: hours as instructor or examiner in FSTDs are not recorded apart from the holder's own FSTD sessions, and the proficiency checks on an FFS for every type held ((b)) need per-type data. Renewal ((e)) is not applied. Only the validity period is evaluated."
    ref: [easa:FCL.940.SFI(a)(1), easa:FCL.940.SFI(b), easa:FCL.940.SFI(e)]
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: no-licence-requirement
    reading: The certificate names no licence requirement. Its holder need only hold or have held a pilot licence and may instruct in an FSTD without exercising licence privileges, and the record cannot show a licence held in the past; requiring a current licence would report valid certificates unknown.
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
