credential: Class rating instructor certificate (CRI)
id: easa.instructor.cri
kind: instructor_certificate
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  privilege: { kinds: [CRI], authorities: [EASA, LBA], not_licence_kinds: [BPL, SPL, LAPL_S, UL] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: revalidation
    asks: Is the CRI certificate within its 3 years, and has the holder met two of the three revalidation items within it (10 hours of instruction in aeroplanes, refresher training, an assessment of competence)?
    source: easa:FCL.940.CRI(a)
    also_cites: [easa:FCL.940]
    valid_for:
      counted_from: valid_from
      periods:
        - { months: 36, ref: easa:FCL.940 }
    counting: { within_months_before_expiry: 36 }
    passes_if:
      id: revalidation
      ref: easa:FCL.940.CRI(a)
      n_of:
        n: 2
        of:
          - instruction_given_time: { id: instruction, min_hours: 10, categories: [aeroplane], ref: easa:FCL.940.CRI(a)(1) }
          - instructor_refresher: { for_rating: [CRI], with: ATO, ref: easa:FCL.940.CRI(a)(2) }
          - assessment_of_competence: { for_rating: [CRI], with: examiner, ref: easa:FCL.940.CRI(a)(3) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: privilege.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: easa:FCL.940 }
      - { id: met, when: all_met, status: current, message: privilege.revalidation_current, params: { date: expiry_date }, ref: easa:FCL.940.CRI(a) }
      - { id: expiring, when: { expires_within: { days: 90 } }, status: expiring, message: privilege.expiring, params: { days: days_to_expiry, date: expiry_date }, ref: policy:expiring-notice }
      - { id: not_met, when: always, status: current, message: privilege.revalidation_not_met, params: { date: expiry_date }, ref: easa:FCL.940 }
    on_fail: { what: renewal (refresher training and an assessment of competence in the 12 months before applying), ref: easa:FCL.940.CRI(c) }
    description_key: privilege_expiry

  - id: licence
    asks: Is the CRI certificate held on an aeroplane licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-certificate
    reading: A CRI certificate is a CRI privilege recorded on a licence of authority EASA or LBA, not on a BPL, SPL, LAPL(S) or ultralight licence.
    ref: easa:FCL.940
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: three-years-from-valid-from
    reading: The 3 years run from the certificate's recorded validity start (validFrom), else its issue date; an earlier recorded expiry date wins, a later one is capped at 3 years. Without either date the result is unknown.
    ref: easa:FCL.940
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: valid-until-expiry
    reading: The certificate stays valid until its expiry date whether or not the revalidation items are met, so an unmet revalidation is reported current (expiring in the last 90 days) with a message saying it is not met; only the met stage says it is revalidated.
    ref: [easa:FCL.940, easa:FCL.940.CRI(a)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: instruction-in-aeroplanes
    reading: The 10 hours are instruction given in aeroplanes (TMGs included) within the validity period; instruction given as FI counts too, because the record does not say in which capacity it was given, and the equal split between single-engine and multi-engine aeroplanes for a CRI holding both is not checked.
    ref: easa:FCL.940.CRI(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: refresher-and-assessment-events
    reading: The refresher training is an instructor_refresher event and the assessment of competence an assessment_of_competence event, each recorded for the CRI certificate and within the validity period; an event recorded for another certificate or for none does not count. Where the refresher was given, who conducted the assessment and for which aeroplanes cannot be shown by the record and are taken as met.
    ref: [easa:FCL.940.CRI(a)(2), easa:FCL.940.CRI(a)(3)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: alternate-assessment-not-tracked
    reading: The rule that at least every alternate revalidation includes the assessment of competence is not applied, because the record holds no history of earlier revalidations. Renewal after expiry is not evaluated.
    ref: [easa:FCL.940.CRI(b), easa:FCL.940.CRI(c)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
