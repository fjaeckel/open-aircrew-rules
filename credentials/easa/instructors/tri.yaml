credential: Type rating instructor certificate (TRI)
id: easa.instructor.tri
kind: instructor_certificate
authority: EASA
held_on: []
selects:
  privilege: { kinds: [TRI], authorities: [EASA, LBA] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: validity
    asks: Is the TRI certificate within its 3-year validity period?
    uses: easa.shared.instructor-certificate-validity

  - id: licence
    asks: Is the TRI certificate held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl, easa.licence.ppl-h, easa.licence.cpl-h, easa.licence.atpl-h, easa.licence.ppl-as, easa.licence.cpl-as]

interpretations:
  - id: part-fcl-certificate
    reading: "An TRI certificate is a TRI privilege recorded on a licence of authority EASA or LBA."
    ref: easa:FCL.940
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: revalidation-not-evaluated
    reading: "The revalidation is not evaluated: the record does not say whether instruction given was part of a complete type rating or recurrent training course, for which category (aeroplanes, helicopters, powered lift) or types the certificate is held, or how many hours were flown per type held, so the two-of-three rule cannot be decided even where a refresher or an assessment of competence is recorded. The TRI(H) validity tied to an FI(H) certificate ((a)(5)) and renewal ((b)) are not applied. Only the validity period is evaluated."
    ref: [easa:FCL.940.TRI(a)(1), easa:FCL.940.TRI(a)(2), easa:FCL.940.TRI(a)(5), easa:FCL.940.TRI(b)]
    affects: [validity]
    approved_by: null
    approved_on: null
