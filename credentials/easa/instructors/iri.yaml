credential: Instrument rating instructor certificate (IRI)
id: easa.instructor.iri
kind: instructor_certificate
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL, PPL(H), CPL(H), ATPL(H)]
selects:
  privilege: { kinds: [IRI], authorities: [EASA, LBA], not_licence_kinds: [BPL, SPL, LAPL_S, UL] }
validity: { period_months: 36, ref: "easa:FCL.940" }

evaluations:
  - id: revalidation
    asks: Is the IRI certificate within its 3 years, and has the holder met two of the three FI revalidation items (50 hours of instruction, instructor refresher training, an assessment of competence in the last 12 months)?
    uses: easa.instructor.fi#revalidation

  - id: licence
    asks: Is the IRI certificate held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl, easa.licence.ppl-h, easa.licence.cpl-h, easa.licence.atpl-h, easa.licence.ppl-as, easa.licence.cpl-as]

interpretations:
  - id: revalidated-like-fi
    reading: The IRI is revalidated exactly as an FI (FCL.940.FI), with the same readings as the FI certificate; the IRI privilege is recorded on a licence of authority EASA or LBA.
    ref: easa:FCL.940.IRI
    affects: [revalidation]
    approved_by: null
    approved_on: null
