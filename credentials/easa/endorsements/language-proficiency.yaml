credential: Language proficiency endorsement
id: easa.endorsement.language-proficiency
kind: endorsement
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  credential: { kinds: [LANG_ICAO_LEVEL4, LANG_ICAO_LEVEL5] }

evaluations:
  - id: level_4
    asks: Is an operational level (4) endorsement still valid (re-evaluated every 4 years)?
    source: easa:FCL.055(c)(1)
    also_cites: [easa:FCL.055(a)]
    only_for: { credential_types: [LANG_ICAO_LEVEL4] }
    valid_for:
      counted_from: issue
      periods:
        - { months: 48, ref: easa:FCL.055(c)(1) }
    outcomes:
      preset: validity
      expiring_notice: { days: 90, ref: policy:expiring-notice }

  - id: level_5
    asks: Is an extended level (5) endorsement still valid (re-evaluated every 6 years)?
    source: easa:FCL.055(c)(2)
    also_cites: [easa:FCL.055(a)]
    only_for: { credential_types: [LANG_ICAO_LEVEL5] }
    valid_for:
      counted_from: issue
      periods:
        - { months: 72, ref: easa:FCL.055(c)(2) }
    outcomes:
      preset: validity
      expiring_notice: { days: 90, ref: policy:expiring-notice }

interpretations:
  - id: issue-is-assessment
    reading: The period runs from the credential's issue date, read as the date of the assessment; the effective expiry is the earlier of that and a recorded expiry date.
    ref: easa:FCL.055(c)
    affects: [level_4, level_5]
    approved_by: null
    approved_on: null
  - id: level-6-not-evaluated
    reading: An expert level (6) endorsement is never re-evaluated and is not selected.
    ref: easa:FCL.055(c)
    affects: [level_4, level_5]
    approved_by: null
    approved_on: null
  - id: radio-use-and-ir-not-checked
    reading: Whether the endorsement is needed at all (radio use) and the additional requirements for IR holders are not evaluated.
    ref: [easa:FCL.055(a), easa:FCL.055(d), easa:FCL.055(e)]
    affects: [level_4, level_5]
    approved_by: null
    approved_on: null
