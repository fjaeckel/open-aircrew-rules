credential: Helicopter type rating
id: easa.rating.helicopter-type
kind: rating
authority: EASA
held_on: [PPL(H), CPL(H), ATPL(H)]
selects:
  ratings: { classes: [HELICOPTER], authorities: [EASA, LBA], not_licence_kinds: [LAPL_H, SPL, LAPL_S, UL] }
validity: { period_months: 12, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the type rating valid, and has the holder flown 2 hours in the type and passed a proficiency check in the 3 months before expiry (or, for light single-engine types, 6 hours as PIC and 1 hour of refresher training)?
    source: easa:FCL.740.H(a)
    also_cites: [easa:FCL.740(a)(1)]
    counting: { within_months_before_expiry: 12, in_class: true, in_type: true }
    passes_if:
      id: revalidation
      ref: easa:FCL.740.H(a)
      any_of:
        - id: check_route
          ref: easa:FCL.740.H(a)(1)
          all_of:
            - proficiency_check: { simulator: include, within_months_before_expiry: 3, with: examiner, ref: easa:FCL.740.H(a)(1)(ii)(A) }
            - flight_time: { id: type_time, name: requirement.flight_time, min_hours: 2, ref: [easa:FCL.740.H(a)(1)(i), easa:FCL.740.H(a)(1)(ii)(B)] }
        - id: refresher_route
          ref: easa:FCL.740.H(a)(2)(ii)
          max_engines: 1
          max_mtom_kg: 3175
          all_of:
            - pic_time: { min_hours: 6, ref: easa:FCL.740.H(a)(2)(ii)(A) }
            - refresher: { id: refresher, min_hours: 1, simulator: include, within_months_before_expiry: 3, with: instructor, remedy: remedy.refresher_training, ref: easa:FCL.740.H(a)(2)(ii)(B) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: rating.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: rating.expired, ref: easa:FCL.740(a)(1) }
      - { id: window_not_open, when: before_window, status: current, message: rating.window_not_open, params: { date: window_opens_at }, ref: policy:window-not-open }
      - { id: met_expiring, when: { all: [all_met, { expires_within: { days: 90 } }] }, status: expiring, message: rating.revalidation_expiring_met, params: { days: days_to_expiry }, ref: policy:expiring-notice }
      - { id: met, when: all_met, status: current, message: rating.revalidation_current, ref: easa:FCL.740.H(a) }
      - { id: type_unknown, when: undetermined, status: unknown, message: rating.type_not_identifiable, ref: policy:unknown-input }
      - { id: not_met, when: always, status: expiring, message: rating.revalidation_not_met_prof_check, ref: policy:revalidation-not-met-expiring }
    on_fail: { what: renewal, ref: easa:FCL.740(b) }

  - id: passengers_day
    asks: May the holder carry passengers in a helicopter?
    uses: easa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in a helicopter?
    uses: easa.shared.passengers-night
    with: { type_rated: true }

  - id: variants
    asks: Has the holder flown each variant recorded on the type rating in the last 2 years (or completed differences training or a proficiency check in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the type rating held on a helicopter licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-h, easa.licence.cpl-h, easa.licence.atpl-h]

interpretations:
  - id: part-fcl-type-ratings
    reading: A Part-FCL helicopter type rating is a HELICOPTER rating recorded on a licence of authority EASA or LBA other than a LAPL(H) (whose types follow FCL.140.H, the credential easa.licence.lapl-h), a sailplane licence or an ultralight licence.
    ref: easa:FCL.740.H(a)
    affects: [revalidation, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
  - id: type-is-type-designator
    reading: The type is the rating's type designator; flights, checks and training count only when they record the same type designator, and when the rating or the flights carry none the result is unknown.
    ref: easa:FCL.740.H(a)(1)(i)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: validity-period-is-twelve-months
    reading: Helicopter type ratings are valid for 1 year, so "within the validity period" is the 12 months before the recorded expiry date; FSTD time does not count toward the 2 hours, and a check flown in the helicopter counts toward them.
    ref: [easa:FCL.740.H(a)(1)(i), easa:FCL.740(a)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: check-in-fstd
    reading: A proficiency check in an FSTD recorded with the type counts as the check; that it followed Appendix 9 and was conducted by an examiner is not checked.
    ref: easa:FCL.740.H(a)(1)(ii)(A)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: light-single-engine-route
    reading: The route of point (a)(2)(ii) counts only flights recorded with 1 engine and a maximum take-off mass of at most 3 175 kg (for an FSTD session, of the type it represents). A flight in the type that records neither is unknown input, so without the check route met the result is unknown rather than not met.
    ref: easa:FCL.740.H(a)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: refresher-as-dual
    reading: The refresher training is 1 hour of dual time received in the type, in the aircraft or an FSTD, in the 3 months before expiry; the instructor and the exercises are not checked.
    ref: easa:FCL.740.H(a)(2)(ii)(B)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: group-revalidation-not-applied
    reading: The revalidation of several SEP or SET helicopter types by one check or refresher training, and revalidation by a skill test for another type, are not applied; each type is revalidated from its own flights and checks.
    ref: [easa:FCL.740.H(b), easa:FCL.740.H(c), easa:FCL.740.H(d)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: early-check-not-credited
    reading: A check passed earlier than the 3 months before expiry (the new period then starts on the check date) is not credited against the recorded expiry date; the holder records the new expiry date instead.
    ref: easa:FCL.740(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
