credential: Instrument rating, airships (IR(As))
id: easa.rating.ir-as
kind: rating
authority: EASA
held_on: [PPL(As), CPL(As)]
selects:
  ratings: { classes: [IR], authorities: [EASA, LBA], licence_kinds: [PPL_AS, CPL_AS] }
validity: { period_months: 12, ref: "easa:FCL.625(a)" }

evaluations:
  - id: revalidation
    asks: Is the IR valid, and has the holder passed an IR proficiency check in an airship or FSTD in the 3 months before expiry?
    source: easa:FCL.625(b)(1)
    also_cites: [easa:FCL.625.As(a), easa:FCL.625.As(b)]
    counting: { within_months_before_expiry: 3 }
    passes_if:
      proficiency_check: { for_rating: [IR], categories: [airship], simulator: include, with: examiner, ref: [easa:FCL.625.As(a), easa:FCL.625.As(b)] }
    outcomes:
      preset: revalidation
      messages: { not_met: rating.ir_check_not_met }
      expiring_notice: { days: 90, ref: policy:expiring-notice }
    on_fail: { what: renewal, ref: easa:FCL.625(c) }
    description_key: easa_ir

  - id: licence
    asks: Is the IR(As) held on an airship licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-as, easa.licence.cpl-as]

interpretations:
  - id: ir-on-airship-licence
    reading: An IR recorded on an EASA or LBA airship licence (PPL(As), CPL(As)) is read as an IR(As).
    ref: [easa:FCL.625.As(a), easa:FCL.625(b)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: ir-check-recorded
    reading: The check counts when recorded as an IR check (an event for the rating IR, or a flight flagged as a proficiency check with checkRating IR) in the airship class, in an airship or an FSTD; an IR check in another category does not count. That it followed Appendix 9 for the type and was conducted by an examiner, the FSTD level and the every-alternate-check-in-an-airship condition are not checked.
    ref: [easa:FCL.625.As(a), easa:FCL.625.As(b)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: early-check-not-credited
    reading: A check passed earlier than the 3 months before expiry (the new period then starts on the check date) is not credited against the recorded expiry date; the holder records the new expiry date instead.
    ref: easa:FCL.625(b)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: renewal-not-modelled
    reading: Renewal and the 7-year rule are not evaluated; an expired IR stays expired until a new expiry date is recorded.
    ref: [easa:FCL.625(c), easa:FCL.625(d)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
