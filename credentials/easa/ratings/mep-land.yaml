credential: MEP (land) class rating
id: easa.rating.mep-land
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [MEP_LAND], authorities: [EASA, LBA], not_licence_kinds: [LAPL_A, SPL, LAPL_S, UL] }
validity: { period_months: 12, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the rating valid, and has the holder passed a proficiency check in the 3 months before expiry and flown 10 route sectors (or 1 with an examiner) during its validity?
    source: easa:FCL.740.A(a)
    also_cites: [easa:FCL.740(a)(2), easa:FCL.010]
    counting: { within_months_before_expiry: 12, in_class: true }
    passes_if:
      ref: easa:FCL.740.A(a)
      all_of:
        - proficiency_check: { also: [ebt_assessment], simulator: include, within_months_before_expiry: 3, ref: [easa:FCL.740.A(a)(1), easa:FCL.740(a)(2)] }
        - id: route_sectors
          ref: easa:FCL.740.A(a)(2)
          any_of:
            - route_sectors: { id: sectors, min: 10, ref: easa:FCL.740.A(a)(2)(i) }
            - route_sectors: { id: examiner_sector, name: requirement.examiner_route_sector, remedy: none, min: 1, flagged: { examinerOnBoard: true }, simulator: include, fstd: [FFS], ref: easa:FCL.740.A(a)(2)(ii) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: rating.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: rating.expired, ref: easa:FCL.740(a)(1) }
      - { id: window_not_open, when: before_window, status: current, message: rating.window_not_open, params: { date: window_opens_at }, ref: policy:window-not-open }
      - { id: met_expiring, when: { all: [all_met, { expires_within: { days: 90 } }] }, status: expiring, message: rating.revalidation_expiring_met, params: { days: days_to_expiry }, ref: policy:expiring-notice }
      - { id: met, when: all_met, status: current, message: rating.revalidation_current, ref: easa:FCL.740.A(a) }
      - { id: sectors_not_logged, when: undetermined, status: unknown, message: rating.route_sectors_not_logged, ref: policy:unknown-input }
      - { id: not_met, when: always, status: expiring, message: rating.revalidation_not_met_prof_check, ref: policy:revalidation-not-met-expiring }
    on_fail: { what: renewal, ref: easa:FCL.740(b) }
    description_key: easa_mep_set

  - id: passengers_day
    asks: May the holder carry passengers in an MEP land aeroplane?
    uses: easa.shared.passengers-day

  - id: passengers_night
    asks: May the holder carry passengers at night in an MEP land aeroplane?
    uses: easa.shared.passengers-night

  - id: variants
    asks: Has the holder flown each variant recorded on the rating in the last 2 years (or completed differences training, a proficiency check or refresher training in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-licences
    reading: A Part-FCL multi-engine class rating is one recorded on a licence of authority EASA or LBA other than LAPL(A), SPL, LAPL(S) and ultralight licences, including a licence whose kind cannot be told from its type.
    ref: easa:FCL.740.A(a)
    affects: [revalidation, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
  - id: validity-period-is-twelve-months
    reading: The validity period of a multi-engine class rating is 1 year, so "during the period of validity" is the 12 months before the recorded expiry date, and the revalidation period opens then.
    ref: [easa:FCL.740.A(a)(2), easa:FCL.740(a)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: check-and-sectors-both-required
    reading: A proficiency check (or EBT practical assessment) in the 3 months before expiry is always required, and in addition 10 route sectors or 1 route sector with an examiner; there is no experience route without the check.
    ref: [easa:FCL.740.A(a)(1), easa:FCL.740.A(a)(2)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: check-in-any-fstd
    reading: The proficiency check counts in the aeroplane or in any FSTD recorded with the class ("an FSTD representing that class"); that it followed Appendix 9 and was conducted by an examiner is not checked.
    ref: easa:FCL.740.A(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: route-sector-cruise
    reading: A route sector is a flight in the class with a recorded cruise of at least 15 minutes (the FCL.010 definition), in any pilot role; a flight without a recorded cruise time is unknown input, never counted, so without the sectors met the result is unknown rather than not met.
    ref: [easa:FCL.010, easa:FCL.740.A(a)(2)(i)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: examiner-sector
    reading: The route sector with an examiner is a flight flagged examinerOnBoard with a cruise of at least 15 minutes, in the aeroplane or an FFS; it may be the proficiency check flight itself.
    ref: easa:FCL.740.A(a)(2)(ii)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: early-check-not-credited
    reading: A check passed earlier than the 3 months before expiry (FCL.740(a)(1), the new period then starts on the check date) is not credited against the recorded expiry date; the holder records the new expiry date instead.
    ref: easa:FCL.740(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: cat-exemption-not-applied
    reading: The exemption from the route sectors for pilots of a commercial air transport operator is not applied, because the record does not say whether the holder flies for such an operator.
    ref: easa:FCL.740.A(a)(3)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: multi-engine-types-separate
    reading: Multi-engine type ratings are recorded with class OTHER and are the credential easa.rating.aeroplane-type; this credential is the MEP class rating only.
    ref: easa:FCL.740.A(a)
    affects: [revalidation]
    approved_by: null
    approved_on: null
