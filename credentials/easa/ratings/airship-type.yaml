credential: Airship type rating
id: easa.rating.airship-type
kind: rating
authority: EASA
held_on: [PPL(As), CPL(As)]
selects:
  ratings: { classes: [AIRSHIP], authorities: [EASA, LBA], not_licence_kinds: [SPL, LAPL_S, UL] }
validity: { period_months: 12, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the type rating valid, and has the holder passed a proficiency check in the type in the 3 months before expiry and flown 2 hours in the type during its validity?
    source: easa:FCL.740.As(a)
    also_cites: [easa:FCL.740(a)(1)]
    counting: { within_months_before_expiry: 12, in_class: true, in_type: true }
    passes_if:
      ref: easa:FCL.740.As(a)
      all_of:
        - proficiency_check: { within_months_before_expiry: 3, with: examiner, ref: easa:FCL.740.As(a)(1) }
        - flight_time: { id: type_time, name: requirement.flight_time, min_hours: 2, ref: easa:FCL.740.As(a)(2) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: rating.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: rating.expired, ref: easa:FCL.740(a)(1) }
      - { id: window_not_open, when: before_window, status: current, message: rating.window_not_open, params: { date: window_opens_at }, ref: policy:window-not-open }
      - { id: met_expiring, when: { all: [all_met, { expires_within: { days: 90 } }] }, status: expiring, message: rating.revalidation_expiring_met, params: { days: days_to_expiry }, ref: policy:expiring-notice }
      - { id: met, when: all_met, status: current, message: rating.revalidation_current, ref: easa:FCL.740.As(a) }
      - { id: type_unknown, when: undetermined, status: unknown, message: rating.type_not_identifiable, ref: policy:unknown-input }
      - { id: not_met, when: always, status: expiring, message: rating.revalidation_not_met_prof_check, ref: policy:revalidation-not-met-expiring }
    on_fail: { what: renewal, ref: easa:FCL.740(b) }

  - id: passengers_day
    asks: May the holder carry passengers in an airship?
    uses: easa.shared.passengers-day

  - id: passengers_night
    asks: May the holder carry passengers at night in an airship?
    uses: easa.shared.passengers-night

  - id: variants
    asks: Has the holder flown each variant recorded on the type rating in the last 2 years (or completed differences training or a proficiency check in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the type rating held on an airship licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-as, easa.licence.cpl-as]

interpretations:
  - id: part-fcl-type-ratings
    reading: A Part-FCL airship type rating is an AIRSHIP rating recorded on a licence of authority EASA or LBA other than a sailplane or ultralight licence; it requires the airship licence (PPL(As) or CPL(As)) it is held on.
    ref: easa:FCL.740.As(a)
    affects: [revalidation, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
  - id: type-is-type-designator
    reading: The type is the rating's type designator; flights and checks count only when they record the same type designator, and when the rating or the flights carry none the result is unknown.
    ref: easa:FCL.740.As(a)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: validity-period-is-twelve-months
    reading: Type ratings are valid for 1 year, so "within the validity period" is the 12 months before the recorded expiry date; the proficiency check flight counts toward the 2 hours.
    ref: [easa:FCL.740.As(a)(2), easa:FCL.740(a)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: check-in-aircraft
    reading: The proficiency check is flown in the airship ("in the relevant type of airship"); a check recorded in an FSTD does not count. That it followed Appendix 9 and was conducted by an examiner is not checked.
    ref: easa:FCL.740.As(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: combined-ir-not-modelled
    reading: The combined revalidation of an IR(As) is not evaluated (an IR is recorded without its category), and renewal is not modelled.
    ref: [easa:FCL.740.As(a)(3), easa:FCL.740(b)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
