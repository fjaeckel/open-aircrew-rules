credential: TMG class rating
id: easa.rating.tmg
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [TMG], authorities: [EASA, LBA], not_licence_kinds: [LAPL_A, SPL, LAPL_S, UL] }
validity: { period_months: 24, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the rating valid, and has the holder done what keeps it valid? (Revalidated exactly like SEP land; SEP land and TMG time pool.)
    uses: easa.rating.sep-land#revalidation

  - id: passengers_day
    asks: May the holder carry passengers in a TMG?
    uses: easa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_night
    asks: May the holder carry passengers at night in a TMG?
    uses: easa.shared.passengers-night
    with: { type_rated: false }

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-licences
    reading: A Part-FCL TMG rating is one recorded on a licence of authority EASA or LBA other than LAPL(A), SPL, LAPL(S) and ultralight licences; TMG privileges on an SPL are the credential easa.privilege.spl-tmg.
    ref: easa:FCL.740.A(b)(1)
    affects: [revalidation, passengers_day, passengers_night]
    approved_by: null
    approved_on: null
