credential: SET (sea) class rating
id: easa.rating.set-sea
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [SET_SEA], authorities: [EASA, LBA], not_licence_kinds: [LAPL_A, SPL, LAPL_S, UL] }
validity: { period_months: 24, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the rating valid, and has the holder passed a proficiency check in the class in the 3 months before expiry? (Same requirement as SET land, in SET sea aeroplanes.)
    uses: easa.rating.set-land#revalidation

  - id: passengers_day
    asks: May the holder carry passengers in an SET sea aeroplane?
    uses: easa.shared.passengers-day

  - id: passengers_night
    asks: May the holder carry passengers at night in an SET sea aeroplane?
    uses: easa.shared.passengers-night

  - id: variants
    asks: Has the holder flown each variant recorded on the rating in the last 2 years (or completed differences training, a proficiency check or refresher training in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-licences
    reading: A Part-FCL SET sea class rating is one recorded on a licence of authority EASA or LBA other than LAPL(A), SPL, LAPL(S) and ultralight licences; it is revalidated by a check in SET sea aeroplanes.
    ref: easa:FCL.740.A(b)(3)
    affects: [revalidation, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
