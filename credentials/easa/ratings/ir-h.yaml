credential: Instrument rating, helicopters (IR(H))
id: easa.rating.ir-h
kind: rating
authority: EASA
held_on: [PPL(H), CPL(H), ATPL(H)]
selects:
  ratings: { classes: [IR], authorities: [EASA, LBA], licence_kinds: [PPL_H, CPL_H, ATPL_H] }
validity: { period_months: 12, ref: "easa:FCL.625(a)" }

evaluations:
  - id: revalidation
    asks: Is the IR valid, and has the holder passed an IR proficiency check (or EBT practical assessment) in a helicopter or FSTD in the 3 months before expiry?
    source: easa:FCL.625(b)(1)
    also_cites: [easa:FCL.625.H(a), easa:FCL.625(b)(4)]
    counting: { within_months_before_expiry: 3 }
    passes_if:
      proficiency_check: { also: [ebt_assessment], for_rating: [IR], categories: [helicopter], simulator: include, with: examiner, ref: [easa:FCL.625.H(a)(2), easa:FCL.625.H(a)(3), easa:FCL.625(b)(4)] }
    outcomes:
      preset: revalidation
      messages: { not_met: rating.ir_check_not_met }
      expiring_notice: { days: 90, ref: policy:expiring-notice }
    on_fail: { what: renewal, ref: easa:FCL.625(c) }
    description_key: easa_ir

  - id: licence
    asks: Is the IR(H) held on a helicopter licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-h, easa.licence.cpl-h, easa.licence.atpl-h]

interpretations:
  - id: ir-on-helicopter-licence
    reading: An IR recorded on an EASA or LBA helicopter licence (PPL(H), CPL(H), ATPL(H)) is read as an IR(H).
    ref: [easa:FCL.625.H(a), easa:FCL.625(b)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: ir-check-recorded
    reading: The check counts when recorded as an IR check (an event for the rating IR, or a flight flagged as a proficiency check with checkRating IR) in the helicopter class; an IR check in an aeroplane does not count. That it followed Appendix 9 for the type and was conducted by an examiner, and holding the type rating, are not checked.
    ref: [easa:FCL.625.H(a)(1), easa:FCL.625.H(a)(2), easa:FCL.625.H(a)(3)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: fstd-level-not-checked
    reading: A check in any FSTD recorded with the helicopter class counts; the FSTD level (FTD 2/3 or FFS), the type and the every-alternate-check-in-a-helicopter condition are not checked.
    ref: easa:FCL.625.H(b)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: early-check-not-credited
    reading: A check passed earlier than the 3 months before expiry (the new period then starts on the check date) is not credited against the recorded expiry date; the holder records the new expiry date instead.
    ref: easa:FCL.625(b)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: renewal-not-modelled
    reading: Renewal, the 7-year rule and the cross-credit of Appendix 8 are not evaluated; an expired IR stays expired until a new expiry date is recorded.
    ref: [easa:FCL.625(c), easa:FCL.625(d), easa:FCL.625.H(c)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
