credential: SET (land) class rating
id: easa.rating.set-land
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [SET_LAND], authorities: [EASA, LBA], not_licence_kinds: [LAPL_A, SPL, LAPL_S, UL] }
validity: { period_months: 24, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the rating valid, and has the holder passed a proficiency check in the class in the 3 months before expiry?
    source: easa:FCL.740.A(b)(3)
    counting: { within_months_before_expiry: 3 }
    passes_if:
      id: revalidation
      ref: easa:FCL.740.A(b)(3)
      any_of:
        - proficiency_check: { in_class: true, with: examiner, excluding_ratings: [IR, BIR], ref: easa:FCL.740.A(b)(3) }
        - proficiency_check: { id: ffs_check, remedy: remedy.proficiency_check, in_class: true, simulator: only, fstd: [FFS], excluding_ratings: [IR, BIR], ref: [easa:FCL.740.A(b)(3), easa:Appendix-9] }
    outcomes:
      preset: revalidation
      messages: { not_met: rating.revalidation_not_met_prof_check }
      expiring_notice: { days: 90, ref: policy:expiring-notice }
    on_fail: { what: renewal, ref: easa:FCL.740(b) }
    description_key: easa_mep_set

  - id: passengers_day
    asks: May the holder carry passengers in an SET land aeroplane?
    uses: easa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_night
    asks: May the holder carry passengers at night in an SET land aeroplane?
    uses: easa.shared.passengers-night
    with: { type_rated: false }

  - id: variants
    asks: Has the holder flown each variant recorded on the rating in the last 2 years (or completed differences training, a proficiency check or refresher training in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-licences
    reading: A Part-FCL SET class rating is one recorded on a licence of authority EASA or LBA other than LAPL(A), SPL, LAPL(S) and ultralight licences, including a licence whose kind cannot be told from its type.
    ref: easa:FCL.740.A(b)(3)
    affects: [revalidation, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
  - id: check-only
    reading: An SET class rating is revalidated by the proficiency check only; flight experience in the class does not revalidate it, and the revalidation period is the 3 months before expiry.
    ref: easa:FCL.740.A(b)(3)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: check-in-aeroplane
    reading: The check is flown in the aeroplane or in an FFS (Appendix 9, Section A, points 1c and 1e, allow a class rating proficiency check in an FFS, in a combination of FSTDs and the aircraft, or in the aircraft). A device check counts only when recorded with the FSTD type FFS (a flight in an FSTD flagged as a proficiency check, or a check event with fstdType FFS); a check in another or an unrecorded device type does not count, because the record cannot show that the aircraft part of a combined check was also flown. A check recorded only for the IR or the BIR is not a class rating check and does not count; a combined check counts when it is recorded for the class as well. That it followed Appendix 9 and was conducted by an examiner is not checked.
    ref: [easa:FCL.740.A(b)(3), easa:Appendix-9]
    affects: [revalidation]
    principle: P2
    approved_by: null
    approved_on: null
  - id: validity-two-years
    reading: An SET class rating is a single-pilot single-engine class rating with a 2-year validity period unless the OSD determines otherwise; only the recorded expiry date is used.
    ref: easa:FCL.740(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: early-check-not-credited
    reading: A check passed earlier than the 3 months before expiry (FCL.740(a)(1), the new period then starts on the check date) is not credited against the recorded expiry date; the holder records the new expiry date instead.
    ref: easa:FCL.740(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
