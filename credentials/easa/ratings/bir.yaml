credential: Basic instrument rating (BIR)
id: easa.rating.bir
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  privilege: { kinds: [BIR], authorities: [EASA, LBA] }
validity: { period_months: 12, ref: "easa:FCL.835(g)(1)" }

evaluations:
  - id: revalidation
    asks: Is the BIR valid, and has the holder passed a BIR proficiency check in the 3 months before expiry, or flown 6 hours as PIC under IFR with 3 instrument approaches and a 1-hour training flight during its validity?
    source: easa:FCL.835(g)(2)
    also_cites: [easa:FCL.835(g)(1)]
    valid_for:
      counted_from: valid_from
      periods:
        - { months: 12, ref: easa:FCL.835(g)(1) }
    counting: { within_months_before_expiry: 12 }
    passes_if:
      id: revalidation
      ref: easa:FCL.835(g)(2)
      any_of:
        - proficiency_check: { for_rating: [BIR], categories: [aeroplane], simulator: include, within_months_before_expiry: 3, with: examiner, ref: easa:FCL.835(g)(2)(i) }
        - id: experience
          ref: easa:FCL.835(g)(2)(ii)
          categories: [aeroplane]
          all_of:
            - ifr_time: { id: ifr_pic_time, min_hours: 6, as: [pic], ref: easa:FCL.835(g)(2)(ii) }
            - approaches: { min: 3, as: [pic], ref: easa:FCL.835(g)(2)(ii) }
            - longest_training_flight: { min_hours: 1, with: instructor, ref: easa:FCL.835(g)(2)(ii) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: privilege.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: easa:FCL.835(g)(1) }
      - { id: met, when: all_met, status: current, message: privilege.revalidation_current, params: { date: expiry_date }, ref: easa:FCL.835(g)(2) }
      - { id: expiring, when: { expires_within: { days: 90 } }, status: expiring, message: privilege.expiring, params: { days: days_to_expiry, date: expiry_date }, ref: policy:revalidation-not-met-expiring }
      - { id: not_met, when: always, status: current, message: privilege.revalidation_not_met, params: { date: expiry_date }, ref: easa:FCL.835(g)(1) }
    on_fail: { what: renewal, ref: easa:FCL.835(g)(6) }

  - id: licence
    asks: Is the BIR held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: bir-as-privilege
    reading: The BIR is recorded as a BIR privilege on an EASA or LBA licence; it is valid for 1 year from its validFrom (else issue) date, and a recorded expiry date wins when earlier.
    ref: easa:FCL.835(g)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: validity-period-is-twelve-months
    reading: '"Within the validity period" is the 12 months before the expiry date.'
    ref: easa:FCL.835(g)(2)(ii)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: ifr-pic-time
    reading: '"6 hours as PIC under IFR" is the IFR time of aeroplane flights with PIC time, and the three instrument approaches are approaches recorded on such flights.'
    ref: easa:FCL.835(g)(2)(ii)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: training-flight-as-dual
    reading: The training flight is one aeroplane flight of at least 1 hour with dual time received; that the instructor holds privileges to train for the BIR is not checked.
    ref: easa:FCL.835(g)(2)(ii)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: bir-check-recorded
    reading: The check counts when recorded as a BIR check (an event for the rating BIR, or a flight flagged as a proficiency check with checkRating BIR) in an aeroplane or an FSTD recorded with an aeroplane class; it may be combined with a class rating check. That it followed Appendix 9 and was conducted by an examiner is not checked.
    ref: [easa:FCL.835(g)(2)(i), easa:FCL.835(g)(8)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: alternate-check-not-tracked
    reading: The rule that every alternate revalidation is a proficiency check in an aeroplane is not tracked, so the experience route is always offered.
    ref: easa:FCL.835(g)(3)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: not-met-stays-valid
    reading: A BIR whose revalidation is not met yet stays valid until its expiry date; it is reported current, and expiring in the 90 days before expiry.
    ref: easa:FCL.835(g)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: multi-engine-and-renewal-not-modelled
    reading: The multi-engine BIR conditions, early revalidation and renewal are not evaluated.
    ref: [easa:FCL.835(g)(7), easa:FCL.835(g)(4), easa:FCL.835(g)(6)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
