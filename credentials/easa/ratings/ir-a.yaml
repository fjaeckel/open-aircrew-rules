credential: Instrument rating, aeroplanes (IR(A))
id: easa.rating.ir-a
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [IR], authorities: [EASA, LBA], not_licence_kinds: [PPL_H, CPL_H, ATPL_H, LAPL_H, PPL_AS, CPL_AS] }
validity: { period_months: 12, ref: "easa:FCL.625(a)" }

evaluations:
  - id: revalidation
    asks: Is the IR valid, and has the holder passed an IR proficiency check (or EBT practical assessment) in an aeroplane or FSTD in the 3 months before expiry?
    source: easa:FCL.625(b)(1)
    also_cites: [easa:FCL.625.A(a), easa:FCL.625(b)(4)]
    counting: { within_months_before_expiry: 3 }
    passes_if:
      proficiency_check: { also: [ebt_assessment], for_rating: [IR], categories: [aeroplane], simulator: include, with: examiner, ref: [easa:FCL.625.A(a)(2), easa:FCL.625.A(a)(3), easa:FCL.625(b)(4)] }
    outcomes:
      preset: revalidation
      messages: { not_met: rating.ir_check_not_met }
      expiring_notice: { days: 90, ref: policy:expiring-notice }
    on_fail: { what: renewal, ref: easa:FCL.625(c) }
    description_key: easa_ir

  - id: licence
    asks: Is the IR held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: ir-on-aeroplane-licence
    reading: An IR is recorded without its aircraft category; an IR on an EASA or LBA licence that is not a helicopter or airship licence is read as an IR(A), including an IR recorded on its own IR licence (an IR on a helicopter licence is an IR(H), one on an airship licence an IR(As)).
    ref: [easa:FCL.625.A(a), easa:FCL.625(b)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: ir-check-recorded
    reading: The check counts when recorded as an IR check (an event for the rating IR, or a flight flagged as a proficiency check with checkRating IR) in an aeroplane class; a combined class rating and IR check is one such event, and a class rating check not recorded for the IR does not count. That it followed Appendix 9 and was conducted by an examiner is not checked.
    ref: [easa:FCL.625.A(a)(2), easa:FCL.625.A(a)(3)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: fstd-level-not-checked
    reading: A check in any FSTD recorded with an aeroplane class counts; that the FSTD is an FNPT II or FFS, and that every alternate check is flown in an aeroplane, are not checked.
    ref: easa:FCL.625.A(a)(4)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: class-rating-held
    reading: Holding the relevant class or type rating is taken as met.
    ref: easa:FCL.625.A(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: early-check-not-credited
    reading: A check passed earlier than the 3 months before expiry (the new period then starts on the check date) is not credited against the recorded expiry date; the holder records the new expiry date instead.
    ref: easa:FCL.625(b)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: renewal-not-modelled
    reading: Renewal and the 7-year rule are not evaluated; an expired IR stays expired until a new expiry date is recorded.
    ref: [easa:FCL.625(c), easa:FCL.625(d)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: cross-credit-not-applied
    reading: The cross-credit of Appendix 8 is not applied.
    ref: easa:FCL.625.A(b)
    affects: [revalidation]
    approved_by: null
    approved_on: null
