credential: SEP (land) class rating
id: easa.rating.sep-land
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [SEP_LAND], authorities: [EASA, LBA], not_licence_kinds: [LAPL_A, SPL, LAPL_S, UL] }
validity: { period_months: 24, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the rating valid, and has the holder done what keeps it valid?
    source: easa:FCL.740.A(b)(1)
    also_cites: [easa:FCL.740.A(b)(2), easa:FCL.035(a)(4)]
    relevant_class: { pooled_with_held: [SEP_LAND, TMG], ref: easa:FCL.740.A(b)(2) }
    counting: { within_months_before_expiry: 12 }
    passes_if:
      id: revalidation
      ref: easa:FCL.740.A(b)(1)
      any_of:
        - proficiency_check: { in_class: true, with: examiner, within_months_before_expiry: 3, simulator: include, fstd: [FFS], excluding_ratings: [IR, BIR], ref: [easa:FCL.740.A(b)(1)(i), easa:Appendix-9] }
        - id: experience
          ref: easa:FCL.740.A(b)(1)(ii)
          all_of:
            - flight_time: { min_hours: 12, in_class: true, ul_credit: &ul { SEP_LAND: [THREE_AXIS], TMG: { ul_kinds: [THREE_AXIS_MOTORGLIDER], fixed_engine: true }, ref: easa:FCL.035(a)(4) }, ref: easa:FCL.740.A(b)(1)(ii) }
            - pic_time: { min_hours: 6, in_class: true, ul_credit: *ul, ref: easa:FCL.740.A(b)(1)(ii)(A) }
            - takeoffs: { min: 12, in_class: true, ref: easa:FCL.740.A(b)(1)(ii)(B) }
            - landings: { min: 12, in_class: true, ref: easa:FCL.740.A(b)(1)(ii)(B) }
            - refresher:
                min_hours: 1
                in_class: true
                with: [FI, CRI]
                ref: easa:FCL.740.A(b)(1)(ii)(C)
                waived_by: &waiver
                  events: [proficiency_check, skill_test, ebt_assessment, assessment_of_competence]
                  categories: [aeroplane]
                  within_months_before_expiry: 24
                  ref: easa:FCL.740.A(b)(1)(ii)(C)
        - id: experience_land_and_sea
          ref: easa:FCL.740.A(b)(4)
          only_if: { holds: { classes: [SEP_LAND, SEP_SEA], sameLicence: true, valid: true, every: true }, ref: easa:FCL.740.A(b)(4) }
          all_of:
            - flight_time: { id: land_sea_total_time, min_hours: 12, classes: [SEP_LAND, SEP_SEA], ul_credit: &ul_land { SEP_LAND: [THREE_AXIS], ref: easa:FCL.035(a)(4) }, ref: easa:FCL.740.A(b)(4) }
            - pic_time: { id: land_sea_pic_time, min_hours: 6, classes: [SEP_LAND, SEP_SEA], ul_credit: *ul_land, ref: easa:FCL.740.A(b)(4) }
            - takeoffs: { id: land_sea_takeoffs, min: 12, classes: [SEP_LAND, SEP_SEA], ref: easa:FCL.740.A(b)(4) }
            - landings: { id: land_sea_landings, min: 12, classes: [SEP_LAND, SEP_SEA], ref: easa:FCL.740.A(b)(4) }
            - pic_time: { id: land_pic_time, min_hours: 1, classes: [SEP_LAND], ul_credit: *ul_land, ref: easa:FCL.740.A(b)(4) }
            - pic_time: { id: sea_pic_time, min_hours: 1, classes: [SEP_SEA], ref: easa:FCL.740.A(b)(4) }
            - takeoffs: { id: land_takeoffs, min: 6, classes: [SEP_LAND], ref: easa:FCL.740.A(b)(4) }
            - landings: { id: land_landings, min: 6, classes: [SEP_LAND], ref: easa:FCL.740.A(b)(4) }
            - takeoffs: { id: sea_takeoffs, min: 6, classes: [SEP_SEA], ref: easa:FCL.740.A(b)(4) }
            - landings: { id: sea_landings, min: 6, classes: [SEP_SEA], ref: easa:FCL.740.A(b)(4) }
            - refresher:
                id: land_sea_refresher
                min_hours: 1
                classes: [SEP_LAND, SEP_SEA]
                with: [FI, CRI]
                ref: easa:FCL.740.A(b)(4)
                waived_by: *waiver
    outcomes:
      preset: revalidation
      expiring_notice: { days: 90, ref: policy:expiring-notice }
    on_fail: { what: renewal, ref: easa:FCL.740(b) }
    description_key: easa_sep_tmg

  - id: passengers_day
    asks: May the holder carry passengers in an SEP land aeroplane?
    uses: easa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_night
    asks: May the holder carry passengers at night in an SEP land aeroplane?
    uses: easa.shared.passengers-night
    with: { type_rated: false }

  - id: variants
    asks: Has the holder flown each variant recorded on the rating in the last 2 years (or completed differences training, a proficiency check or refresher training in it)?
    uses: easa.shared.variants
    only_for: { different_engine_type: true, if_missing: unknown, ref: "easa:FCL.710(da)" }

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-licences
    reading: A Part-FCL rating is one recorded on a licence of authority EASA or LBA (a member-state authority). Every licence kind except LAPL(A), SPL, LAPL(S) and ultralight licences counts, including a licence whose kind cannot be told from its type.
    ref: easa:FCL.740.A(b)(1)
    affects: [revalidation, passengers_day, passengers_night]
    approved_by: null
    approved_on: null
  - id: valid-through-expiry
    reading: A rating is valid on its expiry date and expired from the next day; "within the n months preceding the expiry date" includes the expiry date itself.
    ref: easa:FCL.740.A(b)(1)(i)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: examiner-not-checked
    reading: 'A proficiency check is a check event or a flight flagged as a proficiency check in the class, flown in the aeroplane or in an FFS (Appendix 9, Section A, points 1c and 1e allow an FFS for these class ratings; other devices do not count). A check recorded only for the IR or the BIR is not a class rating check and does not count; a combined check (FCL.740.A(b)(5), FCL.835(g)(8)) counts when it is recorded for the class as well (the event''s ratings). That it followed Appendix 9 and was conducted by an examiner is not checked.'
    ref: [easa:FCL.740.A(b)(1)(i), easa:Appendix-9, easa:FCL.740.A(b)(5)]
    affects: [revalidation]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: refresher-as-dual
    reading: The refresher training is 1 hour of dual time received in the class; that the instructor holds an FI or CRI certificate, and the exercises flown, are not checked.
    ref: easa:FCL.740.A(b)(1)(ii)(C)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: exemption-period
    reading: 'The text does not say when an exempting check, test or assessment must have been passed; it counts when passed within the rating''s validity period being revalidated (the 24 months before expiry), never from an earlier period.'
    ref: easa:FCL.740.A(b)(1)(ii)(C)
    affects: [revalidation]
    principle: P3
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: exemption-any-aeroplane
    reading: '"In any class or type of aeroplane" covers every class of the aeroplane category, TMGs included.'
    ref: easa:FCL.740.A(b)(1)(ii)(C)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: pooling-same-licence
    reading: The SEP land and TMG pooling applies when both ratings are recorded on the same licence; flights in the other class then count toward every requirement of point (1), the proficiency check included.
    ref: easa:FCL.740.A(b)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: land-sea-pooling-not-applied
    reading: 'Point (b)(4) is applied as a third route: while SEP land and SEP sea ratings are both held and valid on the same licence, the 12 hours, 6 hours as PIC, 12 take-offs, 12 landings and the refresher may be flown in either class or a combination, provided at least 1 hour as PIC, 6 take-offs and 6 landings are flown in each class; the route then revalidates both ratings. It does not revalidate a TMG rating.'
    ref: easa:FCL.740.A(b)(4)
    affects: [revalidation]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: ul-credit-time-only
    reading: 'Annex I three-axis ultralights are credited as SEP land (''same category and class''), toward the flight time and PIC time only. Annex I motorglider ultralights are credited as TMG only when the flight is recorded with a fixed engine and propeller (fixedEngine true, the TMG definition of FCL.010); without it they are not credited. Take-offs, landings and the refresher are flown in the Part-FCL class.'
    ref: [easa:FCL.035(a)(4), easa:FCL.010]
    affects: [revalidation]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
