credential: Powered-lift type rating
id: easa.rating.powered-lift-type
kind: rating
authority: EASA
held_on: [CPL(A), ATPL(A), CPL(H), ATPL(H)]
selects:
  ratings: { classes: [POWERED_LIFT], authorities: [EASA, LBA], not_licence_kinds: [SPL, LAPL_S, UL] }
validity: { period_months: 12, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the type rating valid, and has the holder passed a proficiency check in the type in the 3 months before expiry and flown 10 route sectors (or 1 with an examiner) during its validity?
    source: easa:FCL.740.PL(a)
    also_cites: [easa:FCL.740(a)(1), easa:FCL.010]
    counting: { within_months_before_expiry: 12, in_class: true, in_type: true }
    passes_if:
      ref: easa:FCL.740.PL(a)
      all_of:
        - proficiency_check: { within_months_before_expiry: 3, with: examiner, ref: easa:FCL.740.PL(a)(1) }
        - id: route_sectors
          ref: easa:FCL.740.PL(a)(2)
          any_of:
            - route_sectors: { id: sectors, min: 10, ref: easa:FCL.740.PL(a)(2)(i) }
            - route_sectors: { id: examiner_sector, name: requirement.examiner_route_sector, remedy: none, min: 1, flagged: { examinerOnBoard: true }, simulator: include, fstd: [FFS], ref: easa:FCL.740.PL(a)(2)(ii) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: rating.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: rating.expired, ref: easa:FCL.740(a)(1) }
      - { id: window_not_open, when: before_window, status: current, message: rating.window_not_open, params: { date: window_opens_at }, ref: policy:window-not-open }
      - { id: met_expiring, when: { all: [all_met, { expires_within: { days: 90 } }] }, status: expiring, message: rating.revalidation_expiring_met, params: { days: days_to_expiry }, ref: policy:expiring-notice }
      - { id: met, when: all_met, status: current, message: rating.revalidation_current, ref: easa:FCL.740.PL(a) }
      - { id: undetermined, when: undetermined, status: unknown, message: rating.type_not_identifiable, ref: policy:unknown-input }
      - { id: not_met, when: always, status: expiring, message: rating.revalidation_not_met_prof_check, ref: policy:revalidation-not-met-expiring }
    on_fail: { what: renewal, ref: easa:FCL.740(b) }

  - id: passengers_day
    asks: May the holder carry passengers in a powered-lift aircraft?
    uses: easa.shared.passengers-day

  - id: passengers_night
    asks: May the holder carry passengers at night in a powered-lift aircraft?
    uses: easa.shared.passengers-night

  - id: variants
    asks: Has the holder flown each variant recorded on the type rating in the last 2 years (or completed differences training or a proficiency check in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the type rating held on a professional aeroplane or helicopter licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.cpl-h, easa.licence.atpl-h]

interpretations:
  - id: part-fcl-type-ratings
    reading: A Part-FCL powered-lift type rating is a POWERED_LIFT rating recorded on a licence of authority EASA or LBA other than a sailplane or ultralight licence. Part-FCL defines no powered-lift licence; the type rating is held on an aeroplane or helicopter licence, and it requires the CPL or ATPL (aeroplanes or helicopters) it is held on, the licences FCL.720.PL names as prerequisites for its first issue. A powered-lift type rating on a private licence or an MPL finds no required licence and its composite is unknown. The other prerequisites (IR, ATPL theoretical knowledge, MCC, multi-pilot experience, cross-category instruction) and a different determination in the operational suitability data concern the first issue and are not evaluated.
    ref: [easa:FCL.720.PL(a)(1), easa:FCL.720.PL(b)(1), easa:FCL.720.PL(c)(1), easa:FCL.740.PL(a)]
    affects: [revalidation, passengers_day, passengers_night, variants, licence]
    approved_by: null
    approved_on: null
  - id: type-is-type-designator
    reading: The type is the rating's type designator; flights and checks count only when they record the same type designator. When the rating or the flights carry none, or a flight has no recorded cruise time or FSTD type, the result is unknown.
    ref: easa:FCL.740.PL(a)(2)(i)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: validity-period-is-twelve-months
    reading: Type ratings are valid for 1 year, so "during the period of validity" is the 12 months before the recorded expiry date.
    ref: [easa:FCL.740.PL(a)(2), easa:FCL.740(a)(1)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: route-sector-cruise
    reading: A route sector is a flight in the type with a recorded cruise of at least 15 minutes (the FCL.010 definition), in any pilot role; the examiner sector is a flight flagged examinerOnBoard, in the aircraft or an FFS, and may be the proficiency check flight.
    ref: [easa:FCL.010, easa:FCL.740.PL(a)(2)(ii)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: check-in-aircraft
    reading: The proficiency check is flown in the aircraft (point (a)(1) names no FSTD); that it followed Appendix 9 and was conducted by an examiner is not checked.
    ref: easa:FCL.740.PL(a)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: cat-exemption-not-applied
    reading: The exemption from the route sectors for pilots of a commercial air transport operator is not applied, because the record does not say whether the holder flies for such an operator.
    ref: easa:FCL.740.PL(a)(3)
    affects: [revalidation]
    approved_by: null
    approved_on: null
