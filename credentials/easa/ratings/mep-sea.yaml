credential: MEP (sea) class rating
id: easa.rating.mep-sea
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [MEP_SEA], authorities: [EASA, LBA], not_licence_kinds: [LAPL_A, SPL, LAPL_S, UL] }
validity: { period_months: 12, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the rating valid, and has the holder passed a proficiency check in the 3 months before expiry and flown 10 route sectors (or 1 with an examiner) during its validity? (Same requirements as MEP land, counted on MEP sea flights.)
    uses: easa.rating.mep-land#revalidation

  - id: passengers_day
    asks: May the holder carry passengers in an MEP sea aeroplane?
    uses: easa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_night
    asks: May the holder carry passengers at night in an MEP sea aeroplane?
    uses: easa.shared.passengers-night
    with: { type_rated: false }

  - id: variants
    asks: Has the holder flown each variant recorded on the rating in the last 2 years (or completed differences training, a proficiency check or refresher training in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-licences
    reading: A Part-FCL MEP sea class rating is one recorded on a licence of authority EASA or LBA other than LAPL(A), SPL, LAPL(S) and ultralight licences; land and sea classes are revalidated each from its own flights and checks.
    ref: easa:FCL.740.A(a)
    affects: [revalidation, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
