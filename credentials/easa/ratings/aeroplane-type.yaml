credential: Aeroplane type rating
id: easa.rating.aeroplane-type
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [OTHER], authorities: [EASA, LBA] }
validity: { period_months: 12, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: validity
    asks: Is the type rating valid on its recorded expiry date?
    source: easa:FCL.740(a)(1)
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: rating.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: rating.expired, ref: easa:FCL.740(a)(1) }
      - { id: expiring, when: { expires_within: { days: 90 } }, status: expiring, message: rating.expiring, params: { days: days_to_expiry }, ref: policy:expiring-notice }
      - { id: valid, when: always, status: current, message: rating.valid_until, ref: easa:FCL.740(a)(1) }
    on_fail: { what: renewal, ref: easa:FCL.740(b) }

  - id: variants
    asks: Has the holder flown each variant recorded on the type rating in the last 2 years (or completed differences training or a proficiency check in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: other-class-is-aeroplane-type
    reading: Aeroplane type ratings are recorded with class OTHER on a licence of authority EASA or LBA; anything else recorded with class OTHER is treated the same way.
    ref: easa:FCL.740(a)(1)
    affects: [validity, variants]
    approved_by: null
    approved_on: null
  - id: revalidation-not-evaluated
    reading: The revalidation of type ratings (FCL.740.A(a) for multi-engine and multi-pilot types, FCL.740.A(b) for single-engine types) is not evaluated, because class OTHER does not tell which point applies; only the recorded expiry date is reported. The validity period itself (1 year, 2 years or as the OSD determines) is not derived.
    ref: [easa:FCL.740(a)(1), easa:FCL.740.A(a)]
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: renewal-not-modelled
    reading: Renewal is not evaluated; an expired rating stays expired until a new expiry date is recorded.
    ref: easa:FCL.740(b)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: passengers-not-evaluated
    reading: Passenger recency is not evaluated for aeroplane type ratings; the passenger subjects are classes, and class OTHER does not identify one type.
    ref: easa:FCL.060(b)(1)
    affects: [validity]
    approved_by: null
    approved_on: null
