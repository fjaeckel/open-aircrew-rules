credential: SEP (sea) class rating
id: easa.rating.sep-sea
kind: rating
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL]
selects:
  ratings: { classes: [SEP_SEA], authorities: [EASA, LBA], not_licence_kinds: [LAPL_A, SPL, LAPL_S, UL] }
validity: { period_months: 24, ref: "easa:FCL.740(a)(1)" }

evaluations:
  - id: revalidation
    asks: Is the rating valid, and has the holder done what keeps it valid? (Same requirements as SEP land; the SEP land and TMG pool does not include SEP sea.)
    uses: easa.rating.sep-land#revalidation

  - id: passengers_day
    asks: May the holder carry passengers in an SEP sea aeroplane?
    uses: easa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_night
    asks: May the holder carry passengers at night in an SEP sea aeroplane?
    uses: easa.shared.passengers-night
    with: { type_rated: false }

  - id: variants
    asks: Has the holder flown each variant recorded on the rating in the last 2 years (or completed differences training, a proficiency check or refresher training in it)?
    uses: easa.shared.variants

  - id: licence
    asks: Is the rating held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: no-land-sea-pooling
    reading: The SEP land and SEP sea pooling of point (b)(4) is not applied; an SEP sea rating is revalidated from SEP sea flights only, and no ultralight time is credited to it.
    ref: [easa:FCL.740.A(b)(4), easa:FCL.035(a)(4)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
