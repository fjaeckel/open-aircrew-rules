credential: Commercial pilot licence, aeroplanes (CPL(A))
id: easa.licence.cpl-a
kind: licence
authority: EASA
held_on: []
selects:
  licence: { kinds: [CPL_A], authorities: [EASA, LBA] }

evaluations:
  - id: medical
    asks: Does the holder hold a valid class 1 medical certificate?
    uses: easa.shared.medical-certificate
    with: { accepts: [EASA_CLASS1_MEDICAL], ref: "easa:MED.A.030(c)(5)" }

  - id: medical_validity
    asks: Is that class 1 medical certificate itself still valid (its validity depends on the holder's age)?
    requires_any: [easa.medical.class-1]

  - id: language
    asks: Does the holder hold a valid language proficiency endorsement (to use the radio)?
    requires_all: [easa.endorsement.language-proficiency]

interpretations:
  - id: licence-authorities
    reading: A CPL(A) is a licence recorded with authority EASA or LBA whose type reads as a CPL(A).
    ref: easa:MED.A.030(c)(5)
    affects: [medical]
    approved_by: null
    approved_on: null
  - id: class-1-only
    reading: Only a class 1 medical certificate allows the privileges of the licence; a class 2 or LAPL medical certificate recorded instead is reported as not enough (expired), not as missing.
    ref: easa:MED.A.030(c)(5)
    affects: [medical]
    approved_by: null
    approved_on: null
