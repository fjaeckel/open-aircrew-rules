credential: Commercial pilot licence, aeroplanes (CPL(A))
id: easa.licence.cpl-a
kind: licence
authority: EASA
held_on: []
selects:
  licence: { kinds: [CPL_A], authorities: [EASA, LBA] }

evaluations:
  - id: medical
    asks: Does the holder hold a valid class 1 medical certificate, which the commercial privileges need?
    uses: easa.shared.medical-certificate
    with: { accepts: [EASA_CLASS1_MEDICAL], ref: "easa:MED.A.030(c)(5)" }
    limits: commercial_privileges

  - id: medical_validity
    asks: Is that class 1 medical certificate itself still valid for class 1 privileges (its validity depends on the holder's age)?
    requires_any: [easa.medical.class-1@class_1]
    limits: commercial_privileges

  - id: medical_private
    asks: Does the holder hold a medical certificate valid for the LAPL and PPL privileges the licence includes (a class 2 certificate, or a class 1 certificate within its class 2 validity)?
    requires_any: [easa.medical.class-2, easa.medical.class-1@class_2]

  - id: language
    asks: Does the holder hold a valid language proficiency endorsement (to use the radio)?
    requires_all: [easa.endorsement.language-proficiency]

interpretations:
  - id: licence-authorities
    reading: A CPL(A) is a licence recorded with authority EASA or LBA whose type reads as a CPL(A).
    ref: easa:MED.A.030(c)(5)
    affects: [medical]
    approved_by: null
    approved_on: null
  - id: class-1-only
    reading: The CPL(A) includes all LAPL and PPL privileges (FCL.305(a)(1)), and those need only a class 2 medical certificate (MED.A.030(c)(2)); a class 1 certificate counts for them within its class 2 validity. The licence may therefore be exercised within those privileges with a valid class 2 certificate or a class 1 certificate still valid at class 2, which decides the licence. A valid class 1 certificate is needed only for the commercial privileges; without one they are reported as a limitation (commercial_privileges), never deciding the licence. This is the final option (2); the interim option (3) was not needed.
    ref: [easa:MED.A.030(c)(5), easa:MED.A.030(c)(2), easa:FCL.305(a)(1)]
    affects: [medical, medical_validity, medical_private]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
