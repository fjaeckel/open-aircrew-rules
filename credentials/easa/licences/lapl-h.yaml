credential: Light aircraft pilot licence, helicopters (LAPL(H))
id: easa.licence.lapl-h
kind: licence
authority: EASA
held_on: []
selects:
  licence: { kinds: [LAPL_H], authorities: [EASA, LBA] }
  ratings: { classes: [HELICOPTER], licence_kinds: [LAPL_H], authorities: [EASA, LBA] }

evaluations:
  - id: recency
    about: rating
    asks: May the holder fly this helicopter type? 6 hours as PIC, dual or supervised solo with 6 take-offs, approaches and landings and 1 hour of refresher training in the type in the last 12 months, or a proficiency check on the type.
    source: easa:FCL.140.H(a)
    also_cites: [easa:FCL.140.H(b)]
    counting: { within_months: 12, in_class: true, in_type: true }
    passes_if:
      id: recency
      ref: easa:FCL.140.H(a)
      any_of:
        - id: experience
          ref: easa:FCL.140.H(a)(1)
          all_of:
            - pic_dual_or_solo_time: { id: type_time, min_hours: 6, ref: easa:FCL.140.H(a)(1)(i) }
            - takeoffs_and_landings: { min: 6, ref: easa:FCL.140.H(a)(1)(i) }
            - refresher: { id: refresher, min_hours: 1, simulator: include, with: instructor, remedy: remedy.refresher_training, ref: [easa:FCL.140.H(a)(1)(ii), easa:FCL.140.H(b)] }
        - proficiency_check: { simulator: include, with: examiner, ref: easa:FCL.140.H(a)(2) }
    outcomes:
      preset: recency
      special:
        - { id: type_unknown, when: undetermined, status: unknown, message: rating.type_not_identifiable, ref: policy:unknown-input }
    description_key: easa_lapl_h

  - id: passengers_day
    asks: May the holder carry passengers in a helicopter?
    uses: easa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in a helicopter?
    uses: easa.shared.passengers-night
    with: { type_rated: true }

  - id: variants
    asks: Has the holder flown each variant recorded on a type in the last 2 years (or completed differences training or a proficiency check in it)?
    uses: easa.shared.variants

  - id: medical
    asks: Does the holder hold a valid LAPL (or class 2 or class 1) medical certificate?
    uses: easa.shared.medical-certificate
    with: { accepts: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL], ref: "easa:MED.A.030(c)(1)" }

  - id: medical_validity
    asks: Is that medical certificate itself still valid?
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1]

  - id: language
    asks: Does the holder hold a valid language proficiency endorsement (to use the radio)?
    requires_all: [easa.endorsement.language-proficiency]

interpretations:
  - id: lapl-h-types
    reading: The LAPL(H) privileges are the HELICOPTER ratings recorded on a LAPL(H) of authority EASA or LBA, one per type; helicopter ratings on a PPL(H), CPL(H) or ATPL(H) are type ratings under FCL.740.H (easa.rating.helicopter-type).
    ref: easa:FCL.140.H(a)
    affects: [recency, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
  - id: type-is-type-designator
    reading: The type is the rating's type designator; flights, refresher training and checks count only when they record it, and a flight without a type designator is unknown input, so without the requirements met the result is unknown.
    ref: easa:FCL.140.H(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: takeoffs-approaches-landings
    reading: '"Six take-offs, approaches and landings" is counted as the smaller of take-offs and landings; approaches are not counted on their own.'
    ref: easa:FCL.140.H(a)(1)(i)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: refresher-as-dual
    reading: The refresher training is 1 hour of dual time received in the type, in the aircraft or an FSTD; that the instructor selected the exercises and signed is not checked.
    ref: [easa:FCL.140.H(a)(1)(ii), easa:FCL.140.H(c)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: check-on-type
    reading: The proficiency check is a check recorded on the type, also in an FSTD; that its programme followed the LAPL(H) skill test and that it was conducted by an examiner are not checked.
    ref: easa:FCL.140.H(a)(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: twelve-months-rolling
    reading: '"In the last 12 months" is the 12 months up to the date evaluated; a LAPL(H) type has no expiry date and a recorded one is ignored.'
    ref: easa:FCL.140.H(a)
    affects: [recency]
    approved_by: null
    approved_on: null
