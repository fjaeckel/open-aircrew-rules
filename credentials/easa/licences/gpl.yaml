credential: Gyroplane pilot licence (GPL)
id: easa.licence.gpl
kind: licence
authority: EASA
held_on: []
selects:
  licence: { kinds: [GPL], authorities: [EASA, LBA] }
  ratings: { classes: [GYROPLANE], licence_kinds: [GPL], authorities: [EASA, LBA] }

evaluations:
  - id: recency
    about: rating
    asks: May the holder fly this class or type of gyroplane? 12 hours with 12 take-offs and landings and 1 hour of refresher training in the last 2 years, or a GPL proficiency check.
    source: easa:FCL.240.G(a)
    also_cites: [easa:FCL.035(a)(5)]
    counting: { within_months: 24 }
    passes_if:
      id: recency
      ref: easa:FCL.240.G(a)
      any_of:
        - id: experience
          ref: easa:FCL.240.G(a)(1)
          all_of:
            - pic_dual_or_solo_time: { id: total_time, name: requirement.total_time, min_hours: 12, in_class: true, ul_credit: &ul { GYROPLANE: { ul_kinds: [GYROPLANE], min_mtom_kg: 450 }, ref: easa:FCL.035(a)(5) }, ref: easa:FCL.240.G(a)(1) }
            - takeoffs_and_landings: { min: 12, in_class: true, ul_credit: *ul, ref: easa:FCL.240.G(a)(1)(i) }
            - refresher: { id: refresher, min_hours: 1, in_class: true, with: instructor, ref: easa:FCL.240.G(a)(1)(ii) }
        - proficiency_check: { in_class: true, with: examiner, ref: easa:FCL.240.G(a)(2) }
    outcomes: recency
    description_key: easa_gpl

  - id: variants
    about: variants
    asks: For each SPG variant with another type of engine the holder has extended to, has it been flown in the last 2 years, or differences training or a proficiency check completed in it?
    source: easa:FCL.240.G(b)
    counting: { within_months: 24 }
    passes_if:
      id: variant
      ref: easa:FCL.240.G(b)
      any_of:
        - flights: { id: variant_flown, name: requirement.variant_flown, remedy: remedy.differences_training, in_class: true, in_variant: true, ref: [easa:FCL.240.G(b), easa:FCL.240.G(b)(3)] }
        - differences_training: { remedy: none, in_variant: true, also: [proficiency_check], ref: [easa:FCL.240.G(b)(1), easa:FCL.240.G(b)(2)] }
    outcomes:
      preset: recency
      special:
        - { id: variant_unknown, when: undetermined, status: unknown, message: type.unknown, ref: policy:unknown-input }
      messages: { current: type.current, lapsed: type.not_flown }
    description_key: easa_gpl

  - id: passenger_prerequisite
    about: passengers
    asks: Has the holder flown 10 hours as PIC on gyroplanes since the GPL was issued (needed before carrying passengers)?
    source: easa:FCL.205.G(a)(2)
    counting: { since_licence_issue: true }
    passes_if:
      pic_time: { id: gpl_pic, name: requirement.pic_time_since_issue, min_hours: 10, classes: [GYROPLANE], ref: easa:FCL.205.G(a)(2) }
    outcomes:
      - { id: met, when: all_met, status: current, message: pax.prerequisite_met, ref: easa:FCL.205.G(a)(2) }
      - { id: issue_date_unknown, when: undetermined, status: unknown, message: pax.prerequisite_unknown, ref: policy:unknown-input }
      - { id: not_met, when: always, status: expired, message: pax.gpl_experience_not_met, params: { needed: { needed: gpl_pic } }, ref: policy:passengers-expired }
    description_key: easa_pax

  - id: passengers_day
    asks: May the holder carry passengers in a gyroplane? 3 take-offs, approaches and landings as pilot flying in the class in the last 90 days.
    uses: easa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_night
    asks: May the holder carry passengers at night in a gyroplane? 1 take-off, approach and landing at night as pilot flying in the class in the last 90 days, or an IR.
    uses: easa.shared.passengers-night
    with: { type_rated: false }

  - id: medical
    asks: Does the holder hold a valid class 2 (or class 1) medical certificate?
    uses: easa.shared.medical-certificate
    with: { accepts: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL], ref: "easa:MED.A.030(c)(2)" }

  - id: medical_validity
    asks: Is that medical certificate itself still valid (its validity depends on the holder's age)?
    requires_any: [easa.medical.class-2, easa.medical.class-1]

  - id: language
    asks: Does the holder hold a valid language proficiency endorsement (to use the radio)?
    requires_all: [easa.endorsement.language-proficiency]

interpretations:
  - id: gyroplane-privileges-on-gpl
    reading: GPL privileges are the GYROPLANE ratings recorded on a GPL of authority EASA or LBA; a GYROPLANE rating on any other licence (an FAA certificate, an ultralight licence, a PPL(A)) is not evaluated as GPL privileges, since FCL.240.G and FCL.205.G apply to GPL holders.
    ref: [easa:FCL.240.G(a), easa:FCL.205.G(a)]
    affects: [recency, variants, passenger_prerequisite, passengers_day, passengers_night]
    approved_by: null
    approved_on: null
  - id: class-or-type
    reading: '"The relevant class or type" is the recorded class of the rating (GYROPLANE); the record names no gyroplane type or SPG class, so every gyroplane flight counts.'
    ref: easa:FCL.240.G(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: pic-dual-or-supervised
    reading: The 12 hours are flight time with PIC, dual or supervised solo time; a flight with none of these roles does not count. The smaller of take-offs and landings counts toward the 12 take-offs and landings.
    ref: [easa:FCL.240.G(a)(1), easa:FCL.240.G(a)(1)(i)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: ultralight-credit-mass
    reading: 'Ultralight flights of kind GYROPLANE with a recorded maximum take-off mass of at least 450 kg count toward the 12 hours and the 12 take-offs and landings, but not toward the refresher training or the check; the recorded mass is taken as the maximum certificated take-off mass. A lighter one is not credited. One without a recorded mass (or kind) is never credited on a guess: it is left out of the count, which is decided on the flights whose input is known (the requirement is untracked only when no flight in the window has known input).'
    ref: easa:FCL.035(a)(5)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: refresher-as-dual
    reading: The refresher training is 1 hour of dual time received in the class, possibly spread over several flights; that the instructor was qualified and chose the exercises is not checked.
    ref: easa:FCL.240.G(a)(1)(ii)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: proficiency-check-in-class
    reading: The GPL proficiency check is a check event or check flight in the GYROPLANE class; a check in an ultralight gyroplane does not count, and that it was taken with an examiner is not checked.
    ref: easa:FCL.240.G(a)(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: no-expiry
    reading: The GPL has no expiry date; a recorded expiry date is ignored by the recency evaluations. The logbook entries and signatures of (c) are not checked.
    ref: [easa:FCL.240.G(a), easa:FCL.240.G(c)]
    affects: [recency, variants]
    approved_by: null
    approved_on: null
  - id: variants-recorded
    reading: One result per variant recorded on the GYROPLANE rating (the SPG variants with another type of engine the licence was extended to); the record names no SPG class, so every recorded gyroplane variant is evaluated. Refresher training and a check flight in the variant are flights in it and count as flown; differences training or a proficiency check recorded as an event for the variant counts too. A flight with no recorded variant cannot be attributed and makes the result unknown.
    ref: [easa:FCL.240.G(b), easa:FCL.240.G(b)(1), easa:FCL.240.G(b)(2), easa:FCL.240.G(b)(3)]
    affects: [variants]
    approved_by: null
    approved_on: null
  - id: pax-prerequisite-since-issue
    reading: The 10 hours are PIC time on GYROPLANE flights from the recorded issue date of the GPL (a re-issued licence carries a later date than the one meant); ultralight gyroplane time is not credited, because FCL.035(a)(5) credits it toward FCL.240.G(a) only. Without a recorded issue date the result is unknown. Passenger recency of FCL.060(b) is a separate evaluation.
    ref: easa:FCL.205.G(a)(2)
    affects: [passenger_prerequisite]
    approved_by: null
    approved_on: null
  - id: commercial-not-recorded
    reading: Remunerated instruction or examining (FCL.205.G(b)) is not evaluated; the record does not say whether a flight was remunerated.
    ref: easa:FCL.205.G(b)
    affects: [passenger_prerequisite]
    approved_by: null
    approved_on: null
