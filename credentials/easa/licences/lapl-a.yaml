credential: Light aircraft pilot licence, aeroplanes (LAPL(A))
id: easa.licence.lapl-a
kind: licence
authority: EASA
held_on: []
selects:
  licence: { kinds: [LAPL_A], authorities: [EASA, LBA] }
  ratings: { classes: [SEP_LAND, SEP_SEA, TMG], licence_kinds: [LAPL_A], authorities: [EASA, LBA] }

evaluations:
  - id: recency
    about: rating
    asks: May the holder fly (SEP land, SEP sea or TMG)? 12 hours as PIC, dual or supervised solo with 12 take-offs and landings and 1 hour of refresher training in the last 2 years, or a LAPL(A) proficiency check.
    source: easa:FCL.140.A(a)
    also_cites: [easa:FCL.140.A(b), easa:FCL.035(a)(4)]
    counting: { within_months: 24 }
    passes_if:
      id: recency
      ref: easa:FCL.140.A(a)
      any_of:
        - id: experience
          ref: easa:FCL.140.A(a)(1)
          all_of:
            - pic_dual_or_solo_time: { name: requirement.total_time, min_hours: 12, classes: &aeroplanes [SEP_LAND, SEP_SEA, MEP_LAND, MEP_SEA, SET_LAND, SET_SEA, TMG], ul_credit: { SEP_LAND: [THREE_AXIS], TMG: [THREE_AXIS_MOTORGLIDER], ref: easa:FCL.035(a)(4) }, ref: easa:FCL.140.A(a)(1) }
            - takeoffs_and_landings: { min: 12, classes: *aeroplanes, ref: easa:FCL.140.A(a)(1)(i) }
            - refresher: { min_hours: 1, classes: *aeroplanes, with: instructor, ref: easa:FCL.140.A(a)(1)(ii) }
            - id: land_sea_split
              ref: easa:FCL.140.A(b)
              only_if: { holds: { classes: [SEP_LAND, SEP_SEA], sameLicence: true, every: true }, ref: easa:FCL.140.A(b) }
              all_of:
                - pic_dual_or_solo_time: { id: sep_land_time, name: requirement.sep_land_time, min_hours: 1, classes: [SEP_LAND], ref: easa:FCL.140.A(b) }
                - takeoffs_and_landings: { id: sep_land_takeoffs_landings, name: requirement.sep_land_landings, min: 6, classes: [SEP_LAND], ref: easa:FCL.140.A(b) }
                - pic_dual_or_solo_time: { id: sep_sea_time, name: requirement.sep_sea_time, min_hours: 1, classes: [SEP_SEA], ref: easa:FCL.140.A(b) }
                - takeoffs_and_landings: { id: sep_sea_takeoffs_landings, name: requirement.sep_sea_landings, min: 6, classes: [SEP_SEA], ref: easa:FCL.140.A(b) }
        - proficiency_check: { categories: [aeroplane], with: examiner, ref: easa:FCL.140.A(a)(2) }
    outcomes: recency
    description_key: easa_lapl

  - id: passenger_prerequisite
    about: passengers
    asks: Has the holder flown 10 hours as PIC on aeroplanes or TMGs since the LAPL(A) was issued (or previously held a PPL(A), CPL(A), ATPL(A) or MPL)?
    source: easa:FCL.105.A(b)(1)
    also_cites: [easa:FCL.105.A(b)(2)]
    counting: { since_licence_issue: true }
    passes_if:
      pic_time: { id: pic_since_issue, name: requirement.pic_time_since_issue, min_hours: 10, categories: [aeroplane], ref: easa:FCL.105.A(b)(1) }
    outcomes:
      - { id: exempt, when: { holds: { licenceKinds: [PPL_A, CPL_A, ATPL_A, MPL] } }, status: current, message: pax.prerequisite_exempt, ref: easa:FCL.105.A(b)(2) }
      - { id: met, when: all_met, status: current, message: pax.prerequisite_met, ref: easa:FCL.105.A(b)(1) }
      - { id: issue_date_missing, when: undetermined, status: unknown, message: pax.prerequisite_unknown, ref: policy:unknown-input }
      - { id: not_met, when: always, status: expired, message: pax.prerequisite_not_met, params: { needed: { needed: pic_since_issue } }, ref: easa:FCL.105.A(b)(1) }

  - id: passengers_day
    asks: May the holder carry passengers (SEP land, SEP sea or TMG)?
    uses: easa.shared.passengers-day

  - id: passengers_night
    asks: May the holder carry passengers at night (SEP land, SEP sea or TMG)?
    uses: easa.shared.passengers-night

  - id: variants
    asks: Has the holder flown each SEP variant recorded on the licence in the last 2 years (or completed differences training, a proficiency check or refresher training in it)?
    uses: easa.shared.variants
    only_for: { not_classes: [TMG], ref: "easa:FCL.710(da)" }

  - id: medical
    asks: Does the holder hold a valid LAPL (or class 2 or class 1) medical certificate?
    uses: easa.shared.medical-certificate
    with: { accepts: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL], ref: "easa:MED.A.030(c)(1)" }

  - id: medical_validity
    asks: Is that medical certificate itself still valid?
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1]

  - id: language
    asks: Does the holder hold a valid language proficiency endorsement (to use the radio)?
    requires_all: [easa.endorsement.language-proficiency]

interpretations:
  - id: lapl-privileges
    reading: The LAPL(A) privileges are the SEP land, SEP sea and TMG ratings recorded on a LAPL(A) of authority EASA or LBA; one recency result per privilege, each pooling every aeroplane and TMG flight ("as pilots of aeroplanes or TMGs").
    ref: easa:FCL.140.A(a)
    affects: [recency, passengers_day, passengers_night, variants]
    approved_by: null
    approved_on: null
  - id: refresher-as-dual
    reading: The refresher training is 1 hour of dual time received in an aeroplane or TMG; that it was flown with and signed by an instructor who selected the exercises is not checked.
    ref: [easa:FCL.140.A(a)(1)(ii), easa:FCL.140.A(d)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: lapl-proficiency-check
    reading: The LAPL(A) proficiency check is any proficiency check recorded in an aeroplane or TMG; that its programme followed the LAPL(A) skill test and that it was conducted by an examiner are not checked.
    ref: easa:FCL.140.A(a)(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: ul-credit-time-only
    reading: Annex I three-axis ultralights are credited as SEP land and motorglider ultralights as TMG toward the 12 hours only ("flight time requirements"); take-offs, landings and the refresher training are flown in aeroplanes or TMGs, and credited hours do not count toward the 1 hour per class of point (b).
    ref: [easa:FCL.035(a)(4), easa:FCL.140.A(b)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: land-sea-split
    reading: The split of point (b) applies when the holder has both SEP land and SEP sea privileges on the LAPL(A); then 1 hour and 6 take-offs and landings are needed in each class, the smaller of take-offs and landings counting.
    ref: easa:FCL.140.A(b)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: no-expiry
    reading: A LAPL(A) privilege has no expiry date; a recorded one is ignored by the recency evaluation, and "the last 2 years" is the 24 months up to the date evaluated.
    ref: easa:FCL.140.A(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: passenger-pic-since-issue
    reading: PIC time on any aeroplane or TMG since the recorded licence issue date counts toward the 10 hours; ultralight hours are not credited (FCL.035(a)(4) credits them only toward the recency and revalidation hours). Without a licence issue date the result is unknown. The needed amount is in minutes.
    ref: [easa:FCL.105.A(b)(1), easa:FCL.035(a)(4)]
    affects: [passenger_prerequisite]
    approved_by: null
    approved_on: null
  - id: previously-held
    reading: A PPL(A), CPL(A), ATPL(A) or MPL recorded in the holder's record, valid or not, is taken as previously held and exempts from the 10 hours.
    ref: easa:FCL.105.A(b)(2)
    affects: [passenger_prerequisite]
    approved_by: null
    approved_on: null
  - id: prerequisite-not-met-expired
    reading: Until the 10 hours are flown the holder may not carry passengers; the result is reported expired with the missing minutes, as for passenger recency.
    ref: easa:FCL.105.A(b)(1)
    affects: [passenger_prerequisite]
    approved_by: null
    approved_on: null
  - id: variants-sep-only
    reading: FCL.140.A(c) applies the variant rule to SEP variants of a LAPL(A); TMG variants are left out (FCL.710(da)), and whether an SEP variant has a different type of engine is not recorded, so every recorded SEP variant is evaluated.
    ref: [easa:FCL.140.A(c), easa:FCL.710(da)]
    affects: [variants]
    approved_by: null
    approved_on: null
  - id: privileges-scope-not-checked
    reading: The mass and passenger limits of the LAPL(A) privileges are a scope of what a flight may be, not a recency condition, and are not checked.
    ref: easa:FCL.105.A(a)
    affects: [recency]
    approved_by: null
    approved_on: null
