credential: Balloon pilot licence (BPL)
id: easa.licence.bpl
kind: licence
authority: EASA
held_on: []
selects:
  licence: { kinds: [BPL], authorities: [EASA, LBA] }

evaluations:
  - id: recency
    asks: May the holder fly balloons of a given class and group? Part-BFCL recency per balloon class (6 hours and 10 take-offs and landings in 24 months and a training flight in 48 months, or a proficiency check; 3 hours on each additional class; hot-air group limits).
    source: easa:BFCL.160(a)
    also_cites: [easa:BFCL.160(b), easa:BFCL.160(d), easa:BFCL.115(c)]
    passes_if:
      not_recorded: { id: balloon_recency, name: requirement.untracked, messages: { untracked: requirement.untracked }, ref: easa:BFCL.160(a) }
    outcomes:
      - { id: not_evaluable, when: always, status: unknown, message: licence.recency_not_evaluable, ref: policy:unknown-input }

  - id: medical
    asks: Does the holder hold a valid LAPL (or class 2 or class 1) medical certificate?
    uses: easa.shared.medical-certificate
    with: { accepts: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL], ref: "easa:MED.A.030(c)(1)" }

  - id: medical_validity
    asks: Is that medical certificate itself still valid for these privileges (a class 1 certificate within its LAPL validity)?
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1@lapl]

interpretations:
  - id: balloons-not-modelled
    reading: The recency is not evaluable and always unknown. The record holds no balloon class (hot-air, gas, mixed, hot-air airship) or hot-air balloon group (A to D) for a flight, check or rating, so it cannot tell in which class the 6 hours, 10 take-offs and landings, the training flight or the check were flown, whether the 3 hours on each additional class are met, or which groups the pilot may fly; a rule for one BALLOON class would report pilots current in classes and groups they may not fly.
    ref: [easa:BFCL.160(a), easa:BFCL.160(b), easa:BFCL.160(d)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: commercial-credit-not-applied
    reading: The credit from the commercial operation rating's check or training flight is not applied, because the record holds no balloon class for it either.
    ref: easa:BFCL.160(f)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: commercial-medical-not-applied
    reading: The class 2 medical needed for commercial passenger ballooning or commercial operations with more than 4 persons on board is not applied, because the record does not say whether the flying is commercial.
    ref: [easa:MED.A.030(c)(3)(i), easa:MED.A.030(c)(3)(ii)]
    affects: [medical]
    approved_by: null
    approved_on: null
  - id: licence-authorities
    reading: A BPL is a licence recorded with authority EASA or LBA whose type reads as a BPL (or LAPL(B)).
    ref: easa:MED.A.030(c)(1)
    affects: [medical, recency]
    approved_by: null
    approved_on: null
