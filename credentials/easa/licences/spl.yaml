credential: Sailplane pilot licence (SPL)
id: easa.licence.spl
kind: licence
authority: EASA
held_on: []
selects:
  licence: { kinds: [SPL, LAPL_S], authorities: [EASA, LBA] }
  ratings: { classes: [GLIDER], licence_kinds: [SPL, LAPL_S], authorities: [EASA, LBA] }

evaluations:
  - id: recency
    about: rating
    asks: May the holder fly sailplanes (excluding TMGs)? 5 hours, 15 launches and 2 training flights in the last 24 months, or a proficiency check.
    source: easa:SFCL.160(a)
    counting: { within_months: 24 }
    passes_if:
      id: recency
      ref: easa:SFCL.160(a)
      any_of:
        - id: experience
          ref: easa:SFCL.160(a)(1)
          all_of:
            - pic_dual_or_solo_time: { min_hours: 5, classes: [GLIDER, TMG], ref: easa:SFCL.160(a)(1) }
            - launches: { min: 15, classes: [GLIDER], ref: easa:SFCL.160(a)(1)(i) }
            - training_flights: { min: 2, classes: [GLIDER], with: FI(S), ref: easa:SFCL.160(a)(1)(ii) }
        - proficiency_check: { classes: [GLIDER], with: FE(S), ref: easa:SFCL.160(a)(2) }
    outcomes: recency
    description_key: easa_spl

  - id: launch_methods_towed
    about: launch_methods
    asks: For each of winch, car and aerotow launch the holder uses, 5 launches by that method in the last 24 months?
    source: easa:SFCL.155(c)
    also_cites: [easa:SFCL.155(d)]
    only_for: { launch_methods: [winch, car, aerotow] }
    counting: { within_months: 24 }
    passes_if:
      launches: { min: 5, classes: [GLIDER], by_this_launch_method: true, remedy: remedy.launch_method_dual, messages: { met: launch_method.progress, unmet: launch_method.progress }, ref: easa:SFCL.155(c) }
    outcomes: { preset: recency, messages: { current: launch_method.current, lapsed: launch_method.lapsed } }
    on_fail: { what: fly the missing launches dual or solo under supervision, ref: easa:SFCL.155(d) }
    description_key: sfcl_155_launch_method

  - id: launch_method_self
    about: launch_methods
    asks: If the holder self-launches, 5 self-launches or TMG take-offs in the last 24 months?
    source: easa:SFCL.155(c)
    also_cites: [easa:SFCL.155(d)]
    only_for: { launch_methods: [self-launch] }
    counting: { within_months: 24 }
    passes_if:
      launches:
        min: 5
        any_flight_of:
          - { classes: [GLIDER], by_this_launch_method: true }
          - { classes: [TMG] }
        remedy: remedy.launch_method_dual
        messages: { met: launch_method.progress, unmet: launch_method.progress }
        ref: easa:SFCL.155(c)
    outcomes: { preset: recency, messages: { current: launch_method.current, lapsed: launch_method.lapsed } }
    on_fail: { what: fly the missing launches dual or solo under supervision, ref: easa:SFCL.155(d) }
    description_key: sfcl_155_launch_method

  - id: launch_method_bungee
    about: launch_methods
    asks: If the holder uses bungee launches, 2 bungee launches in the last 24 months?
    source: easa:SFCL.155(c)
    also_cites: [easa:SFCL.155(d)]
    only_for: { launch_methods: [bungee] }
    counting: { within_months: 24 }
    passes_if:
      launches: { min: 2, classes: [GLIDER], by_this_launch_method: true, remedy: remedy.launch_method_dual, messages: { met: launch_method.progress, unmet: launch_method.progress }, ref: easa:SFCL.155(c) }
    outcomes: { preset: recency, messages: { current: launch_method.current, lapsed: launch_method.lapsed } }
    on_fail: { what: fly the missing launches dual or solo under supervision, ref: easa:SFCL.155(d) }
    description_key: sfcl_155_launch_method

  - id: passengers
    about: passengers
    asks: May the holder carry passengers in a sailplane? 3 launches as PIC in sailplanes in the last 90 days.
    source: easa:SFCL.160(e)(1)
    counting: { within_days: 90 }
    passes_if:
      launches: { min: 3, classes: [GLIDER], as: [pic], name: requirement.launches_as_pic, ref: easa:SFCL.160(e)(1) }
    outcomes: { preset: passengers, messages: { current: pax.current_day_no_night_privilege }, omit: [unknown] }
    description_key: easa_spl_pax

  - id: passenger_prerequisite
    asks: Has the holder, since the SPL was issued, flown the hours or launches needed before carrying passengers in a sailplane (or does the holder hold an FI(S) certificate)?
    uses: easa.shared.sfcl-passenger-prerequisite
    only_for: { licence_kinds: [SPL, LAPL_S] }

  - id: medical
    asks: Does the holder hold a valid LAPL (or class 2 or class 1) medical certificate?
    uses: easa.shared.medical-certificate
    with: { accepts: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL], ref: "easa:MED.A.030(c)(1)" }

  - id: medical_validity
    asks: Is that medical certificate itself still valid?
    requires_any: [easa.medical.lapl, easa.medical.class-2, easa.medical.class-1]

  - id: training_course
    about: training
    asks: For a student, is the SPL flight instruction complete (15 hours including 10 dual, 2 supervised solo, 45 launches, 7 hours in sailplanes and a cross-country flight)?
    source: easa:SFCL.130(a)(2)
    also_cites: [easa:SFCL.130(b)]
    scope:
      programme: SPL
      when_holding: { credentials: [EASA_LAPL_MEDICAL, EASA_CLASS2_MEDICAL, EASA_CLASS1_MEDICAL] }
      ref: easa:MED.A.030(a)
    counting: { ever: true }
    passes_if:
      ref: easa:SFCL.130(a)(2)
      all_of:
        - instruction_time: { min_hours: 15, classes: [GLIDER, TMG], ref: easa:SFCL.130(a)(2) }
        - dual_time: { min_hours: 10, classes: [GLIDER, TMG], ref: easa:SFCL.130(a)(2)(i) }
        - supervised_solo_time: { min_hours: 2, classes: [GLIDER, TMG], ref: easa:SFCL.130(a)(2)(ii) }
        - launches:
            min: 45
            classes: [GLIDER, TMG]
            any_flight_of: [{ with_time: [dual] }, { with_time: [spic] }]
            ref: easa:SFCL.130(a)(2)(iii)
        - instruction_time: { id: sailplane_instruction, name: requirement.sailplane_instruction, min_hours: 7, classes: [GLIDER], ref: easa:SFCL.130(a)(2)(iv) }
        - dual_time: { id: sailplane_dual, name: requirement.sailplane_dual, min_hours: 3, classes: [GLIDER], ref: easa:SFCL.130(a)(2)(iv)(A) }
        - flights:
            id: cross_country
            min: 1
            classes: [GLIDER, TMG]
            any_flight_of:
              - { classes: [GLIDER], as: [pic, spic], without_time: [dual], with_time: [crossCountry], min_distance_km: 50 }
              - { with_time: [dual, crossCountry], min_distance_km: 100 }
            ref: easa:SFCL.130(a)(2)(iv)(B)
        - pic_time:
            id: credit_sfcl130b
            name: requirement.sfcl130b_credit
            remedy: none
            informational: true
            only_if: { holds: { licenceKinds: [PPL_A, LAPL_A, CPL_A, ATPL_A, MPL, GPL, PPL_H, CPL_H, ATPL_H, LAPL_H, PPL_AS, CPL_AS] }, ref: easa:SFCL.130(b) }
            classes: [SEP_LAND, SEP_SEA, MEP_LAND, MEP_SEA, SET_LAND, SET_SEA, HELICOPTER, GYROPLANE, POWERED_LIFT, AIRSHIP]
            credit: sfcl-130b-credit
            min_hours: 7
            ref: easa:SFCL.130(b)
    outcomes: training

interpretations:
  - id: sailplane-privileges-sfcl-licences
    reading: Sailplane privileges are the GLIDER ratings recorded on an SPL or LAPL(S) licence of authority EASA or LBA (Part-SFCL licences); a GLIDER rating recorded on any other licence is not evaluated as SPL privileges.
    ref: easa:SFCL.160(a)
    affects: [recency, launch_methods_towed, launch_method_self, launch_method_bungee, passengers]
    approved_by: null
    approved_on: null
  - id: sailplanes-include-tmg-time
    reading: '"On sailplanes" includes TMGs (a TMG is a powered sailplane), so TMG time counts toward the 5 hours; the 15 launches and the two training flights are counted on GLIDER flights only, self-launching sailplanes included, whatever the launch method.'
    ref: easa:SFCL.160(a)(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: training-flight-as-dual
    reading: A training flight with an FI(S) is a flight with dual time received; that the instructor holds an FI(S) certificate and that the check was with an FE(S) are not checked.
    ref: [easa:SFCL.160(a)(1)(ii), easa:SFCL.160(a)(2)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: proficiency-check-in-class
    reading: The proficiency check is a check event or check flight in the GLIDER class.
    ref: easa:SFCL.160(a)(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: launch-count
    reading: Launches are the flight's launch count, so a row recording a series of launches counts each launch; for a TMG the launch count is its take-offs.
    ref: easa:SFCL.160(a)(1)(i)
    affects: [recency, launch_method_self]
    approved_by: null
    approved_on: null
  - id: no-expiry
    reading: The SPL has no expiry date; a recorded expiry date is ignored by the recency evaluations.
    ref: easa:SFCL.160(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: logbook-signatures-not-checked
    reading: The logbook entries and signatures for the dual and supervised flights are not checked.
    ref: easa:SFCL.160(d)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: launch-methods-in-use
    reading: A launch method is evaluated when it was ever logged on a GLIDER flight or a LAUNCH_METHOD_TRAINED privilege is recorded for it on the rating's licence; launches in any role count, and "the last two years" is the 24 months up to the date evaluated.
    ref: easa:SFCL.155(c)
    affects: [launch_methods_towed, launch_method_self, launch_method_bungee]
    approved_by: null
    approved_on: null
  - id: self-launch-with-tmg
    reading: Self-launches in sailplanes and take-offs in TMGs count together; TMG take-offs alone do not make self-launch a method in use.
    ref: easa:SFCL.155(c)
    affects: [launch_method_self]
    approved_by: null
    approved_on: null
  - id: other-launch-methods
    reading: Launch methods other than winch, car, aerotow, self-launch and bungee are not recorded and not evaluated.
    ref: easa:SFCL.155(a)(4)
    affects: [launch_methods_towed]
    approved_by: null
    approved_on: null
  - id: launch-as-pic
    reading: A launch as PIC is a launch of a GLIDER flight with PIC time; supervised solo flights do not count. One result per authority for the GLIDER class; sailplanes carry no night passenger privilege.
    ref: easa:SFCL.160(e)(1)
    affects: [passengers]
    approved_by: null
    approved_on: null
  - id: training-course-for-students
    reading: The training programme is evaluated for anyone holding an EASA medical certificate (a student holds no licence yet and needs a medical to fly solo); instruction is dual plus supervised solo time, and the 15 hours, 10 hours dual, 2 hours supervised solo and 45 launches include TMG flights while the 7 hours and 3 hours dual are in sailplanes excluding TMGs.
    ref: [easa:SFCL.130(a)(2), easa:MED.A.030(a)]
    affects: [training_course]
    approved_by: null
    approved_on: null
  - id: cross-country-flight
    reading: The cross-country flight is a solo GLIDER flight of at least 50 km or a dual GLIDER or TMG flight of at least 100 km, with cross-country time and a recorded distance; a flight without a recorded distance is unknown.
    ref: easa:SFCL.130(a)(2)(iv)(B)
    affects: [training_course]
    approved_by: null
    approved_on: null
  - id: other-category-credit-shown-only
    reading: The credit of 10 % of PIC time on other categories (at most 7 hours) is shown for holders of an aeroplane, gyroplane or helicopter licence and never changes the result; its limits in (b)(1) and (b)(2) are not applied.
    ref: easa:SFCL.130(b)
    affects: [training_course]
    approved_by: null
    approved_on: null
  - id: theory-and-ato-not-checked
    reading: The theoretical knowledge and whether the course was completed at an ATO or a DTO are not checked.
    ref: easa:SFCL.130(a)(1)
    affects: [training_course]
    approved_by: null
    approved_on: null
  - id: commercial-medical-not-applied
    reading: The class 2 medical needed for commercial sailplane operations is not applied, because the record does not say whether the flying is commercial.
    ref: easa:MED.A.030(c)(4)
    affects: [medical]
    approved_by: null
    approved_on: null
