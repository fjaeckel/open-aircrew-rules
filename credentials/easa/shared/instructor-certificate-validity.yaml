shared: Instructor certificate validity, 3 years (FCL.940)
id: easa.shared.instructor-certificate-validity
authority: EASA
params: {}
evaluation:
  asks: Is the instructor certificate within its 3-year validity period?
  source: easa:FCL.940
  valid_for:
    counted_from: valid_from
    periods:
      - { months: 36, ref: easa:FCL.940 }
  outcomes:
    preset: validity
    messages: { no_expiry: privilege.no_expiry_date, expired: privilege.expired, expiring: privilege.expiring, valid: privilege.valid }
    expiring_notice: { days: 90, ref: policy:expiring-notice }
  description_key: privilege_expiry

interpretations:
  - id: period-start
    reading: "The 3 years run from the certificate's recorded validity start (validFrom), else its issue date; a recorded expiry date earlier than that end wins, a later one is capped at 3 years. Without either date the validity is unknown."
    ref: easa:FCL.940
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: shorter-validities-not-applied
    reading: "The shorter validities the article reserves (points FCL.900(b)(1) and FCL.915(e)(2), specific certificates) are not applied; such a certificate is evaluated by its recorded expiry date only when that date is earlier than 3 years."
    ref: easa:FCL.940
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: validity-not-revalidation
    reading: "This answers only whether the certificate is within its validity period; it says nothing about whether the revalidation requirements are met, so a current result never means the certificate has been revalidated."
    ref: easa:FCL.940
    affects: [evaluation]
    approved_by: null
    approved_on: null
