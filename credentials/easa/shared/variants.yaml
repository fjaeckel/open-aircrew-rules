shared: Variant not flown within 2 years (FCL.710(d), FCL.140.A(c))
id: easa.shared.variants
authority: EASA
params: {}
evaluation:
  about: variants
  asks: Has the holder flown each variant recorded on the rating in the last 2 years, or completed differences training, a proficiency check or refresher training in it since?
  source: easa:FCL.710(d)
  also_cites: [easa:FCL.140.A(c)]
  counting: { within_months: 24 }
  passes_if:
    flights: { id: variant_flown, name: requirement.variant_flown, remedy: remedy.differences_training, min: 1, in_variant: true, ref: easa:FCL.710(d) }
  restored_by:
    - { differences_training: { in_variant: true }, ref: easa:FCL.710(d)(1) }
    - { proficiency_check: { in_variant: true }, ref: easa:FCL.710(d)(2) }
    - { refresher_training: { in_variant: true, classes: [SEP_LAND, SEP_SEA] }, ref: easa:FCL.710(d)(3) }
  outcomes:
    - { id: current, when: all_met, status: current, message: type.current, ref: easa:FCL.710(d) }
    - { id: unknown, when: undetermined, status: unknown, message: type.unknown, ref: policy:unknown-input }
    - { id: not_flown, when: always, status: lapsed, message: type.not_flown, ref: policy:recency-lapsed }

interpretations:
  - id: variant-is-recorded-variant
    reading: A variant is a variant recorded on the rating (the holder extended the rating to it); a flight or event counts for it when it records that variant name. A flight in the class without a variant name cannot be matched and makes the result unknown.
    ref: easa:FCL.710(d)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: restoring-events-for-two-years
    reading: Further differences training, a proficiency check or refresher training in the variant restores the privilege from its date for another 2 years, as a flight in the variant would; that the training followed points (a) to (c) and was signed ((e)) is not checked.
    ref: [easa:FCL.710(d)(1), easa:FCL.710(d)(2), easa:FCL.710(e)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: refresher-sep-variants
    reading: Refresher training restores only a variant of an SEP (land or sea) class rating, as point (d)(3) allows it only for SEP variants with a particular type of engine; for variants of other class and type ratings only differences training or a proficiency check restores. Which engine type an SEP variant has is not recorded, so refresher training is accepted for every recorded SEP variant.
    ref: easa:FCL.710(d)(3)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: same-engine-sep-variants-evaluated
    reading: Point (da) is applied to TMG variants only (the credentials using this evaluation leave TMG ratings out); whether an SEP variant has the same type of engine as the aircraft the rating was issued on is not recorded, so every recorded SEP variant is evaluated.
    ref: "easa:FCL.710(da)"
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: initial-training-not-logged
    reading: A variant whose initial differences training is not recorded as an event and that has not been flown in the 2 years is reported as not flown.
    ref: easa:FCL.710(a)
    affects: [evaluation]
    approved_by: null
    approved_on: null
