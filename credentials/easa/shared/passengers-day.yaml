shared: Carrying passengers, 90-day recency (FCL.060(b)(1))
id: easa.shared.passengers-day
authority: EASA
params:
  type_rated: false for class ratings (the recorded class), true for type ratings (the recorded type designator).
evaluation:
  about: passengers
  asks: Has the holder made 3 take-offs, approaches and landings as pilot flying in the class (or, for a type rating, the type) in the last 90 days?
  source: easa:FCL.060(b)(1)
  only_for: { type_rated: $type_rated }
  counting: { within_days: 90, in_class: true, in_type: $type_rated, as: pilot_flying, simulator: include, fstd: [FFS] }
  passes_if:
    takeoffs_and_landings: { min: 3, ref: easa:FCL.060(b)(1) }
  outcomes: passengers
  description_key: easa_pax

interpretations:
  - id: class-for-type
    reading: '"Same type or class" is the recorded class for class ratings and the recorded type designator for type ratings (helicopters, powered-lift, airships and LAPL(H) types); for a type rating a flight in the class without a type designator is unknown input. A class rating recorded with a type designator gets no passenger result; a type rating recorded without one is reported unknown (record the type designator), never silently left out.'
    ref: easa:FCL.060(b)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: approaches-with-landings
    reading: Approaches are not counted on their own; each take-off and landing is taken to include one approach. The smaller of take-offs and landings counts.
    ref: easa:FCL.060(b)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: pilot-flying-recorded
    reading: Only flights recorded as pilot flying count; a flight that does not record it is unknown input, never counted, so the result is unknown rather than not met.
    ref: easa:FCL.060(b)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: operations-not-checked
    reading: Whether the take-offs and landings were in single-pilot or multi-pilot operations "depending on the privileges held" is not checked.
    ref: easa:FCL.060(b)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: no-cross-credit
    reading: The cruise relief co-pilot recency and the cross-type credit determined in the operational suitability data are not applied.
    ref: [easa:FCL.060(b)(3), easa:FCL.060(b)(4), easa:FCL.060(b)(5)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
