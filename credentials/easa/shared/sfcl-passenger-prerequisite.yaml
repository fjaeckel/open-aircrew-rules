shared: Experience after SPL issue before carrying passengers (SFCL.115(a)(2)(ii))
id: easa.shared.sfcl-passenger-prerequisite
authority: EASA
params: {}
evaluation:
  about: passengers
  asks: Has the holder, since the SPL was issued, flown 10 hours or 30 launches as PIC on sailplanes (plus a training flight), or does the holder hold an FI(S) certificate?
  source: easa:SFCL.115(a)(2)
  counting: { since_licence_issue: true, classes: [GLIDER, TMG], as: [pic] }
  passes_if:
    ref: easa:SFCL.115(a)(2)(ii)
    all_of:
      - id: prerequisite
        ref: easa:SFCL.115(a)(2)(ii)(A)
        any_of:
          - pic_time: { id: pax_prerequisite_time, name: requirement.pax_prerequisite_time, min_hours: 10, ref: easa:SFCL.115(a)(2)(ii)(A) }
          - launches: { id: pax_prerequisite_launches, name: requirement.pax_prerequisite_launches, min: 30, ref: easa:SFCL.115(a)(2)(ii)(A) }
      - not_recorded: { id: pax_competence_flight, name: requirement.pax_competence_flight, informational: true, messages: { untracked: requirement.untracked }, ref: easa:SFCL.115(a)(2)(ii)(A) }
  outcomes:
    - { id: instructor, when: { holds: { privileges: [FI_S] } }, status: current, message: pax.prerequisite_met, ref: easa:SFCL.115(a)(2)(ii)(B) }
    - { id: met, when: all_met, status: current, message: pax.prerequisite_met, ref: easa:SFCL.115(a)(2)(ii)(A) }
    - { id: issue_date_unknown, when: undetermined, status: unknown, message: pax.prerequisite_unknown, ref: policy:unknown-input }
    - { id: not_met, when: always, status: expired, message: pax.prerequisite_not_met, params: { needed: { needed: pax_prerequisite_time } }, ref: easa:SFCL.115(a)(2)(ii)(A) }
  description_key: easa_spl_pax

interpretations:
  - id: competence-flight-not-recorded
    reading: The training flight demonstrating passenger competence is not recorded in a logbook record; it is shown as an informational, untracked row and does not change the result, so the result reports only the hours or launches.
    ref: easa:SFCL.115(a)(2)(ii)(A)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: since-recorded-issue
    reading: The experience counts from the recorded issue date of the SPL or LAPL(S) (a re-issued licence carries a later date than the one the text means), on GLIDER and TMG flights with PIC time; a TMG flight's launch count is its take-offs. Without a recorded issue date the result is unknown.
    ref: easa:SFCL.115(a)(2)(ii)(A)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: fi-s-on-any-licence
    reading: An FI(S) certificate satisfies the prerequisite when an FI_S privilege is recorded on any licence, whatever its recorded expiry date. Part-SFCL sets the FI(S) no validity period (a date endorsed on conversion from Part-FCL does not end the certificate), and whether the holder may exercise instructor privileges (the SFCL.360 recency, with events recorded for FI_S) is evaluated by easa.instructor.fi-s, not here.
    ref: [easa:SFCL.115(a)(2)(ii)(B), easa:SFCL.360(a)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
