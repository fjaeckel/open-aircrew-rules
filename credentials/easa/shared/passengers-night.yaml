shared: Carrying passengers at night, 90-day recency (FCL.060(b)(2))
id: easa.shared.passengers-night
authority: EASA
params:
  type_rated: false for class ratings (the recorded class), true for type ratings (the recorded type designator).
evaluation:
  about: passengers
  asks: Has the holder made 1 take-off, approach and landing at night as pilot flying in the class (or, for a type rating, the type) in the last 90 days, or does the holder hold an IR?
  source: easa:FCL.060(b)(2)
  only_for: { type_rated: $type_rated }
  counting: { within_days: 90, in_class: true, in_type: $type_rated, as: pilot_flying, simulator: include, fstd: [FFS] }
  passes_if:
    ref: easa:FCL.060(b)(2)(i)
    all_of:
      - night_takeoffs: { min: 1, ref: easa:FCL.060(b)(2)(i) }
      - night_landings: { min: 1, ref: easa:FCL.060(b)(2)(i) }
  outcomes:
    preset: passengers
    special:
      - { id: ir_held, when: { holds: { classes: [IR], sameCategory: true, valid: true, expiryRecorded: true, authorities: [EASA, LBA] } }, status: current, message: pax.night_waived_ir, ref: easa:FCL.060(b)(2)(ii) }
      - { id: ir_no_expiry, when: { holds: { classes: [IR], sameCategory: true, valid: true, authorities: [EASA, LBA] } }, status: unknown, message: pax.night_ir_no_expiry, ref: [easa:FCL.060(b)(2)(ii), policy:unknown-input] }
    messages: { current: pax.night_current, not_met: pax.night_not_current }
  description_key: easa_pax

interpretations:
  - id: ir-held
    reading: '"Holds an IR" is a valid IR of the aircraft category of the passengers result (an IR(A) for aeroplanes, an IR(H) for helicopters), on any EASA or LBA licence of the holder: its category is the one recorded on the rating, else that of the licence it is on. A BIR is not an IR. An IR of the category recorded without an expiry date does not waive the requirement; the result is unknown until its expiry date is recorded. An expired IR does not count.'
    ref: easa:FCL.060(b)(2)(ii)
    affects: [evaluation]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: separate-flights
    reading: The night take-off and the night landing may be on different flights; the approach is taken to go with the landing.
    ref: easa:FCL.060(b)(2)(i)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: class-for-type
    reading: '"Same type or class" is the recorded class for class ratings and the recorded type designator for type ratings, as for passengers by day.'
    ref: easa:FCL.060(b)(2)(i)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: pilot-flying-recorded
    reading: Only flights recorded as pilot flying count; a flight that does not record it is unknown input, never counted.
    ref: easa:FCL.060(b)(2)(i)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: night-privilege-separate
    reading: This answers only the recency for carrying passengers at night; whether the holder may fly at night at all (night rating) is a separate question.
    ref: easa:FCL.060(b)(2)
    affects: [evaluation]
    approved_by: null
    approved_on: null
