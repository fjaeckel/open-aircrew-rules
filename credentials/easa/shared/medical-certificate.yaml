shared: Medical certificate required for a licence (MED.A.030)
id: easa.shared.medical-certificate
authority: EASA
params:
  accepts: Medical certificate types that allow the licence's privileges (the required class and higher classes).
  ref: The MED.A.030(c) point naming the class the licence needs.
evaluation:
  about: licence
  asks: Does the holder hold a valid medical certificate of the class the licence needs?
  source: easa:MED.A.030(c)
  outcomes:
    - { id: valid_medical, when: { holds: { credentials: $accepts, valid: true } }, status: current, message: licence.valid, ref: $ref }
    - { id: no_valid_medical, when: { holds: { credentials: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL] } }, status: expired, message: licence.medical_required, ref: $ref }
    - { id: no_medical_recorded, when: always, status: unknown, message: licence.medical_not_recorded, ref: policy:medical-not-recorded }

interpretations:
  - id: higher-class-counts
    reading: A certificate of a higher class than the one required counts (a class 1 certificate includes the class 2 and LAPL privileges, a class 2 the LAPL privileges).
    ref: easa:MED.A.030(c)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: entered-expiry
    reading: A certificate counts while not expired on the date evaluated by its recorded expiry date; one recorded without an expiry date is taken as valid. The derived validity of MED.A.045 is evaluated by the medical certificate's own credential.
    ref: easa:MED.A.030(c)
    affects: [evaluation]
    approved_by: null
    approved_on: null
