credential: LAPL medical certificate
id: easa.medical.lapl
kind: medical
authority: EASA
held_on: []
selects:
  credential: { kinds: [EASA_LAPL_MEDICAL] }

evaluations:
  - id: validity
    asks: Is the certificate still valid? Its validity depends on the holder's age.
    source: easa:MED.A.045(a)(4)
    also_cites: [easa:MED.A.045(a)(5), easa:MED.A.045(b)]
    valid_for:
      counted_from: valid_from
      ref: easa:MED.A.045(a)(5)
      periods:
        - { age_under: 40, months: 60, ends_at_age: 42, ref: easa:MED.A.045(a)(4)(i) }
        - { months: 24, ref: easa:MED.A.045(a)(4)(ii) }
    outcomes:
      preset: validity
      date_of_birth: when_no_expiry
      expiring_notice: { days: 45, message: credential.revalidation_window_open, ref: easa:MED.A.045(b) }

interpretations:
  - id: age-bands
    reading: '"Aged above 40" is 40 or more, so the two bands leave no gap; a certificate issued before 40 ends on the 42nd birthday at the latest.'
    ref: easa:MED.A.045(a)(4)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: counted-from
    reading: The period runs from validFrom (the previous expiry date, for a revalidation) or else the issue date (the examination date); the age is taken on that date.
    ref: easa:MED.A.045(a)(5)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: earlier-expiry-wins
    reading: The effective expiry is the earlier of the derived and a recorded expiry date. Without a date of birth only a recorded expiry date is used.
    ref: easa:MED.A.045(a)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: renewal-not-modelled
    reading: Renewal after expiry is not evaluated; an expired certificate is reported expired.
    ref: easa:MED.A.045(c)
    affects: [validity]
    approved_by: null
    approved_on: null
