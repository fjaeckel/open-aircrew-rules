credential: Class 1 medical certificate
id: easa.medical.class-1
kind: medical
authority: EASA
held_on: []
selects:
  credential: { kinds: [EASA_CLASS1_MEDICAL] }

evaluations:
  - id: validity
    level: class_1
    asks: Is the certificate still valid for class 1 privileges? Its validity depends on the holder's age.
    source: easa:MED.A.045(a)(1)
    also_cites: [easa:MED.A.045(a)(2), easa:MED.A.045(a)(5), easa:MED.A.045(b)]
    valid_for:
      counted_from: valid_from
      age_on: issue
      ref: easa:MED.A.045(a)(5)
      periods:
        - { age_from: 60, months: 6, ref: easa:MED.A.045(a)(2)(ii) }
        - { months: 12, ref: easa:MED.A.045(a)(1) }
    outcomes:
      preset: validity
      date_of_birth: when_no_expiry
      expiring_notice: { days: 45, message: credential.revalidation_window_open, ref: easa:MED.A.045(b) }

  - id: validity_class_2
    level: class_2
    asks: Is the certificate still valid for the privileges a class 2 certificate gives (a PPL or GPL)?
    source: easa:MED.A.045(a)(3)
    also_cites: [easa:MED.A.030(c)(2), easa:MED.A.045(a)(5), easa:MED.A.045(b)]
    valid_for:
      counted_from: valid_from
      age_on: issue
      recorded_expiry_minimum: true
      ref: easa:MED.A.045(a)(5)
      periods:
        - { age_under: 40, months: 60, ends_at_age: 42, ref: easa:MED.A.045(a)(3)(i) }
        - { age_from: 40, age_under: 50, months: 24, ends_at_age: 51, ref: easa:MED.A.045(a)(3)(ii) }
        - { months: 12, ref: easa:MED.A.045(a)(3)(iii) }
    outcomes:
      preset: validity
      date_of_birth: when_no_expiry
      expiring_notice: { days: 45, message: credential.revalidation_window_open, ref: easa:MED.A.045(b) }

  - id: validity_lapl
    level: lapl
    asks: Is the certificate still valid for the privileges a LAPL medical certificate gives (a LAPL, SPL or BPL)?
    source: easa:MED.A.045(a)(4)
    also_cites: [easa:MED.A.030(c)(1), easa:MED.A.045(a)(5), easa:MED.A.045(b)]
    valid_for:
      counted_from: valid_from
      age_on: issue
      recorded_expiry_minimum: true
      ref: easa:MED.A.045(a)(5)
      periods:
        - { age_under: 40, months: 60, ends_at_age: 42, ref: easa:MED.A.045(a)(4)(i) }
        - { months: 24, ref: easa:MED.A.045(a)(4)(ii) }
    outcomes:
      preset: validity
      date_of_birth: when_no_expiry
      expiring_notice: { days: 45, message: credential.revalidation_window_open, ref: easa:MED.A.045(b) }

interpretations:
  - id: single-pilot-cat-not-applied
    reading: The 6-month period for holders aged 40 or more in single-pilot commercial air transport carrying passengers is not applied, because the record does not say whether the holder flies such operations; a shorter recorded expiry date still applies.
    ref: easa:MED.A.045(a)(2)(i)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: counted-from
    reading: The period runs from validFrom (the previous expiry date, for a revalidation) or else the issue date (the examination date). The holder's age is taken on the examination date (the issue date), not on the date the period starts, so a holder examined at 59 whose revalidated period starts after the 60th birthday gets 12 months.
    ref: easa:MED.A.045(a)(5)
    affects: [validity, validity_class_2, validity_lapl]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: earlier-expiry-wins
    reading: The effective expiry is the earlier of the derived and a recorded expiry date. Without a date of birth only a recorded expiry date is used.
    ref: easa:MED.A.045(a)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: lower-class-validity
    reading: A class 1 certificate also gives the privileges of a class 2 and a LAPL medical certificate, for the periods those classes have at the holder's age (AMC1 MED.A.030), so it is evaluated at three levels (class_1, class_2, lapl); a licence needing only class 2 or LAPL privileges counts it at that level. The record has one expiry date, read as the class 1 date, and it applies to the class 1 level only. The class 2 and LAPL levels run their own periods from the examination date and the age on it; because those periods are never shorter than the class 1 period at the same age, the recorded class 1 date is a date they last at least until (the later of the two applies). Without a date of birth a lower level is valid until the recorded class 1 date and unknown after it (the date of birth decides).
    ref: [easa:MED.A.030(c)(1), easa:MED.A.030(c)(2), easa:MED.A.045(a)(3), easa:MED.A.045(a)(4)]
    affects: [validity_class_2, validity_lapl]
    principle: P1
    approved_by: null
    approved_on: null
  - id: renewal-not-modelled
    reading: Renewal after expiry is not evaluated; an expired certificate is reported expired.
    ref: easa:MED.A.045(c)
    affects: [validity, validity_class_2, validity_lapl]
    approved_by: null
    approved_on: null
