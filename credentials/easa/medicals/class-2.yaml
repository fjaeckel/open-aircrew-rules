credential: Class 2 medical certificate
id: easa.medical.class-2
kind: medical
authority: EASA
held_on: []
selects:
  credential: { kinds: [EASA_CLASS2_MEDICAL] }

evaluations:
  - id: validity
    asks: Is the certificate still valid? Its validity depends on the holder's age.
    source: easa:MED.A.045(a)(3)
    also_cites: [easa:MED.A.045(a)(5), easa:MED.A.045(b)]
    valid_for:
      counted_from: valid_from
      age_on: issue
      ref: easa:MED.A.045(a)(5)
      periods:
        - { age_under: 40, months: 60, ends_at_age: 42, ref: easa:MED.A.045(a)(3)(i) }
        - { age_from: 40, age_under: 50, months: 24, ends_at_age: 51, ref: easa:MED.A.045(a)(3)(ii) }
        - { months: 12, ref: easa:MED.A.045(a)(3)(iii) }
    outcomes:
      preset: validity
      date_of_birth: when_no_expiry
      expiring_notice: { days: 45, message: credential.revalidation_window_open, ref: easa:MED.A.045(b) }

interpretations:
  - id: age-bands
    reading: '"Aged between 40 and 50" is 40 to 49 and "aged above 50" is 50 or more, so the bands leave no gap; a certificate issued before 42 or 51 ends on that birthday at the latest.'
    ref: easa:MED.A.045(a)(3)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: counted-from
    reading: The period runs from validFrom (the previous expiry date, for a revalidation) or else the issue date (the examination date). The holder's age, which picks the period and its age cap, is taken on the examination date (the issue date), not on the date the period starts.
    ref: easa:MED.A.045(a)(5)
    affects: [validity]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: earlier-expiry-wins
    reading: The effective expiry is the earlier of the derived and a recorded expiry date. Without a date of birth only a recorded expiry date is used.
    ref: easa:MED.A.045(a)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: renewal-not-modelled
    reading: Renewal after expiry is not evaluated; an expired certificate is reported expired.
    ref: easa:MED.A.045(c)
    affects: [validity]
    approved_by: null
    approved_on: null
