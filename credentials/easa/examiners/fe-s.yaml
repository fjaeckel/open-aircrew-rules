credential: Flight examiner certificate for sailplanes (FE(S))
id: easa.examiner.fe-s
kind: examiner_certificate
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  privilege: { kinds: [FE_S], not_authorities: [FAA, DULV, DAEC] }
validity: { period_months: 60, ref: "easa:SFCL.460(a)" }

evaluations:
  - id: revalidation
    asks: Is the FE(S) certificate within its 5 years, and has the holder completed an examiner refresher course in the validity period and demonstrated the ability to conduct tests in the last 24 months of it?
    source: easa:SFCL.460(b)
    also_cites: [easa:SFCL.460(a)]
    valid_for:
      counted_from: valid_from
      periods:
        - { months: 60, ref: easa:SFCL.460(a) }
    passes_if:
      id: revalidation
      ref: easa:SFCL.460(b)
      all_of:
        - examiner_refresher: { within_validity_period: true, with: competent_authority, ref: easa:SFCL.460(b)(1) }
        - assessment_of_competence: { id: demonstration, for_rating: [FE_S], within_months_before_expiry: 24, with: inspector, ref: easa:SFCL.460(b)(2) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: privilege.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: easa:SFCL.460(a) }
      - { id: met, when: all_met, status: current, message: privilege.revalidation_current, params: { date: expiry_date }, ref: easa:SFCL.460(b) }
      - { id: not_met, when: always, status: expiring, message: privilege.revalidation_not_met, params: { date: expiry_date }, ref: policy:revalidation-not-met-expiring }
    on_fail: { what: the refresher course and an assessment of competence under SFCL.445 before resuming, ref: easa:SFCL.460(d) }
    description_key: privilege_expiry

  - id: licence
    asks: Is the FE(S) certificate held on a sailplane licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.spl]

interpretations:
  - id: sfcl-certificate
    reading: An FE(S) certificate is an FE_S privilege recorded on a licence of any authority except FAA and the ultralight associations (DULV, DAeC).
    ref: easa:SFCL.460(a)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: five-years-from-valid-from
    reading: The five years run from the certificate's recorded validity start (validFrom), else its issue date; an earlier recorded expiry date wins. Without any of these dates the result is unknown. The certificate is valid through its expiry date.
    ref: easa:SFCL.460(a)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: refresher-event
    reading: The examiner refresher course is an examiner_refresher event within the validity period; that it was provided or approved by the competent authority cannot be shown by the record and is taken as met.
    ref: easa:SFCL.460(b)(1)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: demonstration-event
    reading: The demonstration to an inspector or an authorised examiner is an assessment_of_competence event recorded for the rating FE_S within the 24 months before the expiry date; an assessment of competence of the holder as a pilot or instructor does not count, and who it was demonstrated to cannot be shown by the record.
    ref: easa:SFCL.460(b)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: not-applied
    reading: The combined revalidation with other examiner certificates, renewal after expiry and the continued compliance with SFCL.410 and SFCL.420 are not evaluated.
    ref: [easa:SFCL.460(c), easa:SFCL.460(d), easa:SFCL.460(e)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
