credential: Examiner certificate, Part-FCL (FE, CRE, IRE, TRE, SFE and others)
id: easa.examiner.fcl-examiner
kind: examiner_certificate
authority: EASA
held_on: [PPL(A), CPL(A), ATPL(A), MPL, PPL(H), CPL(H), ATPL(H), GPL]
selects:
  privilege: { kinds: [EXAMINER], authorities: [EASA, LBA], not_licence_kinds: [BPL, SPL, LAPL_S, UL] }
validity: { period_months: 36, ref: "easa:FCL.1025(a)" }

evaluations:
  - id: revalidation
    asks: Is the examiner certificate within its 3 years, and has the holder conducted six tests or checks, completed an examiner refresher course and had one test assessed in the last 12 months?
    source: easa:FCL.1025(b)
    also_cites: [easa:FCL.1025(a)]
    valid_for:
      counted_from: valid_from
      periods:
        - { months: 36, ref: easa:FCL.1025(a) }
    counting: { within_months_before_expiry: 36 }
    passes_if:
      id: revalidation
      ref: easa:FCL.1025(b)
      all_of:
        - flights: { id: tests_conducted, name: requirement.tests_conducted, min: 6, as: [examiner], simulator: include, remedy: none, ref: easa:FCL.1025(b)(1) }
        - examiner_refresher: { within_months_before_expiry: 12, with: competent_authority, ref: easa:FCL.1025(b)(2) }
        - assessment_of_competence: { id: assessed_test, for_rating: [EXAMINER], within_months_before_expiry: 12, with: inspector, ref: easa:FCL.1025(b)(3) }
    outcomes:
      - { id: no_expiry, when: no_expiry, status: unknown, message: privilege.no_expiry_date, ref: policy:no-expiry-recorded }
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: easa:FCL.1025(a) }
      - { id: met, when: all_met, status: current, message: privilege.revalidation_current, params: { date: expiry_date }, ref: easa:FCL.1025(b) }
      - { id: expiring, when: { expires_within: { days: 90 } }, status: expiring, message: privilege.expiring, params: { days: days_to_expiry, date: expiry_date }, ref: policy:expiring-notice }
      - { id: not_met, when: always, status: current, message: privilege.revalidation_not_met, params: { date: expiry_date }, ref: easa:FCL.1025(a) }
    on_fail: { what: renewal (the refresher course and an assessment under FCL.1020 in the 12 months before applying), ref: easa:FCL.1025(c) }
    description_key: privilege_expiry

  - id: licence
    asks: Is the examiner certificate held on a licence whose own requirements (medical, language) are met?
    requires_any: [easa.licence.ppl-a, easa.licence.lapl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl, easa.licence.ppl-h, easa.licence.lapl-h, easa.licence.cpl-h, easa.licence.atpl-h, easa.licence.ppl-as, easa.licence.cpl-as, easa.licence.gpl]

interpretations:
  - id: one-privilege-kind
    reading: An examiner certificate is an EXAMINER privilege recorded on a licence of authority EASA or LBA, not on a BPL, SPL, LAPL(S) or ultralight licence (the sailplane examiner is the FE_S privilege, an examiner on a BPL an FE(B) under Part-BFCL). The privilege kind does not distinguish FE, CRE, IRE, TRE, SFE and the other categories, so all are evaluated alike.
    ref: easa:FCL.1025(a)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: three-years-from-valid-from
    reading: The 3 years run from the certificate's recorded validity start (validFrom), else its issue date; an earlier recorded expiry date wins, a later one is capped at 3 years. Without either date the result is unknown. The certificate stays valid until that date whether or not the revalidation is met, so an unmet revalidation is reported current (expiring in the last 90 days) with a message saying it is not met.
    ref: [easa:FCL.1025(a), easa:FCL.1025(b)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: tests-as-examiner-time
    reading: The six skill tests, proficiency checks, assessments of competence or EBT evaluation phases count only when conducted within the validity period being revalidated (the 36 months before expiry), never from an earlier period. Each is a flight or FSTD session logged with examiner time; EBT evaluation phases count only when logged that way.
    ref: easa:FCL.1025(b)(1)
    affects: [revalidation]
    principle: P3
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: refresher-event
    reading: The examiner refresher course is an examiner_refresher event in the 12 months before expiry; that it was provided or approved by the competent authority cannot be shown by the record and is taken as met.
    ref: easa:FCL.1025(b)(2)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: assessed-test-event
    reading: The test assessed by an inspector or senior examiner (or complying with FCL.1020) is an assessment_of_competence event recorded for the rating EXAMINER in the 12 months before expiry; an assessment of competence of the holder as a pilot does not count, and that the assessed test was one of the six is not checked.
    ref: easa:FCL.1025(b)(3)
    affects: [revalidation]
    approved_by: null
    approved_on: null
  - id: not-applied
    reading: The combined revalidation of several examiner categories, renewal after expiry and continued compliance with FCL.1010 and FCL.1030 are not evaluated.
    ref: [easa:FCL.1025(b), easa:FCL.1025(c), easa:FCL.1025(d)]
    affects: [revalidation]
    approved_by: null
    approved_on: null
