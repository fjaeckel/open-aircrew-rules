credential: TMG privileges of the SPL
id: easa.privilege.spl-tmg
kind: privilege
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  ratings: { classes: [TMG], licence_kinds: [SPL, LAPL_S], not_authorities: [FAA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly TMGs? 12 hours (6 on TMGs), 12 take-offs and landings and a 1-hour training flight in the last 24 months, or a proficiency check, or a Part-FCL TMG rating.
    source: easa:SFCL.160(b)
    also_cites: [easa:SFCL.160(c)]
    counting: { within_months: 24 }
    passes_if:
      id: recency
      ref: easa:SFCL.160(b)
      any_of:
        - id: experience
          ref: easa:SFCL.160(b)(1)
          all_of:
            - pic_dual_or_solo_time: { min_hours: 12, classes: [GLIDER, TMG], ref: easa:SFCL.160(b)(1) }
            - pic_dual_or_solo_time: { id: tmg_time, name: requirement.tmg_time, min_hours: 6, classes: [TMG], ref: easa:SFCL.160(b)(1)(i) }
            - takeoffs_and_landings: { id: tmg_takeoffs_landings, min: 12, classes: [TMG], ref: easa:SFCL.160(b)(1)(ii) }
            - longest_training_flight: { id: tmg_training_flight, name: requirement.tmg_training_flight, min_hours: 1, classes: [TMG], with: instructor, ref: easa:SFCL.160(b)(1)(iii) }
        - proficiency_check: { classes: [TMG], with: examiner, ref: easa:SFCL.160(b)(2) }
    outcomes:
      preset: recency
      special:
        - { id: exempt, when: { holds: { classes: [TMG], licenceKinds: [PPL_A, LAPL_A, CPL_A, ATPL_A, MPL], valid: true } }, status: current, message: rating.sfcl_tmg_exempt, ref: easa:SFCL.160(c) }
    description_key: easa_spl_tmg

  - id: passengers
    about: passengers
    asks: May the holder carry passengers in a TMG (by night only with the TMG night rating)? 3 take-offs and landings as PIC in the last 90 days, one of each at night for night passengers.
    source: easa:SFCL.160(e)(2)
    counting: { within_days: 90, classes: [TMG], as: [pic] }
    passes_if:
      ref: easa:SFCL.160(e)(2)
      all_of:
        - takeoffs_and_landings: { id: day, min: 3, ref: easa:SFCL.160(e)(2) }
        - night_takeoffs: { min: 1, only_if: { holds: { privileges: [TMG_NIGHT], sameLicence: true, valid: true }, ref: easa:SFCL.160(e)(2) }, ref: easa:SFCL.160(e)(2) }
        - night_landings: { min: 1, only_if: { holds: { privileges: [TMG_NIGHT], sameLicence: true, valid: true }, ref: easa:SFCL.160(e)(2) }, ref: easa:SFCL.160(e)(2) }
    outcomes:
      - { id: not_current, when: { unmet: day }, status: expired, message: pax.not_current, params: { needed: { needed: day } }, ref: easa:SFCL.160(e)(2) }
      - { id: day_no_night_rating, when: { not: { holds: { privileges: [TMG_NIGHT], sameLicence: true, valid: true } } }, status: current, message: pax.current_day_no_night_privilege, ref: easa:SFCL.160(e)(2) }
      - { id: day_and_night, when: all_met, status: current, message: pax.current_day_night, ref: easa:SFCL.160(e)(2) }
      - { id: day_only, when: always, status: current, message: pax.day_current_night_not, params: { needed: { needed: night_landings } }, ref: easa:SFCL.160(e)(2) }
    description_key: easa_spl_tmg_pax

  - id: passenger_prerequisite
    asks: Has the holder, since the SPL was issued, flown the hours or launches needed before carrying passengers (or does the holder hold an FI(S) certificate)?
    uses: easa.shared.sfcl-passenger-prerequisite

  - id: extension_training
    about: training
    asks: For an SPL limited to sailplanes, is the training for the TMG extension complete (6 hours of instruction in TMGs including 4 dual, a 150 km solo cross-country flight and a skill test), or credited by a Part-FCL TMG rating?
    source: easa:SFCL.150(b)
    also_cites: [easa:SFCL.150(c), easa:SFCL.130(a)(2)(v)]
    scope: { programme: SPL_TMG_EXTENSION, licence_kinds: [SPL, LAPL_S] }
    counting: { ever: true }
    passes_if:
      ref: easa:SFCL.150(b)
      all_of:
        - instruction_time: { min_hours: 6, classes: [TMG], ref: easa:SFCL.130(a)(2)(v) }
        - dual_time: { min_hours: 4, classes: [TMG], ref: easa:SFCL.130(a)(2)(v)(A) }
        - flights: { id: solo_cross_country, min: 1, classes: [TMG], as: [pic, spic], without_time: [dual], with_time: [crossCountry], min_distance_km: 150, ref: easa:SFCL.130(a)(2)(v)(B) }
        - skill_test: { classes: [TMG], ref: easa:SFCL.150(b)(2) }
    outcomes:
      preset: training
      special:
        - { id: part_fcl_credit, when: { holds: { classes: [TMG], licenceKinds: [PPL_A, CPL_A, ATPL_A, MPL], valid: true } }, status: current, message: training.credited, ref: easa:SFCL.150(c)(1) }

  - id: licence
    asks: Are the requirements of the SPL itself (medical) met?
    requires_all: [easa.licence.spl]

interpretations:
  - id: twelve-hours-on-sailplanes
    reading: The 12 hours are flight time on sailplanes, TMGs included (Part-SFCL writes excluding TMGs where it means to leave them out); time in aeroplanes or other aircraft is not credited. The 6 hours, the 12 take-offs and landings and the training flight are on TMGs; the smaller of take-offs and landings counts.
    ref: easa:SFCL.160(b)(1)
    affects: [recency]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: training-flight
    reading: The training flight is one TMG flight of at least 60 minutes total time with dual time received; that the instructor and the examiner are qualified is not checked.
    ref: [easa:SFCL.160(b)(1)(iii), easa:SFCL.160(b)(2)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: part-fcl-exemption
    reading: The exemption holds while the holder has a TMG class rating, not expired by its recorded date, on a PPL(A), LAPL(A), CPL(A), ATPL(A) or MPL; for a LAPL(A) the recency of that licence is not checked, and a licence of unknown kind does not exempt.
    ref: easa:SFCL.160(c)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: tmg-passengers
    reading: A take-off or landing as PIC is one on a TMG flight with PIC time. The night rows apply only while the holder holds a TMG night rating (TMG_NIGHT privilege) on the same licence; without it the holder may carry passengers by day only, and when the day requirement is met but the night one is not the result stays current for day passengers.
    ref: easa:SFCL.160(e)(2)
    affects: [passengers]
    approved_by: null
    approved_on: null
  - id: extension-for-every-spl
    reading: Whether the skill test was taken in a sailplane (which limits the SPL) is not recorded, so the extension programme is evaluated for every SPL or LAPL(S) holder. Instruction is dual plus supervised solo time; the solo cross-country flight is a TMG flight without dual time, with cross-country time and a recorded distance of at least 150 km; the landing away is not checked.
    ref: [easa:SFCL.150(a), easa:SFCL.130(a)(2)(v)(B)]
    affects: [extension_training]
    approved_by: null
    approved_on: null
  - id: extension-credit
    reading: The Part-FCL credit of point (c)(1) holds while the holder has a TMG class rating, not expired by its recorded date, on a PPL(A), CPL(A), ATPL(A) or MPL. A LAPL(A) has no class ratings; its TMG privileges give the credit only under point (c)(2), together with the FCL.140.A recency, which is not checked here, so TMG privileges on a LAPL(A) do not credit the extension and the training is evaluated.
    ref: easa:SFCL.150(c)
    affects: [extension_training]
    approved_by: null
    approved_on: null
