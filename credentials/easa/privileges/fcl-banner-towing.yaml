credential: Banner towing rating (Part-FCL)
id: easa.privilege.fcl-banner-towing
kind: privilege
authority: EASA
held_on: [PPL(A), LAPL(A), CPL(A), ATPL(A), MPL]
selects:
  privilege: { kinds: [BANNER_TOWING], authorities: [EASA, LBA], licence_kinds: [PPL_A, LAPL_A, CPL_A, ATPL_A, MPL] }

evaluations:
  - id: recency
    asks: May the holder tow banners? 5 tows in aeroplanes or TMGs in the last 24 months.
    source: easa:FCL.805(e)
    also_cites: [easa:FCL.805(f)]
    counting: { within_months: 24 }
    passes_if:
      tows: { min: 5, categories: [aeroplane], tow_kinds: [banner], remedy: remedy.privilege_with_instructor, ref: easa:FCL.805(e) }
    outcomes:
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: easa:FCL.805(a) }
      - { id: current, when: all_met, status: current, message: privilege.recency_current, params: { date: valid_until }, ref: easa:FCL.805(e) }
      - { id: lapsed, when: always, status: lapsed, message: privilege.recency_not_met, ref: policy:recency-lapsed }
    on_fail: { what: fly the missing tows with or under the supervision of an instructor, ref: easa:FCL.805(f) }

  - id: licence
    asks: Are the requirements of the aeroplane licence the rating is held on (medical, language) met?
    requires_any: [easa.licence.ppl-a, easa.licence.lapl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-licences-only
    reading: This is the towing rating of a Part-FCL aeroplane licence (PPL(A), LAPL(A), CPL(A), ATPL(A), MPL) of authority EASA or LBA; the same privilege on an SPL or LAPL(S) follows SFCL.205 and is a different credential.
    ref: easa:FCL.805(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: tows-counted
    reading: 'Only banner tows count for the banner towing rating: a flight flagged as a tow flight with the tow kind banner (one tow per flight when the number is not recorded), in an aeroplane or TMG. Sailplane tows, and tows in gyroplanes or ultralights, do not count.'
    ref: easa:FCL.805(e)
    affects: [recency]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: trained-aircraft-not-checked
    reading: The limitation of the privileges to aeroplanes or TMGs as trained, and to the towing method trained, is not checked.
    ref: easa:FCL.805(d)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: recorded-expiry
    reading: FCL.805 sets no validity period; an expiry date recorded on the privilege is honoured, and after it the rating is reported expired (it is no longer held).
    ref: easa:FCL.805(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: resumption-with-instructor
    reading: When the tows are missing, the holder flies them with or under the supervision of an instructor before resuming; the result names the missing tows with that remedy.
    ref: easa:FCL.805(f)
    affects: [recency]
    approved_by: null
    approved_on: null
