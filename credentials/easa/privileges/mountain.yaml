credential: Mountain rating
id: easa.privilege.mountain
kind: privilege
authority: EASA
held_on: [PPL(A), LAPL(A), CPL(A), ATPL(A), MPL]
selects:
  privilege: { kinds: [MOUNTAIN], not_authorities: [FAA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly to and from mountain surfaces? 6 landings on such surfaces, or a mountain proficiency check, in the last 2 years.
    source: easa:FCL.815(d)
    counting: { within_months: 24 }
    passes_if:
      id: mountain
      ref: easa:FCL.815(d)
      any_of:
        - mountain_landings: { min: 6, categories: [aeroplane], ref: easa:FCL.815(d)(1) }
        - proficiency_check: { for_rating: [MOUNTAIN], with: examiner, ref: easa:FCL.815(d)(2) }
    outcomes:
      - { id: current, when: all_met, status: current, message: privilege.recency_current, params: { date: valid_until }, ref: easa:FCL.815(d) }
      - { id: not_logged, when: undetermined, status: unknown, message: privilege.recency_not_logged, ref: policy:unknown-input }
      - { id: lapsed, when: always, status: lapsed, message: privilege.recency_not_met, ref: policy:recency-lapsed }
    description_key: easa_mountain

  - id: licence
    asks: Are the requirements of the aeroplane licence the rating is held on (medical, language) met?
    requires_any: [easa.licence.ppl-a, easa.licence.lapl-a, easa.licence.cpl-a, easa.licence.atpl-a, easa.licence.mpl]

interpretations:
  - id: part-fcl-authorities
    reading: The mountain rating is a MOUNTAIN privilege recorded on a licence of any authority other than FAA or an ultralight association; the licence kind is not checked.
    ref: easa:FCL.815(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: mountain-landings-recorded
    reading: Mountain landings are the landings a flight records on a surface designated to require a mountain rating, on aeroplane and TMG flights; a flight in the period that does not record them is unknown input, so without six recorded mountain landings or a check the result is unknown rather than lapsed.
    ref: easa:FCL.815(d)(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: check-recorded
    reading: The proficiency check counts when recorded as a check for the rating MOUNTAIN (an event, or a flight flagged as a proficiency check with checkRating MOUNTAIN); that it followed point (c) and was signed by the examiner is not checked.
    ref: easa:FCL.815(d)(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: wheels-and-skis-not-distinguished
    reading: The wheel and ski privileges are not distinguished; the record has one MOUNTAIN privilege.
    ref: easa:FCL.815(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: two-years-rolling
    reading: '"During the last 2 years" is the 24 months up to the date evaluated.'
    ref: easa:FCL.815(d)
    affects: [recency]
    approved_by: null
    approved_on: null
