credential: Banner towing rating (SPL)
id: easa.privilege.sfcl-banner-towing
kind: privilege
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  privilege: { kinds: [BANNER_TOWING], licence_kinds: [SPL, LAPL_S], not_authorities: [FAA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder tow? 5 tows in the last 24 months.
    source: easa:SFCL.205(f)
    counting: { within_months: 24 }
    passes_if:
      tows: { min: 5, excluding_classes: [ULTRALIGHT], ref: easa:SFCL.205(f) }
    outcomes: privilege_recency
    description_key: sfcl_205_banner_towing

  - id: licence
    asks: Are the requirements of the SPL and its TMG privileges met?
    requires: [easa.licence.spl, easa.privilege.spl-tmg]

interpretations:
  - id: tows-counted
    reading: A tow is one towed glider on a flight flagged as a tow flight (one per flight when the number is not recorded), in any aircraft except ultralights; the text counts "tows" without saying what was towed, so sailplane and banner tows both count.
    ref: easa:SFCL.205(f)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: sfcl-licences-only
    reading: This is the towing rating of an SPL or LAPL(S); the same privilege recorded on a Part-FCL licence follows FCL.805 and is a different credential.
    ref: easa:SFCL.205(a)
    affects: [recency]
    approved_by: null
    approved_on: null
