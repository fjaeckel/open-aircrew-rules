credential: Sailplane launch method privileges (SPL)
id: easa.privilege.sfcl-launch-methods
kind: privilege
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  privilege: { kinds: [LAUNCH_METHOD_TRAINED], licence_kinds: [SPL, LAPL_S], authorities: [EASA, LBA] }

evaluations:
  - id: trained
    asks: Has the holder completed the specific training for this launch method (entered and signed in the logbook)?
    source: easa:SFCL.155(a)
    also_cites: [easa:SFCL.155(b)]
    outcomes:
      - { id: expired, when: expired, status: expired, message: privilege.expired, params: { date: expiry_date }, ref: easa:SFCL.155(a) }
      - { id: valid, when: always, status: current, message: privilege.valid, params: { date: expiry_date }, ref: easa:SFCL.155(a) }
    description_key: sfcl_155_launch_method

  - id: licence
    asks: Are the requirements of the SPL itself (medical, recency) met?
    requires_all: [easa.licence.spl]

interpretations:
  - id: recorded-training
    reading: A LAUNCH_METHOD_TRAINED privilege, with the launch method in its detail, records that the specific training of SFCL.155(a) was completed and signed as (b) requires; the signature is not checked. The training launches of (a)(1) to (a)(4) are not counted from the logbook, because training before the logbook record began is usually not in it.
    ref: [easa:SFCL.155(a), easa:SFCL.155(b)]
    affects: [trained]
    approved_by: null
    approved_on: null
  - id: no-expiry
    reading: The text sets no expiry for the training; a recorded expiry date is honoured (valid through that date, expired from the next day) as the holder's own entry.
    ref: easa:SFCL.155(a)
    affects: [trained]
    approved_by: null
    approved_on: null
  - id: recency-with-spl
    reading: The recency of each launch method (5 launches in the last two years, 2 for bungee) is evaluated with the SPL (easa.licence.spl, launch_methods evaluations), where a trained method is evaluated even if never logged; this privilege says only that the method was trained.
    ref: easa:SFCL.155(c)
    affects: [trained]
    approved_by: null
    approved_on: null
  - id: sfcl-licences-only
    reading: The privilege is evaluated on an SPL or LAPL(S) of authority EASA or LBA; the same record item on an FAA certificate or an ultralight licence is not a Part-SFCL launch method training.
    ref: easa:SFCL.155(a)
    affects: [trained]
    approved_by: null
    approved_on: null
