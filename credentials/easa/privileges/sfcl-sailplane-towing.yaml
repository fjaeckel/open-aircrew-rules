credential: Sailplane towing rating (SPL)
id: easa.privilege.sfcl-sailplane-towing
kind: privilege
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  privilege: { kinds: [SAILPLANE_TOWING], licence_kinds: [SPL, LAPL_S], not_authorities: [FAA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder tow? 5 sailplane tows in the last 24 months.
    source: easa:SFCL.205(f)
    counting: { within_months: 24 }
    passes_if:
      tows: { min: 5, tow_kinds: [glider], excluding_classes: [ULTRALIGHT], remedy: remedy.privilege_with_instructor, ref: easa:SFCL.205(f) }
    outcomes: privilege_recency
    description_key: sfcl_205_towing

  - id: licence
    asks: Are the requirements of the SPL and its TMG privileges met?
    requires_all: [easa.licence.spl, easa.privilege.spl-tmg]

interpretations:
  - id: tows-counted
    reading: 'Only sailplane tows count for the sailplane towing rating, read as FCL.805(e) is: a towed glider on a flight flagged as a tow flight with the tow kind glider (one tow per flight when the number is not recorded), in any aircraft except ultralights. Tows flown in aeroplanes count as well as those in TMGs (SFCL.205(d) and FCL.805(g) credit the two families against each other). Tows of an ultralight glider (tow kind ul_glider) do not count, since the rating concerns sailplanes; banner tows, and a tow flight without a recorded tow kind, do not count either.'
    ref: [easa:SFCL.205(f), easa:SFCL.205(d)]
    affects: [recency]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: sfcl-licences-only
    reading: This is the towing rating of an SPL or LAPL(S); the same privilege recorded on a Part-FCL licence follows FCL.805 and is a different credential.
    ref: easa:SFCL.205(a)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: resumption-with-instructor
    reading: When the tows are missing, the holder flies them with or under the supervision of an instructor before resuming; the result names the missing tows with that remedy.
    ref: easa:SFCL.205(g)
    affects: [recency]
    approved_by: null
    approved_on: null
