credential: Sailplane cloud flying privileges
id: easa.privilege.cloud-flying
kind: privilege
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  privilege: { kinds: [CLOUD_FLYING], not_authorities: [FAA, DULV, DAEC] }

evaluations:
  - id: recency
    asks: May the holder fly in cloud? 1 hour or 5 flights of cloud flying in sailplanes in the last 24 months, a proficiency check, or a BIR or IR(A).
    source: easa:SFCL.215(e)
    also_cites: [easa:SFCL.215(f), easa:SFCL.215(g)]
    counting: { within_months: 24, classes: [GLIDER], as: [pic, dual] }
    passes_if:
      id: cloud_flying
      ref: easa:SFCL.215(e)
      any_of:
        - cloud_flying_time: { min_hours: 1, remedy: remedy.privilege_with_instructor, ref: easa:SFCL.215(e) }
        - cloud_flights: { min: 5, remedy: remedy.privilege_with_instructor, ref: easa:SFCL.215(e) }
    restored_by:
      - { proficiency_check: { classes: [GLIDER], for_rating: [CLOUD_FLYING] }, ref: easa:SFCL.215(f)(1) }
    outcomes:
      preset: privilege_recency
      special:
        - id: ir_credit
          when:
            any:
              - { holds: { classes: [IR], licenceKinds: [PPL_A, LAPL_A, CPL_A, ATPL_A, MPL, IR], valid: true } }
              - { holds: { privileges: [BIR], valid: true } }
          status: current
          message: privilege.recency_credited
          params: { date: expiry_date }
          ref: easa:SFCL.215(g)
    description_key: sfcl_215_cloud_flying

  - id: licence
    asks: Are the requirements of the SPL itself met?
    requires: [easa.licence.spl]

interpretations:
  - id: ifr-time-is-cloud-time
    reading: Cloud flying time is the IFR time of a GLIDER flight, and a cloud flight is a GLIDER flight with IFR time.
    ref: easa:SFCL.215(e)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: dual-counts
    reading: Flights with PIC or dual time count; dual flights with an FI(S) are the way to make up a shortfall, and counting them before a lapse changes nothing a pilot could use.
    ref: easa:SFCL.215(f)(2)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: check-restores
    reading: A proficiency check restores the privileges when it is recorded as a check in a GLIDER for the rating CLOUD_FLYING (the sailplane recency check does not), and counts for 24 months like the flights.
    ref: easa:SFCL.215(f)(1)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: bir-ir-credit
    reading: The BIR or IR(A) credit holds while the holder has a BIR privilege or an IR rating on an aeroplane licence, not expired by its recorded date; an FAA or helicopter IR does not count, and an IR recorded on its own IR licence is taken as an IR(A).
    ref: easa:SFCL.215(g)
    affects: [recency]
    approved_by: null
    approved_on: null
