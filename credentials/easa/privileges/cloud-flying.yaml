credential: Sailplane cloud flying privileges
id: easa.privilege.cloud-flying
kind: privilege
authority: EASA
held_on: [SPL, LAPL(S)]
selects:
  privilege: { kinds: [CLOUD_FLYING], licence_kinds: [SPL, LAPL_S], authorities: [EASA, LBA] }

evaluations:
  - id: recency
    asks: May the holder fly in cloud? 1 hour or 5 flights of cloud flying in sailplanes in the last 24 months, a proficiency check, or a BIR or IR(A).
    source: easa:SFCL.215(e)
    also_cites: [easa:SFCL.215(f), easa:SFCL.215(g)]
    counting: { within_months: 24, classes: [GLIDER] }
    passes_if:
      id: cloud_flying
      ref: easa:SFCL.215(e)
      any_of:
        - id: as_pic
          ref: easa:SFCL.215(e)
          as: [pic]
          any_of:
            - cloud_flying_time: { min_hours: 1, remedy: remedy.privilege_with_instructor, ref: easa:SFCL.215(e) }
            - cloud_flights: { min: 5, remedy: remedy.privilege_with_instructor, ref: easa:SFCL.215(e) }
        - id: make_up_with_instructor
          ref: easa:SFCL.215(f)(2)
          all_of:
            - cloud_flights: { id: make_up_dual_flight, as: [dual], min: 1, ref: easa:SFCL.215(f)(2) }
            - id: make_up
              ref: easa:SFCL.215(f)(2)
              as: [pic, dual]
              any_of:
                - cloud_flying_time: { id: make_up_time, min_hours: 1, ref: easa:SFCL.215(f)(2) }
                - cloud_flights: { id: make_up_flights, min: 5, ref: easa:SFCL.215(f)(2) }
    restored_by:
      - { proficiency_check: { classes: [GLIDER], for_rating: [CLOUD_FLYING] }, ref: easa:SFCL.215(f)(1) }
    outcomes:
      preset: privilege_recency
      special:
        - id: ir_credit
          when:
            any:
              - { holds: { classes: [IR], licenceKinds: [PPL_A, LAPL_A, CPL_A, ATPL_A, MPL, IR], valid: true } }
              - { holds: { privileges: [BIR], valid: true } }
          status: current
          message: privilege.recency_credited
          params: { date: expiry_date }
          ref: easa:SFCL.215(g)
    description_key: sfcl_215_cloud_flying

  - id: licence
    asks: Are the requirements of the SPL itself met?
    requires_all: [easa.licence.spl]

interpretations:
  - id: ifr-time-is-cloud-time
    reading: Cloud flying time is the IFR time of a GLIDER flight, and a cloud flight is a GLIDER flight with IFR time.
    ref: easa:SFCL.215(e)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: dual-counts
    reading: 'Point (e) counts only cloud flying as PIC: 1 hour or 5 flights with PIC time. Dual cloud flights count only as the make-up of (f)(2): with at least one dual cloud flight in the 24 months, the PIC and dual cloud flying together must reach the 1 hour or 5 flights. That the dual flights came after the shortfall and were flown with an FI(S) is not checked.'
    ref: [easa:SFCL.215(e), easa:SFCL.215(f)(2)]
    affects: [recency]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: check-restores
    reading: Only a proficiency check recorded in a GLIDER for the rating CLOUD_FLYING restores the privileges; a general sailplane proficiency check does not stand in for it. The check counts for 24 months, like the flights of (e).
    ref: easa:SFCL.215(f)(1)
    affects: [recency]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: bir-ir-credit
    reading: The BIR or IR(A) credit holds while the holder has a BIR privilege or an IR rating on an aeroplane licence, not expired by its recorded date; an FAA or helicopter IR does not count, and an IR recorded on its own IR licence is taken as an IR(A).
    ref: easa:SFCL.215(g)
    affects: [recency]
    approved_by: null
    approved_on: null
