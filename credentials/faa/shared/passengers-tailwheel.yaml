shared: Carrying passengers in a tailwheel airplane (61.57(a)(1)(ii))
id: faa.shared.passengers-tailwheel
authority: FAA
params: {}
evaluation:
  about: passengers
  asks: For a tailwheel airplane, has the holder made the 3 takeoffs and landings to a full stop in a tailwheel airplane in the last 90 days?
  source: faa:61.57(a)(1)(ii)
  only_for: { not_licence_kinds: [FAA_STUDENT] }
  relevant_class: { class_group: faa, ref: [faa:61.57(a)(1)(ii), faa:61.5(b)(2)] }
  counting: { within_days: 90 }
  passes_if:
    ref: faa:61.57(a)(1)(ii)
    all_of:
      - full_stop_landings: { id: tailwheel_full_stop, name: requirement.tailwheel_full_stop_landings, min: 3, in_class: true, tailwheel: true, as: sole_manipulator, ref: faa:61.57(a)(1)(ii) }
      - flights: { id: tailwheel_flown, name: requirement.tailwheel_flights, informational: true, ever: true, in_class: true, tailwheel: true, remedy: none, ref: policy:informational-row }
  outcomes:
    preset: passengers
    special:
      - { id: no_tailwheel, when: { unmet: tailwheel_flown }, status: not_applicable, message: pax.tailwheel_not_applicable, ref: faa:61.57(a)(1)(ii) }
    messages: { current: pax.tailwheel_current, not_met: pax.tailwheel_not_current }
    statuses: { not_met: { status: lapsed, ref: policy:recency-lapsed } }
  description_key: faa_pax_day_night

interpretations:
  - id: tailwheel-from-logbook
    reading: The condition applies only "if the aircraft to be flown is an airplane with a tailwheel", and the logbook is the only evidence of that; a class in which the holder never logged a tailwheel flight is not_applicable, and flights that do not record whether the airplane has a tailwheel make it unknown.
    ref: faa:61.57(a)(1)(ii)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: full-stops-stand-for-both
    reading: The full-stop landing count stands for the takeoffs and landings to a full stop (every landing follows a takeoff); flights without a full-stop count are unknown input.
    ref: faa:61.57(a)(1)(ii)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: faa-class
    reading: As for the day passenger recency (faa.shared.passengers-day, class-or-type), the full-stop landings count in the FAA class of the rating, piston and turbine single-engine airplanes together and land and sea apart.
    ref: [faa:61.57(a)(1)(ii), faa:61.5(b)(2)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
