shared: Carrying passengers in a glider, 90-day recency (61.57(a))
id: faa.shared.passengers-glider
authority: FAA
params: {}
evaluation:
  about: passengers
  asks: Has the holder made 3 launches and 3 landings as sole manipulator of the controls of a glider in the last 90 days?
  source: faa:61.57(a)(1)
  only_for: { not_licence_kinds: [FAA_STUDENT], classes: [GLIDER] }
  counting: { within_days: 90, in_class: true, as: sole_manipulator }
  passes_if:
    ref: faa:61.57(a)(1)
    all_of:
      - launches: { min: 3, ref: faa:61.57(a)(1) }
      - landings: { min: 3, ref: faa:61.57(a)(1) }
  outcomes: { preset: passengers, statuses: { not_met: { status: lapsed, ref: policy:recency-lapsed } } }
  description_key: faa_glider

interpretations:
  - id: launch-is-takeoff
    reading: A glider's takeoff is its launch, so the three takeoffs are three launches of any method (winch, aerotow, self-launch, car, bungee); landings alone do not suffice.
    ref: faa:61.57(a)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: sole-manipulator-recorded
    reading: Only launches and landings on flights recorded as sole manipulator count; PIC time does not show it, and a flight that does not record it is unknown input, so the result is unknown rather than lapsed.
    ref: faa:61.57(a)(1)(i)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: no-type-no-simulator
    reading: Gliders need no type rating, so launches and landings count in the glider category as a whole; simulator sessions do not count, because the approved part 142 course cannot be shown from the record.
    ref: [faa:61.57(a)(1)(ii), faa:61.57(a)(3)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: night-not-evaluated
    reading: Night passenger recency in a glider is not evaluated, because the record does not distinguish launches and full-stop landings in the period from 1 hour after sunset to 1 hour before sunrise for gliders.
    ref: faa:61.57(b)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: students-and-exceptions
    reading: Student certificates are not evaluated (a student pilot may not carry passengers), and the exceptions of paragraph (e) are not applied.
    ref: [faa:61.89(a)(1), faa:61.57(e)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
