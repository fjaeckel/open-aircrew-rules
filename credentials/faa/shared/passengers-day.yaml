shared: Carrying passengers, 90-day recency (61.57(a))
id: faa.shared.passengers-day
authority: FAA
params:
  type_rated: false for class ratings (takeoffs and landings in the class), true for type ratings (in the same type).
evaluation:
  about: passengers
  asks: Has the holder made 3 takeoffs and 3 landings as sole manipulator in the same category, class (and type) in the last 90 days?
  source: faa:61.57(a)(1)
  only_for: { not_licence_kinds: [FAA_STUDENT], type_rated: $type_rated }
  counting: { within_days: 90 }
  passes_if:
    ref: faa:61.57(a)(1)
    all_of:
      - takeoffs_and_landings: { min: 3, in_class: true, in_type: $type_rated, as: sole_manipulator, ref: faa:61.57(a)(1)(i) }
  outcomes: { preset: passengers, statuses: { not_met: lapsed } }
  description_key: faa_pax_day_night

interpretations:
  - id: class-or-type
    reading: A class rating counts takeoffs and landings in its class; a rating with a type designator is a type rating and counts them in aircraft of that type only (a flight in the class without a type designator is unknown input).
    ref: faa:61.57(a)(1)(ii)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: sole-manipulator-recorded
    reading: Only flights recorded as sole manipulator count; a flight that does not record it is unknown input, never counted, so the result is unknown rather than lapsed.
    ref: faa:61.57(a)(1)(i)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: no-simulator-credit
    reading: Simulator sessions do not count, because the approved part 142 course the text requires cannot be shown from the record.
    ref: faa:61.57(a)(3)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: exceptions-not-modelled
    reading: The exceptions of paragraph (e) are not applied, and aircraft certificated for more than one pilot without passengers are not a separate case.
    ref: faa:61.57(e)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: students-excluded
    reading: A student pilot may not carry passengers at all, so student certificates are not evaluated.
    ref: faa:61.89(a)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
