shared: First- and second-class medical duration for commercial privileges (61.23(d))
id: faa.shared.medical-duration-commercial
authority: FAA
params: {}
evaluation:
  asks: Until when does the certificate support commercial privileges (12 calendar months)?
  source: faa:61.23(d)
  also_cites: [faa:61.23(a)(2)]
  only_for:
    when_holding: { licenceKinds: [FAA_COMMERCIAL, FAA_ATP] }
    ref: faa:61.23(a)(2)(ii)
  valid_for:
    counted_from: issue
    periods:
      - { months: 12, end_of_month: true, ref: faa:61.23(d) }
  outcomes:
    preset: validity
    expiring_notice: { days: 30, ref: policy:expiring-notice }
  description_key: faa_medical_commercial

interpretations:
  - id: commercial-glider-balloon
    reading: Commercial privileges in a glider need no medical, and in a balloon only when giving flight training under 61.133(a)(2)(ii); other commercial balloon privileges for compensation or hire need at least a second-class certificate. A certificate holding only glider or balloon privileges still gets this evaluation, because the record does not say which privileges are exercised. The issue date is the examination date.
    ref: [faa:61.23(a)(2)(ii), faa:61.23(a)(2)(iii), faa:61.23(b)(3), faa:61.23(b)(5)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
