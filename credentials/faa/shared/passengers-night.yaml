shared: Carrying passengers at night, 90-day recency (61.57(b))
id: faa.shared.passengers-night
authority: FAA
params:
  type_rated: false for class ratings, true for type ratings (in the same type).
evaluation:
  about: passengers
  asks: Has the holder made 3 takeoffs and 3 full-stop landings at night as sole manipulator in the same category, class (and type) in the last 90 days?
  source: faa:61.57(b)(1)
  also_cites: [faa:61.329, faa:61.101(e)(6)]
  only_for: { not_licence_kinds: [FAA_STUDENT], type_rated: $type_rated }
  relevant_class: { class_group: faa, ref: [faa:61.57(b)(1)(ii), faa:61.5(b)(2)] }
  counting: { within_days: 90, in_class: true, in_type: $type_rated, as: sole_manipulator }
  passes_if:
    ref: faa:61.57(b)(1)
    all_of:
      - night_period_takeoffs: { min: 3, ref: faa:61.57(b)(1) }
      - full_stop_night_landings: { min: 3, ref: faa:61.57(b)(1) }
  outcomes:
    preset: passengers
    special:
      - { id: recreational_no_night, when: { holds: { licenceKinds: [FAA_RECREATIONAL], sameLicence: true } }, status: not_applicable, message: pax.night_no_privilege, ref: faa:61.101(e)(6) }
      - id: sport_no_night
        when:
          all:
            - { holds: { licenceKinds: [FAA_SPORT], sameLicence: true } }
            - { not: { holds: { privileges: [SPORT_NIGHT], sameLicence: true, valid: true } } }
        status: not_applicable
        message: pax.night_no_privilege
        ref: faa:61.329
    messages: { current: pax.night_current, not_met: pax.night_not_current }
    statuses: { not_met: { status: lapsed, ref: policy:recency-lapsed } }
  description_key: faa_pax_day_night

interpretations:
  - id: logged-night-takeoffs
    reading: The three takeoffs and the three full-stop landings must both fall in the period from 1 hour after sunset to 1 hour before sunrise, which starts later than the logbook's night (end of evening civil twilight). Takeoffs count as recorded for that period (nightPeriodTakeoffs); a flight with night takeoffs that does not record how many were in the period is unknown input, never counted, so the result is unknown until it is recorded. A flight without night takeoffs adds none. Full-stop night landings are counted the same way.
    ref: [faa:61.57(b)(1), faa:1.1]
    affects: [evaluation]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: class-or-type
    reading: As by day, takeoffs and landings count in the FAA class of the rating (piston and turbine single-engine together, land and sea apart), one result per FAA class; a type rating counts only its type.
    ref: [faa:61.57(b)(1)(ii), faa:61.5(b)(2)]
    affects: [evaluation]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: no-simulator-credit
    reading: Full flight simulator sessions do not count, because the approved part 142 course cannot be shown from the record.
    ref: faa:61.57(b)(2)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: night-limitation-not-recorded
    reading: A private pilot certificate carrying "night flying prohibited" is not recognised, because the record has no such limitation; recreational pilots, and sport pilots without the night endorsement, get not_applicable.
    ref: [faa:61.110, faa:61.101(e)(6), faa:61.329]
    affects: [evaluation]
    approved_by: null
    approved_on: null
