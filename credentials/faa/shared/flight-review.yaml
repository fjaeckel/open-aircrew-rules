shared: Flight review (61.56)
id: faa.shared.flight-review
authority: FAA
params: {}
evaluation:
  about: pilot
  asks: Has the pilot completed a flight review (or a proficiency check, practical test or proficiency program phase instead) in the last 24 calendar months?
  source: faa:61.56(c)
  also_cites: [faa:61.56(d), faa:61.56(e), faa:61.56(g)]
  scope: { authorities: [FAA], ref: faa:61.56(c) }
  counting: { within_calendar_months: 24 }
  passes_if:
    ref: faa:61.56(c)
    all_of:
      - id: review
        ref: faa:61.56(c)
        any_of:
          - flight_review: { simulator: include, ref: faa:61.56(c)(1) }
          - proficiency_check: { also: [practical_test], simulator: include, remedy: none, ref: faa:61.56(d) }
          - proficiency_program_phase: { simulator: include, ref: faa:61.56(e) }
      - flight_review: { id: last_review, also: [proficiency_check, practical_test, proficiency_program_phase], unit: events, informational: true, ever: true, simulator: include, remedy: none, ref: policy:informational-row }
  outcomes:
    - { id: student, when: { holds: { licenceKinds: [FAA_STUDENT], sameLicence: true } }, status: not_applicable, message: flight_review.not_applicable, ref: faa:61.56(g) }
    - { id: expiring, when: { all: [all_met, { valid_until_within: { days: 90 } }] }, status: expiring, message: flight_review.expiring, params: { days: days_to_valid_until, date: valid_until }, ref: policy:expiring-notice }
    - { id: reviewed, when: { met: flight_review }, status: current, message: flight_review.current, params: { date: { last_date: flight_review } }, ref: faa:61.56(c)(1) }
    - { id: check_substitute, when: { met: proficiency_check }, status: current, message: flight_review.substituted, params: { date: { last_date: proficiency_check } }, ref: faa:61.56(d) }
    - { id: program_substitute, when: all_met, status: current, message: flight_review.substituted, params: { date: { last_date: proficiency_program } }, ref: faa:61.56(e) }
    - { id: expired, when: { met: last_review }, status: expired, message: flight_review.expired, params: { date: { last_date: last_review } }, ref: faa:61.56(c) }
    - { id: none_on_record, when: always, status: expired, message: flight_review.none_on_record, ref: faa:61.56(c) }
  description_key: faa_flight_review

interpretations:
  - id: once-per-pilot
    reading: The flight review is one requirement per pilot, evaluated once on the first FAA certificate in the record, whichever certificate files list it.
    ref: faa:61.56(c)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: who-and-endorsement-not-checked
    reading: Who gave the review or check (authorized instructor, examiner, check airman) and whether the logbook was endorsed are taken as met when the event is recorded.
    ref: [faa:61.56(c)(1), faa:61.56(c)(2), faa:61.56(d)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: ipc-is-no-substitute
    reading: An instrument proficiency check is not a substitute, because it may be given by an authorized instructor and point (d)(1) requires an examiner, check airman or the Armed Forces.
    ref: faa:61.56(d)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: glider-flights-part-of-review
    reading: The three instructional glider flights of point (b) are part of a review, not a substitute for it, and do not count on their own.
    ref: faa:61.56(b)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: student-exemption
    reading: The student exemption assumes a current solo endorsement; student certificates get not_applicable.
    ref: faa:61.56(g)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: simulator-counts
    reading: A review, check or program phase recorded on a simulator or training device counts; the part 142 course conditions are taken as met.
    ref: faa:61.56(i)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: instructor-relief-not-modelled
    reading: The ground-training relief for flight instructors does not change the date and is not modelled.
    ref: faa:61.56(f)
    affects: [evaluation]
    approved_by: null
    approved_on: null
