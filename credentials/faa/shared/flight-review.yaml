shared: Flight review (61.56)
id: faa.shared.flight-review
authority: FAA
params: {}
evaluation:
  about: pilot
  asks: Has the pilot completed a flight review (or a proficiency check, practical test or proficiency program phase instead) in the last 24 calendar months?
  source: faa:61.56(c)
  also_cites: [faa:61.56(d), faa:61.56(e), faa:61.56(g)]
  scope: { authorities: [FAA], ref: faa:61.56(c) }
  counting: { within_calendar_months: 24 }
  passes_if:
    ref: faa:61.56(c)
    all_of:
      - id: review
        ref: faa:61.56(c)
        any_of:
          - flight_review: { by_authority: [FAA], ref: [faa:61.56(c)(1), faa:61.56(i)] }
          - proficiency_check: { also: [practical_test], by_authority: [FAA], simulator: include, remedy: none, ref: [faa:61.56(d), faa:61.1(b)] }
          - proficiency_program_phase: { simulator: include, ref: faa:61.56(e) }
      - flight_review: { id: last_review, also: [proficiency_check, practical_test, proficiency_program_phase], by_authority: [FAA], unit: events, informational: true, ever: true, simulator: include, remedy: none, ref: policy:informational-row }
  outcomes:
    - id: student
      when:
        all:
          - { holds: { licenceKinds: [FAA_STUDENT], sameLicence: true } }
          - { not: { holds: { licenceKinds: [FAA_SPORT, FAA_RECREATIONAL, FAA_PRIVATE, FAA_COMMERCIAL, FAA_ATP, FAA_GLIDER], authorities: [FAA] } } }
      status: not_applicable
      message: flight_review.not_applicable
      ref: faa:61.56(g)
    - { id: expiring, when: { all: [all_met, { valid_until_within: { days: 90 } }] }, status: expiring, message: flight_review.expiring, params: { days: days_to_valid_until, date: valid_until }, ref: policy:expiring-notice }
    - { id: reviewed, when: { met: flight_review }, status: current, message: flight_review.current, params: { date: { last_date: flight_review } }, ref: faa:61.56(c)(1) }
    - { id: check_substitute, when: { met: proficiency_check }, status: current, message: flight_review.substituted, params: { date: { last_date: proficiency_check } }, ref: faa:61.56(d) }
    - { id: program_substitute, when: all_met, status: current, message: flight_review.substituted, params: { date: { last_date: proficiency_program } }, ref: faa:61.56(e) }
    - { id: authority_not_recorded, when: undetermined, status: unknown, message: flight_review.authority_not_recorded, ref: policy:unknown-input }
    - { id: expired, when: { met: last_review }, status: expired, message: flight_review.expired, params: { date: { last_date: last_review } }, ref: faa:61.56(c) }
    - { id: none_on_record, when: always, status: expired, message: flight_review.none_on_record, ref: faa:61.56(c) }
  description_key: faa_flight_review

interpretations:
  - id: once-per-pilot
    reading: The flight review is one requirement per pilot, evaluated once on the first FAA certificate in the record, whichever certificate files list it.
    ref: faa:61.56(c)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: who-and-endorsement-not-checked
    reading: Only a review, check or practical test recorded under the FAA counts. A flight review counts when it was given under the FAA, that is by an instructor authorized under part 61; a proficiency check or practical test counts when it was for an FAA pilot certificate, rating or operating privilege, given by an FAA examiner, an approved check airman or the U.S. Armed Forces, all recorded with authority FAA. A check for another authority's licence (an EASA proficiency check) does not count, however similar. A review or check recorded without an authority is unknown until the authority is recorded. Whether the logbook was endorsed is not checked.
    ref: [faa:61.56(c)(1), faa:61.56(c)(2), faa:61.56(d)(1), faa:61.1(b)]
    affects: [evaluation]
    principle: P2
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: ipc-is-no-substitute
    reading: An instrument proficiency check is not a substitute, because it may be given by an authorized instructor and point (d)(1) requires an examiner, check airman or the Armed Forces.
    ref: faa:61.56(d)(1)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: glider-flights-part-of-review
    reading: The three instructional glider flights of point (b) are part of a review, not a substitute for it, and do not count on their own.
    ref: faa:61.56(b)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: student-exemption
    reading: The student exemption assumes a current solo endorsement; it applies only while the pilot holds no other FAA pilot certificate (sport, recreational, private, commercial, airline transport or glider), so that a student certificate listed first in the record does not exempt the privileges of another certificate; only FAA certificates end the exemption, a foreign licence recorded with the same type word does not. A pilot holding a student certificate only gets not_applicable.
    ref: faa:61.56(g)
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: simulator-counts
    reading: A flight review recorded in a flight simulator or training device does not count, because the record cannot show the approved part 142 course, the device representing an aircraft the pilot is rated for, or the takeoffs and landings the text also asks for. Proficiency checks, practical tests and program phases in a device still count, because their own rules allow devices.
    ref: [faa:61.56(i)(1), faa:61.56(i)(2), faa:61.56(i)(3)]
    affects: [evaluation]
    principle: P4
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: instructor-relief-not-modelled
    reading: The ground-training relief for flight instructors does not change the date and is not modelled.
    ref: faa:61.56(f)
    affects: [evaluation]
    approved_by: null
    approved_on: null
