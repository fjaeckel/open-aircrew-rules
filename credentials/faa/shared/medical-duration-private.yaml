shared: Medical certificate duration for private, recreational, student, sport and instructor privileges (61.23(d))
id: faa.shared.medical-duration-private
authority: FAA
params: {}
evaluation:
  asks: Until when does the certificate support private, recreational, student, sport and flight instructor privileges (60 calendar months under 40, 24 from 40)?
  source: faa:61.23(d)
  only_for:
    when_holding: { licenceKinds: [FAA_STUDENT, FAA_SPORT, FAA_RECREATIONAL, FAA_PRIVATE, FAA_COMMERCIAL, FAA_ATP] }
    ref: faa:61.23(a)(3)(i)
  valid_for:
    counted_from: issue
    periods:
      - { age_under: 40, months: 60, end_of_month: true, ref: faa:61.23(d) }
      - { age_from: 40, months: 24, end_of_month: true, ref: faa:61.23(d) }
  outcomes:
    preset: validity
    date_of_birth: required
    expiring_notice: { days: 30, ref: policy:expiring-notice }
  description_key: faa_medical_private

interpretations:
  - id: no-medical-operations-not-distinguished
    reading: Operations that need no medical (gliders, balloons, instructing without acting as pilot in command) and operations under BasicMed or a driver's license are not distinguished; the duration is reported for every holder of an FAA pilot certificate.
    ref: [faa:61.23(b), faa:61.23(c)]
    affects: [evaluation]
    approved_by: null
    approved_on: null
  - id: examination-date
    reading: The issue date is the examination date and the age is taken on that date; the effective expiry is the earlier of the derived and a recorded expiry date, valid through its last day.
    ref: faa:61.23(d)
    affects: [evaluation]
    approved_by: null
    approved_on: null
