credential: Private pilot certificate, rotorcraft category
id: faa.licence.private-rotorcraft
kind: licence
authority: FAA
held_on: []
selects:
  ratings: { classes: [HELICOPTER, GYROPLANE], licence_kinds: [FAA_PRIVATE, FAA_GLIDER], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each rotorcraft class held (helicopter, gyroplane)?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each rotorcraft type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in each rotorcraft class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each rotorcraft type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate (or BasicMed) that supports private privileges?
    requires_any: [faa.medical.first-class, faa.medical.second-class, faa.medical.third-class, faa.medical.basicmed]

interpretations:
  - id: rating-items
    reading: The private pilot certificate itself is the airplane-category credential's item (faa.licence.private-airplane); this file answers for each rotorcraft class rating on it, whose composite is its own evaluations and the medical. The flight review is one per pilot and decides the certificate's composite, not the rating's.
    ref: faa:61.56(c)
    affects: [flight_review, medical]
    approved_by: null
    approved_on: null
  - id: tailwheel-airplanes-only
    reading: The tailwheel condition applies to airplanes only; rotorcraft (a gyroplane with a tailwheel included) are not evaluated for it.
    ref: faa:61.57(a)(1)(ii)
    affects: [passengers_day]
    approved_by: null
    approved_on: null
  - id: glider-certificate-powered-ratings
    reading: A rotorcraft class rating recorded on a certificate whose type reads only as a glider pilot certificate is evaluated as a private pilot rating; the grade of the certificate is not recorded, passenger recency (61.57) is the same for every grade, and a commercial or airline transport grade would be recorded as such.
    ref: [faa:61.57(a)(1), faa:61.23(a)(3)(i)]
    affects: [passengers_day, passengers_day_type, passengers_night, passengers_night_type]
    approved_by: null
    approved_on: null
