credential: Private pilot certificate, airplane category
id: faa.licence.private-airplane
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_PRIVATE], authorities: [FAA] }
  ratings: { classes: [SEP_LAND, SEP_SEA, MEP_LAND, MEP_SEA, SET_LAND, SET_SEA], licence_kinds: [FAA_PRIVATE, FAA_GLIDER], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each airplane class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each airplane type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_tailwheel
    asks: May the holder carry passengers in a tailwheel airplane?
    uses: faa.shared.passengers-tailwheel

  - id: passengers_night
    asks: May the holder carry passengers at night in each airplane class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each airplane type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate (or BasicMed) that supports private privileges?
    requires_any: [faa.medical.first-class, faa.medical.second-class, faa.medical.third-class, faa.medical.basicmed]

interpretations:
  - id: glider-certificate-powered-ratings
    reading: An airplane class rating recorded on a certificate whose type reads only as a glider pilot certificate is evaluated as a private pilot rating; the grade of the certificate is not recorded, passenger recency (61.57) is the same for every grade, and a commercial or airline transport grade would be recorded as such.
    ref: [faa:61.57(a)(1), faa:61.23(a)(3)(i)]
    affects: [passengers_day, passengers_day_type, passengers_tailwheel, passengers_night, passengers_night_type]
    approved_by: null
    approved_on: null
