credential: Airline transport pilot certificate, rotorcraft category
id: faa.licence.atp-rotorcraft
kind: licence
authority: FAA
held_on: []
selects:
  ratings: { classes: [HELICOPTER, GYROPLANE], licence_kinds: [FAA_ATP], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each rotorcraft class held (helicopter, gyroplane)?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each rotorcraft type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in each rotorcraft class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each rotorcraft type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate (or BasicMed) that supports at least private privileges?
    requires_any: [faa.medical.first-class@private, faa.medical.second-class@private, faa.medical.third-class, faa.medical.basicmed]

  - id: medical_commercial
    asks: Does the pilot hold a first- or second-class medical certificate that supports commercial privileges?
    requires_any: [faa.medical.first-class@commercial, faa.medical.second-class@commercial]
    limits: commercial_privileges

  - id: medical_atp
    asks: Does the pilot hold a first-class medical certificate that supports airline transport pilot privileges?
    requires_any: [faa.medical.first-class@atp]
    limits: airline_transport_privileges

interpretations:
  - id: rating-items
    reading: The airline transport pilot certificate itself is the airplane-category credential's item (faa.licence.atp-airplane); this file answers for each rotorcraft class rating on it, whose composite is its own evaluations and the medical. The flight review is one per pilot and decides the certificate's composite, not the rating's. A gyroplane rating on the certificate carries commercial or private privileges only and is evaluated here the same way.
    ref: faa:61.56(c)
    affects: [flight_review, medical]
    approved_by: null
    approved_on: null
  - id: atp-privileges-medical
    reading: The certificate may be used for private privileges with any medical certificate that still supports them, or under BasicMed; that decides the composite. The commercial privileges (a first- or second-class certificate within its commercial duration) and the airline transport pilot-in-command privileges (a first-class certificate within its ATP duration) are reported as limitations of scope commercial_privileges and airline_transport_privileges, so a certificate past its ATP or commercial duration, or of a lower class, no longer makes the whole certificate read expired or unknown.
    ref: [faa:61.23(a)(1)(i), faa:61.23(a)(2)(ii), faa:61.23(a)(3)(i), faa:61.23(d)]
    affects: [medical, medical_commercial, medical_atp]
    approved_by: null
    approved_on: null
