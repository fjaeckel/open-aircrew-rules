credential: Airline transport pilot certificate, rotorcraft category
id: faa.licence.atp-rotorcraft
kind: licence
authority: FAA
held_on: []
selects:
  ratings: { classes: [HELICOPTER, GYROPLANE], licence_kinds: [FAA_ATP], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each rotorcraft class held (helicopter, gyroplane)?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each rotorcraft type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in each rotorcraft class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each rotorcraft type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a first-class medical certificate that supports airline transport pilot privileges?
    requires_any: [faa.medical.first-class]

interpretations:
  - id: rating-items
    reading: The airline transport pilot certificate itself is the airplane-category credential's item (faa.licence.atp-airplane); this file answers for each rotorcraft class rating on it, whose composite is its own evaluations and the medical. The flight review is one per pilot and decides the certificate's composite, not the rating's. A gyroplane rating on the certificate carries commercial or private privileges only and is evaluated here the same way.
    ref: faa:61.56(c)
    affects: [flight_review, medical]
    approved_by: null
    approved_on: null
  - id: atp-privileges-medical
    reading: The rating is composed for its pilot-in-command privileges as an airline transport pilot, which need a first-class medical certificate; a holder exercising only commercial or private privileges on a lower class or under BasicMed is not distinguished and reads as unknown.
    ref: [faa:61.23(a)(1)(i), faa:61.23(a)(2)(ii)]
    affects: [medical]
    approved_by: null
    approved_on: null
