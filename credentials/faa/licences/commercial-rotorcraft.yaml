credential: Commercial pilot certificate, rotorcraft category
id: faa.licence.commercial-rotorcraft
kind: licence
authority: FAA
held_on: []
selects:
  ratings: { classes: [HELICOPTER, GYROPLANE], licence_kinds: [FAA_COMMERCIAL], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each rotorcraft class held (helicopter, gyroplane)?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each rotorcraft type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in each rotorcraft class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each rotorcraft type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate that supports commercial privileges (first or second class)?
    requires_any: [faa.medical.first-class, faa.medical.second-class]

interpretations:
  - id: rating-items
    reading: The commercial pilot certificate itself is the airplane-category credential's item (faa.licence.commercial-airplane); this file answers for each rotorcraft class rating on it, whose composite is its own evaluations and the medical. The flight review is one per pilot and decides the certificate's composite, not the rating's.
    ref: faa:61.56(c)
    affects: [flight_review, medical]
    approved_by: null
    approved_on: null
  - id: commercial-privileges-medical
    reading: The rating is composed for commercial privileges, which need at least a second-class medical certificate; exercising only private privileges on a third-class certificate or under BasicMed is not distinguished and reads as unknown.
    ref: [faa:61.23(a)(2)(ii), faa:61.23(a)(3)(i)]
    affects: [medical]
    approved_by: null
    approved_on: null
