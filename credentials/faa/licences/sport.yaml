credential: Sport pilot certificate
id: faa.licence.sport
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_SPORT], authorities: [FAA] }
  ratings: { classes: [SEP_LAND, SEP_SEA, GLIDER, GYROPLANE, HELICOPTER, AIRSHIP, BALLOON, OTHER], licence_kinds: [FAA_SPORT], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry a passenger in each powered category and class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER], type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry a passenger in each type recorded on a sport pilot rating?
    uses: faa.shared.passengers-day
    with: { type_rated: true }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER], type_rated: true }

  - id: passengers_glider
    asks: May the holder carry a passenger in a glider?
    uses: faa.shared.passengers-glider

  - id: passengers_tailwheel
    asks: May the holder carry a passenger in a tailwheel airplane?
    uses: faa.shared.passengers-tailwheel
    only_for: { not_licence_kinds: [FAA_STUDENT], classes: [SEP_LAND, SEP_SEA] }

  - id: passengers_night
    asks: With the night endorsement of 61.329, may the holder carry a passenger at night in each powered category and class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER], type_rated: false }
    effective_from: 2025-10-22

  - id: passengers_night_type
    asks: With the night endorsement of 61.329, may the holder carry a passenger at night in each type recorded on a sport pilot rating?
    uses: faa.shared.passengers-night
    with: { type_rated: true }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER], type_rated: true }
    effective_from: 2025-10-22

  - id: no_night_privileges
    asks: Before 22 October 2025 a sport pilot could not act as pilot in command at night, so night passenger recency did not apply.
    about: passengers
    source: faa:61.315(c)(5)
    also_cites: [faa:61.329]
    effective_to: 2025-10-21
    outcomes:
      - { id: no_night_privilege, when: always, status: not_applicable, message: pax.night_no_privilege, ref: faa:61.315(c)(5) }
    description_key: faa_pax_day_night

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

interpretations:
  - id: night-regime-change
    reading: Sport pilot night privileges exist from 22 October 2025, the date the amendment adding 61.329 took effect (Amdt. 61-159); before it night passenger recency is not_applicable, from it the night rules apply to a sport pilot holding the night endorsement (privilege SPORT_NIGHT on the same certificate) and are not_applicable without it. The stored text is the amended one; the earlier wording of 61.315(c)(5), which prohibited night flight without exception, is cited by its paragraph.
    ref: [faa:61.329, faa:61.315(c)(5)]
    affects: [passengers_night, passengers_night_type, no_night_privileges]
    approved_by: null
    approved_on: null
  - id: sport-classes
    reading: A sport pilot certificate's category and class privileges (airplane, glider, gyroplane, helicopter, lighter-than-air, powered parachute, weight-shift-control) are the ratings recorded on it; powered parachutes and weight-shift-control aircraft have no class of their own in the record and are recorded as OTHER.
    ref: faa:61.315(a)
    affects: [passengers_day, passengers_day_type, passengers_night, passengers_night_type]
    approved_by: null
    approved_on: null
  - id: one-passenger
    reading: A sport pilot may carry at most one passenger; the limit concerns the flight and is not evaluated, the passenger recency is.
    ref: faa:61.315(c)(4)
    affects: [passengers_day, passengers_glider]
    approved_by: null
    approved_on: null
  - id: no-glider-night
    reading: Night passenger recency is not evaluated for gliders, as for other certificates (faa.shared.passengers-glider); only powered classes get the night evaluations.
    ref: faa:61.57(b)(1)
    affects: [passengers_night, passengers_night_type]
    approved_by: null
    approved_on: null
  - id: tailwheel-airplanes-only
    reading: The tailwheel condition is evaluated for the airplane classes only.
    ref: faa:61.57(a)(1)(ii)
    affects: [passengers_tailwheel]
    approved_by: null
    approved_on: null
  - id: medical-or-drivers-license
    reading: A sport pilot may fly on a U.S. driver's license instead of a medical certificate (and needs neither in a glider or balloon); the catalogue has no credential for the driver's license alone, so the certificate names no medical requirement and the operating limits of the 61.303 table are not evaluated.
    ref: [faa:61.23(c)(1)(ii), faa:61.23(b)(2), faa:61.303]
    affects: [flight_review]
    approved_by: null
    approved_on: null
