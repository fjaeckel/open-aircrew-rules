credential: Sport pilot certificate
id: faa.licence.sport
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_SPORT], authorities: [FAA] }
  ratings: { classes: [SEP_LAND, SEP_SEA, GLIDER, GYROPLANE, HELICOPTER, AIRSHIP, BALLOON, POWERED_PARACHUTE_LAND, POWERED_PARACHUTE_SEA, WEIGHT_SHIFT_CONTROL_LAND, WEIGHT_SHIFT_CONTROL_SEA, OTHER], licence_kinds: [FAA_SPORT], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry a passenger in each powered category and class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER, OTHER], type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry a passenger in each type recorded on a sport pilot rating?
    uses: faa.shared.passengers-day
    with: { type_rated: true }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER, OTHER], type_rated: true }

  - id: passengers_glider
    asks: May the holder carry a passenger in a glider?
    uses: faa.shared.passengers-glider

  - id: passengers_tailwheel
    asks: May the holder carry a passenger in a tailwheel airplane?
    uses: faa.shared.passengers-tailwheel
    only_for: { not_licence_kinds: [FAA_STUDENT], classes: [SEP_LAND, SEP_SEA] }

  - id: passengers_night
    asks: With the night endorsement of 61.329, may the holder carry a passenger at night in each powered category and class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER, OTHER], type_rated: false }
    effective_from: 2025-10-22

  - id: passengers_night_type
    asks: With the night endorsement of 61.329, may the holder carry a passenger at night in each type recorded on a sport pilot rating?
    uses: faa.shared.passengers-night
    with: { type_rated: true }
    only_for: { not_licence_kinds: [FAA_STUDENT], not_classes: [GLIDER, OTHER], type_rated: true }
    effective_from: 2025-10-22

  - id: no_night_privileges
    asks: Before 22 October 2025 a sport pilot could not act as pilot in command at night, so night passenger recency did not apply.
    about: passengers
    source: faa:61.315(c)(5)
    also_cites: [faa:61.329]
    effective_to: 2025-10-21
    outcomes:
      - { id: no_night_privilege, when: always, status: not_applicable, message: pax.night_no_privilege, ref: faa:61.315(c)(5) }
    description_key: faa_pax_day_night

  - id: class_not_recorded
    asks: A rating recorded in the class OTHER does not show its category and class (powered parachute, weight-shift-control or another), so its passenger recency and medical cannot be evaluated.
    about: rating
    source: faa:61.57(a)(1)(ii)
    also_cites: [faa:61.5(b)(1)]
    only_for: { classes: [OTHER], ref: faa:61.57(a)(1)(ii) }
    outcomes:
      - { id: class_not_recorded, when: always, status: unknown, message: rating.class_not_recorded, ref: policy:unknown-input }
    description_key: faa_sport_class_not_recorded

  - id: medical_or_drivers_license
    asks: Does the pilot hold a valid U.S. driver's license or medical certificate, as sport pilot privileges in an aircraft other than a glider or balloon require?
    requires_any: [faa.document.drivers-license, faa.medical.first-class@private, faa.medical.second-class@private, faa.medical.third-class]
    only_for: { classes: [SEP_LAND, SEP_SEA, GYROPLANE, HELICOPTER, AIRSHIP, POWERED_PARACHUTE_LAND, POWERED_PARACHUTE_SEA, WEIGHT_SHIFT_CONTROL_LAND, WEIGHT_SHIFT_CONTROL_SEA], ref: faa:61.23(c)(1)(ii) }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

interpretations:
  - id: night-regime-change
    reading: Sport pilot night privileges exist from 22 October 2025, the date the amendment adding 61.329 took effect (Amdt. 61-159); before it night passenger recency is not_applicable, from it the night rules apply to a sport pilot holding the night endorsement (privilege SPORT_NIGHT on the same certificate) and are not_applicable without it. The stored text is the amended one; the earlier wording of 61.315(c)(5), which prohibited night flight without exception, is cited by its paragraph.
    ref: [faa:61.329, faa:61.315(c)(5)]
    affects: [passengers_night, passengers_night_type, no_night_privileges]
    approved_by: null
    approved_on: null
  - id: sport-classes
    reading: A sport pilot certificate's category and class privileges are the ratings recorded on it. Powered parachutes and weight-shift-control aircraft are separate categories with their own land and sea classes, so takeoffs and landings count only in the same one; one never counts for the other. A rating recorded in the class OTHER cannot be placed in a category and class, so it reads unknown until the right class is recorded.
    ref: [faa:61.315(a), faa:61.5(b)(1)(vi), faa:61.5(b)(1)(vii), faa:61.5(b)(5), faa:61.5(b)(6), faa:61.57(a)(1)(ii)]
    affects: [passengers_day, passengers_day_type, passengers_night, passengers_night_type, class_not_recorded]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: one-passenger
    reading: A sport pilot may carry at most one passenger; the limit concerns the flight and is not evaluated, the passenger recency is.
    ref: faa:61.315(c)(4)
    affects: [passengers_day, passengers_glider]
    approved_by: null
    approved_on: null
  - id: no-glider-night
    reading: Night passenger recency is not evaluated for gliders, as for other certificates (faa.shared.passengers-glider); only powered classes get the night evaluations.
    ref: faa:61.57(b)(1)
    affects: [passengers_night, passengers_night_type]
    approved_by: null
    approved_on: null
  - id: tailwheel-airplanes-only
    reading: The tailwheel condition is evaluated for the airplane classes only.
    ref: faa:61.57(a)(1)(ii)
    affects: [passengers_tailwheel]
    approved_by: null
    approved_on: null
  - id: medical-or-drivers-license
    reading: A certificate with a rating in a category other than glider or balloon needs a valid U.S. driver's license or a medical certificate; one with only glider or balloon ratings needs neither (night is evaluated by faa.privilege.sport-night). A driver's license counts while its recorded expiry date has not passed; a first-, second- or third-class medical certificate counts at its private-privilege validity, which the medical derives from the examination date and the age when no expiry date is recorded. A driver's license without an expiry date, or a medical whose validity cannot be derived, reads unknown, and so does a record that holds neither, until it is recorded; when every one held has expired, the result is expired.
    ref: [faa:61.23(c)(1)(ii), faa:61.23(b)(2), faa:61.303]
    affects: [medical_or_drivers_license]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: drivers-license-conditions
    reading: The conditions for flying on a driver's license (following any restriction on it, the most recent medical application not denied, no medical certificate suspended or revoked, the last special issuance not withdrawn) are not in the record and are taken as met. The operating limits of the 61.303 table concern the flight and are not evaluated. The medical's own duration for sport privileges is reported by the medical certificate's evaluations.
    ref: [faa:61.23(c)(2), faa:61.303]
    affects: [medical_or_drivers_license]
    approved_by: null
    approved_on: null
