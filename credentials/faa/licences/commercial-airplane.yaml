credential: Commercial pilot certificate, airplane category
id: faa.licence.commercial-airplane
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_COMMERCIAL], authorities: [FAA] }
  ratings: { classes: [SEP_LAND, SEP_SEA, MEP_LAND, MEP_SEA, SET_LAND, SET_SEA], licence_kinds: [FAA_COMMERCIAL], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each airplane class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each airplane type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_tailwheel
    asks: May the holder carry passengers in a tailwheel airplane?
    uses: faa.shared.passengers-tailwheel

  - id: passengers_night
    asks: May the holder carry passengers at night in each airplane class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each airplane type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate (or BasicMed) that supports at least private privileges?
    requires_any: [faa.medical.first-class@private, faa.medical.second-class@private, faa.medical.third-class, faa.medical.basicmed]

  - id: medical_commercial
    asks: Does the pilot hold a first- or second-class medical certificate that supports commercial privileges?
    requires_any: [faa.medical.first-class@commercial, faa.medical.second-class@commercial]
    limits: commercial_privileges

interpretations:
  - id: commercial-privileges-medical
    reading: The certificate may be used for private privileges with any medical certificate that still supports them, or under BasicMed; that decides the composite. Whether the commercial privileges may be used (a first- or second-class certificate within its 12 commercial months) is reported as a limitation of scope commercial_privileges, so a first- or second-class certificate past its commercial duration, or a third-class certificate, no longer makes the whole certificate read expired or unknown. Commercial glider and balloon privileges, which need no medical or only in some cases, are not distinguished.
    ref: [faa:61.23(a)(1)(i), faa:61.23(a)(2)(ii), faa:61.23(a)(3)(i), faa:61.23(d)]
    affects: [medical, medical_commercial]
    approved_by: null
    approved_on: null
