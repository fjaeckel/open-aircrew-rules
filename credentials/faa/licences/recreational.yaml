credential: Recreational pilot certificate
id: faa.licence.recreational
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_RECREATIONAL], authorities: [FAA] }
  ratings: { classes: [SEP_LAND, SEP_SEA, GYROPLANE, HELICOPTER], licence_kinds: [FAA_RECREATIONAL], authorities: [FAA] }

evaluations:
  - id: pic_recency
    asks: With fewer than 400 flight hours, has the holder logged pilot-in-command time in the last 180 days, or received flight training and an instructor's endorsement since?
    source: faa:61.101(g)
    counting: { within_days: 180 }
    passes_if:
      id: recency
      ref: faa:61.101(g)
      any_of:
        - flight_time: { id: experienced, min_hours: 400, ever: true, ref: faa:61.101(g) }
        - pic_time: { id: recent_pic, min_minutes: 1, ref: faa:61.101(g) }
    restored_by:
      - { instructor_endorsement: {}, ref: faa:61.101(g) }
    outcomes:
      preset: recency
      messages: { current: licence.recency_current, lapsed: licence.recency_not_met }
    on_fail: { what: flight training and an instructor's logbook endorsement, ref: faa:61.101(g) }
    description_key: faa_recreational

  - id: passengers_day
    asks: May the holder carry a passenger in each class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_tailwheel
    asks: May the holder carry a passenger in a tailwheel airplane?
    uses: faa.shared.passengers-tailwheel
    only_for: { not_licence_kinds: [FAA_STUDENT], classes: [SEP_LAND, SEP_SEA] }

  - id: passengers_night
    asks: A recreational pilot may not act as pilot in command between sunset and sunrise, so night passenger recency does not apply.
    about: passengers
    source: faa:61.101(e)(6)
    also_cites: [faa:61.57(b)(1)]
    outcomes:
      - { id: no_night_privilege, when: always, status: not_applicable, message: pax.night_no_privilege, ref: faa:61.101(e)(6) }
    description_key: faa_pax_day_night

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate (or BasicMed) that supports recreational privileges?
    requires_any: [faa.medical.first-class@private, faa.medical.second-class@private, faa.medical.third-class, faa.medical.basicmed]

interpretations:
  - id: four-hundred-hours-total
    reading: The 400 flight hours are the total flight time logged in aircraft at any time, simulators and training devices excluded; the 180 days are the 180 days before the date evaluated, both ends included.
    ref: faa:61.101(g)
    affects: [pic_recency]
    approved_by: null
    approved_on: null
  - id: pic-time-in-any-aircraft
    reading: Pilot-in-command time in any aircraft counts; dual instruction received is not pilot-in-command time.
    ref: faa:61.101(g)
    affects: [pic_recency]
    approved_by: null
    approved_on: null
  - id: endorsement-restores
    reading: The instructor's endorsement after flight training is an instructor_endorsement event; that it followed flight training and certifies proficiency is not checked. It counts for 180 days from its date, after which pilot-in-command time logged since keeps the pilot current.
    ref: faa:61.101(g)
    affects: [pic_recency]
    approved_by: null
    approved_on: null
  - id: flight-limits-not-evaluated
    reading: The other recreational limits (one passenger, distance from the departure airport, airspace, the endorsements of paragraphs (c), (d) and (i)) concern individual flights and are not evaluated.
    ref: [faa:61.101(a), faa:61.101(e)]
    affects: [passengers_day]
    approved_by: null
    approved_on: null
  - id: no-night-privilege
    reading: A recreational pilot may not act as pilot in command between sunset and sunrise except under the training exception of paragraph (i), so night passenger recency is not_applicable for every class and type held, whatever the logbook shows.
    ref: faa:61.101(e)(6)
    affects: [passengers_night]
    approved_by: null
    approved_on: null
  - id: tailwheel-airplanes-only
    reading: The tailwheel condition is evaluated for the airplane classes only; rotorcraft are not airplanes with a tailwheel.
    ref: faa:61.57(a)(1)(ii)
    affects: [passengers_tailwheel]
    approved_by: null
    approved_on: null
