credential: Airline transport pilot certificate, airplane category
id: faa.licence.atp-airplane
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_ATP], authorities: [FAA] }
  ratings: { classes: [SEP_LAND, SEP_SEA, MEP_LAND, MEP_SEA, SET_LAND, SET_SEA], licence_kinds: [FAA_ATP], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each airplane class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each airplane type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_tailwheel
    asks: May the holder carry passengers in a tailwheel airplane?
    uses: faa.shared.passengers-tailwheel

  - id: passengers_night
    asks: May the holder carry passengers at night in each airplane class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each airplane type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a first-class medical certificate that supports airline transport pilot privileges?
    requires_any: [faa.medical.first-class]

interpretations:
  - id: atp-privileges-medical
    reading: The certificate is composed for its pilot-in-command privileges as an airline transport pilot, which need a first-class medical certificate; a holder exercising only commercial or private privileges on a lower class or under BasicMed is not distinguished and reads as unknown.
    ref: [faa:61.23(a)(1)(i), faa:61.23(a)(2)(ii)]
    affects: [medical]
    approved_by: null
    approved_on: null
