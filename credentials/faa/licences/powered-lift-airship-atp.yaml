credential: Powered-lift and airship category ratings (airline transport pilot certificate)
id: faa.licence.powered-lift-airship-atp
kind: licence
authority: FAA
held_on: []
selects:
  ratings: { classes: [POWERED_LIFT, AIRSHIP], licence_kinds: [FAA_ATP], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each powered-lift or airship class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each powered-lift or airship type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in each powered-lift or airship class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each powered-lift or airship type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate (or BasicMed) that supports at least private privileges?
    requires_any: [faa.medical.first-class@private, faa.medical.second-class@private, faa.medical.third-class, faa.medical.basicmed]

  - id: medical_commercial
    asks: Does the pilot hold a first- or second-class medical certificate that supports commercial privileges?
    requires_any: [faa.medical.first-class@commercial, faa.medical.second-class@commercial]
    limits: commercial_privileges

  - id: medical_atp
    asks: Does the pilot hold a first-class medical certificate that supports airline transport pilot privileges?
    requires_any: [faa.medical.first-class@atp]
    limits: airline_transport_privileges

interpretations:
  - id: rating-items
    reading: The certificate itself is the airplane-category credential's item (faa.licence.private-airplane, commercial-airplane, atp-airplane) or the glider credential's (faa.licence.glider); this file answers for each powered-lift or airship rating on an airline transport pilot certificate, whose composite is its own evaluations and the medical. The flight review is one per pilot and decides the certificate's composite, not the rating's.
    ref: faa:61.56(c)
    affects: [flight_review, medical]
    approved_by: null
    approved_on: null
  - id: atp-privileges-medical
    reading: The rating may be used for private privileges with any medical certificate that still supports them, or under BasicMed; that decides the composite. The commercial privileges (a first- or second-class certificate within its commercial duration) and the airline transport pilot-in-command privileges (a first-class certificate within its ATP duration) are reported as limitations of scope commercial_privileges and airline_transport_privileges.
    ref: [faa:61.23(a)(1)(i), faa:61.23(a)(2)(ii), faa:61.23(a)(3)(i), faa:61.23(d)]
    affects: [medical, medical_commercial, medical_atp]
    approved_by: null
    approved_on: null
