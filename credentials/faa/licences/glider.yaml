credential: Pilot certificate, glider category rating
id: faa.licence.glider
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_GLIDER], authorities: [FAA] }
  ratings: { classes: [GLIDER], licence_kinds: [FAA_GLIDER, FAA_PRIVATE, FAA_COMMERCIAL], authorities: [FAA] }

evaluations:
  - id: passengers
    asks: May the holder carry passengers in a glider?
    uses: faa.shared.passengers-glider

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

interpretations:
  - id: private-and-commercial
    reading: Glider privileges of a private and of a commercial pilot certificate have the same recency and need no medical certificate, so one file answers for the glider rating on either; a certificate recorded as a glider pilot certificate is this credential's own item, while a private or commercial certificate is composed by its airplane-category file.
    ref: [faa:61.57(a)(1), faa:61.23(b)(3)]
    affects: [passengers, flight_review]
    approved_by: null
    approved_on: null
  - id: no-medical
    reading: Exercising the privileges of a pilot certificate with a glider category rating in a glider needs no medical certificate, so the credential names none.
    ref: faa:61.23(b)(3)
    affects: [flight_review]
    approved_by: null
    approved_on: null
  - id: powered-classes-elsewhere
    reading: The requirement follows the category of the aircraft flown; a powered class recorded on a glider pilot certificate (such as a motorglider logged as SEP land) is not a glider and is not evaluated by this file; it is evaluated as a private pilot rating (faa.licence.private-airplane, faa.licence.private-rotorcraft or faa.licence.powered-lift-airship).
    ref: faa:61.57(a)(1)(ii)
    affects: [passengers]
    approved_by: null
    approved_on: null
