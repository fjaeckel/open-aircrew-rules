credential: Powered-lift and airship category ratings (private pilot certificate)
id: faa.licence.powered-lift-airship
kind: licence
authority: FAA
held_on: []
selects:
  ratings: { classes: [POWERED_LIFT, AIRSHIP], licence_kinds: [FAA_PRIVATE, FAA_GLIDER], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each powered-lift or airship class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each powered-lift or airship type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in each powered-lift or airship class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each powered-lift or airship type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate (or BasicMed) that supports private privileges?
    requires_any: [faa.medical.first-class@private, faa.medical.second-class@private, faa.medical.third-class, faa.medical.basicmed]

  - id: certificate_grade
    asks: A powered-lift or airship rating recorded on a certificate that reads only as a glider pilot certificate does not show which privileges, and so which medical, apply.
    source: faa:61.23(a)
    also_cites: [faa:61.23(a)(3)(i)]
    only_for: { licence_kinds: [FAA_GLIDER], ref: faa:61.23(a) }
    outcomes:
      - { id: grade_not_recorded, when: always, status: unknown, message: licence.certificate_grade_not_recorded, ref: policy:unknown-input }
    description_key: faa_certificate_grade

interpretations:
  - id: rating-items
    reading: The certificate itself is the airplane-category credential's item (faa.licence.private-airplane, commercial-airplane, atp-airplane) or the glider credential's (faa.licence.glider); this file answers for each powered-lift or airship rating on a private pilot certificate (faa.licence.powered-lift-airship-commercial and -atp for the other grades), whose composite is its own evaluations and the medical. The flight review is one per pilot and decides the certificate's composite, not the rating's.
    ref: faa:61.56(c)
    affects: [flight_review, medical]
    approved_by: null
    approved_on: null
  - id: medical-grade-not-recorded
    reading: The medical a powered-lift or airship rating needs follows the grade of the certificate it is on, as in the rotorcraft files. On a private pilot certificate any medical certificate that supports private privileges, or BasicMed, is enough; commercial and airline transport pilot certificates are evaluated by faa.licence.powered-lift-airship-commercial and faa.licence.powered-lift-airship-atp. A rating on a certificate recorded only as a glider pilot certificate does not show its grade, so the result is unknown until the certificate's grade is recorded.
    ref: [faa:61.23(a)(1)(i), faa:61.23(a)(2)(ii), faa:61.23(a)(3)(i)]
    affects: [medical, certificate_grade]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
