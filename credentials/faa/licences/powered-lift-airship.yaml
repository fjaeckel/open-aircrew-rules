credential: Powered-lift and airship category ratings (private, commercial or airline transport pilot certificate)
id: faa.licence.powered-lift-airship
kind: licence
authority: FAA
held_on: []
selects:
  ratings: { classes: [POWERED_LIFT, AIRSHIP], licence_kinds: [FAA_PRIVATE, FAA_COMMERCIAL, FAA_ATP, FAA_GLIDER], authorities: [FAA] }

evaluations:
  - id: passengers_day
    asks: May the holder carry passengers in each powered-lift or airship class held?
    uses: faa.shared.passengers-day
    with: { type_rated: false }

  - id: passengers_day_type
    asks: May the holder carry passengers in each powered-lift or airship type held?
    uses: faa.shared.passengers-day
    with: { type_rated: true }

  - id: passengers_night
    asks: May the holder carry passengers at night in each powered-lift or airship class held?
    uses: faa.shared.passengers-night
    with: { type_rated: false }

  - id: passengers_night_type
    asks: May the holder carry passengers at night in each powered-lift or airship type held?
    uses: faa.shared.passengers-night
    with: { type_rated: true }

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (Once per pilot, whatever certificates are held.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the pilot hold a medical certificate of at least the second class?
    requires_any: [faa.medical.first-class, faa.medical.second-class]

interpretations:
  - id: rating-items
    reading: The certificate itself is the airplane-category credential's item (faa.licence.private-airplane, commercial-airplane, atp-airplane) or the glider credential's (faa.licence.glider); this file answers for each powered-lift or airship rating on it, whose composite is its own evaluations and the medical. The flight review is one per pilot and decides the certificate's composite, not the rating's.
    ref: faa:61.56(c)
    affects: [flight_review, medical]
    approved_by: null
    approved_on: null
  - id: medical-grade-not-recorded
    reading: The rating record does not say whether private, commercial or airline transport pilot privileges are exercised, so the composite asks for at least a second-class medical certificate (commercial privileges); private privileges on a third-class certificate or under BasicMed, and airline transport privileges, which need a first-class certificate, are not distinguished (the first read as unknown, the second as met by a second-class certificate).
    ref: [faa:61.23(a)(1)(i), faa:61.23(a)(2)(ii), faa:61.23(a)(3)(i)]
    affects: [medical]
    approved_by: null
    approved_on: null
