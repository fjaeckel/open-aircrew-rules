credential: Student pilot certificate
id: faa.licence.student
kind: licence
authority: FAA
held_on: []
selects:
  licence: { kinds: [FAA_STUDENT], authorities: [FAA] }

evaluations:
  - id: solo_endorsement
    asks: Has an authorized instructor endorsed the student's logbook for solo flight within the last 90 days?
    source: faa:61.87(n)
    also_cites: [faa:61.87(p)(4)]
    counting: { within_days: 90 }
    passes_if:
      ref: faa:61.87(n)
      all_of:
        - solo_endorsement: { ref: faa:61.87(n) }
    outcomes:
      preset: recency
      messages: { current: licence.recency_current, lapsed: licence.recency_not_met }
    on_fail: { what: an updated solo endorsement from an authorized instructor, ref: faa:61.87(p)(4) }
    description_key: faa_student_solo

  - id: flight_review
    asks: Has the pilot had a flight review in the last 24 calendar months? (A student pilot undergoing training for a certificate with a current solo endorsement needs none.)
    uses: faa.shared.flight-review

  - id: medical
    asks: Does the student hold a medical certificate (or BasicMed) that supports student privileges?
    requires_any: [faa.medical.first-class@private, faa.medical.second-class@private, faa.medical.third-class, faa.medical.basicmed]

interpretations:
  - id: endorsement-as-event
    reading: The solo endorsement is a solo_endorsement event; any such event in the 90 days before the date evaluated (both ends included) counts. The make and model it names, and who gave the training, are not checked, and the separate night solo endorsement is not evaluated.
    ref: [faa:61.87(n), faa:61.87(o)]
    affects: [solo_endorsement]
    approved_by: null
    approved_on: null
  - id: medical-for-every-student
    reading: A student seeking a glider or balloon rating needs no medical certificate and a student seeking sport pilot privileges may use a U.S. driver's license; the record does not say which certificate the student seeks, so the composite asks for a medical certificate or BasicMed in every case.
    ref: [faa:61.23(a)(3)(i), faa:61.23(b)(1), faa:61.23(c)(1)(i)]
    affects: [medical]
    approved_by: null
    approved_on: null
