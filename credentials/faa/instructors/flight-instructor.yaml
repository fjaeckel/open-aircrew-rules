credential: Flight instructor certificate (including the sport pilot rating)
id: faa.instructor.flight-instructor
kind: instructor_certificate
authority: FAA
held_on: [Commercial, ATP, Sport]
selects:
  privilege: { kinds: [CFI], authorities: [FAA] }

evaluations:
  - id: certificate_expiry
    asks: A flight instructor certificate issued before 1 December 2024 carries an expiration date (24 calendar months after the month it was issued, renewed or reinstated); is it still valid?
    source: faa:61.19(d)(2)
    also_cites: [faa:61.19(d)(1), faa:61.197(e), faa:61.425(b), faa:61.19(a)(1)]
    outcomes:
      preset: validity
      messages: { no_expiry: privilege.not_applicable, expired: privilege.expired, expiring: privilege.expiring, valid: privilege.valid }
      statuses: { no_expiry: { status: not_applicable, ref: faa:61.19(d)(1) } }
      expiring_notice: { days: 90, ref: policy:expiring-notice }
    on_fail: { what: reinstatement of the flight instructor privileges, ref: [faa:61.197(e), faa:61.199(a)] }
    description_key: faa_cfi

  - id: recent_experience
    asks: For a certificate issued without an expiration date, has the holder passed a flight instructor practical test or completed an approved flight instructor refresher course in the last 24 calendar months?
    source: faa:61.197(a)
    also_cites: [faa:61.19(d)(1), faa:61.197(c), faa:61.197(d), faa:61.199(a), faa:61.425(a), faa:61.427]
    effective_from: 2024-12-01
    counting: { within_calendar_months: 24 }
    passes_if:
      id: recent_experience
      ref: faa:61.197(b)
      any_of:
        - practical_test: { also: [skill_test], for_rating: [CFI, CFII, MEI], simulator: include, ref: faa:61.197(b)(1) }
        - instructor_refresher: { id: refresher_course, ref: faa:61.197(b)(2)(iii) }
    outcomes:
      - { id: old_regime, when: { not: no_expiry }, status: not_applicable, message: privilege.not_applicable, ref: faa:61.19(d)(2) }
      - { id: current, when: all_met, status: current, message: privilege.recency_current, params: { date: valid_until }, ref: faa:61.197(a) }
      - { id: refresher_reinstatement, when: { met_within: { calendar_months: 3 } }, status: lapsed, message: privilege.cfi_reinstate_refresher, ref: [faa:61.199(a)(1), faa:61.427(a), policy:recency-lapsed] }
      - { id: practical_test_reinstatement, when: always, status: lapsed, message: privilege.cfi_reinstate_practical_test, ref: [faa:61.199(a)(2), faa:61.427(b), policy:recency-lapsed] }
    on_fail: { what: reinstatement of the flight instructor privileges, ref: [faa:61.197(c), faa:61.199(a)] }
    description_key: faa_cfi

interpretations:
  - id: regime-by-recorded-expiry
    reading: Which regime applies depends on the certificate's issue date, not on the date evaluated. A certificate recorded with an expiration date was issued before 1 December 2024 and gets the expiry evaluation (not_applicable for recent experience); one recorded without was issued on or after that date (61.19(d)(1)) and gets recent experience (not_applicable for the expiry). The expiry is not derived from the issue date, so an old certificate recorded without its date reads as a new one.
    ref: [faa:61.19(d)(1), faa:61.19(d)(2)]
    affects: [certificate_expiry, recent_experience]
    approved_by: null
    approved_on: null
  - id: old-regime-not-bounded
    reading: The expiry evaluation has no effective_to, because certificates issued before 1 December 2024 keep their expiration dates (the last ones run to 30 November 2026) and must still be reported expired afterwards; the recent-experience evaluation applies from 1 December 2024, the date 61.19(d)(1) names.
    ref: [faa:61.19(d)(1), faa:61.19(d)(2)]
    affects: [certificate_expiry, recent_experience]
    approved_by: null
    approved_on: null
  - id: renewal-is-a-new-record
    reading: Renewing an unexpired old certificate by recent experience before its expiration month produces a new certificate, recorded as a new privilege; an expired old certificate is reported expired, and its reinstatement under 61.199 is not modelled as its own stage.
    ref: [faa:61.197(e), faa:61.199(a)]
    affects: [certificate_expiry]
    approved_by: null
    approved_on: null
  - id: practical-test-events
    reading: A practical test for a flight instructor rating is a practical_test or skill_test event for the rating CFI, CFII or MEI, in an aircraft or a device (the part 142 course of paragraph (d) is taken as met); a practical test for another rating (such as an instrument rating) does not count.
    ref: [faa:61.197(b)(1), faa:61.197(d)]
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: refresher-counts-24-months
    reading: An approved flight instructor refresher course is an instructor_refresher event; it establishes recent experience in its month and counts for the 24 calendar months that follow, like a practical test; either one suffices.
    ref: faa:61.197(b)(2)(iii)
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: other-means-not-recorded
    reading: "Not counted, because the record cannot show them: 5 endorsed applicants with 80 % first-time passes, check pilot or chief instructor duties, a military instructor proficiency check and instructing in an FAA-sponsored pilot proficiency program. Paragraph (a)(1) also starts the 24 calendar months from the month the FAA issued the certificate, whatever led to the issue; the recorded issue date is not counted, so a certificate issued in the last 24 calendar months reads lapsed unless the practical test or refresher course behind it is recorded as an event."
    ref: [faa:61.197(b)(2)(i), faa:61.197(b)(2)(ii), faa:61.197(b)(2)(iv), faa:61.197(b)(2)(v), faa:61.197(a)(1)]
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: carry-forward-not-modelled
    reading: The carry-forward of paragraph (a)(3) (recent experience in the 3 calendar months before the last month keeps the period running from that last month) is not modelled; an early renewal can show a period up to 3 months shorter than the text gives.
    ref: faa:61.197(a)(3)
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: reinstatement-window
    reading: After recent experience lapses, a refresher course or a practical test reinstates within 3 calendar months after the last month of the period, and only a practical test later; the engine cannot tell a refresher course taken after that limit from one taken in time, so a late course reads as current. The application to the FAA and the military reinstatement are not modelled.
    ref: [faa:61.199(a)(1), faa:61.199(a)(2), faa:61.199(a)(3)]
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: sport-rating-same-rule
    reading: A flight instructor certificate with a sport pilot rating is recorded as the same CFI privilege and follows the same evaluations; its reinstatement (61.427) has the same two steps as 61.199.
    ref: [faa:61.425(a), faa:61.425(b), faa:61.427]
    affects: [certificate_expiry, recent_experience]
    approved_by: null
    approved_on: null
  - id: no-pilot-certificate-requirement
    reading: The certificate names no pilot certificate or medical as a requirement, because instructing without acting as pilot in command needs no medical certificate and the pilot certificate's own composite (flight review, medical) concerns acting as pilot in command.
    ref: faa:61.23(b)(7)
    affects: [certificate_expiry, recent_experience]
    approved_by: null
    approved_on: null
