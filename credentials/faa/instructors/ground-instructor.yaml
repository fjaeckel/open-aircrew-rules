credential: Ground instructor certificate
id: faa.instructor.ground-instructor
kind: instructor_certificate
authority: FAA
held_on: []
selects:
  privilege: { kinds: [GROUND_INSTRUCTOR], authorities: [FAA] }

evaluations:
  - id: recent_experience
    asks: Has the holder, in the last 12 calendar months, instructed as a ground or flight instructor, completed an approved flight instructor refresher course, or received an instructor's endorsement of demonstrated knowledge?
    source: faa:61.217
    also_cites: [faa:61.19(e)]
    counting: { within_calendar_months: 12 }
    passes_if:
      id: recent_activity
      ref: faa:61.217
      any_of:
        - not_recorded:
            id: ground_instruction
            name: requirement.ground_instruction_activity
            unit: events
            messages: { untracked: requirement.untracked }
            ref: faa:61.217(a)
        - instruction_given_time: { id: flight_instruction, min_minutes: 1, simulator: include, ref: faa:61.217(b) }
        - instructor_refresher: { id: refresher_course, ref: faa:61.217(c) }
        - instructor_endorsement: { ref: faa:61.217(d) }
    outcomes:
      - { id: current, when: all_met, status: current, message: privilege.recency_current, params: { date: valid_until }, ref: faa:61.217 }
      - { id: not_logged, when: always, status: unknown, message: privilege.recency_not_logged, ref: policy:unknown-input }
    description_key: faa_ground_instructor

interpretations:
  - id: ground-instruction-not-recorded
    reading: Employment or activity as a ground instructor, and ground training given as a flight instructor, are not recorded; they are an untracked alternative, so without recorded flight instruction, a refresher course or an endorsement the result is unknown, never lapsed.
    ref: [faa:61.217(a), faa:61.217(b)]
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: flight-instruction-given
    reading: Flight training given as a flight instructor is logged instruction-given time, in an aircraft or a device.
    ref: faa:61.217(b)
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: events-as-waivers
    reading: The refresher course with its graduation certificate is an instructor_refresher event and the endorsement of demonstrated knowledge an instructor_endorsement event (who gave it and the subject areas are not checked); any one of the four alternatives suffices.
    ref: [faa:61.217(c), faa:61.217(d)]
    affects: [recent_experience]
    approved_by: null
    approved_on: null
  - id: no-expiry
    reading: A ground instructor certificate is issued without an expiration date; a recorded expiry date is not read.
    ref: faa:61.19(e)
    affects: [recent_experience]
    approved_by: null
    approved_on: null
