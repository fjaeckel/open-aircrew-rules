credential: U.S. driver's license
id: faa.document.drivers-license
kind: document
authority: FAA
held_on: []
selects:
  credential: { kinds: [US_DRIVERS_LICENSE] }

evaluations:
  - id: validity
    asks: Is the U.S. driver's license valid? It may stand in for a medical certificate for day sport pilot privileges and is a condition of BasicMed.
    source: faa:61.23(c)(1)(ii)
    also_cites: [faa:61.113(i)]
    outcomes:
      preset: validity
      expiring_notice: { days: 30, ref: policy:expiring-notice }
    description_key: faa_drivers_license

interpretations:
  - id: recorded-expiry
    reading: The license is valid through the expiry date recorded on it; without a recorded expiry the result is unknown. Restrictions on the license, and whether it has been suspended or revoked, are not in the record and are not checked.
    ref: [faa:61.23(c)(1)(ii), faa:61.23(c)(2)]
    affects: [validity]
    principle: P1
    approved_by: null
    approved_on: null
