credential: Sport pilot night privileges (61.329 endorsement)
id: faa.privilege.sport-night
kind: privilege
authority: FAA
held_on: [Sport]
selects:
  privilege: { kinds: [SPORT_NIGHT], authorities: [FAA] }

evaluations:
  - id: certificate
    asks: Is the night endorsement held on a sport pilot certificate whose own requirements are met?
    requires_all: [faa.licence.sport]

  - id: medical
    asks: Does the pilot hold a medical certificate, or meet the BasicMed conditions, as night operations under a sport pilot certificate require?
    requires_any: [faa.medical.first-class, faa.medical.second-class, faa.medical.third-class, faa.medical.basicmed]

interpretations:
  - id: endorsement-as-privilege
    reading: The instructor's endorsement of 3 hours of night training (with a night cross-country flight and 10 night full-stop takeoffs and landings) and of night proficiency in the category and class is recorded as the SPORT_NIGHT privilege on the sport pilot certificate; the training it certifies is not recounted and the category and class it names are not checked.
    ref: [faa:61.329(a), faa:61.329(c)]
    affects: [certificate]
    approved_by: null
    approved_on: null
  - id: medical-for-night
    reading: Night operations need a part 67 medical certificate or the BasicMed conditions, even in a glider or balloon; a U.S. driver's license alone does not suffice at night.
    ref: [faa:61.329(b), faa:61.23(c)(1)(vi)]
    affects: [medical]
    approved_by: null
    approved_on: null
