credential: Glider and unpowered ultralight vehicle towing
id: faa.privilege.glider-towing
kind: privilege
authority: FAA
held_on: [Private, Commercial, ATP]
selects:
  privilege: { kinds: [SAILPLANE_TOWING], authorities: [FAA] }

evaluations:
  - id: recency
    asks: Has the holder, in the last 24 calendar months, made 3 tows of a glider or unpowered ultralight vehicle accompanied by a qualified pilot, or 3 flights as pilot in command of a glider towed by an aircraft?
    source: faa:61.69(a)(6)
    counting: { within_calendar_months: 24 }
    passes_if:
      id: towing_recency
      ref: faa:61.69(a)(6)
      any_of:
        - tows: { id: tows_accompanied, min: 3, tow_kinds: [glider, ul_glider], flagged: { accompanied: true }, ref: faa:61.69(a)(6)(i) }
        - flights: { id: towed_glider_flights, name: requirement.towed_glider_flights, min: 3, classes: [GLIDER], as: [pic], launch_methods: [aerotow], ref: faa:61.69(a)(6)(ii) }
    outcomes:
      - { id: current, when: all_met, status: current, message: privilege.recency_current, params: { date: valid_until }, ref: faa:61.69(a)(6) }
      - { id: not_logged, when: undetermined, status: unknown, message: privilege.recency_not_logged, ref: policy:unknown-input }
      - { id: not_met, when: always, status: lapsed, message: privilege.recency_not_met, ref: [faa:61.69(a)(6), policy:recency-lapsed] }
    description_key: faa_61_69_towing

  - id: certificate
    asks: Is the towing privilege held on a private, commercial or airline transport pilot certificate with a powered category rating whose own requirements are met?
    requires_any: [faa.licence.private-airplane, faa.licence.commercial-airplane, faa.licence.atp-airplane, faa.licence.private-rotorcraft, faa.licence.commercial-rotorcraft]

interpretations:
  - id: accompanied-tows
    reading: Tows under point (i) count only on tow flights flagged as accompanied by a qualified pilot; that the accompanying pilot meets 61.69 is not checked. A tow flight counts each glider it records as towed (one when the number is not recorded); a tow flight that does not record what it towed is unknown, and banner tows do not count.
    ref: faa:61.69(a)(6)(i)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: simulated-tows
    reading: Simulated tows (towing procedures flown without a glider) cannot be told from other flights and do not count.
    ref: faa:61.69(a)(6)(i)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: towed-glider-flights
    reading: Point (ii) counts glider flights with pilot-in-command time launched by aerotow; towed unpowered ultralight vehicles (hang gliders) have no class in the record and are not counted.
    ref: faa:61.69(a)(6)(ii)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: calendar-months-before-flight
    reading: "\"Within 24 calendar months before the flight\" is the 24 calendar months before the month of the date evaluated plus that month to date."
    ref: faa:61.69(a)(6)
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: prerequisites-not-evaluated
    reading: The one-time qualifications (100 hours as pilot in command in the towing aircraft's category, class and type, the instructor's endorsement and the three training tows with their endorsement) are not recorded and are taken as met; a recorded expiry date on the towing privilege is not read (the endorsements do not expire).
    ref: [faa:61.69(a)(2), faa:61.69(a)(3), faa:61.69(a)(4), faa:61.69(a)(5)]
    affects: [recency]
    approved_by: null
    approved_on: null
  - id: powered-certificate
    reading: The towing pilot's certificate is any of the private, commercial or airline transport credentials for a powered category the catalogue holds; the best composite among those held on the same certificate decides.
    ref: faa:61.69(a)(1)
    affects: [certificate]
    approved_by: null
    approved_on: null
