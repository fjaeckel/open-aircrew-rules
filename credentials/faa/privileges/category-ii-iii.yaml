credential: Category II or Category III pilot authorization
id: faa.privilege.category-ii-iii
kind: privilege
authority: FAA
held_on: [Private, Commercial, ATP]
selects:
  privilege: { kinds: [CAT_II, CAT_III], authorities: [FAA] }
validity: { period_months: 6, ref: "faa:61.21(a)" }

evaluations:
  - id: validity
    asks: Is the authorization valid? It expires at the end of the sixth calendar month after the month in which it was issued or renewed.
    source: faa:61.21(a)
    valid_for:
      counted_from: valid_from
      periods:
        - { months: 6, end_of_month: true, ref: faa:61.21(a) }
    outcomes:
      preset: validity
      messages: { no_expiry: privilege.no_expiry_date, expired: privilege.expired, expiring: privilege.expiring, valid: privilege.valid }
      expiring_notice: { days: 30, ref: policy:expiring-notice }
    on_fail: { what: renewal by a practical test in the aircraft type, ref: faa:61.21(b) }
    description_key: faa_cat_ii_iii

  - id: certificate
    asks: Is the authorization held on a pilot certificate whose own requirements are met?
    requires_any: [faa.licence.private-airplane, faa.licence.commercial-airplane, faa.licence.atp-airplane, faa.licence.private-rotorcraft, faa.licence.commercial-rotorcraft, faa.licence.atp-rotorcraft, faa.licence.powered-lift-airship, faa.licence.powered-lift-airship-commercial, faa.licence.powered-lift-airship-atp]

  - id: instrument_rating
    asks: Does the holder have an instrument rating whose own requirements (instrument currency, certificate) are met, or an airline transport pilot certificate?
    requires_any: [faa.rating.instrument-airplane, faa.licence.atp-airplane, faa.licence.atp-rotorcraft, faa.licence.powered-lift-airship-atp]

interpretations:
  - id: renewal-date
    reading: The period runs from the renewal date recorded as validFrom, else the issue date; the earlier of the derived and a recorded expiry date wins, valid through its last day.
    ref: faa:61.21(a)
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: renewal-rules-not-modelled
    reading: Renewal per aircraft type and the 12-calendar-month limit from the practical test in that type are not modelled; a renewal test passed in the month before expiry counts as passed in the expiry month, which the holder reflects by recording the renewal in the expiry month (otherwise the derived expiry is one month early).
    ref: [faa:61.21(b), faa:61.21(c), faa:61.21(d)]
    affects: [validity]
    approved_by: null
    approved_on: null
  - id: certificate-and-instrument-rating
    reading: The authorization needs a private or commercial pilot certificate with an instrument rating, or an airline transport pilot certificate. The certificate requirement names every powered-category certificate credential, and a separate requirement asks for an instrument rating (with its instrument currency) or an airline transport pilot certificate on the same certificate.
    ref: [faa:61.67(a)(1), faa:61.68(a)(1)]
    affects: [certificate, instrument_rating]
    approved_by: null
    approved_on: null
