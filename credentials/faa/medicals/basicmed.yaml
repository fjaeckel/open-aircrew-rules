credential: BasicMed
id: faa.medical.basicmed
kind: medical
authority: FAA
held_on: []
selects:
  credential: { kinds: [FAA_BASICMED] }

evaluations:
  - id: course_and_examination
    asks: Has the pilot completed the medical education course in the last 24 calendar months and the medical examination in the last 48, and does the pilot hold a valid U.S. driver's license?
    source: faa:61.23(c)(3)
    also_cites: [faa:61.113(i), faa:68.3]
    passes_if:
      ref: faa:61.23(c)(3)(i)
      all_of:
        - basicmed_course: { within_calendar_months: 24, ref: faa:61.23(c)(3)(i)(C) }
        - basicmed_exam: { within_calendar_months: 48, ref: faa:61.23(c)(3)(i)(D) }
    outcomes:
      - { id: no_drivers_license, when: { not: { holds: { credentials: [US_DRIVERS_LICENSE] } } }, status: unknown, message: credential.drivers_license_required, ref: policy:unknown-input }
      - { id: drivers_license_expired, when: { not: { holds: { credentials: [US_DRIVERS_LICENSE], valid: true } } }, status: lapsed, message: credential.drivers_license_expired, ref: faa:61.113(i) }
      - { id: current, when: all_met, status: current, message: credential.valid, params: { date: valid_until }, ref: faa:61.23(c)(3)(i) }
      - { id: not_met, when: always, status: lapsed, message: credential.basicmed_not_met, ref: faa:61.23(c)(3)(i) }
    description_key: faa_basicmed

interpretations:
  - id: valid-until-both-count
    reading: The course must lie in the 24 and the examination in the 48 calendar months before the month of the flight, plus that month; the result is valid until the last day both still count.
    ref: [faa:61.23(c)(3)(i)(C), faa:61.23(c)(3)(i)(D)]
    affects: [course_and_examination]
    approved_by: null
    approved_on: null
  - id: drivers-license
    reading: A valid U.S. driver's license is a recorded US_DRIVERS_LICENSE credential not expired by its recorded date; without one the result is unknown.
    ref: faa:61.113(i)
    affects: [course_and_examination]
    approved_by: null
    approved_on: null
  - id: not-modelled
    reading: "Not evaluated: having held a medical certificate after 14 July 2006, the conditions on the most recent medical certificate and application, care for a diagnosed condition, special issuances, and the operating limits of 61.113(i), which concern the flight rather than the pilot's record."
    ref: [faa:61.23(c)(3)(i)(B), faa:61.23(c)(3)(ii), faa:61.23(c)(3)(i)(E), faa:68.9, faa:61.113(i)]
    affects: [course_and_examination]
    approved_by: null
    approved_on: null
