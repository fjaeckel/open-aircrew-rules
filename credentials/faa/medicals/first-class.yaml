credential: First-class medical certificate
id: faa.medical.first-class
kind: medical
authority: FAA
held_on: []
selects:
  credential: { kinds: [FAA_CLASS1_MEDICAL] }

evaluations:
  - id: atp_privileges
    asks: Until when does the certificate support airline transport pilot privileges (12 calendar months under 40, 6 from 40)?
    source: faa:61.23(d)
    also_cites: [faa:61.23(a)(1)]
    only_for:
      when_holding: { licenceKinds: [FAA_ATP] }
      ref: faa:61.23(a)(1)(i)
    valid_for:
      counted_from: issue
      periods:
        - { age_under: 40, months: 12, end_of_month: true, ref: faa:61.23(d) }
        - { age_from: 40, months: 6, end_of_month: true, ref: faa:61.23(d) }
    outcomes:
      preset: validity
      date_of_birth: required
      expiring_notice: { days: 30, ref: policy:expiring-notice }
    description_key: faa_medical_atp

  - id: commercial_privileges
    asks: Until when does the certificate support commercial privileges?
    uses: faa.shared.medical-duration-commercial

  - id: private_privileges
    asks: Until when does the certificate support private and recreational privileges?
    uses: faa.shared.medical-duration-private

interpretations:
  - id: steps-down
    reading: A first-class certificate steps down; each privilege level is its own evaluation reporting until when the same certificate supports it.
    ref: faa:61.23(d)
    affects: [atp_privileges, commercial_privileges, private_privileges]
    approved_by: null
    approved_on: null
  - id: part-121-age-60-not-modelled
    reading: The case of a part 121 flightcrew member aged 60 or more is not modelled, because the record does not say whether the pilot flies part 121 operations. The issue date is the examination date and the age is taken on that date.
    ref: faa:61.23(d)
    affects: [atp_privileges]
    approved_by: null
    approved_on: null
