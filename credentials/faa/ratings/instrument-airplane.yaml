credential: Instrument rating (airplane, helicopter, powered-lift)
id: faa.rating.instrument-airplane
kind: rating
authority: FAA
held_on: [Private, Commercial, ATP]
selects:
  ratings: { classes: [IR], authorities: [FAA] }

evaluations:
  - id: instrument_experience
    asks: Has the holder flown 6 approaches, holding and intercepting and tracking courses in the rating's aircraft category in the last 6 calendar months (or passed an instrument proficiency check in that category)?
    source: faa:61.57(c)(1)
    also_cites: [faa:61.57(c)(2), faa:61.57(d)]
    only_for: { not_licence_kinds: [FAA_SPORT, FAA_RECREATIONAL], categories: [aeroplane, helicopter, powered_lift, airship], if_missing: unknown, ref: faa:61.57(c)(1) }
    counting: { within_calendar_months: 6, in_category: true, simulator: include }
    passes_if:
      ref: faa:61.57(c)(1)
      all_of:
        - approaches: { min: 6, ref: faa:61.57(c)(1)(i) }
        - holds: { min: 1, ref: faa:61.57(c)(1)(ii) }
        - intercept_and_track: { min: 1, ref: faa:61.57(c)(1)(iii) }
    restored_by:
      - { ipc: { in_category: true, simulator: include }, ref: [faa:61.57(d)(1), faa:61.57(d)(2)] }
    outcomes:
      - { id: current, when: all_met, status: current, message: rating.ir_current, ref: faa:61.57(c)(1) }
      - { id: tasks_not_logged, when: undetermined, status: unknown, message: rating.ir_tasks_not_logged, ref: policy:unknown-input }
      - { id: grace, when: { met_within: { calendar_months: 6 } }, status: lapsed, message: rating.ir_lapsed_safety_pilot, ref: [faa:61.57(d)(1), policy:recency-lapsed] }
      - { id: ipc_required, when: always, status: expired, message: rating.ir_expired_ipc, ref: faa:61.57(d)(1) }
    description_key: faa_ir

  - id: no_instrument_privileges
    asks: An instrument rating recorded on a sport or recreational certificate carries no privileges.
    source: faa:61.315(c)(13)
    also_cites: [faa:61.101(e)(10)]
    only_for: { licence_kinds: [FAA_SPORT, FAA_RECREATIONAL] }
    outcomes:
      - { id: not_applicable, when: always, status: not_applicable, message: rating.ir_not_applicable, ref: [faa:61.315(c)(13), faa:61.101(e)(10)] }
    description_key: faa_ir

  - id: certificate
    asks: Is the rating held on a pilot certificate whose own requirements (medical, flight review) are met?
    requires_any: [faa.licence.private-airplane, faa.licence.commercial-airplane, faa.licence.atp-airplane]

interpretations:
  - id: any-powered-category
    reading: Instrument currency is kept per aircraft category. The IR rating records its category (airplane, helicopter, powered-lift or airship), and only tasks flown in that category, or in a device representing it, count; helicopter approaches do not keep an airplane instrument rating current. An IR rating recorded without a category is unknown until the category is recorded.
    ref: [faa:61.57(c)(1), faa:61.57(c)(2)]
    affects: [instrument_experience]
    principle: P1
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: grace-from-last-met
    reading: When the tasks were last met more than 6 calendar months ago, the pilot may not fly under IFR as pilot in command, so the result is lapsed. For six more calendar months the pilot can become current again by flying the tasks with a safety pilot, without an instrument proficiency check, and the message says so; after that an IPC is needed.
    ref: [faa:61.57(c), faa:61.57(d)(1)]
    affects: [instrument_experience]
    approved_by: Frederic Jung
    approved_on: 2026-09-28
  - id: ipc-restores
    reading: An instrument proficiency check (an ipc event or a flight flagged as one) restores currency from its date when it was flown in the rating's category, in an aircraft or a device representing that category (the event's recorded category, else its class's); who gave it is not checked.
    ref: [faa:61.57(d)(1), faa:61.57(d)(2)]
    affects: [instrument_experience]
    approved_by: null
    approved_on: null
  - id: intercept-track-recorded
    reading: Intercepting and tracking courses must be recorded on a flight; when no flight in the period records it the result is unknown, never current.
    ref: faa:61.57(c)(1)(iii)
    affects: [instrument_experience]
    approved_by: null
    approved_on: null
  - id: no-recorded-expiry
    reading: FAA ratings are issued without an expiration date; a recorded expiry date is ignored.
    ref: faa:61.19(c)(1)
    affects: [instrument_experience]
    approved_by: null
    approved_on: null
  - id: exceptions-not-modelled
    reading: The exceptions for part 121, 125 and 135 operations are not applied.
    ref: faa:61.57(e)
    affects: [instrument_experience]
    approved_by: null
    approved_on: null
  - id: no-privileges-basis
    reading: A sport or recreational pilot may not fly without visual reference to the surface or below 3 statute miles visibility, so instrument recency does not apply and the result is not_applicable.
    ref: [faa:61.315(c)(12), faa:61.315(c)(13), faa:61.101(e)(9), faa:61.101(e)(10)]
    affects: [no_instrument_privileges]
    approved_by: null
    approved_on: null
