credential: faa.licence.powered-lift-airship-atp
examples:
  - name: passengers-day-current
    evaluation: passengers_day
    says: Three takeoffs and landings as sole manipulator in the AIRSHIP class on 1 July allow an airline transport pilot certificate holder to carry passengers there on 16 August.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-1, licenceId: l-faa, class: AIRSHIP}
      flights:
        - {date: 2026-07-01, class: AIRSHIP, minutes: {total: 90, pic: 90}, takeoffs: {day: 3}, landings: {day: 3}, soleManipulator: true}
    outcome: current
    expect: { message: pax.day_current }
  - name: passengers-day-simulator-not-counted
    evaluation: passengers_day
    says: Landings in a full flight simulator count only under an approved part 142 course, which the record cannot show; an airship pilot with only simulator landings is not current.
    asOf: 2026-08-16
    record:
      licences:
        - { id: l-faa, authority: FAA, type: ATP }
      ratings:
        - { id: r-ship, licenceId: l-faa, class: AIRSHIP }
      flights:
        - { date: 2026-08-10, class: AIRSHIP, isSimulator: true, fstdType: FFS, minutes: { total: 120 }, takeoffs: { day: 6 }, landings: { day: 6 }, soleManipulator: true }
    outcome: lapsed
    expect:
      subject: { kind: passengers, id: l-faa, class: AIRSHIP }
      message: pax.not_current
      params: { needed: 3 }
  - name: passengers-day-type-current
    evaluation: passengers_day_type
    says: Three takeoffs and landings as sole manipulator in an AW609 powered-lift on 1 July allow an airline transport pilot certificate holder to carry passengers there on 16 August.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-1, licenceId: l-faa, class: POWERED_LIFT, typeDesignator: AW609}
      flights:
        - {date: 2026-07-01, class: POWERED_LIFT, typeDesignator: AW609, minutes: {total: 90, pic: 90}, takeoffs: {day: 3}, landings: {day: 3}, soleManipulator: true}
    outcome: current
    expect: { message: pax.day_current }
  - name: passengers-day-type-simulator-not-counted
    evaluation: passengers_day_type
    says: Per type (each rating carries a type designator, so it is a type rating). Landings in a full flight simulator count only under an approved part 142 course, which the record cannot show; a powered-lift pilot with only simulator landings is not current.
    asOf: 2026-08-16
    record:
      licences:
        - { id: l-faa, authority: FAA, type: ATP }
      ratings:
        - { id: r-ship, licenceId: l-faa, class: POWERED_LIFT, typeDesignator: AW609 }
      flights:
        - { date: 2026-08-10, class: POWERED_LIFT, typeDesignator: AW609, isSimulator: true, fstdType: FFS, minutes: { total: 120 }, takeoffs: { day: 6 }, landings: { day: 6 }, soleManipulator: true }
    outcome: lapsed
    expect:
      subject: { kind: passengers, id: l-faa, class: POWERED_LIFT }
      message: pax.not_current
      params: { needed: 3 }
  - name: passengers-night-current
    evaluation: passengers_night
    says: Three night takeoffs and three full-stop night landings as sole manipulator in the AIRSHIP class on 10 July allow an airline transport pilot certificate holder to carry passengers at night there.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-1, licenceId: l-faa, class: AIRSHIP}
      flights:
        - {date: 2026-07-10, class: AIRSHIP, minutes: {total: 90, pic: 90, night: 60}, takeoffs: {night: 3}, nightPeriodTakeoffs: 3, landings: {night: 3}, fullStopNightLandings: 3, soleManipulator: true}
    outcome: current
    expect: { message: pax.night_current }
  - name: passengers-night-day-only
    evaluation: passengers_night
    says: Only day takeoffs and landings in the AIRSHIP class in the last 90 days; night passenger recency has lapsed.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-1, licenceId: l-faa, class: AIRSHIP}
      flights:
        - {date: 2026-07-10, class: AIRSHIP, minutes: {total: 90, pic: 90}, takeoffs: {day: 3}, landings: {day: 3}, soleManipulator: true}
    outcome: lapsed
    expect: { message: pax.night_not_current, params: { needed: 3 } }
  - name: passengers-night-type-current
    evaluation: passengers_night_type
    says: Three night takeoffs and three full-stop night landings as sole manipulator in an AW609 powered-lift on 10 July allow an airline transport pilot certificate holder to carry passengers at night there.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-1, licenceId: l-faa, class: POWERED_LIFT, typeDesignator: AW609}
      flights:
        - {date: 2026-07-10, class: POWERED_LIFT, typeDesignator: AW609, minutes: {total: 90, pic: 90, night: 60}, takeoffs: {night: 3}, nightPeriodTakeoffs: 3, landings: {night: 3}, fullStopNightLandings: 3, soleManipulator: true}
    outcome: current
    expect: { message: pax.night_current }
  - name: passengers-night-type-day-only
    evaluation: passengers_night_type
    says: Only day takeoffs and landings in an AW609 powered-lift in the last 90 days; night passenger recency has lapsed.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-1, licenceId: l-faa, class: POWERED_LIFT, typeDesignator: AW609}
      flights:
        - {date: 2026-07-10, class: POWERED_LIFT, typeDesignator: AW609, minutes: {total: 90, pic: 90}, takeoffs: {day: 3}, landings: {day: 3}, soleManipulator: true}
    outcome: lapsed
    expect: { message: pax.night_not_current, params: { needed: 3 } }
  - name: flight-review-current
    evaluation: flight_review
    says: An airline transport pilot with a flight review on 1 September 2025 may act as pilot in command through 30 September 2027.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      events:
        - {date: 2025-09-01, kind: flight_review, authority: FAA}
    outcome: current
    expect: { message: flight_review.current }
  - name: flight-review-none
    evaluation: flight_review
    says: An airline transport pilot with no flight review, proficiency check or practical test on record may not act as pilot in command.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
    outcome: expired
    expect: { message: flight_review.none_on_record }
  - name: composite-powered-lift-first-class
    composite: true
    says: The powered-lift type rating on an airline transport pilot certificate may be exercised with a first-class medical certificate examined in May 2026 by a pilot under 40.
    asOf: 2026-08-16
    record:
      holder: {dateOfBirth: 1990-01-01}
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-pl, licenceId: l-faa, class: POWERED_LIFT, typeDesignator: AW609}
      credentials:
        - {id: c-med, type: FAA_CLASS1_MEDICAL, issued: 2026-05-01}
      events:
        - {date: 2025-09-01, kind: flight_review, authority: FAA}
    outcome: current
    expect: { subject: { kind: rating, id: r-pl } }
  - name: composite-powered-lift-second-class
    composite: true
    shows: [atp-privileges-medical]
    says: With a second-class medical certificate only, the powered-lift rating on an airline transport pilot certificate may be used for commercial and private privileges; the airline transport privileges are reported as a limitation (the old one-size rule reported them as met).
    asOf: 2026-08-16
    record:
      holder: {dateOfBirth: 1990-01-01}
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-pl, licenceId: l-faa, class: POWERED_LIFT, typeDesignator: AW609}
      credentials:
        - {id: c-med, type: FAA_CLASS2_MEDICAL, issued: 2026-05-01}
      events:
        - {date: 2025-09-01, kind: flight_review, authority: FAA}
    outcome: current
    expect: { subject: { kind: rating, id: r-pl } }
  - name: composite-powered-lift-medical-past-private-duration
    composite: true
    shows: [atp-privileges-medical]
    says: A pilot aged 54 whose first-class certificate was examined in June 2024 had it for private privileges through June 2026; on 16 August the powered-lift rating on the ATP certificate may not be exercised.
    asOf: 2026-08-16
    record:
      holder: {dateOfBirth: 1972-01-01}
      licences:
        - {id: l-faa, authority: FAA, type: ATP}
      ratings:
        - {id: r-pl, licenceId: l-faa, class: POWERED_LIFT, typeDesignator: AW609}
      credentials:
        - {id: c-med, type: FAA_CLASS1_MEDICAL, issued: 2024-06-10}
      events:
        - {date: 2025-09-01, kind: flight_review, authority: FAA}
    outcome: expired
    expect: { subject: { kind: rating, id: r-pl }, decidedBy: { evaluation: medical, credential: faa.medical.first-class@private } }
