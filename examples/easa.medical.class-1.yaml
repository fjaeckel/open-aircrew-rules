credential: easa.medical.class-1
examples:
  - name: validity-age-60
    evaluation: validity
    says: A holder aged 60 on the examination date gets 6 months.
    asOf: 2026-09-15
    record:
      holder: {dateOfBirth: 1966-02-01}
      credentials:
        - {id: c-med, type: EASA_CLASS1_MEDICAL, issued: 2026-08-01}
    outcome: current
    expect: { message: credential.valid }
  - name: validity-expired-day-after
    evaluation: validity
    says: The day after its expiry date the certificate is expired.
    asOf: 2027-03-02
    record:
      holder: {dateOfBirth: 1980-05-20}
      credentials:
        - {id: c-med, type: EASA_CLASS1_MEDICAL, issued: 2026-03-01}
    outcome: expired
    expect: { message: credential.expired }
