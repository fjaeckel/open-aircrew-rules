credential: easa.privilege.sfcl-banner-towing
examples:
  - name: recency-current
    evaluation: recency
    shows: [tows-counted]
    says: 'Five banner tows in the last 24 months keep the towing rating current: three on the window''s first day, one in a TMG and one in an aeroplane; a sailplane tow, a tow in an ultralight and an ordinary TMG flight do not count.'
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-spl, authority: EASA, type: SPL}
      ratings:
        - {id: r-tmg, licenceId: l-spl, class: TMG}
      privileges:
        - {id: p-tow, licenceId: l-spl, kind: BANNER_TOWING}
      flights:
        - {date: 2024-09-15, class: TMG, minutes: {total: 60, pic: 60}, takeoffs: {day: 3}, landings: {day: 3}, launches: 3, towedGliders: 3, towKind: banner, flags: {towFlight: true}}
        - {date: 2026-05-01, class: TMG, minutes: {total: 20, pic: 20}, takeoffs: {day: 1}, landings: {day: 1}, launches: 1, towKind: banner, flags: {towFlight: true}}
        - {date: 2026-06-01, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}, towKind: banner, flags: {towFlight: true}}
        - {date: 2026-06-02, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}, towKind: glider, flags: {towFlight: true}}
        - {date: 2026-07-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: {total: 60, pic: 60}, takeoffs: {day: 4}, landings: {day: 4}, towedGliders: 4, towKind: banner, flags: {towFlight: true}}
        - {date: 2026-08-01, class: TMG, minutes: {total: 90, pic: 90}, takeoffs: {day: 1}, landings: {day: 1}, launches: 1}
    outcome: current
    expect: { message: privilege.recency_current }
  - name: recency-other-kind-not-counted
    evaluation: recency
    shows: [tows-counted]
    says: Four banner tows and three sailplane tows are seven tows, but only the four banner tows count, one short of five.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-spl, authority: EASA, type: SPL}
      ratings:
        - {id: r-tmg, licenceId: l-spl, class: TMG}
      privileges:
        - {id: p-tow, licenceId: l-spl, kind: BANNER_TOWING}
      flights:
        - {date: 2026-05-01, class: TMG, minutes: {total: 90, pic: 90}, takeoffs: {day: 4}, landings: {day: 4}, towedGliders: 4, towKind: banner, flags: {towFlight: true}}
        - {date: 2026-06-01, class: TMG, minutes: {total: 90, pic: 90}, takeoffs: {day: 3}, landings: {day: 3}, towedGliders: 3, towKind: glider, flags: {towFlight: true}}
    outcome: lapsed
    expect: { message: privilege.recency_not_met }
  - name: recency-expired
    evaluation: recency
    says: A towing rating past its expiry date is expired whatever the tows.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-spl, authority: EASA, type: SPL}
      privileges:
        - {id: p-tow, licenceId: l-spl, kind: BANNER_TOWING, expires: 2026-09-14}
      flights:
        - {date: 2026-05-01, class: TMG, minutes: {total: 90, pic: 90}, takeoffs: {day: 5}, landings: {day: 5}, towedGliders: 5, flags: {towFlight: true}}
    outcome: expired
    expect: { message: privilege.expired }
