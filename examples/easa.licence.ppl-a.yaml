credential: easa.licence.ppl-a
examples:
  - name: medical-higher-class
    evaluation: medical
    says: A class 1 certificate includes the privileges of the lower classes.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-1, authority: EASA, type: PPL(A)}
      credentials:
        - {id: c-1, type: EASA_CLASS1_MEDICAL, expires: 2027-01-10}
    expect: { status: current, message: licence.valid }
  - name: medical-expired
    evaluation: medical
    says: An expired medical certificate does not allow exercising the licence.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-1, authority: EASA, type: PPL(A)}
      credentials:
        - {id: c-1, type: EASA_CLASS2_MEDICAL, expires: 2026-09-14}
    expect: { status: expired, message: licence.medical_required }
