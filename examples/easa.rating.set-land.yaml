credential: easa.rating.set-land
examples:
  - name: revalidation-check-met-expiring
    evaluation: revalidation
    says: A proficiency check in the class within the 3 months before expiry revalidates the rating.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: expiring
    expect: { subject: { kind: rating, id: r-set, class: SET_LAND }, message: rating.revalidation_expiring_met, params: {days: 46}, requirements: {proficiency_check: {current: 1, required: 1, met: true, lastDate: 2026-08-20}} }
  - name: revalidation-experience-does-not-count
    evaluation: revalidation
    says: Route sectors and refresher training do not revalidate an SET rating; a check in another class does not count either.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-08-01, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-02, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-03, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-04, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-05, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-06, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-07, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-08, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-09, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-10, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30 }
        - { date: 2026-08-15, class: SET_LAND, minutes: { total: 60, dual: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-08-16, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true } }
    outcome: expiring
    expect: { subject: { kind: rating, id: r-set }, message: rating.revalidation_not_met_prof_check, requirements: {proficiency_check: {current: 0, met: false, remedyKey: remedy.proficiency_check}} }
  - name: revalidation-expired-day-after
    evaluation: revalidation
    says: The day after its expiry date the rating is expired.
    asOf: 2026-11-01
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: expired
    expect: { subject: { kind: rating, id: r-set }, message: rating.expired }
  - name: revalidation-met-current
    evaluation: revalidation
    says: With 92 days to expiry, on the first day of the window, a check makes the rating current.
    asOf: 2026-09-30
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-12-31 }
      flights:
        - { date: 2026-09-30, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: current
    expect: { subject: { kind: rating, id: r-set }, message: rating.revalidation_current }
  - name: revalidation-no-expiry-date
    evaluation: revalidation
    says: Without an expiry date the window cannot be placed.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: unknown
    expect: { subject: { kind: rating, id: r-set }, message: rating.no_expiry_date }
  - name: revalidation-simulator-check
    evaluation: revalidation
    shows: [check-in-aeroplane]
    says: A proficiency check recorded in an FFS of the class counts for an SET rating (Appendix 9, Section A, point 1c(a)).
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, isSimulator: true, fstdType: FFS, minutes: { total: 60 }, flags: { proficiencyCheck: true } }
    outcome: expiring
    expect: { subject: { kind: rating, id: r-set }, message: rating.revalidation_expiring_met, requirements: {ffs_check: {current: 1, met: true}} }
  - name: revalidation-fnpt-check-does-not-count
    evaluation: revalidation
    shows: [check-in-aeroplane]
    says: A proficiency check recorded only in an FNPT does not count; the record cannot show that the aircraft part of a combined FSTD and aircraft check was flown.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, isSimulator: true, fstdType: FNPT, minutes: { total: 60 }, flags: { proficiencyCheck: true } }
    outcome: expiring
    expect: { subject: { kind: rating, id: r-set }, message: rating.revalidation_not_met_prof_check, requirements: {proficiency_check: {current: 0, met: false}, ffs_check: {current: 0, met: false}} }
  - name: revalidation-valid-on-expiry-day
    evaluation: revalidation
    says: On its expiry date the rating is still valid.
    asOf: 2026-10-31
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: expiring
    expect: { subject: { kind: rating, id: r-set }, message: rating.revalidation_expiring_met, params: {days: 0} }
  - name: revalidation-window-edges
    evaluation: revalidation
    says: A check on 31 July, 3 months before the 31 October expiry, counts; one on 30 July does not.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-07-30, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
        - { date: 2026-07-31, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: expiring
    expect: { subject: { kind: rating, id: r-set }, message: rating.revalidation_expiring_met, requirements: {proficiency_check: {current: 1, lastDate: 2026-07-31}} }
  - name: revalidation-window-not-open
    evaluation: revalidation
    says: Earlier than 3 months before expiry the revalidation window is not open.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2027-06-30 }
      flights: []
    outcome: current
    expect: { subject: { kind: rating, id: r-set }, message: rating.window_not_open, params: {date: 2027-03-30} }
  - name: passengers-day-current
    evaluation: passengers_day
    says: Three take-offs and landings as pilot flying in an SET land aeroplane within 90 days allow carrying passengers.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: SET_LAND, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, pilotFlying: true }
    outcome: current
    expect: { subject: { kind: passengers, id: l-1, class: SET_LAND }, message: pax.day_current }
  - name: passengers-day-one-short
    evaluation: passengers_day
    says: Two take-offs and landings are one short.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: SET_LAND, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 }, pilotFlying: true }
    outcome: expired
    expect: { subject: { kind: passengers, id: l-1, class: SET_LAND }, message: pax.not_current, params: { needed: 1 } }
  - name: passengers-night-current
    evaluation: passengers_night
    says: One night take-off and landing as pilot flying in an SET land aeroplane within 90 days allow carrying passengers at night.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: SET_LAND, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60, night: 60 }, takeoffs: { night: 1 }, landings: { night: 1 }, pilotFlying: true }
    outcome: current
    expect: { subject: { kind: passengers, id: l-1, class: SET_LAND }, message: pax.night_current }
  - name: passengers-night-day-only
    evaluation: passengers_night
    says: Day take-offs and landings do not count for night passengers.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: SET_LAND, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: SET_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, pilotFlying: true }
    outcome: expired
    expect: { subject: { kind: passengers, id: l-1, class: SET_LAND }, message: pax.night_not_current }
  - name: variants-flown
    evaluation: variants
    shows: [variant-is-recorded-variant]
    says: A flight in the variant within 2 years keeps its privileges.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: SET_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-1, ratingId: r-1, name: GLASS_COCKPIT, issued: 2023-05-01 }
      flights:
        - { date: 2026-03-10, class: SET_LAND, variant: GLASS_COCKPIT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: { subject: { kind: type, id: v-1 }, message: type.current, validUntil: 2028-03-10 }
  - name: variants-not-flown
    evaluation: variants
    says: The variant was last flown more than 2 years ago; flights without it do not count, so it may not be flown before differences training or a proficiency check in it.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: SET_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-1, ratingId: r-1, name: GLASS_COCKPIT, issued: 2023-05-01 }
      flights:
        - { date: 2024-08-01, class: SET_LAND, variant: GLASS_COCKPIT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-04-10, class: SET_LAND, variant: STANDARD, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: lapsed
    expect: { subject: { kind: type, id: v-1 }, message: type.not_flown, requirements: { variant_flown: { current: 0, met: false, remedyKey: remedy.differences_training } } }
  - name: revalidation-not-applicable-other-items
    evaluation: revalidation
    shows: [part-fcl-licences]
    says: MEP ratings and SET ratings on ultralight licences are not evaluated here; only the SET land rating on the EASA licence is (legacy not-applicable case with that rating added).
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
        - { id: l-dulv, authority: DAEC, type: UL }
      ratings:
        - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
        - { id: r-dulv, licenceId: l-dulv, class: SET_LAND, expires: 2026-10-31 }
        - { id: r-set, licenceId: l-ppl, class: SET_LAND, expires: 2027-12-31 }
    outcome: current
    expect: { message: rating.window_not_open }
