credential: de.rating.ul-three-axis
examples:
  - name: current-by-experience
    evaluation: recency
    shows: [scope-of-closing-words, counted-aircraft, three-axis-includes-motorgliders]
    says: Three-axis UL, UL motorglider, SEP(land) and TMG time pools to 12 hours with 6 hours PIC and 12 take-offs and landings; the aerotowed UL motorglider flight with an instructor counts and is the training flight. The first flight falls on the first day of the 24 months, so the rating stays current through the date evaluated only.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2024-09-15, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 120, pic: 120 }, takeoffs: { day: 3 }, landings: { day: 3 } }
        - { date: 2025-06-01, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 6 }, landings: { day: 6 } }
        - { date: 2026-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS_MOTORGLIDER, launchMethod: aerotow, minutes: { total: 240, pic: 180, dual: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
        - { date: 2026-07-01, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect:
      subject: { kind: rating, id: r-3ax, class: ULTRALIGHT, ulKind: THREE_AXIS }
      message: rating.recency_current
      validUntil: 2026-09-15
      requirements:
        total_time: { current: 720, required: 720, met: true }
        pic_time: { current: 660, met: true }
        takeoffs: { current: 12, met: true }
        landings: { current: 12, met: true }
        training_flight: { current: 240, met: true }
        proficiency_check: { current: 0, met: false, remedyKey: remedy.proficiency_check }

  - name: kind-unknown
    evaluation: recency
    shows: [kindless-flights-unknown]
    says: Every ultralight flight in the 24 months has no ultralight kind recorded; they cannot be classified as three-axis flights, so the recency is unknown rather than met or lapsed.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2026-04-01, class: ULTRALIGHT, minutes: { total: 720, pic: 660, dual: 60 }, takeoffs: { day: 12 }, landings: { day: 12 } }
    outcome: unknown
    expect:
      subject: { kind: rating, id: r-3ax }
      message: rating.ul_flights_kind_unknown
      requirements:
        total_time: { tracked: false, met: false }
        training_flight: { tracked: false }
        proficiency_check: { tracked: true, met: false }

  - name: not-applicable
    evaluation: recency
    says: 'Only three-axis ultralight ratings on a German ultralight licence (LBA, DULV, DAeC) are evaluated: not a trike rating, a rating with no kind, an ultralight rating on an EASA or FAA licence, or an SEP rating (a second result would fail the example).'
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
        - { id: l-easa, authority: EASA, type: PPL(A) }
        - { id: l-faa, authority: FAA, type: PRIVATE }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
        - { id: r-ws, licenceId: l-ul, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT }
        - { id: r-none, licenceId: l-ul, class: ULTRALIGHT }
        - { id: r-easa-ul, licenceId: l-easa, class: ULTRALIGHT, ulKind: THREE_AXIS }
        - { id: r-faa-ul, licenceId: l-faa, class: ULTRALIGHT, ulKind: THREE_AXIS }
        - { id: r-sep, licenceId: l-easa, class: SEP_LAND, expires: 2027-01-31 }
    outcome: lapsed
    expect: { message: rating.recency_not_met }

  - name: proficiency-check
    evaluation: recency
    shows: [proficiency-check-period]
    says: A proficiency check with an examiner in an SEP(land) aeroplane replaces the experience (§ 45(3)); it keeps the rating current until it leaves the 24 months.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DAeC, type: Luftsportgeräteführer }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2026-03-01, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: current
    expect:
      subject: { kind: rating, id: r-3ax }
      message: rating.recency_current
      validUntil: 2028-03-01
      requirements:
        proficiency_check: { current: 1, met: true }
        total_time: { current: 60, met: false }

  - name: takeoffs-short
    evaluation: recency
    shows: [takeoffs-and-landings]
    says: Twelve landings but only eleven take-offs (a touch-and-go logged as a landing only); the article asks for 12 take-offs and 12 landings.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2026-04-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 660, pic: 600 }, takeoffs: { day: 11 }, landings: { day: 12 } }
        - { date: 2026-04-02, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, dual: 60 } }
    outcome: lapsed
    expect:
      subject: { kind: rating, id: r-3ax }
      message: rating.recency_not_met
      requirements:
        takeoffs: { current: 11, met: false, remedyParams: { missing: 1, unit: takeoffs } }
        landings: { current: 12, met: true }
        training_flight: { current: 60, met: true }

  - name: training-flight-only-on-ultralight
    evaluation: recency
    shows: [training-flight-as-dual, counted-aircraft]
    says: Twelve hours including dual time in an SEP aeroplane; the training flight with an instructor must be flown on a three-axis ultralight, and dual time is not PIC time. Trike, gyroplane and single-engine turbine flights never count.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: lba, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2026-01-10, class: SEP_LAND, minutes: { total: 420, dual: 420 }, takeoffs: { day: 12 }, landings: { day: 12 } }
        - { date: 2026-02-10, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 300, pic: 300 } }
        - { date: 2026-03-10, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: { total: 600, pic: 540, dual: 60 }, takeoffs: { day: 10 }, landings: { day: 10 } }
        - { date: 2026-03-11, class: ULTRALIGHT, ulKind: GYROPLANE, minutes: { total: 600, pic: 600 }, takeoffs: { day: 10 }, landings: { day: 10 } }
        - { date: 2026-03-12, class: SET_LAND, minutes: { total: 600, pic: 600 }, takeoffs: { day: 10 }, landings: { day: 10 } }
    outcome: lapsed
    expect:
      subject: { kind: rating, id: r-3ax }
      message: rating.recency_not_met
      requirements:
        total_time: { current: 720, met: true }
        pic_time: { current: 300, met: false }
        takeoffs: { current: 12, met: true }
        landings: { current: 12, met: true }
        training_flight: { current: 0, met: false, remedyKey: remedy.training_flight }

  - name: window-day-before
    evaluation: recency
    shows: [licence-without-expiry]
    says: The same flights one day later; the flight of 14 September 2024 is outside the 24 months, so time, take-offs and landings fall short and the privileges lapse. The recorded rating expiry is ignored; the licence itself does not expire.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS, expires: 2025-01-01 }
      flights:
        - { date: 2024-09-14, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 120, pic: 120 }, takeoffs: { day: 3 }, landings: { day: 3 } }
        - { date: 2025-06-01, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 6 }, landings: { day: 6 } }
        - { date: 2026-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS_MOTORGLIDER, minutes: { total: 240, pic: 180, dual: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
        - { date: 2026-07-01, class: TMG, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: lapsed
    expect:
      subject: { kind: rating, id: r-3ax }
      message: rating.recency_not_met
      requirements:
        total_time: { current: 600, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 120, unit: minutes } }
        pic_time: { current: 540, met: true }
        takeoffs: { current: 9, met: false, remedyParams: { missing: 3, unit: takeoffs } }
        landings: { current: 9, met: false }
        training_flight: { met: true }
        proficiency_check: { current: 0, met: false }

  - name: pax-authorisation-missing
    evaluation: passengers
    shows: [authorisation-recorded, authorisation-progress-informational, xc-200-km-per-flight]
    says: Recency met, but the passenger authorisation on this licence expired and the one on the other licence does not count; the status is unknown with the progress toward § 84a(2). Five cross-country flights with an instructor since the licence was issued on 1 March 2025 (the one on 28 February does not count), two of them with an intermediate landing over at least 200 km.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DAeC, type: UL, issued: 2025-03-01 }
        - { id: l-other, authority: DULV, type: UL, issued: 2019-01-01 }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      privileges:
        - { id: p-old, licenceId: l-ul, kind: UL_PASSENGER_AUTH, expires: 2026-01-01 }
        - { id: p-other, licenceId: l-other, kind: UL_PASSENGER_AUTH }
      flights:
        - { date: 2025-02-28, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 120, dual: 120, crossCountry: 120 }, landings: { day: 2 }, distanceKm: 250 }
        - { date: 2025-03-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 120, dual: 120, crossCountry: 120 }, landings: { day: 2 }, distanceKm: 210 }
        - { date: 2025-04-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 150, dual: 150, crossCountry: 150 }, landings: { day: 3 }, distanceKm: 260 }
        - { date: 2025-04-02, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, dual: 60, crossCountry: 60 }, landings: { day: 1 }, distanceKm: 90 }
        - { date: 2025-04-03, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, dual: 60, crossCountry: 60 }, landings: { day: 1 }, distanceKm: 90 }
        - { date: 2025-04-04, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, dual: 60, crossCountry: 60 }, landings: { day: 1 }, distanceKm: 90 }
        - { date: 2025-04-05, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, pic: 60, crossCountry: 60 }, landings: { day: 2 }, distanceKm: 300 }
        - { date: 2026-09-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 } }
    outcome: unknown
    expect:
      subject: { kind: passengers, id: l-ul, ulKind: THREE_AXIS }
      message: pax.ul_authorisation_missing
      requirements:
        day: { current: 3, met: true }
        ul_xc_flights: { current: 5, required: 5, met: true }
        ul_xc_landing_flights: { current: 2, required: 2, met: true }

  - name: pax-current-authorised
    evaluation: passengers
    shows: [same-kind-any-role, three-axis-includes-motorgliders, day-only]
    says: Three take-offs and landings on three-axis ultralights (one on a UL motorglider) in the preceding 90 days, the first on the first day of the window, and a recorded passenger authorisation; passengers may be carried by day until 15 September. No progress rows are shown once the authorisation is held.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL, issued: 2020-05-01 }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      privileges:
        - { id: p-pax, licenceId: l-ul, kind: UL_PASSENGER_AUTH, detail: THREE_AXIS }
      flights:
        - { date: 2026-06-17, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-08-01, class: ULTRALIGHT, ulKind: THREE_AXIS_MOTORGLIDER, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
        - { date: 2026-08-02, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 5 }, landings: { day: 5 } }
    outcome: current
    expect:
      subject: { kind: passengers, id: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      message: pax.current_day_no_night_privilege
      validUntil: 2026-09-15
      requirements:
        day: { current: 3, required: 3, met: true }
        ul_xc_flights: { absent: true }
        ul_xc_landing_flights: { absent: true }

  - name: pax-deemed-by-ppl
    evaluation: passengers
    shows: [deemed-authorisation]
    says: A three-axis pilot holds a valid PPL(A), but the record does not show that it was valid when the ultralight licence was issued (§ 84a(2) second sentence deems the authorisation granted on that day), and no authorisation is recorded on the ultralight licence; with the recency met the status is unknown and asks for the authorisation, and the progress rows are shown.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL, issued: 2021-01-01 }
        - { id: l-ppl, authority: LBA, type: PPL(A) }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-05-31 }
      flights:
        - { date: 2026-09-10, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 45, pic: 45 }, takeoffs: { day: 3 }, landings: { day: 3 } }
    outcome: unknown
    expect:
      subject: { kind: passengers, id: l-ul }
      message: pax.ul_authorisation_missing
      requirements:
        day: { current: 3, met: true }
        ul_xc_flights: { current: 0, met: false }

  - name: pax-kind-unknown
    evaluation: passengers
    shows: [same-kind-any-role]
    says: The only take-offs and landings in 90 days were on an ultralight with no kind recorded; they cannot be shown to be "derselben Art" and are not counted.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      privileges:
        - { id: p-pax, licenceId: l-ul, kind: UL_PASSENGER_AUTH }
      flights:
        - { date: 2026-09-01, class: ULTRALIGHT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 } }
    outcome: expired
    expect:
      subject: { kind: passengers, id: l-ul }
      message: pax.not_current
      requirements:
        day: { tracked: false, met: false }

  - name: pax-not-applicable
    evaluation: passengers
    says: 'Only the three-axis rating on the ultralight licence gets this passenger evaluation: trike ratings follow their own credential, and a rating with no kind or three-axis ratings on EASA or FAA licences get none (a second result would fail the example).'
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
        - { id: l-easa, authority: EASA, type: PPL(A) }
        - { id: l-faa, authority: FAA, type: SPORT }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
        - { id: r-ws, licenceId: l-ul, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT }
        - { id: r-none, licenceId: l-ul, class: ULTRALIGHT }
        - { id: r-easa-ul, licenceId: l-easa, class: ULTRALIGHT, ulKind: THREE_AXIS }
        - { id: r-faa-ul, licenceId: l-faa, class: ULTRALIGHT, ulKind: THREE_AXIS }
    outcome: expired
    expect: { message: pax.not_current }

  - name: pax-progress-short-distance-unknown
    evaluation: passengers
    shows: [authorisation-progress-informational, xc-200-km-per-flight]
    says: No authorisation and no recency; two cross-country flights with an instructor so far, one landing flight covers 210 km, the other has no distance recorded and cannot be counted.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL, issued: 2025-03-01 }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2025-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 120, dual: 120, crossCountry: 120 }, landings: { day: 2 }, distanceKm: 210 }
        - { date: 2025-05-02, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 120, dual: 120, crossCountry: 120 }, landings: { day: 2 } }
    outcome: expired
    expect:
      subject: { kind: passengers, id: l-ul }
      message: pax.not_current
      params: { needed: 3 }
      requirements:
        day: { current: 0, met: false }
        ul_xc_flights: { current: 2, met: false, remedyParams: { missing: 3, unit: flights } }
        ul_xc_landing_flights: { current: 1, met: false, tracked: true }

  - name: pax-takeoffs-not-logged
    evaluation: passengers
    shows: [same-kind-any-role]
    says: Three landings in 90 days on three-axis ultralights, but one of the three flights logs no take-off; only the logged take-offs count, so the pilot has two take-offs and landings.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL, issued: 2020-05-01 }
      ratings:
        - { id: r-ul, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      privileges:
        - { id: p-pax, licenceId: l-ul, kind: UL_PASSENGER_AUTH, detail: THREE_AXIS }
      flights:
        - { date: 2026-08-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-08-02, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-08-03, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 30, pic: 30 }, landings: { day: 1 } }
    outcome: expired
    expect:
      subject: { kind: passengers, class: ULTRALIGHT, id: l-ul, ulKind: THREE_AXIS }
      message: pax.not_current
      requirements:
        day: { current: 2, met: false }

  - name: pax-towed-launches
    evaluation: passengers
    shows: [same-kind-any-role]
    says: Three take-offs and landings in 90 days on a three-axis UL motorglider launched by aerotow count toward passenger recency like any other.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL, issued: 2020-05-01 }
      ratings:
        - { id: r-ul, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      privileges:
        - { id: p-pax, licenceId: l-ul, kind: UL_PASSENGER_AUTH, detail: THREE_AXIS }
      flights:
        - { date: 2026-08-01, class: ULTRALIGHT, ulKind: THREE_AXIS_MOTORGLIDER, launchMethod: aerotow, minutes: { total: 90, pic: 90 }, takeoffs: { day: 3 }, landings: { day: 3 } }
    outcome: current
    expect:
      subject: { kind: passengers, class: ULTRALIGHT, id: l-ul, ulKind: THREE_AXIS }
      message: pax.current_day_no_night_privilege
      requirements:
        day: { current: 3, met: true }

  - name: pax-window-day-before
    evaluation: passengers
    says: The take-off and landing of 16 June is one day outside the 90 days, and SEP landings never count; the pilot needs one more take-off and landing before carrying passengers.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL, issued: 2020-05-01 }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      privileges:
        - { id: p-pax, licenceId: l-ul, kind: UL_PASSENGER_AUTH, detail: THREE_AXIS }
      flights:
        - { date: 2026-06-16, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-08-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
        - { date: 2026-08-02, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 5 }, landings: { day: 5 } }
    outcome: expired
    expect:
      subject: { kind: passengers, id: l-ul }
      message: pax.not_current
      params: { needed: 1 }
      requirements:
        day: { current: 2, met: false, remedyKey: remedy.fly_more, remedyParams: { missing: 1, unit: landings } }

  - name: composite-may-fly
    composite: true
    says: With the § 45(2) experience met on an ultralight licence, three-axis ultralights may be flown; missing passenger recency only limits the passenger privilege.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2026-01-10, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 660, pic: 660 }, takeoffs: { day: 11 }, landings: { day: 11 } }
        - { date: 2026-02-10, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 60, dual: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: { subject: { kind: rating, id: r-3ax } }

  - name: composite-recency-lapsed
    composite: true
    says: Without the § 45(2) experience or a proficiency check the privileges of the three-axis kind may not be exercised; the recency decides.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ul, authority: DULV, type: UL }
      ratings:
        - { id: r-3ax, licenceId: l-ul, class: ULTRALIGHT, ulKind: THREE_AXIS }
      flights:
        - { date: 2026-01-10, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: { total: 120, pic: 120 }, takeoffs: { day: 2 }, landings: { day: 2 } }
    outcome: lapsed
    expect: { subject: { kind: rating, id: r-3ax }, decidedBy: { evaluation: recency } }
