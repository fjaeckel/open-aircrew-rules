credential: easa.medical.class-2
examples:
  - name: validity-age-50
    evaluation: validity
    shows: [age-bands]
    says: Issued at 50 the certificate runs 12 months.
    asOf: 2026-09-15
    record:
      holder: {dateOfBirth: 1976-01-01}
      credentials:
        - {id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2026-06-01}
    outcome: current
    expect: { message: credential.valid }
  - name: validity-entered-date-earlier
    evaluation: validity
    shows: [earlier-expiry-wins]
    says: An entered expiry date earlier than the derived one is used.
    asOf: 2026-09-15
    record:
      holder: {dateOfBirth: 1980-05-20}
      credentials:
        - {id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2026-03-01, expires: 2026-12-31}
    outcome: current
    expect: { message: credential.valid }
  - name: validity-age-49-capped-at-51
    evaluation: validity
    says: Issued at 49 the certificate would run 24 months but ends on the 51st birthday.
    asOf: 2026-09-15
    record:
      holder: {dateOfBirth: 1977-01-01}
      credentials:
        - {id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2026-01-10}
    outcome: current
    expect: { message: credential.valid }
  - name: validity-expired-day-after
    evaluation: validity
    says: The day after its expiry date the certificate is expired.
    asOf: 2028-03-02
    record:
      holder: {dateOfBirth: 1980-05-20}
      credentials:
        - {id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2026-03-01}
    outcome: expired
    expect: { message: credential.expired }
  - name: validity-age-on-examination-date
    evaluation: validity
    shows: [counted-from]
    says: Examined at 49 and revalidated from the previous expiry date after the 50th birthday, the 24-month band of the examination age applies, capped at the 51st birthday.
    asOf: 2027-09-30
    record:
      holder: {dateOfBirth: 1976-10-01}
      credentials:
        - {id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2026-09-01, validFrom: 2026-10-15}
    outcome: expiring
    expect: { message: credential.revalidation_window_open, expiresOn: 2027-10-01 }
  - name: validity-age-on-examination-date-capped
    evaluation: validity
    shows: [counted-from]
    says: The certificate ends on the 51st birthday; the 12 months the age at the start of the period would give (to 15 October) do not apply.
    asOf: 2027-10-05
    record:
      holder: {dateOfBirth: 1976-10-01}
      credentials:
        - {id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2026-09-01, validFrom: 2026-10-15}
    outcome: expired
    expect: { message: credential.expired }
