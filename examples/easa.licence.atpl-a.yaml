credential: easa.licence.atpl-a
examples:
  - name: medical-class-1-valid
    evaluation: medical
    shows: [licence-authorities]
    says: A valid class 1 medical certificate allows exercising the ATPL(A).
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: ATPL(A) }
      credentials:
        - { id: c-1, type: EASA_CLASS1_MEDICAL, expires: 2027-01-10 }
    outcome: current
    expect: { message: licence.valid }
  - name: medical-class-2-not-enough
    evaluation: medical
    shows: [class-1-only]
    says: A class 2 medical certificate is not enough for the ATPL(A).
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: ATPL(A) }
      credentials:
        - { id: c-1, type: EASA_CLASS2_MEDICAL, expires: 2027-09-14 }
    outcome: expired
    expect: { message: licence.medical_required }
  - name: medical-none-recorded
    evaluation: medical
    says: With no medical certificate recorded the result is unknown, not expired.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: ATPL(A) }
    outcome: unknown
    expect: { message: licence.medical_not_recorded }
  - name: composite-class-1-and-language-valid
    composite: true
    says: With a valid class 1 medical and a valid language endorsement the ATPL(A) may be exercised.
    asOf: 2026-09-15
    record:
      holder: { dateOfBirth: 1976-01-01 }
      licences:
        - { id: l-1, authority: EASA, type: ATPL(A) }
      credentials:
        - { id: c-med, type: EASA_CLASS1_MEDICAL, issued: 2026-06-01 }
        - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
    outcome: current
    expect: { subject: { kind: licence, id: l-1 } }
  - name: composite-class-2-private-privileges
    composite: true
    shows: [class-1-only]
    says: With a valid class 2 medical certificate the ATPL(A) may be exercised within its private privileges; the commercial privileges are listed as limited, not deciding.
    asOf: 2026-09-15
    record:
      holder: { dateOfBirth: 1976-01-01 }
      licences:
        - { id: l-1, authority: EASA, type: ATPL(A) }
      credentials:
        - { id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2026-06-01 }
        - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
    outcome: current
    expect: { subject: { kind: licence, id: l-1 } }
  - name: composite-class-1-at-class-2-validity
    composite: true
    shows: [class-1-only]
    says: A class 1 certificate past its 12 class 1 months (no expiry date recorded) is still valid at class 2, so the ATPL(A) may be exercised within its private privileges.
    asOf: 2026-09-15
    record:
      holder: { dateOfBirth: 1980-05-20 }
      licences:
        - { id: l-1, authority: EASA, type: ATPL(A) }
      credentials:
        - { id: c-med, type: EASA_CLASS1_MEDICAL, issued: 2025-03-01 }
        - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
    outcome: current
    expect: { subject: { kind: licence, id: l-1 } }
  - name: composite-class-2-expired
    composite: true
    shows: [class-1-only]
    says: With the only medical certificate, a class 2 one, expired the ATPL(A) may not be exercised at all; the private-privilege medical decides.
    asOf: 2026-09-15
    record:
      holder: { dateOfBirth: 1976-01-01 }
      licences:
        - { id: l-1, authority: EASA, type: ATPL(A) }
      credentials:
        - { id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2024-06-01 }
        - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
    outcome: expired
    expect: { subject: { kind: licence, id: l-1 }, decidedBy: { evaluation: medical_private, credential: easa.medical.class-2 } }
