credential: easa.rating.sep-sea
examples:
  - name: revalidation-sep-sea-not-pooled-with-tmg
    evaluation: revalidation
    shows: [no-land-sea-pooling]
    says: SEP(sea) and TMG do not pool; each class counts only its own flights.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2026-10-31}
        - {id: r-tmg, licenceId: l-ppl, class: TMG, expires: 2026-10-31}
      flights:
        - {date: 2026-03-10, class: SEP_SEA, minutes: {total: 300, pic: 300}, takeoffs: {day: 5}, landings: {day: 5}}
        - {date: 2026-05-20, class: TMG, minutes: {total: 60, dual: 60}, takeoffs: {day: 2}, landings: {day: 2}}
        - {date: 2026-06-12, class: TMG, minutes: {total: 360, pic: 60, dual: 300}, takeoffs: {day: 5}, landings: {day: 5}}
    outcome: expiring
    expect: { message: rating.revalidation_not_met }
  - name: revalidation-experience-in-sea
    evaluation: revalidation
    says: 12 hours in SEP sea aeroplanes, 6 as PIC, 12 take-offs and landings and 1 hour of dual in the 12 months before expiry revalidate the rating.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2027-03-31}
      flights:
        - {date: 2026-09-01, class: SEP_SEA, minutes: {total: 720, pic: 660, dual: 60}, takeoffs: {day: 12}, landings: {day: 12}}
    outcome: current
    expect: { message: rating.revalidation_current }
  - name: passengers-day-current
    evaluation: passengers_day
    says: Three take-offs and landings as pilot flying in the class within 90 days.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2027-06-30}
      flights:
        - {date: 2026-08-20, class: SEP_SEA, minutes: {total: 60, pic: 60}, takeoffs: {day: 3}, landings: {day: 3}, pilotFlying: true}
    outcome: current
    expect: { message: pax.day_current }
  - name: passengers-day-one-short
    evaluation: passengers_day
    says: Two take-offs and landings are one short.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2027-06-30}
      flights:
        - {date: 2026-08-20, class: SEP_SEA, minutes: {total: 60, pic: 60}, takeoffs: {day: 2}, landings: {day: 2}, pilotFlying: true}
    outcome: expired
    expect: { message: pax.not_current, params: { needed: 1 } }
  - name: passengers-night-current
    evaluation: passengers_night
    says: One night take-off and landing as pilot flying in the class within 90 days.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2027-06-30}
      flights:
        - {date: 2026-08-20, class: SEP_SEA, minutes: {total: 60, pic: 60}, takeoffs: {night: 1}, landings: {night: 1}, pilotFlying: true}
    outcome: current
    expect: { message: pax.night_current }
  - name: passengers-night-day-only
    evaluation: passengers_night
    says: Day take-offs and landings do not count for night passengers.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2027-06-30}
      flights:
        - {date: 2026-08-20, class: SEP_SEA, minutes: {total: 60, pic: 60}, takeoffs: {day: 3}, landings: {day: 3}, pilotFlying: true}
    outcome: expired
    expect: { message: pax.night_not_current }
  - name: variants-flown
    evaluation: variants
    says: A flight on the SEP sea variant within 2 years keeps the privilege; a flight on another variant does not count for it.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2027-06-30 }
      variants:
        - { id: v-float, ratingId: r-sea, name: AMPHIBIAN }
      flights:
        - { date: 2026-03-10, class: SEP_SEA, variant: AMPHIBIAN, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-04-10, class: SEP_SEA, variant: FLOAT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: { subject: { kind: type, id: v-float }, message: type.current, validUntil: 2028-03-10 }
  - name: variants-not-flown
    evaluation: variants
    says: The SEP sea variant was last flown more than 2 years ago; before flying it again the pilot needs differences training, a proficiency check or refresher training in it.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sea, licenceId: l-ppl, class: SEP_SEA, expires: 2027-06-30 }
      variants:
        - { id: v-float, ratingId: r-sea, name: AMPHIBIAN }
      flights:
        - { date: 2024-08-01, class: SEP_SEA, variant: AMPHIBIAN, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: lapsed
    expect: { subject: { kind: type, id: v-float }, message: type.not_flown, requirements: { variant_flown: { current: 0, met: false } } }
