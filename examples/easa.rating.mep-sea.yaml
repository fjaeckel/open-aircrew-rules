credential: easa.rating.mep-sea
examples:
  - name: revalidation-check-with-examiner-sector
    evaluation: revalidation
    shows: [examiner-sector]
    says: A proficiency check in an MEP sea aeroplane with a cruise of 30 minutes is both the check and the route sector flown with an examiner.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2026-10-31 }
      flights:
        - { date: 2026-09-01, class: MEP_SEA, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: expiring
    expect: { message: rating.revalidation_expiring_met }
  - name: revalidation-land-check-does-not-count
    evaluation: revalidation
    shows: [part-fcl-licences]
    says: A check in an MEP land aeroplane does not revalidate the MEP sea rating; each class counts its own checks and sectors.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2026-10-31 }
      flights:
        - { date: 2026-09-01, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 30, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: expiring
    expect: { message: rating.revalidation_not_met_prof_check }
  - name: passengers-day-current
    evaluation: passengers_day
    says: Three take-offs and landings as pilot flying in an MEP sea aeroplane within 90 days allow carrying passengers.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: MEP_SEA, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, pilotFlying: true }
    outcome: current
    expect: { subject: { kind: passengers, id: l-1, class: MEP_SEA }, message: pax.day_current }
  - name: passengers-day-one-short
    evaluation: passengers_day
    says: Two take-offs and landings are one short.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: MEP_SEA, minutes: { total: 60, pic: 60 }, takeoffs: { day: 2 }, landings: { day: 2 }, pilotFlying: true }
    outcome: expired
    expect: { subject: { kind: passengers, id: l-1, class: MEP_SEA }, message: pax.not_current, params: { needed: 1 } }
  - name: passengers-night-current
    evaluation: passengers_night
    says: One night take-off and landing as pilot flying in an MEP sea aeroplane within 90 days allow carrying passengers at night.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: MEP_SEA, minutes: { total: 60, pic: 60, night: 60 }, takeoffs: { night: 1 }, landings: { night: 1 }, pilotFlying: true }
    outcome: current
    expect: { subject: { kind: passengers, id: l-1, class: MEP_SEA }, message: pax.night_current }
  - name: passengers-night-day-only
    evaluation: passengers_night
    says: Day take-offs and landings do not count for night passengers.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2027-06-30 }
      flights:
        - { date: 2026-08-20, class: MEP_SEA, minutes: { total: 60, pic: 60 }, takeoffs: { day: 3 }, landings: { day: 3 }, pilotFlying: true }
    outcome: expired
    expect: { subject: { kind: passengers, id: l-1, class: MEP_SEA }, message: pax.night_not_current }
  - name: variants-flown
    evaluation: variants
    shows: [variant-is-recorded-variant]
    says: A flight in the variant within 2 years keeps its privileges.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2027-06-30 }
      variants:
        - { id: v-1, ratingId: r-1, name: GLASS_COCKPIT, issued: 2023-05-01 }
      flights:
        - { date: 2026-03-10, class: MEP_SEA, variant: GLASS_COCKPIT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: { subject: { kind: type, id: v-1 }, message: type.current, validUntil: 2028-03-10 }
  - name: variants-not-flown
    evaluation: variants
    says: The variant was last flown more than 2 years ago; flights without it do not count, so it may not be flown before differences training or a proficiency check in it.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-1, licenceId: l-1, class: MEP_SEA, expires: 2027-06-30 }
      variants:
        - { id: v-1, ratingId: r-1, name: GLASS_COCKPIT, issued: 2023-05-01 }
      flights:
        - { date: 2024-08-01, class: MEP_SEA, variant: GLASS_COCKPIT, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-04-10, class: MEP_SEA, variant: STANDARD, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: lapsed
    expect: { subject: { kind: type, id: v-1 }, message: type.not_flown, requirements: { variant_flown: { current: 0, met: false, remedyKey: remedy.differences_training } } }
