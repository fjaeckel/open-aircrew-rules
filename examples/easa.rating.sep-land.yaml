credential: easa.rating.sep-land
examples:
  - name: revalidation-proficiency-check
    evaluation: revalidation
    shows: [examiner-not-checked]
    says: A proficiency check in the class within the 3 months before expiry revalidates the rating without the experience route.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31}
      flights:
        - {date: 2026-08-01, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}, flags: {proficiencyCheck: true, examinerOnBoard: true}}
    outcome: expiring
    expect: { message: rating.revalidation_expiring_met }
  - name: revalidation-refresher-exempt-by-skill-test
    evaluation: revalidation
    shows: [exemption-period, exemption-any-aeroplane]
    says: A skill test in another aeroplane class exempts from the refresher training; one in a helicopter would not.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31}
      events:
        - {date: 2026-02-01, kind: skill_test, class: MEP_LAND}
        - {date: 2026-02-02, kind: skill_test, class: HELICOPTER}
      flights:
        - {date: 2026-03-10, class: SEP_LAND, minutes: {total: 720, pic: 360, sic: 360}, takeoffs: {day: 12}, landings: {day: 12}}
    outcome: expiring
    expect: { message: rating.revalidation_expiring_met }
  - name: revalidation-sep-land-and-tmg-pooled
    evaluation: revalidation
    shows: [pooling-same-licence]
    says: A pilot holding SEP(land) and TMG on the same licence may fly the requirements in either class and revalidates both (FCL.740.A(b)(2)).
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: LBA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31}
        - {id: r-tmg, licenceId: l-ppl, class: TMG, expires: 2026-10-31}
      flights:
        - {date: 2026-03-10, class: SEP_LAND, minutes: {total: 300, pic: 300}, takeoffs: {day: 5}, landings: {day: 5}}
        - {date: 2026-05-20, class: TMG, minutes: {total: 60, dual: 60}, takeoffs: {day: 2}, landings: {day: 2}}
        - {date: 2026-06-12, class: TMG, minutes: {total: 360, pic: 60, dual: 300}, takeoffs: {day: 5}, landings: {day: 5}}
    outcome: expiring
    expect: { message: rating.revalidation_expiring_met }
  - name: revalidation-ultralight-credit
    evaluation: revalidation
    shows: [ul-credit-time-only]
    says: Three-axis ultralight hours count toward the 12 h and 6 h PIC, but not toward take-offs, landings or the refresher; weight-shift hours never count; an ultralight flight with no kind cannot be classified and is reported as unknown input.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31}
      flights:
        - {date: 2026-04-01, class: SEP_LAND, minutes: {total: 120, pic: 60, dual: 60}, takeoffs: {day: 12}, landings: {day: 12}}
        - {date: 2026-05-01, class: ULTRALIGHT, ulKind: THREE_AXIS, minutes: {total: 600, pic: 540, dual: 60}, takeoffs: {day: 10}, landings: {day: 10}}
        - {date: 2026-06-01, class: ULTRALIGHT, minutes: {total: 90, pic: 90}, takeoffs: {day: 1}, landings: {day: 1}}
        - {date: 2026-06-02, class: ULTRALIGHT, ulKind: WEIGHT_SHIFT, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}}
    outcome: expiring
    expect: { message: rating.revalidation_expiring_met }
  - name: revalidation-valid-on-expiry-day
    evaluation: revalidation
    shows: [valid-through-expiry]
    says: On its expiry date the rating is still valid; 0 days remain.
    asOf: 2026-10-31
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31}
      flights:
        - {date: 2026-03-10, class: SEP_LAND, minutes: {total: 300, pic: 300}, takeoffs: {day: 5}, landings: {day: 5}}
        - {date: 2026-05-20, class: SEP_LAND, minutes: {total: 60, dual: 60}, takeoffs: {day: 2}, landings: {day: 2}}
        - {date: 2026-06-12, class: SEP_LAND, minutes: {total: 360, pic: 60, dual: 300}, takeoffs: {day: 5}, landings: {day: 5}}
    outcome: expiring
    expect: { message: rating.revalidation_expiring_met }
  - name: revalidation-experience-met-current
    evaluation: revalidation
    says: With more than 90 days to expiry the met rating is current. The authority matches whatever its case and spacing.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: " Easa ", type: PPL}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30}
      flights:
        - {date: 2026-07-05, class: SEP_LAND, minutes: {total: 300, pic: 300}, takeoffs: {day: 5}, landings: {day: 5}}
        - {date: 2026-07-20, class: SEP_LAND, minutes: {total: 60, dual: 60}, takeoffs: {day: 2}, landings: {day: 2}}
        - {date: 2026-08-10, class: SEP_LAND, minutes: {total: 360, pic: 60, dual: 300}, takeoffs: {day: 5}, landings: {day: 5}}
    outcome: current
    expect: { message: rating.revalidation_current }
  - name: revalidation-experience-not-met
    evaluation: revalidation
    says: 5 h and 5 take-offs and landings are not enough; every unmet row carries its remedy.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31}
      flights:
        - {date: 2026-03-10, class: SEP_LAND, minutes: {total: 300, pic: 300}, takeoffs: {day: 5}, landings: {day: 5}}
    outcome: expiring
    expect: { message: rating.revalidation_not_met }
  - name: passengers-day-pilot-flying-not-logged
    evaluation: passengers_day
    shows: [pilot-flying-recorded]
    says: When no flight in the 90 days records whether the pilot was flying, the recency is unknown, never current.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30}
      flights:
        - {date: 2026-08-20, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 5}, landings: {day: 5}}
    outcome: unknown
    expect: { message: pax.experience_not_logged }
  - name: passengers-day-current
    evaluation: passengers_day
    says: Three take-offs and landings as pilot flying in the class within 90 days allow carrying passengers; the recency lasts until the first of them is 90 days old.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30}
      flights:
        - {date: 2026-08-01, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}, pilotFlying: true}
        - {date: 2026-08-20, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 2}, landings: {day: 2}, pilotFlying: true}
    outcome: current
    expect: { message: pax.day_current }
  - name: passengers-day-not-current
    evaluation: passengers_day
    says: Two take-offs and landings are one short.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30}
      flights:
        - {date: 2026-08-20, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 2}, landings: {day: 2}, pilotFlying: true}
    outcome: expired
    expect: { message: pax.not_current }
  - name: passengers-night-ir-no-expiry-waives
    evaluation: passengers_night
    shows: [ir-held]
    says: An IR recorded without an expiry date is taken as held and waives the night requirement.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30}
        - {id: r-ir, licenceId: l-ppl, class: IR}
      flights:
        - {date: 2026-08-20, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}, pilotFlying: true}
    outcome: current
    expect: { message: pax.night_waived_ir }
  - name: passengers-night-ffs-night
    evaluation: passengers_night
    says: A night take-off and landing as pilot flying in an FFS representing the class allow night passengers.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30}
      flights:
        - {date: 2026-08-10, class: SEP_LAND, isSimulator: true, fstdType: FFS, minutes: {total: 60}, takeoffs: {night: 1}, landings: {night: 1}, pilotFlying: true}
    outcome: current
    expect: { message: pax.night_current }
  - name: passengers-night-ir-expired
    evaluation: passengers_night
    says: An IR that expired the day before does not waive the night requirement.
    asOf: 2026-09-15
    record:
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30}
        - {id: r-ir, licenceId: l-ppl, class: IR, expires: 2026-09-14}
      flights:
        - {date: 2026-08-20, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}, pilotFlying: true}
    outcome: expired
    expect: { message: pax.night_not_current }
  - name: composite-licence-medical-expired
    composite: true
    says: A rating revalidated by a check in the 3 months before expiry is expiring on its own, but its PPL(A) has an expired medical, so the rating may not be exercised; missing passenger recency is a limitation only and decides nothing.
    asOf: 2026-09-15
    record:
      holder: {dateOfBirth: 1976-01-01}
      licences:
        - {id: l-ppl, authority: EASA, type: PPL(A)}
      ratings:
        - {id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2026-10-31}
      credentials:
        - {id: c-med, type: EASA_CLASS2_MEDICAL, issued: 2024-06-01, expires: 2025-06-01}
        - {id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15}
      flights:
        - {date: 2026-08-01, class: SEP_LAND, minutes: {total: 60, pic: 60}, takeoffs: {day: 1}, landings: {day: 1}, flags: {proficiencyCheck: true, examinerOnBoard: true}}
    outcome: expired
    expect: { subject: { kind: rating, id: r-sep }, decidedBy: { evaluation: licence, credential: easa.licence.ppl-a } }
  - name: variants-differences-training
    evaluation: variants
    says: "Further differences training on the variant restores the privilege. (FCL.710 case.)"
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
      events:
        - { date: 2026-02-01, kind: differences_training, class: SEP_LAND, variant: ELECTRIC }
        - { date: 2026-02-02, kind: differences_training, class: SEP_LAND, variant: PISTON }
      flights:
        - { date: 2023-06-01, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect:
      subject: { kind: type, id: v-electric, class: SEP_LAND }
      message: type.current
      validUntil: 2028-02-01
  - name: variants-flown
    evaluation: variants
    says: "A flight on the variant within 2 years keeps the privilege; it lasts until 2 years after that flight. (FCL.710 case.)"
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
      flights:
        - { date: 2026-03-10, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-04-10, class: SEP_LAND, variant: PISTON, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect:
      subject: { kind: type, id: v-electric, class: SEP_LAND }
      message: type.current
      validUntil: 2028-03-10
      requirements:
        variant_flown: { current: 1, met: true, lastDate: 2026-03-10 }
  - name: variants-not-flown
    evaluation: variants
    says: "The variant was last flown more than 2 years ago; flights on another variant do not count. (FCL.710 case.)"
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
      flights:
        - { date: 2024-08-01, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-04-10, class: SEP_LAND, variant: PISTON, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: lapsed
    expect:
      subject: { kind: type, id: v-electric, class: SEP_LAND }
      message: type.not_flown
      requirements:
        variant_flown: { current: 0, met: false, remedyKey: remedy.differences_training }
  - name: variants-proficiency-check
    evaluation: variants
    says: "A proficiency check in the variant, logged as an event, restores the privilege. (FCL.710 case.)"
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
      events:
        - { date: 2026-08-01, kind: proficiency_check, class: SEP_LAND, variant: ELECTRIC }
      flights:
        - { date: 2023-06-01, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect:
      subject: { kind: type, id: v-electric, class: SEP_LAND }
      message: type.current
  - name: variants-refresher-training
    evaluation: variants
    says: "Refresher training in the variant restores the privilege. (FCL.710 case.)"
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
      events:
        - { date: 2026-05-01, kind: refresher_training, class: SEP_LAND, variant: ELECTRIC }
      flights: []
    outcome: current
    expect:
      subject: { kind: type, id: v-electric, class: SEP_LAND }
      message: type.current
  - name: variants-variant-not-recorded
    evaluation: variants
    says: "Flights in the class without a variant cannot be matched; the result is unknown. (FCL.710 case.)"
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
      flights:
        - { date: 2026-05-01, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: unknown
    expect:
      subject: { kind: type, id: v-electric, class: SEP_LAND }
      message: type.unknown
      requirements:
        variant_flown: { met: false, tracked: false }
  - name: variants-window-edges
    evaluation: variants
    says: "A flight on 15 September 2024 counts on 15 September 2026; one on 14 September 2024 does not. (FCL.710 case.)"
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC, issued: 2023-05-01 }
      flights:
        - { date: 2024-09-14, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2024-09-15, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect:
      subject: { kind: type, id: v-electric, class: SEP_LAND }
      message: type.current
      validUntil: 2026-09-15
      requirements:
        variant_flown: { current: 1 }
  - name: variants-other-ratings-not-evaluated
    evaluation: variants
    says: "TMG variants are exempt (FCL.710(da)), gyroplane variants follow FCL.240.G(b) and variants on FAA licences are not evaluated; only the SEP land variant is (FCL.710 not-applicable case with an SEP land rating added)."
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
        - { id: l-faa, authority: FAA, type: PRIVATE }
        - { id: l-gpl, authority: EASA, type: GPL }
      ratings:
        - { id: r-tmg, licenceId: l-ppl, class: TMG, expires: 2027-06-30 }
        - { id: r-faa, licenceId: l-faa, class: SEP_LAND }
        - { id: r-gyro, licenceId: l-gpl, class: GYROPLANE }
        - { id: r-sep, licenceId: l-ppl, class: SEP_LAND, expires: 2027-06-30 }
      variants:
        - { id: v-tmg, ratingId: r-tmg, name: RETRACTABLE }
        - { id: v-faa, ratingId: r-faa, name: ELECTRIC }
        - { id: v-gyro, ratingId: r-gyro, name: ENCLOSED_COCKPIT }
        - { id: v-electric, ratingId: r-sep, name: ELECTRIC }
      flights:
        - { date: 2026-03-10, class: SEP_LAND, variant: ELECTRIC, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: { message: type.current }
