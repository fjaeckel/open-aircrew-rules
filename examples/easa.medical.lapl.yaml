credential: easa.medical.lapl
examples:
  - name: validity-age-70
    evaluation: validity
    says: Issued at 70 the certificate runs 24 months.
    asOf: 2026-09-15
    record:
      holder: {dateOfBirth: 1956-01-01}
      credentials:
        - {id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-06-01}
    outcome: current
    expect: { message: credential.valid }
  - name: validity-expired-day-after
    evaluation: validity
    says: The day after its expiry date the certificate is expired.
    asOf: 2028-03-02
    record:
      holder: {dateOfBirth: 1980-05-20}
      credentials:
        - {id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-03-01}
    outcome: expired
    expect: { message: credential.expired }
  - name: validity-age-on-examination-date
    evaluation: validity
    shows: [counted-from]
    says: Examined at 39 and revalidated from the previous expiry date after the 40th birthday, the 60-month band of the examination age applies, capped at the 42nd birthday.
    asOf: 2028-06-01
    record:
      holder: {dateOfBirth: 1986-10-01}
      credentials:
        - {id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-09-01, validFrom: 2026-10-15}
    outcome: current
    expect: { message: credential.valid, expiresOn: 2028-10-01 }
  - name: validity-age-on-examination-date-capped
    evaluation: validity
    shows: [counted-from]
    says: The certificate ends on the 42nd birthday, before the 24 months the age at the start of the period would give.
    asOf: 2028-10-05
    record:
      holder: {dateOfBirth: 1986-10-01}
      credentials:
        - {id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-09-01, validFrom: 2026-10-15}
    outcome: expired
    expect: { message: credential.expired }
