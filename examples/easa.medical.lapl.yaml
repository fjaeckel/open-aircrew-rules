credential: easa.medical.lapl
examples:
  - name: validity-age-70
    evaluation: validity
    says: Issued at 70 the certificate runs 24 months.
    asOf: 2026-09-15
    record:
      holder: {dateOfBirth: 1956-01-01}
      credentials:
        - {id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-06-01}
    outcome: current
    expect: { message: credential.valid }
  - name: validity-expired-day-after
    evaluation: validity
    says: The day after its expiry date the certificate is expired.
    asOf: 2028-03-02
    record:
      holder: {dateOfBirth: 1980-05-20}
      credentials:
        - {id: c-med, type: EASA_LAPL_MEDICAL, issued: 2026-03-01}
    outcome: expired
    expect: { message: credential.expired }
