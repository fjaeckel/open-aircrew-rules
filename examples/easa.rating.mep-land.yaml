    expect: { subject: { kind: rating, id: r-mep }, message: rating.revalidation_expiring_met, requirements: {proficiency_check: {current: 1, met: true, lastDate: 2026-07-31}} }
  - name: revalidation-check-without-sectors
    evaluation: revalidation
    says: 'A proficiency check in the class alone does not revalidate an MEP rating: the 10 route sectors, or one with an examiner, are needed as well.'
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-08-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, cruiseMinutes: 10, flags: { proficiencyCheck: true } }
    outcome: expiring
    expect: { subject: { kind: rating, id: r-mep, class: MEP_LAND }, message: rating.revalidation_not_met_prof_check, requirements: {proficiency_check: {current: 1, met: true}, sectors: {current: 0, met: false}, examiner_sector: {current: 0, met: false}} }
  - name: revalidation-cruise-not-recorded
    evaluation: revalidation
    says: With the proficiency check passed but no cruise time recorded on any flight, the route sectors cannot be counted and the rating is reported unknown, never current.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
      flights:
        - { date: 2026-05-10, class: MEP_LAND, minutes: { total: 90, pic: 90 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-08-20, class: MEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true } }
    outcome: unknown
    expect: { subject: { kind: rating, id: r-mep }, message: rating.route_sectors_not_logged, requirements: {proficiency_check: {met: true}, sectors: {met: false, tracked: false}, examiner_sector: {current: 0, met: false, tracked: true}} }
  - name: revalidation-examiner-route-sector
    evaluation: revalidation
    says: The proficiency check flown with an examiner is also the one route sector with an examiner; no further sectors are needed.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
