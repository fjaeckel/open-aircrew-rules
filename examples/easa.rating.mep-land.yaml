    outcome: expiring
    expect: { subject: { kind: rating, id: r-mep }, message: rating.revalidation_expiring_met, requirements: {proficiency_check: {current: 1, met: true}, sectors: {current: 1, met: false, remedyKey: remedy.fly_more, remedyParams: {missing: 9, unit: sectors}}, examiner_sector: {current: 1, met: true}} }
  - name: revalidation-expired-day-after
    evaluation: revalidation
    says: The day after its expiry date the rating is expired.
    asOf: 2026-11-01
