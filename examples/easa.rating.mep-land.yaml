    expect: { subject: { kind: rating, id: r-mep }, message: rating.expired }
  - name: revalidation-fstd-check-and-ffs-sector
    evaluation: revalidation
    says: A proficiency check in an FNPT counts toward (a)(1); a route sector with an examiner counts in an FFS but not in an FNPT.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      ratings:
        - { id: r-mep, licenceId: l-ppl, class: MEP_LAND, expires: 2026-10-31 }
