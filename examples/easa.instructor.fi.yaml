credential: easa.instructor.fi
examples:
  - name: revalidation-two-of-three
    evaluation: revalidation
    says: 50 hours of instruction and instructor refresher training within the validity period revalidate the certificate.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      events:
        - { date: 2026-02-01, kind: instructor_refresher, rating: FI }
      flights:
        - { date: 2025-03-01, class: SEP_LAND, minutes: { total: 1500, dualGiven: 1500 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-03-01, class: SEP_LAND, minutes: { total: 1500, dualGiven: 1500 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.revalidation_current, params: {date: 2027-01-15}, expiresOn: 2027-01-15, requirements: {instruction: {current: 3000, met: true}, refresher: {current: 1, met: true}, assessment: {current: 0, met: false}}}
  - name: revalidation-assessment-window-edges
    evaluation: revalidation
    says: An assessment of competence on 15 January 2026, 12 months before expiry, counts; one on 14 January 2026 does not.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      events:
        - { date: 2026-01-14, kind: assessment_of_competence, rating: FI }
        - { date: 2026-01-15, kind: assessment_of_competence, rating: FI }
        - { date: 2025-05-01, kind: instructor_refresher, rating: FI }
      flights: []
    outcome: current
    expect: {subject: {kind: privilege, id: p-1}, requirements: {assessment: {current: 1, met: true, lastDate: 2026-01-15}}}
  - name: revalidation-one-of-three
    evaluation: revalidation
    says: Only the refresher training is done; two of the three items are needed.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      events:
        - { date: 2026-02-01, kind: instructor_refresher, rating: FI }
      flights:
        - { date: 2025-03-01, class: SEP_LAND, minutes: { total: 120, dualGiven: 120 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.revalidation_not_met, params: {date: 2027-01-15}, requirements: {instruction: {current: 120, met: false, remedyKey: remedy.fly_more, remedyParams: {missing: 2880, unit: minutes}}}}
  - name: revalidation-validity-window-edges
    evaluation: revalidation
    says: Instruction on 15 January 2024, the first day of the validity period, counts; instruction the day before does not.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      flights:
        - { date: 2024-01-14, class: SEP_LAND, minutes: { total: 600, dualGiven: 600 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2024-01-15, class: SEP_LAND, minutes: { total: 600, dualGiven: 600 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.revalidation_not_met, requirements: {instruction: {current: 600}}}
  - name: revalidation-expiring-not-met
    evaluation: revalidation
    says: Within 90 days of expiry and not revalidated, the certificate shows as expiring.
    asOf: 2026-11-01
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      flights: []
    outcome: expiring
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.expiring, params: {days: 75, date: 2027-01-15}, requirements: {refresher: {current: 0, met: false}}}
  - name: revalidation-valid-on-expiry-day
    evaluation: revalidation
    says: On its expiry date the certificate is still valid.
    asOf: 2027-01-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      flights: []
    outcome: expiring
    expect: {subject: {kind: privilege, id: p-1}, params: {days: 0, date: 2027-01-15}}
  - name: revalidation-expired-day-after
    evaluation: revalidation
    says: The day after its expiry date the certificate is expired; renewal is not modelled.
    asOf: 2027-01-16
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      events:
        - { date: 2026-02-01, kind: instructor_refresher, rating: FI }
        - { date: 2026-03-01, kind: assessment_of_competence, rating: FI }
      flights: []
    outcome: expired
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.expired, params: {date: 2027-01-15}}
  - name: revalidation-no-dates
    evaluation: revalidation
    says: Without an issue date or an expiry date the validity cannot be placed.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI }
      flights: []
    outcome: unknown
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.no_expiry_date}
  - name: revalidation-other-certificates-not-selected
    evaluation: revalidation
    shows: [part-fcl-certificate]
    says: Other instructor certificates, the sailplane FI(S) and an FI privilege recorded on a BPL (an FI(B)) are not this certificate; only the FI on the CPL(A) is evaluated, valid and not yet revalidated.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
        - { id: l-b, authority: EASA, type: BPL }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
        - { id: p-o, licenceId: l-1, kind: CRI, issued: 2024-01-15 }
        - { id: p-fis, licenceId: l-1, kind: FI_S, issued: 2024-01-15 }
        - { id: p-tri, licenceId: l-1, kind: TRI, issued: 2024-01-15 }
        - { id: p-fib, licenceId: l-b, kind: FI, issued: 2024-01-15 }
    outcome: current
    expect: { message: privilege.revalidation_not_met }
  - name: composite-licence-medical-expired
    composite: true
    says: The FI certificate is revalidated, but the CPL(A) it is held on may not be exercised with an expired class 1 medical, so the licence requirement decides.
    asOf: 2026-09-15
    record:
      holder: { dateOfBirth: 1976-01-01 }
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      credentials:
        - { id: c-med, type: EASA_CLASS1_MEDICAL, issued: 2024-01-10, expires: 2025-01-31 }
        - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
      events:
        - { date: 2026-02-01, kind: instructor_refresher, rating: FI }
        - { date: 2026-03-01, kind: assessment_of_competence, rating: FI }
    outcome: expired
    expect: { subject: { kind: privilege, id: p-1 }, decidedBy: { evaluation: licence, credential: easa.licence.cpl-a } }
  - name: composite-licence-valid
    composite: true
    says: With the certificate revalidated and the CPL(A) it is held on usable (valid class 1 medical and language endorsement), the FI privileges may be exercised.
    asOf: 2026-09-15
    record:
      holder: { dateOfBirth: 1976-01-01 }
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      credentials:
        - { id: c-med, type: EASA_CLASS1_MEDICAL, issued: 2026-06-01 }
        - { id: c-lang, type: LANG_ICAO_LEVEL4, issued: 2023-04-15 }
      events:
        - { date: 2026-02-01, kind: instructor_refresher, rating: FI }
        - { date: 2026-03-01, kind: assessment_of_competence, rating: FI }
    outcome: current
    expect: { subject: { kind: privilege, id: p-1 } }
  - name: revalidation-events-for-other-certificates
    evaluation: revalidation
    shows: [refresher-and-assessment-events]
    says: Refresher training recorded for an FI(S) and an assessment of competence recorded for an examiner certificate (FCL.1020) do not revalidate the FI certificate; the revalidation is not met, and the certificate stays valid until its expiry date.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: FI, issued: 2024-01-15 }
      events:
        - { date: 2026-02-01, kind: instructor_refresher, rating: FI_S }
        - { date: 2026-03-01, kind: assessment_of_competence, rating: EXAMINER }
      flights: []
    outcome: current
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.revalidation_not_met, requirements: {refresher: {current: 0, met: false}, assessment: {current: 0, met: false}}}
