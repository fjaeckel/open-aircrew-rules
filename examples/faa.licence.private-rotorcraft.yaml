credential: faa.licence.private-rotorcraft
examples:
  - name: passengers-day-current
    evaluation: passengers_day
    says: Three takeoffs and landings as sole manipulator in the HELICOPTER class on 1 July allow a private pilot holder to carry passengers there on 16 August.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: PRIVATE}
      ratings:
        - {id: r-1, licenceId: l-faa, class: HELICOPTER}
      flights:
        - {date: 2026-07-01, class: HELICOPTER, minutes: {total: 90, pic: 90}, takeoffs: {day: 3}, landings: {day: 3}, soleManipulator: true}
    outcome: current
    expect: { message: pax.day_current }
  - name: passengers-day-lapsed
    evaluation: passengers_day
    says: The last three takeoffs and landings in the HELICOPTER class were on 1 May, more than 90 days before 16 August; passenger recency has lapsed, the certificate stays valid.
    asOf: 2026-08-16
    record:
      licences:
        - {id: l-faa, authority: FAA, type: PRIVATE}
      ratings:
        - {id: r-1, licenceId: l-faa, class: HELICOPTER}
      flights:
        - {date: 2026-05-01, class: HELICOPTER, minutes: {total: 90, pic: 90}, takeoffs: {day: 3}, landings: {day: 3}, soleManipulator: true}
    outcome: lapsed
    expect: { message: pax.not_current, params: { needed: 3 } }
