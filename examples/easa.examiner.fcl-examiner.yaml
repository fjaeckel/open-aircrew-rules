credential: easa.examiner.fcl-examiner
examples:
  - name: revalidation-revalidated
    evaluation: revalidation
    says: Six tests conducted, a refresher course and an assessed test in the last 12 months revalidate the examiner certificate.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: CPL(A) }
      privileges:
        - { id: p-1, licenceId: l-1, kind: EXAMINER, issued: 2024-01-15 }
      events:
        - { date: 2026-05-01, kind: examiner_refresher }
        - { date: 2026-06-01, kind: assessment_of_competence, rating: EXAMINER }
      flights:
        - { date: 2025-01-10, class: SEP_LAND, minutes: { total: 60, examiner: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2025-02-10, class: SEP_LAND, minutes: { total: 60, examiner: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2025-03-10, class: SEP_LAND, minutes: { total: 60, examiner: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2025-04-10, class: SEP_LAND, minutes: { total: 60, examiner: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
