        - { date: 2025-06-10, class: SEP_LAND, minutes: { total: 60, examiner: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: {subject: {kind: privilege, id: p-1}, message: privilege.revalidation_current, params: {date: 2027-01-15}, requirements: {tests_conducted: {current: 6, met: true}}}
