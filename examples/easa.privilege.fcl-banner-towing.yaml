        - { date: 2026-06-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true } }
    outcome: lapsed
    expect: { subject: { kind: privilege, id: p-tow }, requirements: {tows: {current: 4, met: false, tracked: true}} }
