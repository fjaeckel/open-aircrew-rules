  - name: recency-gyroplane-tows
    evaluation: recency
    says: Tows flown in a gyroplane are not tows in an aeroplane or TMG; with three tows in an aeroplane the pilot needs two more.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      privileges:
        - { id: p-tow, licenceId: l-1, kind: BANNER_TOWING }
      flights:
        - { date: 2026-01-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
        - { date: 2026-02-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
        - { date: 2026-03-01, class: TMG, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
        - { date: 2026-04-01, class: GYROPLANE, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
        - { date: 2026-05-01, class: GYROPLANE, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
    outcome: lapsed
    expect: { subject: { kind: privilege, id: p-tow }, message: privilege.recency_not_met, requirements: {tows: {current: 3, met: false}} }
  - name: recency-lapsed
    evaluation: recency
    says: Three tows are not enough; the missing two are flown with or under the supervision of an instructor.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      privileges:
        - { id: p-tow, licenceId: l-1, kind: BANNER_TOWING }
      flights:
        - { date: 2026-01-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
        - { date: 2026-02-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
        - { date: 2026-03-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
    outcome: lapsed
    expect: { subject: { kind: privilege, id: p-tow }, message: privilege.recency_not_met, requirements: {tows: {current: 3, met: false, remedyKey: remedy.privilege_with_instructor, remedyParams: {missing: 2, unit: tows}}} }
  - name: recency-tow-kind
    evaluation: recency
    says: Only banner tows count; glider tows do not, and a tow flight without a recorded tow kind is unknown.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      privileges:
        - { id: p-tow, licenceId: l-1, kind: BANNER_TOWING }
      flights:
        - { date: 2026-01-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
        - { date: 2026-02-01, class: SEP_LAND, minutes: { total: 30, pic: 30 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { towFlight: true }, towKind: banner }
