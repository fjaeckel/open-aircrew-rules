  - name: recency-window-edges
    evaluation: recency
    says: A tow on 15 September 2024 counts on 15 September 2026; one on 14 September 2024 does not.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-1, authority: EASA, type: PPL(A) }
      privileges:
