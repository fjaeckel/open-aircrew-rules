  - name: recency-not-applicable-other-items
    evaluation: recency
    shows: [part-fcl-licences-only]
    says: The towing privilege of a sailplane licence follows SFCL.205, and FAA licences and other privileges are not evaluated here; only the privilege on the PPL(A) is (legacy not-applicable case with that privilege added).
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-spl, authority: EASA, type: SPL }
        - { id: l-faa, authority: FAA, type: PRIVATE }
        - { id: l-ppl, authority: EASA, type: PPL(A) }
      privileges:
