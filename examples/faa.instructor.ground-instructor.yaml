credential: faa.instructor.ground-instructor
examples:
  - name: activity-not-recorded
    evaluation: recent_experience
    shows: [ground-instruction-not-recorded]
    says: Instruction on 31 July 2025 is outside the 12 calendar months on 16 August 2026; nothing recorded shows recent activity, but ground instruction given is not recorded, so the status is unknown rather than lapsed.
    asOf: 2026-08-16
    record:
      licences:
        - { id: l-faa, authority: FAA, type: COMMERCIAL }
        - { id: l-easa, authority: EASA, type: PPL(A) }
      privileges:
        - { id: p-gi, licenceId: l-faa, kind: GROUND_INSTRUCTOR }
        - { id: p-easa, licenceId: l-easa, kind: GROUND_INSTRUCTOR }
      flights:
        - { date: 2025-07-31, class: SEP_LAND, minutes: { total: 90, pic: 90, dualGiven: 90 } }
    outcome: unknown
    expect:
      subject: { kind: privilege, id: p-gi }
      message: privilege.recency_not_logged
      requirements:
        flight_instruction: { current: 0, met: false }
        ground_instruction: { tracked: false, met: false, messageKey: requirement.untracked }
  - name: endorsement
    evaluation: recent_experience
    shows: [events-as-waivers]
    says: An instructor's endorsement of demonstrated knowledge in January 2026 counts.
    asOf: 2026-08-16
    record:
      licences:
        - { id: l-faa, authority: FAA, type: PRIVATE }
      privileges:
        - { id: p-gi, licenceId: l-faa, kind: GROUND_INSTRUCTOR }
      events:
        - { date: 2026-01-10, kind: instructor_endorsement }
    outcome: current
    expect:
      subject: { kind: privilege, id: p-gi }
  - name: flight-instruction
    evaluation: recent_experience
    shows: [flight-instruction-given]
    says: Flight instruction given in February 2026 keeps the ground instructor current through 28 February 2027.
    asOf: 2026-08-16
    record:
      licences:
        - { id: l-faa, authority: FAA, type: COMMERCIAL }
      privileges:
        - { id: p-gi, licenceId: l-faa, kind: GROUND_INSTRUCTOR, issued: 2019-05-01 }
      flights:
        - { date: 2026-02-01, class: SEP_LAND, minutes: { total: 60, pic: 60, dualGiven: 60 } }
    outcome: current
    expect:
      subject: { kind: privilege, id: p-gi }
      message: privilege.recency_current
      params: { date: 2027-02-28 }
  - name: refresher-course
    evaluation: recent_experience
    says: A flight instructor refresher course on 1 August 2025, the first day of the 12 calendar months before August 2026, counts through 31 August.
    asOf: 2026-08-16
    record:
      licences:
        - { id: l-faa, authority: FAA, type: PRIVATE }
      privileges:
        - { id: p-gi, licenceId: l-faa, kind: GROUND_INSTRUCTOR }
      events:
        - { date: 2025-08-01, kind: instructor_refresher }
    outcome: current
    expect:
      subject: { kind: privilege, id: p-gi }
      validUntil: 2026-08-31
