        - { date: 2026-05-10, class: SEP_LAND, minutes: { total: 60, dual: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: current
    expect: { subject: { kind: rating, id: r-land }, message: rating.recency_current, requirements: {sep_sea_time: {current: 60, met: true}, sep_sea_takeoffs_landings: {current: 6, met: true}} }
