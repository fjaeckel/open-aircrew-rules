credential: easa.licence.lapl-a
examples:
  - name: recency-experience-current
    evaluation: recency
    says: 12 h as PIC or dual including 12 take-offs and landings and 1 h of dual in aeroplanes or TMGs in the last 2 years keep the LAPL(A) current; SEP and TMG flights pool.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
        - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
      flights:
        - { date: 2025-03-10, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
        - { date: 2025-11-20, class: TMG, minutes: { total: 60, dual: 60 }, takeoffs: { day: 2 }, landings: { day: 2 } }
        - { date: 2026-06-12, class: SEP_LAND, minutes: { total: 360, pic: 60, dual: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
    outcome: current
    expect: { subject: { kind: rating, id: r-land, class: SEP_LAND }, message: rating.recency_current, validUntil: 2027-03-10, requirements: {flight_time: {current: 720, required: 720, met: true}, takeoffs_landings: {current: 12, required: 12, met: true}, refresher_training: {current: 360, met: true}, proficiency_check: {current: 0, met: false, remedyKey: remedy.proficiency_check}, sep_land_time: {absent: true}} }
  - name: recency-land-sea-split-land-short-r-land
    evaluation: recency
    says: A seaplane pilot who also holds SEP(land) flew everything on sea; the land share is missing, but a proficiency check keeps the LAPL(A) current anyway.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: LBA, type: LAPL(A) }
      ratings:
        - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
        - { id: r-sea, licenceId: l-lapl, class: SEP_SEA }
      flights:
        - { date: 2026-03-10, class: SEP_SEA, minutes: { total: 720, pic: 660, dual: 60 }, takeoffs: { day: 12 }, landings: { day: 12 } }
        - { date: 2026-08-10, class: SEP_SEA, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true } }
    outcome: current
    expect: { subject: { kind: rating, id: r-land }, message: rating.recency_current, requirements: {sep_land_time: {current: 0, met: false}, sep_land_takeoffs_landings: {current: 0, met: false}, sep_sea_time: {current: 780, met: true}, proficiency_check: {current: 1, met: true}} }
