    says: Dual time and ultralight hours do not count; 5 hours as PIC leave 5 hours to fly.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A), issued: 2025-04-01 }
      ratings:
        - { id: r-sep, licenceId: l-lapl, class: SEP_LAND }
