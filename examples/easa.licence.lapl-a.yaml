        - { date: 2026-04-10, class: SEP_SEA, minutes: { total: 30, pic: 30 }, takeoffs: { day: 3 }, landings: { day: 3 } }
        - { date: 2026-05-10, class: SEP_LAND, minutes: { total: 60, dual: 60 }, takeoffs: { day: 1 }, landings: { day: 1 } }
    outcome: lapsed
    expect: { subject: { kind: rating, id: r-land }, message: rating.recency_not_met, requirements: {flight_time: {current: 720, met: true}, takeoffs_landings: {current: 13, met: true}, sep_land_time: {current: 690, met: true}, sep_land_takeoffs_landings: {current: 10, met: true}, sep_sea_time: {current: 30, met: false, remedyParams: {missing: 30, unit: minutes}}, sep_sea_takeoffs_landings: {current: 3, met: false, remedyParams: {missing: 3, unit: landings}}} }
