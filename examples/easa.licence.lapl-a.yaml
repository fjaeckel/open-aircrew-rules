        - { date: 2026-05-02, class: SEP_LAND, minutes: { total: 20, dual: 20 }, takeoffs: { day: 1 }, landings: { day: 1 } }
        - { date: 2026-05-03, class: SEP_LAND, minutes: { total: 20, dual: 20 }, takeoffs: { day: 1 }, landings: { day: 1 } }
