    expect: { subject: { kind: rating, id: r-land }, message: rating.recency_current, requirements: {refresher_training: {current: 60, met: true}, flight_time: {current: 720, met: true}} }
  - name: recency-roles-and-takeoffs
    evaluation: recency
    says: Co-pilot and PICUS time do not count toward the 12 hours, and 12 landings with only 8 take-offs are 8 take-offs and landings.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
        - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
      flights:
