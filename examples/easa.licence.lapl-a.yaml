  - name: recency-land-sea-takeoffs-short-r-land
    evaluation: recency
    says: 'With SEP(land) and SEP(sea), the sea class has six landings but only four take-offs: each class needs six take-offs and six landings.'
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
        - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
        - { id: r-sea, licenceId: l-lapl, class: SEP_SEA }
      flights:
        - { date: 2026-03-10, class: SEP_LAND, minutes: { total: 360, pic: 300, dual: 60 }, takeoffs: { day: 6 }, landings: { day: 6 } }
        - { date: 2026-05-10, class: SEP_SEA, minutes: { total: 360, pic: 300, dual: 60 }, takeoffs: { day: 4 }, landings: { day: 6 } }
    outcome: lapsed
    expect: { subject: { kind: rating, id: r-land, class: SEP_LAND }, message: rating.recency_not_met, requirements: {flight_time: {current: 720, met: true}, takeoffs_landings: {current: 10, met: false}, refresher_training: {current: 120, met: true}, sep_land_time: {current: 360, met: true}, sep_land_takeoffs_landings: {current: 6, met: true}, sep_sea_time: {current: 360, met: true}, sep_sea_takeoffs_landings: {current: 4, met: false}, proficiency_check: {current: 0, met: false}} }
  - name: recency-land-sea-takeoffs-short-r-sea
    evaluation: recency
    says: 'With SEP(land) and SEP(sea), the sea class has six landings but only four take-offs: each class needs six take-offs and six landings.'
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
