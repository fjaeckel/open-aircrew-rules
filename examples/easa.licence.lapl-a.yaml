  - name: recency-lapsed
    evaluation: recency
    says: 5 hours and 5 take-offs and landings are not enough; the privilege lapses, every unmet row carries its remedy.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
        - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
      flights:
        - { date: 2026-03-10, class: SEP_LAND, minutes: { total: 300, pic: 300 }, takeoffs: { day: 5 }, landings: { day: 5 } }
    outcome: lapsed
    expect: { subject: { kind: rating, id: r-land }, message: rating.recency_not_met, requirements: {flight_time: {current: 300, met: false, remedyKey: remedy.fly_more, remedyParams: {missing: 420, unit: minutes}}, takeoffs_landings: {current: 5, met: false, remedyParams: {missing: 7, unit: landings}}, refresher_training: {current: 0, met: false, remedyParams: {missing: 60, unit: minutes}}} }
  - name: recency-proficiency-check
    evaluation: recency
    says: A proficiency check with an examiner in an aeroplane in the last 2 years keeps the LAPL(A) current without the experience.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
        - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
      flights:
        - { date: 2025-10-01, class: SEP_LAND, minutes: { total: 60, pic: 60 }, takeoffs: { day: 1 }, landings: { day: 1 }, flags: { proficiencyCheck: true, examinerOnBoard: true } }
    outcome: current
    expect: { subject: { kind: rating, id: r-land }, message: rating.recency_current, validUntil: 2027-10-01, requirements: {proficiency_check: {current: 1, met: true, lastDate: 2025-10-01}, flight_time: {current: 60, met: false}} }
  - name: recency-refresher-several-flights
    evaluation: recency
    says: Three dual flights of 20 minutes add up to the 1 hour of refresher training.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
        - { id: r-land, licenceId: l-lapl, class: SEP_LAND }
      flights:
