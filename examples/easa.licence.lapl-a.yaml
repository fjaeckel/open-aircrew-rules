  - name: recency-land-sea-split-unmet-r-land
    evaluation: recency
    says: Holding SEP(land) and SEP(sea), the pilot flew only 30 minutes and 3 take-offs and landings on sea; the split of FCL.140.A(b) is not met for either privilege.
