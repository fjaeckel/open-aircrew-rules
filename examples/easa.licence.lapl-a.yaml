    evaluation: recency
    says: A flight on 15 September 2024, 2 years before, counts; one on 14 September 2024 does not.
    asOf: 2026-09-15
    record:
      licences:
        - { id: l-lapl, authority: EASA, type: LAPL(A) }
      ratings:
