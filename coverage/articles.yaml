  # FAA
  - article: "faa:61.2"
    not_evaluated: 'Definitional: 61.2 separates validity (a certificate, rating or medical that is expired, suspended or revoked) from currency (recent experience and medical requirements for the operation).'
  - article: "faa:61.3"
    not_evaluated: 'Not supported: 61.3 is about holding and carrying the pilot certificate, photo identification and, where required, a medical certificate or U.S. driver''s license, and about holding the rating or authorization an operation needs.'
