    not_evaluated: 'Not supported: the record''s IR rating does not say whether its privileges are used in a glider, and instrument time is not split by the tasks (A) and (B) require (interception and tracking for one hour, performance manoeuvres for two hours). Not supported: the exceptions depend on the operation, not the pilot''s record: employment by a part 119 certificate holder under parts 121, 125 or 135 with that operator''s own recency ((e)(1)-(3)), the turbine multi-pilot night alternative ((e)(4)), flight training with an instructor as sole occupants ((e)(5)) and practical tests ((e)(6)). Not supported: the record does not mark flights as night vision goggle operations, nor the NVG tasks (takeoffs and landings with each phase, hovering, area departures and arrivals, aided-unaided transitions).'
