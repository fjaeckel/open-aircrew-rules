# Every article in scope (scope/articles-*.yaml) and how it is accounted for:
#   evaluations    the credential evaluations that encode it;
#   not_evaluated  why it is not evaluated (not a currency or validity rule, or the record
#                  cannot show what it needs);
#   pending        the credential files (credentials/<path>.yaml) planned to encode it, with
#                  a one-line note; the gate lists pending articles and does not fail on them.
# An article may combine evaluations with pending. The gate fails on an article of the scope
# that is missing here, on an evaluation that does not exist, on an evaluation not listed
# under its source article, and on a reference that does not resolve.
