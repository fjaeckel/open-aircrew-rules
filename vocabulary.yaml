# The closed vocabulary (DESIGN.md sections 4 and 5). Engine rules may only use what is
# declared here; credential files may only use the words of `credential_vocabulary` at the
# end. Adding an entry means: this file, the engine implementation (or the compiler for a
# credential word), `go generate ./...`, and a worked example that exercises it. `rulescheck`
# fails on entries the engine does not implement.
version: 1

# ---------------------------------------------------------------------------------------
# Source texts
# ---------------------------------------------------------------------------------------
# Allowed origins of the texts stored under sources/ (DESIGN.md section 6; sources/README.md).
# Every file there declares one in its header ("- Origin: <name>") and carries an
# "- Attribution:" line containing `attribution`; every URL in its header is on `hosts`; it
# lives in `directory`. Anything else (EASA AMC/GM or Easy Access Rules, ICAO documents,
# association or other private documents) is never stored.
source_origins:
  us-federal:
    directory: faa
    basis: "Works of the US federal government are not subject to copyright in the United States (17 U.S.C. § 105)."
    attribution: "17 U.S.C. § 105"
    hosts: [www.ecfr.gov, ecfr.gov, www.govinfo.gov, www.federalregister.gov]
  de-amtliches-werk:
    directory: de
    basis: "Statutes and ordinances are official works not protected by copyright (§ 5(1) UrhG)."
    attribution: "§ 5(1) UrhG"
    hosts: [www.gesetze-im-internet.de, gesetze-im-internet.de]
  eu-legal-act:
    directory: easa
    basis: "EU legal texts reused under Commission Decision 2011/833/EU with attribution and without distorting their meaning."
    attribution: "© European Union, https://eur-lex.europa.eu"
    hosts: [eur-lex.europa.eu, publications.europa.eu]

# Words that mark material never stored under sources/; the gate fails when one appears in
# a source file's header or in any heading.
source_forbidden_markers: [AMC, GM, Easy Access Rules, ICAO, DULV, DAeC, association]

# Licence authority strings as they appear in a record (matched case-insensitively after
# trimming, DESIGN.md section 11).
record_authorities: [EASA, FAA, LBA, DULV, DAEC]

# ---------------------------------------------------------------------------------------
# Value domains
# ---------------------------------------------------------------------------------------
categories: [aeroplane, helicopter, powered_lift, airship, sailplane, gyroplane, balloon, ultralight, powered_parachute, weight_shift_control, other]

classes:
  SEP_LAND: { category: aeroplane }
  SEP_SEA: { category: aeroplane }
  MEP_LAND: { category: aeroplane }
  MEP_SEA: { category: aeroplane }
  SET_LAND: { category: aeroplane }
  SET_SEA: { category: aeroplane }
  TMG: { category: aeroplane }
  IR: { category: other }
  GLIDER: { category: sailplane }
  GYROPLANE: { category: gyroplane }
  HELICOPTER: { category: helicopter }
  POWERED_LIFT: { category: powered_lift }
  AIRSHIP: { category: airship }
  BALLOON: { category: balloon }
  ULTRALIGHT: { category: ultralight }
  POWERED_PARACHUTE_LAND: { category: powered_parachute }
  POWERED_PARACHUTE_SEA: { category: powered_parachute }
  WEIGHT_SHIFT_CONTROL_LAND: { category: weight_shift_control }
  WEIGHT_SHIFT_CONTROL_SEA: { category: weight_shift_control }
  OTHER: { category: other }

# Class groups: an authority's class that the record splits into several classes. A
# passengers evaluation with `relevant_class: { class_group: <set> }` gives one result per
# group and counts every class of it (14 CFR 61.5(b): single-engine land is one class,
# whatever the engine).
class_groups:
  faa:
    SINGLE_ENGINE_LAND: [SEP_LAND, SET_LAND]
    SINGLE_ENGINE_SEA: [SEP_SEA, SET_SEA]
    MULTI_ENGINE_LAND: [MEP_LAND]
    MULTI_ENGINE_SEA: [MEP_SEA]

ul_kinds: [THREE_AXIS, THREE_AXIS_MOTORGLIDER, WEIGHT_SHIFT, GYROPLANE, HELICOPTER, POWERED_PARAGLIDER, SAILPLANE]

launch_methods: [winch, car, aerotow, self-launch, bungee]

fstd_types: [FFS, FTD, FNPT, ATD, BITD]

tow_kinds: [glider, banner, ul_glider, hang_glider]

# How the towed object was taken up (LuftPersV § 84(4) "Art der Aufnahme").
tow_take_ups: [ground, pick_up]

# Privileges a training programme can seek (record.trainings[].seeks, condition seeks).
sought_privileges: [SAILPLANE, TMG]

# Licence kinds; a record licence without `kind` is classified from `type` by these
# aliases (upper-cased, whitespace removed). Authorities DULV and DAEC always yield UL.
# `category` is the aircraft category of a licence for one category (the category of the
# ratings and privileges held on it when they do not name one).
licence_kinds:
  PPL_A: { aliases: [PPL, PPL(A)], category: aeroplane }
  LAPL_A: { aliases: [LAPL, LAPL(A)], category: aeroplane }
  CPL_A: { aliases: [CPL, CPL(A)], category: aeroplane }
  ATPL_A: { aliases: [ATPL, ATPL(A)], category: aeroplane }
  MPL: { aliases: [MPL, MPL(A)], category: aeroplane }
  SPL: { aliases: [SPL], category: sailplane }
  LAPL_S: { aliases: [LAPL(S)], category: sailplane }
  GPL: { aliases: [GPL], category: gyroplane }
  BPL: { aliases: [BPL, LAPL(B)], category: balloon }
  PPL_H: { aliases: [PPL(H)], category: helicopter }
  CPL_H: { aliases: [CPL(H)], category: helicopter }
  ATPL_H: { aliases: [ATPL(H)], category: helicopter }
  PPL_AS: { aliases: [PPL(AS)], category: airship }
  CPL_AS: { aliases: [CPL(AS)], category: airship }
  LAPL_H: { aliases: [LAPL(H)], category: helicopter }
  UL: { aliases: [UL, ULTRALIGHT, ULTRALEICHT, SPL-UL, LUFTSPORTGERÄTEFÜHRER], category: ultralight }
  FAA_STUDENT: { aliases: [STUDENT] }
  FAA_SPORT: { aliases: [SPORT] }
  FAA_RECREATIONAL: { aliases: [RECREATIONAL] }
  FAA_PRIVATE: { aliases: [PRIVATE] }
  FAA_COMMERCIAL: { aliases: [COMMERCIAL] }
  FAA_ATP: { aliases: [ATP] }
  FAA_GLIDER: { aliases: [GLIDER], category: sailplane }
  IR: { aliases: [IR, IR(A), IR(H)] }
  INSTRUCTOR: { aliases: [FI, CRI, IRI, TRI, SFI, MCCI, STI, FTI, MI, FE, CRE, IRE, TRE, SFE, FIE, "FI(A)", "FI(S)", "FI(H)", "FI(B)", CFI, CFII, MEI, EXAMINER] }

privilege_kinds: [SAILPLANE_TOWING, BANNER_TOWING, CLOUD_FLYING, AEROBATIC_BASIC, AEROBATIC_ADVANCED, TMG_NIGHT, NIGHT, MOUNTAIN, FLIGHT_TEST, FI_S, BI_S, FE_S, FI, CRI, IRI, TRI, SFI, MCCI, STI, MI, FTI, EXAMINER, CFI, GROUND_INSTRUCTOR, UL_INSTRUCTOR, UL_PASSENGER_AUTH, UL_TOWING, UL_TYPE_BRIEFING, LAUNCH_METHOD_TRAINED, BIR, CAT_II, CAT_III, EFVS, NVG, TETHERED_BALLOON, BALLOON_COMMERCIAL, SPORT_NIGHT]

credential_types: [EASA_CLASS1_MEDICAL, EASA_CLASS2_MEDICAL, EASA_LAPL_MEDICAL, FAA_CLASS1_MEDICAL, FAA_CLASS2_MEDICAL, FAA_CLASS3_MEDICAL, FAA_BASICMED, US_DRIVERS_LICENSE, LANG_ICAO_LEVEL4, LANG_ICAO_LEVEL5, LANG_ICAO_LEVEL6, SEC_CLEARANCE_ZUP, SEC_CLEARANCE_ZUBB, RADIO_BZF2, RADIO_BZF1, RADIO_AZF, OTHER]

# Flight flags (booleans, absent = false).
flight_flags: [proficiencyCheck, flightReview, ipc, trainingFlight, towFlight, outlanding, instructorOnBoard, examinerOnBoard, accompanied]

# Event kinds. Events come from `record.events` and from flight flags (`from_flag`); a
# flag-derived event carries the flight's date, class, ulKind, typeDesignator, variant,
# isSimulator and `checkRating` as `rating`.
event_kinds:
  proficiency_check: { from_flag: proficiencyCheck }
  flight_review: { from_flag: flightReview }
  ipc: { from_flag: ipc }
  skill_test: {}
  practical_test: {}
  ebt_assessment: {}
  assessment_of_competence: {}
  differences_training: {}
  familiarisation: {}
  refresher_training: {}
  instructor_refresher: {}
  examiner_refresher: {}
  supervised_instruction: {}
  proficiency_program_phase: {}
  basicmed_course: {}
  basicmed_exam: {}
  solo_endorsement: {}
  instructor_endorsement: {}
  language_assessment: {}
  passenger_training_flight: {}
  safety_training: {}

# ---------------------------------------------------------------------------------------
# Record input fields (DESIGN.md section 5). `optional: true` means absent = unknown.
# ---------------------------------------------------------------------------------------
record_fields:
  holder.dateOfBirth: { type: date, optional: true }
  flight.date: { type: date }
  flight.class: { type: class }
  flight.ulKind: { type: ul_kind, optional: true }
  flight.typeDesignator: { type: string, optional: true }
  flight.variant: { type: string, optional: true }
  flight.registration: { type: string, optional: true }
  flight.launchMethod: { type: launch_method, optional: true }
  flight.isSimulator: { type: bool }
  flight.fstdType: { type: fstd_type, optional: true }
  flight.mtomKg: { type: int, optional: true }
  flight.engines: { type: int, optional: true }
  flight.tailwheel: { type: bool, optional: true }
  flight.minutes: { type: minutes }
  flight.takeoffs: { type: day_night }
  flight.landings: { type: day_night }
  flight.fullStopLandings: { type: int, optional: true }
  flight.fullStopNightLandings: { type: int, optional: true }
  flight.mountainLandings: { type: int, optional: true }
  flight.launches: { type: int }
  flight.approaches: { type: int }
  flight.holds: { type: int }
  flight.interceptAndTrack: { type: bool, optional: true }
  flight.cruiseMinutes: { type: int, optional: true }
  flight.soleManipulator: { type: bool, optional: true }
  flight.pilotFlying: { type: bool, optional: true }
  flight.towKind: { type: tow_kind, optional: true }
  flight.towTakeUp: { type: tow_take_up, optional: true }
  flight.fixedEngine: { type: bool, optional: true }
  flight.nightPeriodTakeoffs: { type: int, optional: true }
  flight.checkAuthority: { type: string, optional: true }
  flight.towedGliders: { type: int, optional: true }
  flight.distanceKm: { type: number, optional: true }
  flight.checkRating: { type: string, optional: true }
  flight.flags: { type: flags }
  event.date: { type: date }
  event.kind: { type: event_kind }
  event.class: { type: class, optional: true }
  event.rating: { type: string, optional: true }
  event.ratings: { type: strings, optional: true }
  event.category: { type: category, optional: true }
  event.authority: { type: string, optional: true }
  event.fstdType: { type: fstd_type, optional: true }
  rating.category: { type: category, optional: true }
  variant.differentEngineType: { type: bool, optional: true }
  training.programme: { type: string }
  training.seeks: { type: sought_privileges, optional: true }

minute_fields: [total, pic, dual, spic, picus, sic, dualGiven, examiner, multiPilot, night, ifr, actualInstrument, simulatedInstrument, crossCountry]

# ---------------------------------------------------------------------------------------
# Rule vocabulary (subject to the implemented-entry check)
# ---------------------------------------------------------------------------------------
subjects:
  rating: { description: "One class, type or instrument rating on a licence.", expiry: true }
  licence: { description: "One licence.", expiry: true }
  privilege: { description: "One licence privilege (towing, cloud flying, instructor certificate ...).", expiry: true }
  credential: { description: "One medical, language or other certificate; validity may be derived.", expiry: true }
  passengers: { description: "Carrying passengers in one class (and ultralight kind); one subject per class and authority." }
  flight_review: { description: "The pilot's flight review; one subject per holder." }
  training: { description: "One training programme (subject detail = programme)." }
  type: { description: "One variant within a class or type rating (record.variants)." }
  launch_method: { description: "One sailplane launch method on a rating (trained privilege or ever logged)." }

statuses:
  current: may exercise the privileges
  expiring: expiry approaching, expiry-anchored revalidation not yet met, or a grace period
  expired: past a date expiry, or a restoring event is required
  lapsed: rolling recency not met; the licence stays valid
  unknown: not determinable (missing data); the messageKey says what is missing
  not_applicable: the rule does not apply to this subject

units: [minutes, landings, takeoffs, flights, check, review, approaches, holds, launches, tows, training, sectors, events]

# Metrics are counters over the flights (or events) in a window after filtering.
# source: flights | events. aggregate: sum | max | min_of_sums | none (always untracked).
# reads: record fields the value depends on; optional: some input may be absent (unknown).
metrics:
  flights: { source: flights, aggregate: sum, reads: [], units: [flights, sectors, tows, launches] , description: "Number of flights." }
  route_sectors: { source: flights, aggregate: sum, reads: [flight.cruiseMinutes], optional: true, units: [sectors, flights], description: "Flights with a cruise of at least 15 minutes (FCL.010 route sector)." }
  minutes.total: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "Total flight time." }
  minutes.pic: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "Time as PIC." }
  minutes.dual: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "Dual instruction received." }
  minutes.spic: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "Supervised solo (SPIC) time." }
  minutes.dualGiven: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "Instruction given as instructor." }
  minutes.ifr: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "IFR time." }
  minutes.picOrDualOrSpic: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "PIC + dual + supervised solo (\"as PIC or flying dual or solo under supervision\")." }
  minutes.dualOrSpic: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "Dual + supervised solo (flight instruction)." }
  minutes.picOrSpic: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "PIC + supervised solo (solo time)." }
  minutes.instructorOrExaminer: { source: flights, aggregate: sum, reads: [flight.minutes], units: [minutes], description: "Instruction given + examiner time." }
  takeoffs.total: { source: flights, aggregate: sum, reads: [flight.takeoffs], units: [takeoffs], description: "Day + night take-offs." }
  takeoffs.night: { source: flights, aggregate: sum, reads: [flight.takeoffs], units: [takeoffs], description: "Night take-offs." }
  takeoffs.night_period: { source: flights, aggregate: sum, reads: [flight.nightPeriodTakeoffs, flight.takeoffs], optional: true, units: [takeoffs], description: "Take-offs between 1 hour after sunset and 1 hour before sunrise (14 CFR 61.57(b)); 0 on a flight without night take-offs, unknown on one with night take-offs and no nightPeriodTakeoffs." }
  landings.total: { source: flights, aggregate: sum, reads: [flight.landings], units: [landings], description: "Day + night landings." }
  landings.night: { source: flights, aggregate: sum, reads: [flight.landings], units: [landings], description: "Night landings." }
  takeoffs_and_landings: { source: flights, aggregate: min_of_sums, reads: [flight.takeoffs, flight.landings], units: [landings, takeoffs], description: "The smaller of total take-offs and total landings (\"3 take-offs and 3 landings\")." }
  full_stop_landings: { source: flights, aggregate: sum, reads: [flight.fullStopLandings], optional: true, units: [landings], description: "Landings to a full stop (day or night)." }
  full_stop_night_landings: { source: flights, aggregate: sum, reads: [flight.fullStopNightLandings], optional: true, units: [landings], description: "Night landings to a full stop." }
  mountain_landings: { source: flights, aggregate: sum, reads: [flight.mountainLandings], optional: true, units: [landings], description: "Landings on a surface designated to require a mountain rating (FCL.815)." }
  launches: { source: flights, aggregate: sum, reads: [flight.launches], units: [launches], description: "Launches (for self-launching aircraft and TMGs: take-offs)." }
  approaches: { source: flights, aggregate: sum, reads: [flight.approaches], units: [approaches], description: "Instrument approaches." }
  holds: { source: flights, aggregate: sum, reads: [flight.holds], units: [holds], description: "Holding procedures." }
  intercept_and_track: { source: flights, aggregate: sum, reads: [flight.interceptAndTrack], optional: true, units: [flights], description: "Flights on which intercepting and tracking courses was performed." }
  training_flights: { source: flights, aggregate: sum, reads: [flight.minutes], units: [flights], description: "Flights with dual instruction received." }
  longest_training_flight_minutes: { source: flights, aggregate: max, reads: [flight.minutes], units: [minutes], description: "Total time of the longest flight with dual instruction received." }
  longest_flight_minutes: { source: flights, aggregate: max, reads: [flight.minutes], units: [minutes], description: "Total time of the longest counted flight (the filter says which flights count)." }
  tows: { source: flights, aggregate: sum, reads: [flight.flags, flight.towedGliders], units: [tows], description: "Tows flown as tug pilot: towedGliders of flights flagged towFlight, 1 when not stated." }
  not_recorded: { source: flights, aggregate: none, reads: [], optional: true, units: [flights, training, check, events, landings], description: "A requirement that cannot be counted from the record (e.g. the SFCL.115(a)(2) passenger-competence flight); always tracked: false, never met (requirement.untracked)." }
  events: { source: events, aggregate: sum, reads: [event.kind], units: [events, check, review, training, flights], description: "Events (checks, reviews, courses, tests); filter with eventKinds." }

# Filters restrict the items a metric counts. absent: what happens when the field a filter
# reads is missing on an item (unknown makes the item unknown, never zero).
filters:
  classes: { applies_to: [flights, events], reads: [flight.class], values: classes, subject_ref: true, description: "Item class in the list; $subject = the subject's class." }
  excludeClasses: { applies_to: [flights, events], reads: [flight.class], values: classes, description: "Item class not in the list." }
  heldClassPools: { applies_to: [flights, events], reads: [flight.class], values: class_pools, description: "Extends classes: every pool containing a counted class adds the pool's classes the holder rates on the subject's licence (FCL.740.A(b)(2))." }
  categories: { applies_to: [flights, events], reads: [flight.class, event.category], values: categories, subject_ref: true, description: "Category of the item's class (an event's recorded category first); $subject = the subject's category (rating.category, else its class's, else its licence kind's)." }
  ulKinds: { applies_to: [flights, events], reads: [flight.ulKind], values: ul_kinds, subject_ref: true, absent: unknown, description: "Ultralight kind; an ULTRALIGHT item with no kind is unknown." }
  ulCredit: { applies_to: [flights], reads: [flight.ulKind, flight.mtomKg, flight.fixedEngine], values: ul_credit, absent: unknown, description: "Adds ultralight flights of listed kinds when the mapped class is counted (FCL.035(a)(4)/(5)); minMtomKg with absent mass, and fixedEngine with absent fixedEngine, are unknown." }
  launchMethods: { applies_to: [flights], reads: [flight.launchMethod], values: launch_methods, subject_ref: true, absent: no_match, description: "Launch method in the list." }
  typeDesignators: { applies_to: [flights, events], reads: [flight.typeDesignator], values: string, subject_ref: true, absent: unknown, description: "Aircraft type designator." }
  variants: { applies_to: [flights, events], reads: [flight.variant], values: string, subject_ref: true, absent: unknown, description: "Variant within a class or type (FCL.710)." }
  roles: { applies_to: [flights], reads: [flight.minutes], values: roles, description: "Any listed role has time on the flight." }
  withMinutes: { applies_to: [flights], reads: [flight.minutes], values: minute_fields, description: "Every listed minute field is positive on the flight." }
  withoutMinutes: { applies_to: [flights], reads: [flight.minutes], values: minute_fields, description: "Every listed minute field is zero on the flight." }
  simulator: { applies_to: [flights, events], reads: [flight.isSimulator], values: [exclude, only, include], description: "Simulator (FSTD) items; default exclude." }
  fstdTypes: { applies_to: [flights, events], reads: [flight.fstdType, event.fstdType], values: fstd_types, absent: unknown, description: "FSTD type of a simulator flight or event." }
  flags: { applies_to: [flights], reads: [flight.flags], values: flight_flags, description: "Flight flags that must have the given value." }
  minLandings: { applies_to: [flights], reads: [flight.landings], values: int, description: "Per-flight landings of at least n." }
  minDistanceKm: { applies_to: [flights], reads: [flight.distanceKm], values: number, absent: unknown, description: "Per-flight distance of at least n km." }
  maxEngines: { applies_to: [flights], reads: [flight.engines], values: int, absent: unknown, description: "The aircraft (or the type an FSTD represents) has at most n engines." }
  maxMtomKg: { applies_to: [flights], reads: [flight.mtomKg], values: int, absent: unknown, description: "The aircraft (or the type an FSTD represents) has a maximum take-off mass of at most n kg." }
  tailwheel: { applies_to: [flights], reads: [flight.tailwheel], values: bool, absent: unknown, description: "Aircraft has a tailwheel." }
  soleManipulator: { applies_to: [flights], reads: [flight.soleManipulator], values: bool, absent: unknown, description: "Pilot was the sole manipulator of the controls." }
  pilotFlying: { applies_to: [flights], reads: [flight.pilotFlying], values: bool, absent: unknown, description: "Pilot was pilot flying." }
  towKinds: { applies_to: [flights], reads: [flight.towKind], values: tow_kinds, subject_ref: true, absent: unknown, description: "What a tow flight towed; $subject = the tow kinds named in the privilege detail." }
  towTakeUps: { applies_to: [flights], reads: [flight.towTakeUp], values: tow_take_ups, subject_ref: true, absent: unknown, description: "How a tow flight took up what it towed; $subject = the take-up named in the privilege detail." }
  classGroup: { applies_to: [flights, events], reads: [flight.class], values: class_groups, description: "Extends classes: each counted class adds the other classes of its group in this class_groups set." }
  eventKinds: { applies_to: [events], reads: [event.kind], values: event_kinds, description: "Event kind in the list (required with the events metric)." }
  eventRatings: { applies_to: [events], reads: [event.rating, event.ratings], values: string, absent: no_match, description: "Rating the event was for (e.g. IR); any of rating and ratings." }
  excludeEventRatings: { applies_to: [events], reads: [event.rating, event.ratings], values: string, absent: match, description: "Drops an event recorded only for these ratings; one recorded without a rating, or also for another, stays." }
  eventAuthorities: { applies_to: [events], reads: [event.authority, flight.checkAuthority], values: string, absent: unknown, description: "Authority the event (check, review, test) was conducted under." }
  any: { applies_to: [flights, events], reads: [], values: filters, description: "Alternatives: an item matches when it matches any listed filter object." }

roles: [pic, dual, spic, picus, sic, instructor, examiner]

# Windows: date-only, inclusive (DESIGN.md section 11). moving windows follow asOf and
# give validUntil projections.
windows:
  rolling_days: { param: int, moving: true, description: "asOf - n days through asOf." }
  rolling_months: { param: int, moving: true, description: "asOf - n months (end of month clamped) through asOf." }
  calendar_months: { param: int, moving: true, description: "First day of the nth calendar month before the month of asOf through asOf." }
  before_expiry_months: { param: int, anchor: expiry, description: "Expiry - n months through the expiry date (and not after asOf)." }
  validity_period: { param: bool, anchor: expiry, description: "Subject validFrom (else issued) through the expiry date." }
  since_issue: { param: [licence, subject], anchor: issue, description: "Issue date of the licence or the subject itself through asOf." }
  lifetime: { param: bool, description: "Every item up to asOf." }

combinators:
  all_of: every child met
  any_of: at least one child met
  n_of: at least n children met
  sum_of: the children's values added reach the node's min (the node is a requirement row)

# Stage `when` conditions (evaluated top to bottom; first hit sets status and messageKey).
stage_conditions:
  always: always true
  all_met: the requirement tree is met (or restored by a restored_by event)
  undetermined: the requirement tree is neither met nor definitely unmet (missing data)
  met: "{ met: <requirement id> }"
  unmet: "{ unmet: <requirement id> } — tracked and not met"
  expired: the subject's expiry date is before asOf (valid through the expiry date)
  no_expiry: the subject's expiry is neither recorded nor derivable
  expires_within: "{ expires_within: { days: n } } — not expired, expiry within n days"
  valid_until_within: "{ valid_until_within: { days: n } } — the evaluation has a validUntil (a moving window, met on asOf) at most n days after asOf"
  before_window: the rule window (anchored) opens after asOf
  met_within: "{ met_within: { calendar_months|rolling_months|rolling_days: n } } — last met within n units before asOf"
  holds: "{ holds: { classes|licenceKinds|privileges|credentials, ulKinds?, sameLicence?, valid?, every? } }"
  missing: "{ missing: date_of_birth } — an input the rule needs is absent"
  seeks: "{ seeks: [privileges] } — a recorded training programme of the subject's programme seeks one of these privileges"
  all: "{ all: [conditions] }"
  any: "{ any: [conditions] }"
  not: "{ not: condition }"

missing_inputs: [date_of_birth]

# Rule-level event hooks.
rule_events:
  restored_by: "[{ event: <kind>, filter? }] — the tree counts as met from the event date until the event would leave the rule window"

# Sources for stage messageParams and requirement remedyParams.
param_sources:
  days_to_expiry: days from asOf to the expiry date
  expiry_date: the subject's expiry date
  window_opens_at: first day of the rule window
  needed: "{ needed: <requirement id> } — ceil(required - current), at least 0"
  last_date: "{ last_date: <requirement id> } — latest counted item in the window"
  valid_until: the evaluation's validUntil
  days_to_valid_until: days from asOf to the evaluation's validUntil

# Derived validity (credentials, certificates): periods by age at the anchor date.
validity:
  anchors: [issued, valid_from]
  period_conditions: [age_under, age_at_least]
  period_fields: [months, cap_at_age, end_of_month]
  # age_on: the anchor the age is taken on; recorded_wins: the derived end applies only
  # without a recorded expiry; end_offset_days: moves the derived end (authority_conventions).
  options: [age_on, recorded_wins, end_offset_days]

hatches:
  sfcl-130b-credit: "SFCL.130(b): 10 % of the PIC time on other aircraft categories, at most 7 hours."

# ---------------------------------------------------------------------------------------
# Credential vocabulary (DESIGN.md section 4;
# docs/credential-format.md). The words credential files may use in `passes_if`,
# `counting`, `restored_by` and `outcomes`, and what each compiles to in the rule model
# above. The compiler (package credentials) reads this section; a word not listed here is
# an error.
# ---------------------------------------------------------------------------------------
credential_vocabulary:
  # Credential kinds (what a pilot holds). `selects` in the credential file says how the
  # credential appears in the record (a licence, ratings on a licence, a licence privilege or
  # a certificate); an evaluation about `self` evaluates that part (the licence part only for
  # kind licence).
  kinds:
    licence: "A pilot licence or certificate."
    rating: "A class, type or instrument rating."
    privilege: "A privilege or extension of a licence (towing, cloud flying, TMG extension)."
    endorsement: "An endorsement with its own validity (language proficiency)."
    instructor_certificate: "An instructor certificate."
    examiner_certificate: "An examiner certificate."
    medical: "A medical certificate or an alternative to one (BasicMed)."
    document: "A non-aviation document a rule accepts in place of a medical certificate (a U.S. driver's license)."

  # Record parts a credential can select, and the engine subject each is evaluated as.
  selects:
    licence: licence
    ratings: rating
    privilege: privilege
    credential: credential

  # What an evaluation is about (the engine subject). `self` is the credential's own subject.
  about:
    self: { description: "The credential itself." }
    passengers: { subject: passengers, selects: ratings, description: "Carrying passengers in the class of each selected rating (one result per class and authority)." }
    launch_methods: { subject: launch_method, selects: ratings, description: "Each sailplane launch method logged or trained on a selected rating." }
    licence: { subject: licence, selects: licence, description: "The licence the credential is held on." }
    rating: { subject: rating, selects: ratings, description: "Each selected rating (for a licence credential: the ratings that carry its privileges)." }
    training: { subject: training, selects: licence, description: "A training programme (only_for.programme names it)." }
    pilot: { subject: flight_review, selects: licence, description: "The pilot as a whole (one result per pilot)." }
    variants: { subject: type, selects: ratings, description: "Each variant recorded on a selected rating (one result per variant)." }

  # Reference authorities: `<prefix>:<article><paragraph labels>` resolves to
  # sources/<directory>/<file>.md. file: lower_dashed turns "FCL.740.A" into fcl-740-a;
  # as_is keeps "61.57". `policy:<id>` refs mark a condition with no legal text behind it (a
  # presentation or implementation choice); the ids are declared in policies.yaml.
  # `assoc:<publisher>:<document>` refs cite an association document declared in
  # associations.yaml (never stored under sources/).
  ref_authorities:
    easa: { directory: easa, file: lower_dashed, cite: "EASA {article}" }
    faa: { directory: faa, file: as_is, cite: "14 CFR {article}" }
    de: { directory: de, file: lower_dashed, cite: "{article}" }

  # Counts: leaf words of passes_if. metric: the engine metric; amount: how the minimum is
  # written (count: min; time: min_hours or min_minutes); id, name, unit, remedy: the
  # defaults of the requirement row (the ids and keys consumers display; override with id:, name:, unit:,
  # remedy: or remedy: none). filter: filters the word implies.
  counts:
    flight_time: { metric: minutes.total, amount: time, id: total_time, name: requirement.total_time, unit: minutes, remedy: remedy.fly_more }
    pic_time: { metric: minutes.pic, amount: time, id: pic_time, name: requirement.pic_time, unit: minutes, remedy: remedy.fly_more }
    dual_time: { metric: minutes.dual, amount: time, id: dual_time, name: requirement.dual_time, unit: minutes, remedy: remedy.fly_more }
    supervised_solo_time: { metric: minutes.spic, amount: time, id: supervised_solo_time, name: requirement.supervised_solo_time, unit: minutes, remedy: remedy.fly_more }
    instruction_time: { metric: minutes.dualOrSpic, amount: time, id: instruction_time, name: requirement.flight_instruction, unit: minutes, remedy: remedy.fly_more }
    pic_dual_or_solo_time: { metric: minutes.picOrDualOrSpic, amount: time, id: flight_time, name: requirement.flight_time, unit: minutes, remedy: remedy.fly_more }
    refresher: { metric: minutes.dual, amount: time, id: refresher_training, name: requirement.refresher_training, unit: minutes, remedy: remedy.fly_more }
    cloud_flying_time: { metric: minutes.ifr, amount: time, id: cloud_flying_time, name: requirement.cloud_flying_time, unit: minutes, remedy: remedy.fly_more }
    ifr_time: { metric: minutes.ifr, amount: time, id: ifr_time, name: requirement.ifr_time, unit: minutes, remedy: remedy.fly_more }
    cloud_flights: { metric: flights, amount: count, id: cloud_flying_flights, name: requirement.cloud_flying_flights, unit: flights, remedy: remedy.fly_more, filter: { withMinutes: [ifr] } }
    longest_flight: { metric: longest_flight_minutes, amount: time, id: training_flight, name: requirement.training_flight, unit: minutes, remedy: remedy.training_flight }
    night_period_takeoffs: { metric: takeoffs.night_period, amount: count, id: night_takeoffs, name: requirement.night_takeoffs, unit: takeoffs, remedy: remedy.fly_more }
    longest_training_flight: { metric: longest_training_flight_minutes, amount: time, id: training_flight, name: requirement.training_flight, unit: minutes, remedy: remedy.training_flight }
    flights: { metric: flights, amount: count, id: flights, name: requirement.cross_country_flights, unit: flights, remedy: remedy.fly_more }
    training_flights: { metric: training_flights, amount: count, id: training_flights, name: requirement.training_flights, unit: flights, remedy: remedy.fly_more }
    takeoffs: { metric: takeoffs.total, amount: count, id: takeoffs, name: requirement.takeoffs, unit: takeoffs, remedy: remedy.fly_more }
    landings: { metric: landings.total, amount: count, id: landings, name: requirement.landings, unit: landings, remedy: remedy.fly_more }
    takeoffs_and_landings: { metric: takeoffs_and_landings, amount: count, id: takeoffs_landings, name: requirement.takeoffs_and_landings, unit: landings, remedy: remedy.fly_more }
    night_takeoffs: { metric: takeoffs.night, amount: count, id: night_takeoffs, name: requirement.night_takeoffs, unit: takeoffs, remedy: remedy.fly_more }
    night_landings: { metric: landings.night, amount: count, id: night_landings, name: requirement.night_landings, unit: landings, remedy: remedy.fly_more }
    full_stop_landings: { metric: full_stop_landings, amount: count, id: full_stop_landings, name: requirement.full_stop_landings, unit: landings, remedy: remedy.fly_more }
    full_stop_night_landings: { metric: full_stop_night_landings, amount: count, id: full_stop_night_landings, name: requirement.full_stop_night_landings, unit: landings, remedy: remedy.fly_more }
    launches: { metric: launches, amount: count, id: launches, name: requirement.launches, unit: launches, remedy: remedy.fly_more }
    approaches: { metric: approaches, amount: count, id: approaches, name: requirement.approaches, unit: approaches, remedy: remedy.fly_more }
    holds: { metric: holds, amount: count, id: holds, name: requirement.holds, unit: holds, remedy: remedy.fly_more }
    intercept_and_track: { metric: intercept_and_track, amount: count, id: intercept_track, name: requirement.intercept_track, unit: flights, remedy: remedy.fly_more }
    tows: { metric: tows, amount: count, id: tows, name: requirement.tows, unit: tows, remedy: remedy.fly_more }
    route_sectors: { metric: route_sectors, amount: count, id: route_sectors, name: requirement.route_sectors, unit: sectors, remedy: remedy.fly_more }
    solo_time: { metric: minutes.picOrSpic, amount: time, id: solo_time, name: requirement.solo_time, unit: minutes, remedy: remedy.fly_more }
    instruction_given_time: { metric: minutes.dualGiven, amount: time, id: instruction_given, name: requirement.instruction_given, unit: minutes, remedy: remedy.fly_more }
    instruction_or_examining_time: { metric: minutes.instructorOrExaminer, amount: time, id: instruction_given, name: requirement.instruction_given, unit: minutes, remedy: remedy.fly_more }
    mountain_landings: { metric: mountain_landings, amount: count, id: mountain_landings, name: requirement.mountain_landings, unit: landings, remedy: remedy.fly_more }
    not_recorded: { metric: not_recorded, amount: count, id: not_recorded, name: requirement.untracked, unit: flights }
    # Events: checks, reviews, tests and courses (record.events and flagged flights).
    proficiency_check: { metric: events, events: [proficiency_check], amount: count, id: proficiency_check, name: requirement.proficiency_check, unit: check, remedy: remedy.proficiency_check }
    skill_test: { metric: events, events: [skill_test], amount: count, id: skill_test, name: requirement.skill_test, unit: check }
    flight_review: { metric: events, events: [flight_review], amount: count, id: flight_review, name: requirement.flight_review, unit: review, remedy: remedy.flight_review }
    proficiency_program_phase: { metric: events, events: [proficiency_program_phase], amount: count, id: proficiency_program, name: requirement.proficiency_program, unit: events }
    basicmed_course: { metric: events, events: [basicmed_course], amount: count, id: course, name: requirement.basicmed_course, unit: training }
    basicmed_exam: { metric: events, events: [basicmed_exam], amount: count, id: exam, name: requirement.basicmed_exam, unit: check }
    practical_test: { metric: events, events: [practical_test], amount: count, id: practical_test, name: requirement.practical_test, unit: check }
    assessment_of_competence: { metric: events, events: [assessment_of_competence], amount: count, id: assessment, name: requirement.assessment_of_competence, unit: check, remedy: remedy.proficiency_check }
    instructor_refresher: { metric: events, events: [instructor_refresher], amount: count, id: refresher, name: requirement.instructor_refresher, unit: training, remedy: remedy.refresher_training }
    examiner_refresher: { metric: events, events: [examiner_refresher], amount: count, id: refresher, name: requirement.examiner_refresher, unit: training, remedy: remedy.refresher_training }
    supervised_instruction: { metric: events, events: [supervised_instruction], amount: count, id: supervised_instruction, name: requirement.supervised_instruction, unit: check }
    differences_training: { metric: events, events: [differences_training], amount: count, id: differences_training, name: requirement.differences_training, unit: training, remedy: remedy.differences_training }
    solo_endorsement: { metric: events, events: [solo_endorsement], amount: count, id: solo_endorsement, name: requirement.solo_endorsement, unit: events }
    instructor_endorsement: { metric: events, events: [instructor_endorsement], amount: count, id: endorsement, name: requirement.instructor_endorsement, unit: events }
    passenger_training_flight: { metric: events, events: [passenger_training_flight], amount: count, id: passenger_training_flight, name: requirement.passenger_training_flight, unit: flights }
    safety_training: { metric: events, events: [safety_training], amount: count, id: safety_training, name: requirement.safety_training, unit: training, remedy: remedy.refresher_training }

  # Qualifiers: where a count is counted. Allowed on a count, on a combinator (inherited by
  # its children), in `counting` (the whole evaluation) and on `restored_by` events.
  qualifiers:
    within_days: { window: rolling_days, description: "The n days before the date evaluated, both days included." }
    within_months: { window: rolling_months, description: "The n months before the date evaluated." }
    within_calendar_months: { window: calendar_months, description: "The n calendar months before the month of the date evaluated, plus that month to date." }
    within_months_before_expiry: { window: before_expiry_months, description: "The n months before the credential's expiry date." }
    within_validity_period: { window: validity_period, description: "From the credential's validFrom (else issue) date through its expiry." }
    since_licence_issue: { window: since_issue, anchor: licence, description: "Since the licence was issued." }
    since_issue: { window: since_issue, anchor: subject, description: "Since the credential was issued." }
    ever: { window: lifetime, description: "Every flight or event up to the date evaluated." }
    in_class: { filter: classes, value: subject, description: "In the class of the credential evaluated (with relevant_class pooling when the evaluation declares it)." }
    classes: { filter: classes, description: "In one of these classes." }
    excluding_classes: { filter: excludeClasses, description: "Not in these classes." }
    categories: { filter: categories, description: "In a class of these categories." }
    ul_kinds: { filter: ulKinds, description: "Ultralights of these kinds." }
    ul_credit: { filter: ulCredit, description: "Also counts ultralight flights of the listed kinds toward the class they are credited to ({ CLASS: [UL kinds] })." }
    launch_methods: { filter: launchMethods, description: "Launched by one of these methods." }
    by_this_launch_method: { filter: launchMethods, value: subject, description: "Launched by the launch method evaluated." }
    in_type: { filter: typeDesignators, value: subject, description: "In the type of the rating evaluated." }
    in_variant: { filter: variants, value: subject, description: "In the variant evaluated (about: variants)." }
    in_category: { filter: categories, value: subject, description: "In the aircraft category of the credential evaluated (rating.category, else its class's, else its licence kind's); unknown when none can be told." }
    in_ul_kind: { filter: ulKinds, value: subject, description: "In the ultralight kind of the rating evaluated, or the kinds a privilege's detail names; unknown when none is recorded." }
    by_this_tow_kind: { filter: towKinds, value: subject, description: "Tow flights of the tow kind the privilege's detail names; unknown when it names none." }
    by_this_tow_take_up: { filter: towTakeUps, value: subject, description: "Tow flights with the take-up the privilege's detail names; unknown when it names none." }
    by_authority: { filter: eventAuthorities, description: "Events (checks, reviews, tests) conducted under one of these authorities; an event without one is unknown." }
    excluding_ratings: { filter: excludeEventRatings, description: "Leaves out events recorded only for these ratings (a check for the IR or BIR alone)." }
    as: { filter: role, description: "pilot_flying, sole_manipulator, or a list of roles (pic, dual, spic, picus, sic, instructor, examiner) with time on the flight." }
    with_time: { filter: withMinutes, description: "Flights with time of these kinds (ifr, crossCountry, dual ...)." }
    without_time: { filter: withoutMinutes, description: "Flights without time of these kinds." }
    simulator: { filter: simulator, description: "exclude (default), include or only FSTD sessions." }
    fstd: { filter: fstdTypes, description: "Only these FSTD types count when simulators are included." }
    tailwheel: { filter: tailwheel, description: "In an aircraft with (true) or without (false) a tailwheel." }
    flagged: { filter: flags, description: "Flights with these flags set or unset ({ examinerOnBoard: true })." }
    min_landings: { filter: minLandings, description: "Flights with at least n landings." }
    max_engines: { filter: maxEngines, description: "In an aircraft with at most n engines." }
    max_mtom_kg: { filter: maxMtomKg, description: "In an aircraft of at most n kg maximum take-off mass." }
    tow_kinds: { filter: towKinds, description: "Tow flights of these kinds (glider, banner, ul_glider)." }
    min_distance_km: { filter: minDistanceKm, description: "Flights of at least n km." }
    for_rating: { filter: eventRatings, description: "Events for this rating (for example CLOUD_FLYING)." }
    also: { filter: eventKinds, description: "Events of these kinds count as well." }
    any_flight_of: { filter: any, description: "A flight counts when it matches any of the listed qualifier sets." }
    with: { document: true, description: "Who conducts or signs the item (examiner, FI, CRI ...). Not evaluated; an interpretation of the evaluation must say so." }

  # Outcome presets: the status and message stages an evaluation reports, so authors rarely
  # write stages. The stages each generates are listed in docs/credential-format.md.
  # `conventions` names, per stage id, the policy (policies.yaml) behind a status the preset
  # sets by convention rather than by the text; every evaluation using the preset cites it.
  outcome_presets:
    revalidation:
      description: "A rating with an expiry date revalidated inside a period before expiry (rating.* keys)."
      conventions: { no_expiry: policy:no-expiry-recorded, window_not_open: policy:window-not-open, met_expiring: policy:expiring-notice, not_met: policy:revalidation-not-met-expiring }
    recency:
      description: "Rolling recency: current or lapsed (rating.* keys unless messages says otherwise)."
      conventions: { lapsed: policy:recency-lapsed }
    privilege_recency:
      description: "A licence privilege with an optional expiry and rolling recency (privilege.* keys)."
      conventions: { lapsed: policy:recency-lapsed }
    passengers:
      description: "Passenger recency: current, unknown when the input is not logged, else not met with the missing count of the last listed unmet requirement."
      conventions: { unknown: policy:unknown-input, not_met: policy:passengers-expired }
    validity:
      description: "A certificate that is valid until its (recorded or derived) expiry date (credential.* keys)."
      conventions: { date_of_birth: policy:unknown-input, no_expiry: policy:no-expiry-recorded, expiring: policy:expiring-notice }
    training:
      description: "A training programme: complete, unknown when the input is not logged, else in progress."
      conventions: { unknown: policy:unknown-input, in_progress: policy:training-in-progress-lapsed }

  # Scopes a composite limitation can name (`limits:` on an evaluation or requirement entry):
  # the entry is reported under `limitations` with this scope and never decides.
  limitation_scopes:
    commercial_privileges: "The privileges beyond those of a private pilot licence (commercial and airline transport privileges)."
    airline_transport_privileges: "The privileges of an airline transport pilot beyond those of a commercial pilot."
    night_privileges: "The privileges of flying at night."

  # Conventions every evaluation of an authority's credentials follows, keyed by the
  # credential file's `authority`. validity_ends: day_before ends a derived validity period
  # (valid_for) on the day before the day that corresponds to its start.
  authority_conventions:
    DE: { validity_ends: day_before, ref: ["de:BGB.186", "de:BGB.187(2)", "de:BGB.188(2)"] }
